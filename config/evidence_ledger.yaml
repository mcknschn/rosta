# Rösta — evidensliggare (delpoäng B)
#
# VIKTIGT — INTEGRITET:
# GENERELL policy-evidens (åtgärdstyp -> indikatoreffekt), citerad till officiella svenska
# utvärderingsorgan / svensk akademi. Medvetet INTE partikopplad — inga påståenden om enskilda
# partier fabriceras. Partispecifik B kräver att partiers faktiska förslag klassificeras mot
# dessa åtgärdstyper i config/party_positions.yaml (Fas 4b), vilket levereras TOMT. Tills dess
# faller B tillbaka på neutral (2.5, låg säkerhet) per (parti, kategori).
#
# HÄRKOMST: posterna under `seed:` är den ursprungliga handskissade startliggaren. Posterna
# under `verified_draft:` lades till 2026-05-30 av en research-workflow där varje källa
# URL-bekräftades live (ett stickprov dubbelkollades manuellt: IFAU 2025:17, SBU rapport 369).
# Båda grupperna är version 0 och KRÄVER EXPERTGRANSKNING innan B aktiveras för skarp betygsättning.
#
# Fält: category, indicator (ur categories.yaml), policy_type (åtgärdstyp), direction (relativt
# indikatorns positiva riktning: positive = åtgärden rör indikatorn ÅT RÄTT HÅLL), evidence_level,
# effect_strength, confidence, source (+ source_url/note för spårbarhet i verified_draft).

version: 0          # 0 = seed/utkast, ej produktionsklar
status: seed_requires_curation

# Slås ihop till en lista av config.evidence_ledger()["entries"] nedan.
entries:
  # ---------------------------------------------------------------------------
  # seed (ursprunglig handskiss, generell, ej partispecifik)
  # ---------------------------------------------------------------------------
  - category: ekonomi
    indicator: arbetsloshet
    policy_type: subventionerade_anstallningar
    direction: positive
    evidence_level: authority_evaluation
    effect_strength: medium
    confidence: medium
    source: "IFAU – utvärderingar av arbetsmarknadspolitik (generell, ej partispecifik)"

  - category: valfard
    indicator: skolresultat
    policy_type: tidiga_insatser_lagstadiet
    direction: positive
    evidence_level: systematic_review
    effect_strength: medium
    confidence: medium
    source: "Skolforskningsinstitutet / SBU – forskningsöversikter (generell)"

  - category: trygghet
    indicator: aterfall_i_brott
    policy_type: behandlingsprogram_kriminalvard
    direction: positive
    evidence_level: authority_evaluation
    effect_strength: medium
    confidence: medium
    source: "Brå / Kriminalvården – utvärderingar (generell)"

  - category: klimat
    indicator: territoriella_utslapp
    policy_type: koldioxidskatt
    direction: positive
    evidence_level: authority_evaluation
    effect_strength: high
    confidence: medium
    source: "Konjunkturinstitutet (miljöekonomi) / Klimatpolitiska rådet (generell)"

  - category: integration
    indicator: sysselsattningsgap_inrikes_utrikes
    policy_type: sfi_kombinerat_med_praktik
    direction: positive
    evidence_level: authority_evaluation
    effect_strength: medium
    confidence: low
    source: "IFAU / ESO – utvärderingar (generell)"

  # ---------------------------------------------------------------------------
  # verified_draft (2026-05-30, research-workflow, källor URL-bekräftade)
  # ---------------------------------------------------------------------------
  # --- ekonomi ---
  - category: ekonomi
    indicator: sysselsattning
    policy_type: subventionerade_anstallningar
    direction: positive
    evidence_level: systematic_review
    effect_strength: medium
    confidence: medium
    source: "IFAU Rapport 2018:14, Subventionerade anställningar – avvägningar och empirisk evidens (Forslund)"
    source_url: "https://www.ifau.se/Press/Meddelanden/subventionerade-anstallningar--avvagningar-och-empirisk-evidens/"
    note: "Högre sysselsättning för deltagare, men betydande undanträngning dämpar nettoeffekten."

  - category: ekonomi
    indicator: sysselsattning
    policy_type: arbetsmarknadsutbildning
    direction: positive
    evidence_level: authority_evaluation
    effect_strength: medium
    confidence: high
    source: "IFAU Rapport 2017:17, Långsiktiga effekter av arbetsmarknadsutbildning (Vikström & van den Berg)"
    source_url: "https://www.ifau.se/Forskning/Publikationer/Rapporter/2017/langsiktiga-effekter-av-arbetsmarknadsutbildning/"
    note: "Högre arbetsinkomst och sysselsättning för deltagare, effekt kvarstår länge."

  - category: ekonomi
