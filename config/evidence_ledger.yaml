  # --- integration / migrationssystem (atervandande_effektivitet) ---
  - category: integration
    indicator: atervandande_effektivitet
    policy_type: se_over_ansvarsfordelning_atervandande
    direction: positive
    evidence_level: authority_evaluation
    effect_strength: medium
    confidence: medium
    source: "Riksrevisionen RiR 2020:7 'Återvändandeverksamheten – resultat, kostnader och effektivitet' (riksdagens spegel dok H8B57). Partiståndpunkter via bet. 2020/21:SfU6 punkt 2 (votering C7DEF4C6-4668-4D8E-AF06-7A820A666C39)."
    source_url: "https://www.riksrevisionen.se/granskningar/granskningsrapporter/2020/atervandandeverksamheten---resultat-kostnader-och-effektivitet.html"
    note: "TILLAGD 2026-06-07 (integration-svepet, NY INDIKATOR §5.7, FLAGGAD; codex KEEP-WITH-CHANGES). INSTRUMENT (snävt, codex-krav): att SE ÖVER/reformera ansvarsfördelningen för återvändandeverksamheten (Migrationsverket/Polis/Kriminalvården) -> atervandande_effektivitet UPP. EJ den starkare 'samla allt ansvar'-tesen (som RiR inte slår fast) -> policy_type bytt till se_over_ansvarsfordelning_atervandande. SYSTEMFUNKTION, EJ VOLYM: mäter kostnad/effektivitet PER verkställt beslut (att lagakraftvunna beslut verkställs effektivt) — ALDRIG antal utvisningar/'fler = bra'. INSTRUMENT-MEKANISM (RiR 2020:7, ordagrant): kostnaden per verkställd person har 'ökat från cirka 48 000 kronor 2016 till knappt 97 000 kronor 2018'; styrningen beskrivs som 'svag, otydlig och splittrad'. INSTRUMENT-GRIND: RiR REKOMMENDERAR uttryckligen att 'se över myndigheternas uppdrag och ansvarsfördelning, samt överväga förändring av myndighetsorganisationen på området' — claimet hålls vid DENNA nivå (se över/överväga). direction positive (ej en §10-negativ-post; framställs ej som negativ-evidens-vinkel). KAVEAT (effect_strength/confidence=MEDIUM, ej high): RiR belägger problemet starkt + rekommenderar översynen, men ingen ex-post-utvärdering bevisar att omorganisation RÄCKER (S/MP-reservation 3 invänder just detta). TIDSNOT (§10.5): primärkällan är 2020/21 -> partiernas NUVARANDE hållning är EJ bevisad här; flaggas för tidskontroll vid sign-off (M/KD/L/SD-riktningen är förenlig med Tidöavtalet 2022). EJ enhällighet: tvåsidig split. NEUTRALITET (verifierat mot SfU6 votering C7DEF4C6 + betänkandetext 2026-06-07): tillkännagivandet 'tillsätta en utredning som ser över ansvarsfördelningen' vanns MOT sittande S/MP-regering; C+L (då i Januari-samarbete med S) röstade JA med oppositionen -> ej rent regering-vs-opp; V avstod (ej med S/MP) -> ej ren vänster-höger-axel. Röster p2: S 1ja/15nej, M 11, SD 10, C 5, V 4avst, KD 3, L 3, MP 3nej."
