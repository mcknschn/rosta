    note: "TILLAGD 2026-06-07 (B-grön-svepet, §5.7 ny indikator + §5.2 enhällighet; codex BUILD). NY INDIKATOR kommunalt_brottsforebyggande_arbete (up) i forebyggande (tidigare utan indikator, §4.2-vägg). INSTRUMENT: lagstadgat krav att varje kommun bedriver kunskapsbaserat, samordnat brottsförebyggande arbete (lägesbild + åtgärdsplan + samordningsfunktion). RIKTNING (ordagrant, prop. 2022/23:43): 'För att säkerställa att kommunerna arbetar med dessa frågor på ett effektivt och kunskapsbaserat sätt föreslår regeringen att kommunernas ansvar för brottsförebyggande arbete regleras i lag.' Brå: 'Syftet med lagen är att stärka kommunernas systematiska brottsförebyggande arbete.' KAVEAT (LOW/LOW): design-/mekanismevidens (lagens syfte), ingen ex-post-effektutvärdering (lagen ny 2023). Mäter förebyggande KAPACITET, ej uppklaring/återfall (ingen dubbelräkning mot rattsvasendets_effektivitet/aterfall_kriminalvard). KONSENSUS-MÅTT (icke-rankningsdrivande): bet. 2022/23:JuU9 p1 ACKLAMATION (verifierat dokumentstatus; enpunkts-betänkande), 'Propositionen har inte lett till några motionsyrkanden eller andra invändningar under utskottsbehandlingen' -> alla 8 supports."

