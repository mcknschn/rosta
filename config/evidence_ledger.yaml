  # Fas 4c Plan A (2026-05-30): enda kandidat som passerade evidens-/negativ-grinden av 8 systematiskt
  # skannade omstridda instrument (övriga 7 hade blandad/svag officiell evidens -> inerta, se
  # docs/fas4c_planA_kandidatregister.md). KRÄVER mänsklig granskning (laddad energifråga).
  - category: klimat
    indicator: effektbrist
    policy_type: ny_karnkraft
    direction: positive
    evidence_level: authority_evaluation
    effect_strength: high
    confidence: high
    source: "Svenska kraftnät, Kraftbalansen på den svenska elmarknaden – rapport 2025 (lagstadgad rapport till regeringen, 3 § förordn. 2007:1119)"
    source_url: "https://www.svk.se/49bb53/siteassets/om-oss/rapporter/2025/kraftbalansen-pa-den-svenska-elmarknaden-rapport-2025.pdf"
    note: "Exakt på indikatorn effektbrist (effektbalans vid topplasttimmen). Planerbar baskraft har tillgänglighetsfaktor ~90 % vid topplast (vindkraft 9 %, solkraft 0 %, Tabell 13 s.45), så ny/utbyggd planerbar kärnkraft ökar tillgänglig effekt vid topplast och drar effektbrist-risken nedåt. POSITIV riktning (negativ-grinden ej tillämplig). Källan fastställer riktningsmekanismen via tillgänglighetsfaktorer, ej nybyggnadskostnad/ledtid; ett parti som motsätter sig instrumentet (opposes) får negativt B-bidrag på effektbrist — flaggat för mänsklig granskning."

