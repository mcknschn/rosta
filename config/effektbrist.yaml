# Effektbrist (närliggande bärare): NETTOIMPORT VID VINTERNS TOPPLASTTIMME i Sverige, MWh/h.
# Positivt värde = nettoimport, negativt = nettoexport.
#
# DELPOÄNG D, kategori klimat, kanonisk indikator effektbrist (riktning DOWN; submått
# energi_elpriser). Tidigare allowlistad "derived: härleds ur Svk effektdata, ingen färdig
# årsserie" — löst via kraftbalansrapporten (ej timdata; data.svk.se saknar ännu ett
# förbruknings-/effektbalansdataset). Spår D kväll 2026-06-12.
#
# MÅTTVAL (sonderat och avgjort): faktisk effektbrist (lastfrånkoppling) har ALDRIG inträffat i
# Sverige — Svk rapport 2025 s.30 explicit: "Svenska kraftnät har därför aldrig behövt koppla
# bort elförbrukning på grund av effektbrist" (maskinverifierat citat). En konstant 0-serie bär
# inget D-tecken. NETTOIMPORT VID VINTERNS TOPPLASTTIMME (årets mest ansträngda timme) är den
# trogna närliggande bäraren: högre importberoende under topplasttimmen = mindre inhemsk
# effektmarginal = närmare effektbrist. Riktningen DOWN matchar DIREKT (lägre nettoimport/mer
# export = bättre) — ingen teckenmappning behövs.
#
# VÄRDEKÄLLA (spine): Svenska kraftnät (statligt affärsverk = officiell svensk källa),
# "Kraftbalansen på den svenska elmarknaden" — årlig LAGSTADGAD rapport till regeringen enligt
# 3 § förordning (2007:1119) med instruktion för Affärsverket svenska kraftnät. Värdet hämtas ur
# rapportens UTFALLS-kapitel "Vinterns topplasttimme" (tabellen "Effektbalans, vinterns
# topplasttimme [MWh/h]" + prosa "Nettoimporten (skillnaden mellan import och export) var ...").
#
# VINTERÅR -> SLUTÅR-REGELN: varje värde gäller EN vinter (t.ex. 2024/2025) och etiketteras på
# vinterns SLUTÅR (2025). Topplasttimmen infaller normalt i januari–februari (dvs. i slutåret);
# undantagen 2019/20 (2019-12-10) och 2021/22 (2021-12-07) inföll i december men etiketteras
# ändå konsekvent på slutåret enligt Svk:s egen vinterkonvention (rapport N redovisar utfallet
# för vintern N−1/N). Ankar-/rimlighetsreferens: Svk:s HTML-tabell över topplasttimmen
# (svk_topplast_referens nedan, 2002/03–2024/25) bekräftar datum/topplast per vinter.
#
# KÄLLSPÅRNING (MASKINVERIFIERAD 2026-06-12, PyMuPDF): ALLA 7 årsvärden är direkt verifierade ur
# Svk:s original-PDF:er. 2024/2025/vår-2026 ligger live på svk.se; 2020–2023 års utgåvor är
# flyttade/404 på svk.se och hämtades som web.archive.org-snapshots AV SVK-ORIGINALEN (fältet
# wayback = hämtväg; källan förblir Svk:s rapport, titel + år). Varje övergång är dessutom
# korsbekräftad av PÅFÖLJANDE års rapport ("förra vintern var det ..."), så alla 6 D-tecken är
# dubbelkällade inom samma rapportserie.
#
# CAVEAT (v0, FLAGGAD): serien är VÄDERDRIVEN — en kall vinter ger högre topplast och därmed
# högre nettoimport oavsett förd politik (mild-2025-outliern: vintern 2024/25 var mild + blåsig,
# 62 % vindutnyttjande under topplasttimmen -> ovanlig nettoexport −2690). Importutfallet är
# dessutom delvis PRISDRIVET (Svk: import sker oftast för att importerad el är billigare, inte
# för att inhemska resurser är uttömda). Mildras av modellens standard: sign-only D + 20 %-vikt
# + makt-/ansvarsviktning. ROBUSTHETSREFERENS: prognos_normalvinter nedan (Svk:s prognostiserade
# nationella effektbalans vid normalvinter, väderNORMERAD) visar samma underliggande förlopp
# (underskott −1700..−1300 sedan 2020, vändning till +600 inför 2025/26) utan väderbrus — den
# serien MATAR INTE D (prognos, ej utfall) utan dokumenteras som kommentar. v0 tills formell
# sign-off (->v1).
version: 0
indicator: effektbrist
category: klimat
submeasure: energi_elpriser
unit: "MWh/h (nettoimport topplasttimme)"
svk_rapportindex: "https://www.svk.se/om-oss/rapporter-och-remissvar/"
svk_topplast_referens: "https://www.svk.se/om-kraftsystemet/kraftsystemdata/topplasttimmen/"
