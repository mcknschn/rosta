# SEKUNDÄRSERIE (ROBUSTHETSREFERENS — MATAR INTE D): Svk:s prognostiserade NATIONELLA EFFEKTBALANS
# vid topplasttimmen för en NORMALVINTER (MWh/h; negativt = underskott/importbehov), ur rapporten
# året FÖRE respektive vinter, etiketterad på samma slutår som utfallsserien ovan. Vädernormerad
# (normalvinter-antagande) -> visar det underliggande förloppet utan utfallsseriens väderbrus:
# stabilt underskott −1700..−1300 sedan 2020, vändning till ÖVERSKOTT +600 inför vintern 2025/26
# (rapport 2025 s.8: "plus 600 MWh/h vid en normalvinter ... minus 600 MWh/h vid en tioarsvinter").
# Alla 6 värden MASKINVERIFIERADE ur samma PDF:er som ovan: 2021 = rapport 2020 s.7 (−1700);
# 2022 = rapport 2021 s.7 (−1600); 2023 = rapport 2022 s.6 (−1400); 2024 = rapport 2023 s.7
# (−1400); 2025 = rapport 2024 s.7 (−1300); 2026 = rapport 2025 s.8 (+600). PROGNOS, ej utfall —
# därför dokumentation/kommentar här, ingen observations-rad (readern läser bara 'years').
prognos_normalvinter:
  2021: -1700
  2022: -1600
  2023: -1400
  2024: -1400
  2025: -1300
  2026: 600
