# Antal värnpliktiga som PÅBÖRJADE grundutbildning med värnplikt i Sverige per kalenderår.
#
# DELPOÄNG D, kategori forsvar, kanonisk indikator personal_varnpliktiga (riktning up, fler
# utbildade värnpliktiga = starkare militär förmåga; submått militar_formaga). Detta är försvarets
# FÖRSTA D-serie — kategorin var tidigare strukturellt D-tom (allowlistad). Spår D Tier 4.
#
# VÄRDEKÄLLA (spine): Försvarsmaktens årsredovisning (FM ÅR) per år — "antal som påbörjade
# grundutbildning med värnplikt" / "antal inryckta". FM är förmågemyndigheten och dess ÅR-mått är
# kalenderårsrent (antal som faktiskt ryckte in under året), till skillnad från Plikt- och
# prövningsverkets "inskrivna", vars utbildningsårs-etikett (X/X+1) inte mappar entydigt mot
# kalenderår. Värdet matchar indikatorns namn direkt: antal värnpliktiga under utbildning.
#
# KORSVERIFIERING ("varför inte båda", din sign-off 2026-06-07): varje år stäms av mot Plikt- och
# prövningsverkets OBEROENDE "inskrivna till grundutbildning med värnplikt" (annat myndighetsmått,
# läst direkt ur Pliktverkets pressmeddelanden). De två officiella myndigheterna ligger nära varann
# (≤~3 % de år båda finns) och — avgörande — BÅDA visar samma enda nedgång 2021->2022. Eftersom D
# bara tar TECKEN på årsförändringen är attributionen robust mot kvarvarande sifferosäkerhet:
# serien är monoton uppåt utom 2021->2022, och den enda teckenkänsliga övergången är dubbel-
# bekräftad av båda myndigheterna.
#
# SERIE FR.O.M. 2018: värnplikten återaktiverades 1 jan 2018; 2018 är första kullen (FM ÅR 2018:
# "Sammantaget påbörjade 3 750 värnpliktiga grundutbildning"). Inga värden före 2018 (måttet
# existerar inte — värnplikten vilade 2010–2017).
#
# KÄLLSPÅRNING (PDF-VERIFIERAD 2026-06-08): det tidigare antagandet att FM:s ÅR-PDF:er är oläsbara
# (FlateDecode, pdftoppm saknas) är ÖVERSPELAT — pdfplumber/PyMuPDF läser dem. 7 av 8 år är nu DIREKT
# verifierade ur FM ÅR (ordagranna citat/Personalberättelsens tabeller):
#   2018 direktcitat · 2019 "drygt 4 500" (ÖB-sammanfattning) · 2020 tabell 4 915 (FM ÅR 2022 bil. 1
#   Tab 6, inkl. HAGS) · 2021 tabell 5 873 (FM ÅR 2022+2023 bilagor, ×2) · 2022 tabell 5 475 (×3) ·
#   2023 prosa+tabell 6 320 · 2024 tabell 7 343 (FM ÅR 2024 bil. 1 Tab 3) · 2025 direktcitat 8 136.
# KORRIGERINGAR mot tidigare gissningar: 2020 4917->4915, 2024 7300->7343. Båda är inre/monotona och
# ändrar INGET D-tecken (serien är monoton upp utom den dubbelbekräftade 2021->2022-dippen).
# ENDA MJUKA PUNKTEN: 2019 = "drygt 4 500" (exakt heltal ej funnet; 2019 års bilaga-PDF ger 404, 2021
# års ÅR är bildbaserad men 2021-värdet är korsbekräftat via 2022/2023 års bilagor). Påverkar inget
# tecken (inre monoton punkt). version 0 kvarstår tills din formella sign-off (då v1, jfr B1-
# granskningen). Reproducerbar/auditerbar via pipeline/tools/varnpliktiga_audit.py.
version: 0
