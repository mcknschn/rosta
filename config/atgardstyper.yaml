# Rösta — åtgärdstypsregistret (ADR 0019 beslut 6, biljett #50)
#
# VERSIONERAT OCH SLUTET. Varje åtgärdstyp som förekommer i party_positions.yaml eller
# evidence_ledger.yaml måste stå här. En typ utanför registret ger HÅRD FAIL.
#
# D1, den frusna avgränsningsregeln: två poster får registreras som SKILDA åtgärdstyper endast
# om minst en versionslåst källa behandlar dem som separata, självständigt ställningstagbara
# BESLUTSPUNKTER. Skillnaden dokumenteras med källhänvisning och exakt beslutsenhet. Språkliga
# varianter, underpunkter och samtidiga genomföranden utgör inte i sig skilda typer. Vid
# oenighet mellan källor gäller den MINST UPPDELADE indelning som ändå bevarar explicit
# separata beslutspunkter.
#
# ATT DELA ELLER SLÅ IHOP EN TYP ÄR EN SKALÄNDRING, inte ett datatillskott: summan går över
# åtgärdstyper, så indelningen är en del av mätskalan. En delning går genom samma
# versionsmaskineri som en ändring av R. Delning eller sammanslagning efter att beräkningen
# har påbörjats är förbjuden.
#
# HÄRKOMST: harledd = beslutsenheten är den starkaste positionsradens källa och ordagranna
# citat, alltså ett yrkande eller en votering som redan är verifierad mot fulltexten.
# handskriven = typen saknar positionsrad och avgränsningen är skriven för hand.

