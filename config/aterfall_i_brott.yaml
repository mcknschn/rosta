# Återfall i brott inom tre år (Kriminalvården) — andel av klienter med starthändelse som
# återfaller i brott inom 3 år.
#
# DELPOÄNG D, kategori trygghet, kanonisk indikator aterfall_i_brott (riktning down, lägre
# återfall = bättre; submått aterfall_kriminalvard). Öppnar submåttet aterfall_kriminalvard
# (tidigare D-tomt; tidigare allowlistat "blocked: PDF"). Spår D, färsk session 2026-06-09.
#
# VÄRDEKÄLLA: Kriminalvården, "Kriminalvård och statistik" (KOS) 2025, Tabell 6.1 "Återfall i
# brott inom tre år efter avslutad fängelseverkställighet eller påbörjad verkställighet i frivård
# 1994–2022" (s. 126; källa KVR, KUM). Officiell svensk myndighetskälla (Kriminalvården).
#
# DEFINITION (Tabell 6.1, prosa s. 116): återfall = klient som avslutat en fängelseverkställighet
# ELLER påbörjat en verkställighet inom frivården, och därefter döms till en NY påföljd inom
# Kriminalvården (fängelse/frivård) där både nytt brott och dom infaller inom 3 år. Smalare än
# Brås "återfall i lagförd brottslighet" (böter/villkorlig dom utan samhällstjänst räknas ej här).
# Konsekvent definition, ingen metodbrytning i serien 1994–2022 (Kriminalvården anger en
# sammanhängande serie).
#
# RÅTAL, EJ AVRUNDAD ANDEL (medveten metodval): KOS publicerar både antalet klienter med
# starthändelse (`klienter`) OCH antalet av dem som återföll (`aterfall`) per ingångsår, samt en
# HELTALSAVRUNDAD andel (`andel_publicerad`, t.ex. "31 %"). Vi lagrar råtalen och låter loadern
# beräkna andelen = aterfall / klienter * 100 (2 dec). Skäl: delpoäng D tar TECKEN på den
# riktningsjusterade årsförändringen inom en relativ dödzon (scoring.yaml change_dead_zone =
# 0,5 %). Vid ~30 % motsvarar 0,5 % ≈ 0,15 pp. Den publicerade HELTALSANDELEN skulle göra varje
# 1 pp-avrundningssteg (≈3,3 % relativt) till ett FALSKT tecken i den platta zonen; råtalsandelen
# låter platåns äkta brus korrekt falla i dödzonen → tecknet blir både mest källtroget (täljare och
# nämnare är agenturens egna publicerade tal) och minst brusigt. `andel_publicerad` behålls per år
# enbart som korsverifiering (loadern jämför och hård-failar vid >0,6 pp avvikelse mot råtalsandelen).
#
# EFTERSLÄPNING: senaste ingångsår = 2022 (3-årsuppföljning klar 2025, redovisas i KOS 2025).
# KOS 2026 (maj 2026) väntas lägga till ingångsår 2023. Transkriberad config → uppdateras manuellt.
#
# V0-CAVEAT (riktnings-/signalsvaghet, ej dataproblem): serien föll tydligt 1999→2012 (42 %→29 %),
# men ligger sedan 2012 på en PLATÅ ~29–32 %. I platåperioden avgörs enskilda årstecken av små
# rörelser; flera faller i dödzonen (tecken 0, korrekt "oförändrat"). D tar bara tecken, väger 20 %
# och makt-/ansvarsviktas, så platån bidrar lite — men v0 kvarstår tills serien expertgranskats.
# v0 → v1 när andelarna korsverifierats mot KOS-statistikens webbtabell post för post.
