  doc_id: 'H901UbU24 / votering 13F52F92-6597-473E-B912-4C7BB0EEE42F'
  quote: 'Röst: Ja (partiets samtliga närvarande) — avslog SD:s och KD:s avslagsyrkanden på prop. 2021/22:132, vars förslag är att hemkommunen ska "genom uppsökande verksamhet ta kontakt med vårdnadshavare till de barn som inte har en plats i förskolan" och att det blir "obligatoriskt för hemkommunen att erbjuda förskola till barn som har bott i Sverige kort tid eller som har vårdnadshavare som har bott i Sverige kort tid".'
  date: '2022-06-08'
  confidence: high
  mapping_note: 'FLAGGAD v0 (B3 2026-06-12, kräver mänsklig slutgranskning). Regeringsparti (S) som lade fram prop. 2021/22:132; röst Ja p1 (mot avslagsreservation 1 SD/KD) + Ja p2 (lagförslaget om uppsökande verksamhet, 8 kap. 12 a §, votering BBBB09FC: S 89 Ja) + p3 (lagförslaget i övrigt, 12 b-12 c §§, acklamation) = supports hela instrumentet. TIDSREGEL §4: rm 2021/22, en session före föredragen period; ingen nyare votering om samma instrument (U 2024:04 ej redovisad/lagstiftad) — symmetriskt för alla 6 kodade partier. Votering p1 2022-06-08: S 89 Ja / 0 Nej.'
