  quote: Det är en självklarhet att den som får ekonomiskt bistånd, efter sin förmåga, ska delta i aktiviteter som kan bidra till att den kan försörja sig på egen hand. Därför tillsatte den socialdemokratiska regeringen den utredning om aktivitetsplikt som nu resulterat i en proposition om aktivitetskrav. Det är förslag som Socialdemokraterna står bakom.
  date: '2026-04-01'
  confidence: high
  mapping_note: 'Instrument-exakt: ''aktivitetskrav/aktivitetsplikt'' för mottagare av ''ekonomiskt bistånd''/''försörjningsstöd'' = det kodade instrumentet (synonym i sökordslistan; ''aktiveringskrav'' saknas men ''aktivitetskrav'' finns ordagrant). Decisivt belägg: ''Det är förslag som Socialdemokraterna står bakom.'' BUNTEN-REGEL §2: motionens tre yrkanden buntar tilläggsinstrument (utestänga organiserad brottslighet, kommunal heltidsaktivitet + barnomsorg, annan tillsynsmyndighet). Dessa interna nyanser noteras men förkastar ALDRIG raden — S motsätter sig inte instrumentet, utan stöder och vill villkora dess utformning. Mjuka bindestreck (U+00AD) i HTML normaliserade i citatet. Källa: kommittémotion, hög i hierarkin (näst votering).'
