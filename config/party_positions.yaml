  quote: För att nyttan av fritid inte ska räknas in i kalkylen som görs när en person ska gå från bidrag till jobb, krävs tydliga aktivitetskrav för de bidrag som erhålls av arbetsmarknadsskäl. Att få pengar utan motprestation ska inte vara ett alternativ för den som skulle kunna jobba.
  date: '2021-10-05'
  confidence: high
  mapping_note: 'Instrument-exakt: ''krävs tydliga aktivitetskrav för de bidrag som erhålls av arbetsmarknadsskäl'' + i samma motion ''motprestation på heltid krävas av alla som kan arbeta men som istället lever på försörjningsstöd'' = aktiveringskrav för ekonomiskt bistånd. BUNTEN-REGEL §2: H9024033 är en bred integrations-partimotion (sfi-villkor, utbildningsplikt m.m.) men den citerade meningen är instrument-exakt, så raden räknas; bredden noteras endast. TIDSREGEL §4: källan är 2021/22, utanför föredragen period (2022/23-2025/26), men är den starkaste partikollektiva källan på exakt detta instrument; den enskilda 2025/26-motionen (HD021533, yrkande om krav på arbets-/praktik-/utbildningsinsats för försörjningsstöd) visar att linjen kvarstår. Symmetrisk tidshantering: KD och L bedöms lika (äldre källa OK + notering).'
