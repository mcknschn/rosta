  quote: Centerpartiet ställer sig i grunden positivt till regeringens proposition och delar ambitionen att arbetslinjen måste stärkas. Det är en självklarhet att den som kan arbeta ska arbeta. Att ställa krav på aktivitet för den som uppbär försörjningsstöd är därför ett viktigt steg för att bryta utanförskap och underlätta för fler att nå egen försörjning. Vi ställer oss därför bakom propositionens intentioner och huvudsakliga förslag.
  date: '2026-04-01'
  confidence: high
  mapping_note: 'Instrument-exakt: ''Att ställa krav på aktivitet för den som uppbär försörjningsstöd'' + ''Vi ställer oss därför bakom propositionens intentioner och huvudsakliga förslag.'' ''aktiveringskrav'' saknas; instrumentet benämns ''krav på aktivitet''/''aktivitetskrav'' med mottagargruppen ''försörjningsstöd'' (= ekonomiskt bistånd). BUNTEN-REGEL §2: C vill därutöver utveckla/komplettera kravet (obligatoriskt nystartsår, uppföljning, proportionerlig tillsyn) — intern nyans som noteras men ALDRIG förkastar raden. Behandlas symmetriskt med S (samma slags ''med anledning av''-kommittémotion till prop. 207, stödjande nyans => keep supports).'
