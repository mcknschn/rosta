# Genomsnittlig handläggningstid (dagar) för avgjorda FÖRSTAGÅNGSÄRENDEN om asyl per kalenderår.
#
# DELPOÄNG D, kategori integration, kanonisk indikator asyl_handlaggningstid (riktning DOWN, kortare
# handläggningstid = bättre; submått migrationssystem). Öppnar submåttet migrationssystem (tidigare
# D-tomt) → integration får sin första D i migrationssystemets hållbarhet. Spår D, integration
# 2026-06-12.
#
# VÄRDEKÄLLA: Migrationsverkets officiella statistik "Avgjorda asylärenden" (per år, xlsx). Bladet
# "Totalt, förstagångsärenden", DELTABELLEN "Asyl", raden "Totalt", kolumnen "Handläggningstid,
# dagar". Officiell svensk källa (Migrationsverket, statistikansvarig myndighet).
#
# AVGRÄNSNING (kritisk för neutralitet + jämförbarhet): ENDAST deltabellen "Asyl" (reguljära
# förstagångsärenden) räknas. De separata deltabellerna "Asyl, ukrainska medborgare" och
# "Massflyktsdirektivet" EXKLUDERAS — de är en near-automatisk process (~20-30 dagars snitt) som
# aktiverades av EU:s massflyktsdirektiv 2022 och speglar ett EU-beslut, inte svensk handläggnings-
# effektivitet. Att blanda in dem skulle (a) göra serien ojämförbar före/efter 2022 och (b) dränka
# signalen i Ukraina-inflödet. 2021-filen har bara "Asyl"-tabellen (massflykt fanns ej än).
#
# NEUTRALITET (integration-kategorins caveat "extra tydliga indikatorer"): kortare asylhandläggning
# är ett av FÅ migrationsmått där båda politiska poler är överens om riktningen — sökande slipper
# utdraget limbo OCH systemkostnaden/osäkerheten minskar. Till skillnad från återvändandeärenden
# ("färre = bättre" förutsätter en omtvistad effektiv-återvändande-ram) bär detta ingen given
# partipreferens. KVARVARANDE CAVEAT (v0): kvalitet-vs-hastighet (tid kan kortas genom sämre beslut
# → fler överklaganden) + tiden påverkas delvis av inflödesvolym, ej bara effektivitet. Eftersom D
# bara tar TECKEN på årsförändringen (väger 20 %, makt-/ansvarsviktas) är detta hanterbart och
# transparent flaggat.
#
# SERIE 2021-2025: 257 → 166 → 198 → 187 → 180 dagar. Inte monoton (genuint diskriminerande): stor
# förbättring 2021→2022, försämring 2022→2023, förbättringar 2023→2024 och 2024→2025. Verifierad
# direkt ur de officiella per-års-xlsx-filerna 2026-06-12 (pdfplumber/openpyxl-läsning av "Totalt"-
# raden). v0 kvarstår tills siffrorna formellt expertgranskats (→v1).
