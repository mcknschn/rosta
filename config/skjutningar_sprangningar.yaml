# Konstaterade skjutningar OCH sprängningar i Sverige per år — Polisen.
#
# DELPOÄNG D, kategori trygghet, kanonisk indikator skjutningar_sprangningar (riktning down,
# färre = bättre). Indikatorns VÄRDE = SUMMAN av bekräftade skjutningar + bekräftade sprängningar
# (detonationer) per år — så datan matchar indikatornamnet (grov skjut-/sprängbrottslighet).
#
# Polisen för officiell statistik över båda (skjutningar: regeringsuppdrag nov 2016; sprängningar:
# fr.o.m. 2018), men publicerar dem ENDAST som PDF per polisregion och år (ingen maskinläsbar
# tabell). Båda komponenterna är därför TROGET TRANSKRIBERADE ur respektive års-PDF (samma mönster
# som budget_ramar/SKR; ingen runtime-PDF-parser). Varje komponent och år är KORSVERIFIERAT vid
# transkribering: summan av de 7 polisregionernas årstotaler == PDF:ens nationella Totalt-rad.
# Reproducerbart/auditerbart via pipeline/tools/skjutningar_transcribe.py.
#
# SERIE FR.O.M. 2018: sprängningsstatistiken börjar 2018. 2017 (som bara har skjutningar, 281)
# utelämnas medvetet — annars skulle 2017->2018 bli ett falskt hopp när sprängningskomponenten
# tillkommer. Både skjutningar och sprängningar finns alltså för varje år i serien.
#
# PRELIMINÄR: Polisens källnotis anger att statistiken är preliminär och kan ändras i efterhand.
# Version 0 — transkriberad 2026-06-03.
