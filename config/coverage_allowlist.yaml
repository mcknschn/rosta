  - { category: forsvar, indicator: forsvarsanslag_andel_bnp, reason: "target: upp till beslutad målnivå, ej up/down -> ej D-duglig." }
  # personal_varnpliktiga inläst via Försvarsmaktens årsredovisning (antal som påbörjade GU per
  # kalenderår 2018-2025, transkriberad config/personal_varnpliktiga.yaml, korsverifierad mot
  # Pliktverkets inskrivna) -> ej allowlistad fr.o.m. 2026-06-07 (Spår D Tier 4). FÖRSVARETS FÖRSTA D.
  - { category: forsvar, indicator: materiel_formaga,         reason: "qualitative: sekretess/operativ förmåga, ingen öppen mätserie." }
  - { category: forsvar, indicator: civil_beredskap_niva,     reason: "qualitative: MSB-bedömning, ingen kvantitativ årsserie." }
