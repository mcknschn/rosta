  # (Spår D natt). Öppnade submåttet nato_ukraina. Tidigare antagande "ad hoc, ingen objektiv
  # årsindikator" var överspelat: regeringen redovisar ett per-år-värde.
  - { category: forsvar, indicator: nato_interoperabilitet,   reason: "qualitative: ingen öppen mätserie." }
  - { category: forsvar, indicator: leveranstid_materiel,     reason: "qualitative: sekretess, ingen öppen serie." }
  - { category: forsvar, indicator: forsvarsfinansiering_upptrappning_mot_mal, reason: "B-only: ny B-indikator 2026-06-07 (§5.7, åtagande om finansieringsupptrappning mot beslutad målnivå). Inriktnings-/åtagandemått, ej utfallsårsserie (target-syskonet forsvarsanslag_andel_bnp är likaså D-otäckt). version 0, sign-off." }
