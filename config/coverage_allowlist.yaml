# Rösta — täckningsallowlist (Fas 3 coverage-gate)
#
# Kanoniska indikatorer (categories.yaml) som ÄNNU saknar en officiell svensk ÅRSSERIE som
# matar delpoäng D — listade EXPLICIT med skäl, så att gapet är synligt och inte tyst.
# Invariant (tests/test_fas3_gate.py): varje indikator är ANTINGEN inläst (build_fas2 SCB/Kolada/Brå)
# ELLER med här. Listan krymper när nya källor tillkommer (flytta indikatorn ur allowlist då).
#
# Skälkategorier: target (ej D-duglig, ingen riktning up/down) · derived (kräver flera serier/
# beräkning som loadern ej stöder) · no_api (officiell/akademisk källa utan maskinläsbar serie)
# · international (ej officiell svensk källa, otillåtet enligt CLAUDE.md) · qualitative
# (saknar kvantitativ officiell mätserie) · future (källa finns men adaptern är inte byggd än).

version: 1

allowlist:
  # --- ekonomi (produktivitet + hushallens_reala_disponibla_inkomst härleds, pipeline.derived;
  #     naringslivets_investeringar inläst via SCB TAB3610 BNAR (build_fas2) — ej längre allowlistade) ---
  # naringslivets_investeringar: SCB TAB3610 Anvandningstyp=BNAR (näringslivets fasta bruttoinv, fasta priser) -> ej allowlistad fr.o.m. 2026-06-07 (Spår D Tier 1).
  # hushallens_reala_disponibla_inkomst: härlett kumulativt realindex ur SCB TAB4592 B6nRealGrowth S14 (pipeline.derived) -> ej allowlistad fr.o.m. 2026-06-07 (Spår D Tier 1).
  - { category: ekonomi, indicator: realloner,            reason: "future: kräver Medlingsinstitutets konjunkturlönestatistik (helekonomi-löneindex) som egen adapter — SCB:s API saknar en ren, kontinuerlig helekonomi-löneserie (allt är privat sektor, sektoruppdelat/brutet vid SSYK-revisionen 2014, eller dött). Sonderat 2026-05-31. (realloner är vilande kontext; submåttet realloner_hushall får sin D via hushallens_reala_disponibla_inkomst.)" }
  - { category: ekonomi, indicator: inflation,            reason: "target: nära mål (~2 %), ej up/down -> ej D-duglig (kvarstår för B/visning)." }
  - { category: ekonomi, indicator: statsskuld_underskott, reason: "target: hållbar nivå, ej up/down -> ej D-duglig." }
  # --- valfard ---
  - { category: valfard, indicator: vard_i_tid,                reason: "low_value: Kolada U79142 (vårdgaranti-index) finns men avslutades 2023 OCH dubblerar vard_tillganglighet-submåttet som vardkoer redan täcker. Lågt mervärde." }
  # overlevnad_svar_sjukdom inläst via Kolada U70471 (30-dagarsöverlevnad efter akut tjocktarmscancer-
  # kirurgi, årlig 2010-2025) -> ej allowlistad fr.o.m. 2026-06-08 (Spår D natt). Det kvinkenniala
  # N79196 (5-årsöverlevnad cancer) var odugligt för D:s konsekutiva-år-krav; U70471 är den årliga
  # officiella överlevnadsserien för svår sjukdom (matchar riktning up).
  - { category: valfard, indicator: skillnader_mellan_skolor,  reason: "no_api: ingen nationell spridnings-/likvärdighetsserie i Kolada/SCB (Skolverkets rapporter ej maskinläsbara)." }
  - { category: valfard, indicator: personalomsattning_omsorg, reason: "no_api: ingen omsorgsspecifik nationell personalomsättningsserie (Kolada saknar KPI)." }
  - { category: valfard, indicator: kontinuitet_i_omsorgen,    reason: "B-only: ny B-indikator 2026-06-07 (§5.7, fast omsorgskontakt → kontinuitet). Socialstyrelsens andel-som-ofta-träffar-sin-fasta-omsorgskontakt är ej ren maskinläsbar årsserie; formell effektutvärdering klar dec 2026/okt 2027. version 0, sign-off." }
  - { category: valfard, indicator: valfardsbrottslighet,      reason: "no_api: ingen ren officiell årsserie för välfärdsbrottslighet." }
  # --- trygghet (dodligt_vald + NTU brottsutsatthet/upplevd_otrygghet inlästa via Brå) ---
  # brottsutsatthet (NTU 3A) + upplevd_otrygghet (NTU 4A:1) inlästa via build_fas2 -> ej allowlistade.
  # uppklaringsgrad (personuppklaringsprocent, Handlagda brott 10La) inläst via build_fas2 -> ej allowlistad.
  # skjutningar_sprangningar (Polisens skjutningar + sprängningar, config/skjutningar_sprangningar.yaml) inläst via build_fas3 -> ej allowlistad.
  - { category: trygghet, indicator: handlaggningstid,         reason: "future: Brå/Åklagarmyndigheten genomströmningstider — publiceras i statistikdatabasen (interaktiv) / PDF, ingen ren maskinläsbar årsserie hittad (sonderat 2026-06-03)." }
  - { category: trygghet, indicator: kommunalt_brottsforebyggande_arbete, reason: "B-only: ny B-indikator 2026-06-07 (§5.7, lagen 2023:196 om kommuners brottsförebyggande ansvar). Ingen nationell maskinläsbar årsserie för kommunal brottsförebyggande kapacitet (Brå publicerar ej KPI). version 0, sign-off." }
  # aterfall_i_brott inläst via Kriminalvården KOS 2025 Tabell 6.1 (config/aterfall_i_brott.yaml,
  # transkriberade råtal 1994-2022, build_fas3) -> ej allowlistad fr.o.m. 2026-06-09 (Spår D färsk
  # session). Det tidigare allowlist-skälet gällde BRÅS PDF-statistik; Kriminalvårdens KOS-tabell
  # ger i stället antal klienter + antal återfall per ingångsår -> exakt andel (down). Öppnade aterfall_kriminalvard.
