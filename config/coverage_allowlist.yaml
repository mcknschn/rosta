# ---------------------------------------------------------------------------------------------------
# B-BREDD — kategorier vars viktade cov_B-TAK ligger under grindtröskeln (B5, docs/done/b_coverage_krympning_spec.md §6.4)
# ---------------------------------------------------------------------------------------------------
# Taket = viktad andel icke-target-undermått med >=1 kodbar åtgärdstyp (mätare
# pipeline.tools.coverage_report.b_submeasure_breadth, samma nämnare som D) — det värde
# per-parti-cov_B aldrig kan överstiga ens vid full kodning. B-väggar sänker taket permanent
# tills de byggs bort (Spår B/B2); här listas kategorier under grindtröskeln (0.75) EXPLICIT
# med skäl så B-väggarnas kostnad är människosignerad, aldrig tyst.
# Invariant (tests/test_b_breadth_gate.py, spegel av test_d_breadth_gate):
#   - varje kategori under grindtröskeln MÅSTE stå här (annars tyst regression), OCH
#   - varje post här MÅSTE fortfarande vara under tröskeln (listan krymper när B-väggar byggs bort).
b_thin_breadth_accepted:
  - category: integration
    reason: "B-väggar: boendesegregation (20) + normer_tillit (15) saknar kodbar åtgärdstyp -> cov_B-tak 65/100. Människosignerade mandat-undantag från B-grön-mandatet (beslutsunderlag_hold_2026-06-12, sign-off 2026-06-12): H4 JA — boendesegregation HOLD/BEVAKA med trigger bosättningslag-betänkandet (~2027, Dir 2024:22; varje dagens kandidat faller på tilt, SD-självstyre-axeln); H3 JA — normer_tillit HOLD/BEVAKA med dubbla triggrar (GOTV-anslag där oppositionen ej avstår -> Delmi 2025:5; acklamerad UbU-behandling av yrkesprogram -> IFAU 2017:12). Tiltad evidens byggs ALDRIG; posten tas bort när en trigger faller ut och väggen byggs bort."
  - category: valfard
    reason: "B-väggar: vard_tillganglighet (30) + omsorg_personal (20) saknar kodbar åtgärdstyp -> cov_B-tak 50/100. Utlyfta poster: koncentration_nationell_hogspecialiserad_vard (overlevnad_svar_sjukdom) och fast_omsorgskontakt (kontinuitet_i_omsorgen), båda authority_evaluation men confidence low. Svepet kom närmast här: RiR 2023:12 mäter att standardiserade vårdförlopp kortade cancerväntetiderna, men Riksrevisionen varnar samtidigt för undanträngning av patienter med större vårdbehov och rekommenderar att nettot utreds. Bryggan cancerväntetid -> vårdköer håller därför inte (§5.3) och kandidaten förkastades. Väggen uppstod 2026-08-23 när den symmetriska evidensgrinden tillämpades (#26, ADR 0006 punkt 2): posten som höll undermåttet uppe var kodad ur ett instruments SYFTE och inte ur en utvärdering av dess verkan, och föll på grinden. Det källstyrda svepet samma dag räknade upp samtliga 68 indikatorer och fann ingen admissibel ersättare (docs/done/b_evidenssvep_2026-08-23.md §5). Tystnaden är alltså PRÖVAD och inte antagen, vilket är precis den ordning ADR 0006 punkt 5 kräver. Återöppningstrigger: en officiell utvärdering som mäter ett instruments verkan på exakt indikatorn och bär confidence minst medium. Posten tas bort när väggen byggs bort."
  - category: forsvar
