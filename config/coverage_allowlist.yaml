# ---------------------------------------------------------------------------------------------------
# B-BREDD - kategorier med minst ett TOMT undermått (ADR 0014 punkt 9)
# ---------------------------------------------------------------------------------------------------
# Tomt undermått = ett icke-uteslutet undermått utan en enda kodbar åtgärdstyp, alltså en B-vägg.
# Ett sådant undermått bidrar 0 till B:s täljare och behåller full vikt i nämnaren: det är VÅR
# tystnad och inte partiets, och krympningen räknar den som "vet ej" (ADR 0014 punkt 2).
#
# PIPEN ÄGER TALET, REGISTRET ÄGER SKÄLET (ADR 0014 punkt 9). Taken och undermåttsvikterna stod
# en gång i skältexterna här och två av dem hade ruttnat: demokrati stod som 25 + 15 + 15 mot
# configens 20 + 20 + 15, försvar som 20 + 15 + 15 mot 20 + 25 + 5. Summorna var rätt, delarna fel.
# Talen räknas numera i pipen (scorerun._b_covered_submeasures -> Mättaket på categories[] och
# kategoriflaggan B_thin_category_ceiling), och här står bara orsaken och återöppningstriggern.
#
# INGEN TRÖSKEL (ADR 0003 punkt 3, ADR 0008 punkt 6). Villkoret var en gång "taket under 0,75",
# vilket dolde ekonomi och trygghet: båda bär ett tomt undermått men ligger över talet. Ett fast
# tal ruttnar dessutom tyst den dag en vägg byggs bort.
# Invariant (tests/test_b_breadth_gate.py, mätare pipeline.tools.coverage_report.b_submeasure_breadth):
#   - varje kategori med minst ett tomt undermått MÅSTE stå här (annars tyst regression), OCH
#   - varje post här MÅSTE fortfarande ha ett tomt undermått (listan krymper när en vägg byggs bort).
b_thin_breadth_accepted:
  - category: ekonomi
    reason: "B-vägg: realloner_hushall saknar kodbar åtgärdstyp. Väggen uppstod 2026-08-23 när den symmetriska evidensgrinden tillämpades (#26, ADR 0006 punkt 2): posten inkomststarkande_hushallspolitik föll på §5.1, eftersom Fördelningspolitiska redogörelsen är officiell BESKRIVANDE statistik över hur inkomster fördelas och inte en utvärdering av att åtgärdstypen orsakar högre real disponibel inkomst. Posten raderas inte; källspåret står kvar med admitted: false. Kategorin stod inte här före 2026-09-13, eftersom den gamla grinden hade en tröskel och ekonomins tak låg över den (ADR 0014 diagnos punkt 6). Återöppningstrigger: en officiell utvärdering som mäter ett instruments verkan på exakt indikatorn och bär evidence_level authority_evaluation eller systematic_review. Posten tas bort när väggen byggs bort."
  - category: valfard
