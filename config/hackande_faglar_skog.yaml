# Häckande fåglar i skogen — samlat populationsindex för 16 skogsfågelarter med höga naturvärden.
#
# DELPOÄNG D, kategori klimat, NY kanonisk indikator hackande_faglar_skog (riktning up, högre
# index = fler fåglar = bättre; submått biologisk_mangfald). Ger biologisk_mangfald sin FÖRSTA
# D-serie (den befintliga indikatorn hotade_arter_naturforlust är no_api/allowlistad — rödlistan
# saknar årlig maskinläsbar serie). Spår D, färsk session 2026-06-09.
#
# VÄRDEKÄLLA: Svensk Fågeltaxering, Biologiska institutionen, LUNDS UNIVERSITET (akademisk svensk
# producent → tillåten enligt CLAUDE.md när officiell statistik saknas). Publiceras som officiell
# miljömålsindikator för "Levande skogar" på Sveriges miljömåls-portal (sverigesmiljomal.se), där
# tidsserien ligger maskinläsbart som Highcharts-JSON i sid-HTML:en (serienamn "Häckande fåglar i
# skogen", det SAMLADE indexet — inte ett enskilt habitat-delindex som lövskog/gammal skog/död ved).
#
# VARFÖR DETTA INDEX (neutralitet): det samlade skogsfågelindexet är den GÄLLANDE officiella
# miljömålsindikatorn (till skillnad från jordbrukslandskapets fågelindex, som är mer direkt knutet
# till jordbrukssubventioner/CAP och därmed politiskt laddat). Det mäter ett äkta biologiskt UTFALL
# (populationsstorlek), inte en policy-INSATS (jfr "skyddad areal" = insats/hammare, som ratades i
# djupsvepet). 16 arter över lövskog/gammal skog/dödvedshabitat → bredare biodiversitetsproxy än ett
# enskilt artindex.
#
# METOD (Svensk Fågeltaxering): standardrutter, TRIM-baserat populationsindex, basår 2002 = 100.
# Indexet är medelvärdet av de ingående arternas individuella index.
#
# V0-CAVEAT (BRUS — viktigaste reservationen): serien är trendlös och BRUSIG (svänger ~90–129
# mellan år; väder, häckningsframgång och samplingsvariation dominerar den enskilda årsförändringen,
# inte politik). Delpoäng D tar bara TECKEN på den riktningsjusterade årsförändringen, väger 10 %,
# makt-/ansvarsviktas och medlas över submått — en TRENDLÖS serie bidrar därför netto ≈ neutralt per
# parti (inget parti straffas/belönas systematiskt; +/−-tecknen tar i stort ut varandra). Det är en
# ärlig "äkta naturUTFALL men svag årssignal"-indikator, ej ett trendmått. IDEA.md:s konjunktur-
# caveat (D = tecken, ej magnitud, låg vikt) är just till för detta. v0 → v1 när serien expert-
# granskats och ev. en utjämnings-/trendbehandling övervägts på modellnivå (görs EJ per-indikator här).
#
# Reproducerbar avläsning/audit: pipeline/tools/faglar_transcribe.py (hämtar sid-HTML, extraherar
# Highcharts-serien "Häckande fåglar i skogen", korsverifierar mot värdena nedan). Ingen runtime-
# HTML-parser körs i pipelinen — den läser bara denna pinnade config (nätverksfri, golden-testbar).
