    kategori: "Välfärd"
    sida: null
    kalla: mappning_framat.md
    citat: "Alla ska känna trygghet i att när man behöver en äldreboendeplats, så ska det finnas en tillgänglig"
  - id: KD-039
    dokument: KD
    kategori: "Välfärd"
    sida: null
    kalla: mappning_framat.md
    citat: "Man ska kunna välja var man bor även på ålderns höst. Inför en rätt att ta med sig biståndsbeslut om exempelvis hemtjänst och äldreboende om man flyttar till en ny kommun."
  - id: KD-040
    dokument: KD
    kategori: "Välfärd"
    sida: null
    kalla: mappning_framat.md
    citat: "Välfärden behöver fler eldsjälar. Förbättra möjligheterna för ideella aktörer att bedriva skola, vård och omsorg. Värna möjligheten för reserverade upphandlingar för idéburna aktörer."
