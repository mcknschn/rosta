    kategori: "Välfärd"
    sida: null
    kalla: mappning_framat.md
    citat: "Stärk patientens ställning genom att se över lagstiftningen för att slå fast rätten till vård i tid, information och delaktighet likt de patienträttighetslagstiftningar som finns i våra grannländer"
  - id: KD-020
    dokument: KD
    kategori: "Välfärd"
    sida: null
    kalla: mappning_framat.md
    citat: "Ställ om vården genom att kraftigt förstärka vardagsvården - framför allt primärvården - så att den kan utgöra navet i svensk sjukvård - med hög kontinuitet, fast läkarkontakt och patienten i centrum"
