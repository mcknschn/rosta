    dokument: KD
    kategori: "Välfärd"
    sida: null
    kalla: mappning_framat.md
    citat: "Säkra en god, näringsriktig, svenskproducerad och kostnadsfri skolmat till alla - och stoppa tvångsvegetariska måltider i skola, vård och omsorg."
  - id: KD-046
    dokument: KD
    kategori: "Välfärd"
    sida: null
    kalla: mappning_framat.md
    citat: "Vård, skola och omsorg ska alltid göra utdrag ur belastnings- och misstankeregistren, både vid nyanställning och regelbundet för befintliga medarbetare."
  - id: KD-047
