    citat: "Den som har svårt att bli gravid ska få hjälp av IVF-behandling, också för att få syskon till sitt första eller andra barn."
  - id: KD-018
    dokument: KD
    kategori: "Välfärd"
    sida: null
    kalla: mappning_framat.md
    citat: "Vården ska bli bättre. Gör vården till ett nationellt ansvar och avveckla därefter dagens 21 olika regioner. För en mer tillgänglig, jämlik och högkvalitativ vård till hela befolkningen, oavsett bostadsort"
  - id: KD-019
