    citat: "Inrätta ett vaccinationsprogram för äldre"
  - id: KD-032
    dokument: KD
    kategori: "Välfärd"
    sida: null
    kalla: mappning_framat.md
    citat: "Ingen ska behöva avstå från medicin. Gör högkostnadsskyddet för medicin inkomstprövat"
  - id: KD-033
    dokument: KD
    kategori: "Välfärd"
    sida: null
    kalla: mappning_framat.md
    citat: "Ingen ska behöva avstå nödvändig tandvård. Patienter som är yngre än 67 år med stora tandvårdsbehov bör också omfattas av det nya högkostnadsskyddet, där endast tio procent av tandvårdskostnaden betalas av patienten."
  - id: KD-034
    dokument: KD
    kategori: "Välfärd"
    sida: null
    kalla: mappning_framat.md
    citat: "Personalen är avgörande för god vård. Det statliga ansvaret för kompetensförsörjningen behöver stärkas. Arbetsmiljön måste förbättras, så att fler lockas att arbeta inom vården och vill stanna kvar i yrket"
  - id: KD-035
    dokument: KD
    kategori: "Välfärd"
    sida: null
    kalla: mappning_framat.md
