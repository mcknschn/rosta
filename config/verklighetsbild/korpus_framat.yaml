  - id: KD-036
    dokument: KD
    kategori: "Välfärd"
    sida: null
    kalla: mappning_framat.md
    citat: "Värna om maten i äldreomsorgen. Söndagsstek med ett glas vin på äldreboendet om så önskas och goda matlådor från hemtjänsten."
  - id: KD-037
    dokument: KD
    kategori: "Välfärd"
