    kategori: "Välfärd"
    sida: null
    kalla: mappning_framat.md
    citat: "Riv upp könsbyteslagen. Juridiskt kön ska i grunden vara en fråga om biologi, inte identitet och könsbyten en fråga om insatser och hjälp från vården."
  - id: KD-031
    dokument: KD
    kategori: "Välfärd"
    sida: null
