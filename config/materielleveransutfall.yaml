# FMV:s leveransindex anslagspost 1:3.1: andel av årets planerade materielleveranser till
# Försvarsmakten som levererats i enlighet med årets leveransplan, värdeviktat. Kan överstiga 100
# när tidigarelagda leveranser överträffar planen (FMV ÅR 2022/2023 explicit).
#
# DELPOÄNG D, kategori forsvar, kanonisk indikator materielleveransutfall (riktning UP; submått
# genomforbarhet_leverans). ÖPPNAR undermåttet på D-sidan (tidigare D-tomt: leveranstid_materiel
# är 🔴 BEVAKA/allowlistad "qualitative: sekretess" och ÅTERANVÄNDS INTE — annat mått [ledtid],
# annan riktning [down]). MODELLBESLUT signat 2026-06-12 (H6-uppföljning: "Bygg nu, flaggad v0";
# sonderingsmandatet beviljades i beslutsunderlag_hold_2026-06-12 H6 VAL A+B).
#
# VÄRDEKÄLLA (spine): FMV:s årsredovisning per år, resultatredovisningens leveransindex-avsnitt
# (FMV = anskaffningsmyndigheten; indexet är myndighetens eget huvudmått på leveransförmåga).
#
# JÄMFÖRBARHETSKEDJA (serien BÖRJAR 2021 — 2020− är EXPLICIT ojämförbara):
#   ÅR 2022 (PDF s.38): "Resultaten för 2022 är jämförbara med resultaten som redovisades i FMV:s
#     årsredovisning 2021" + (PDF s.42): "Det är däremot inte möjligt att göra jämförelser med
#     resultaten i årsredovisningen för 2020 och tidigare år eftersom tidigare indikatorerna
#     baserades på andra principer och indata."
#   ÅR 2023 (PDF s.48): "möjligt att jämföra ... med ... 2022 och 2021 men inte tidigare år".
#   ÅR 2024 (PDF s.22): "möjligt att jämföra ... med ... 2023 och 2022 men inte tidigare än 2021".
#   ÅR 2025 (PDF s.27): "möjligt att jämföra ... med ... 2024 och 2023 men inte tidigare än 2021".
#
# KÄLLSPÅRNING (MASKINVERIFIERAD 2026-06-12, PyMuPDF): ALLA 5 årsvärden + samtliga kedje- och
# caveatcitat är direkt verifierade ur FMV:s original-PDF:er (lokala kopior c:\tmp\fmv_probe\);
# alla 5 käll-URL:er på fmv.se HTTP 200-verifierade samma datum. Sidhänvisningar = PDF-sidor.
#
# v0-CAVEATS (FLAGGADE — obligatoriska, centrala för neutraliteten):
# 1. SJÄLVREFERENTIELL MÅTTSTOCK: indexet mäter utfall mot FMV:s EGEN leveransplan. 2025-raset
#    (53) beror delvis på FMV:s ÖVERPLANERING — tidigarelagda leveranser i målvärdet höjde ribban
#    (ÅR 2025 PDF s.28: "Denna överplanering har bidragit till ett högre målvärde och därmed till
#    ett lägre leveransindex jämfört med 2024") — plus försenade högvärdesleveranser (JAS 39E +
#    armémateriel, ~8,3 mdkr ≈ 24 % av leveransplanen, ÅR 2025 PDF s.28). EJ entydigt
#    regeringsutfall: attributionen delas av industrins kapacitet + FMV:s egen planering.
# 2. KALENDERÅRSKÄNSLIGT: "en försening på några veckor i december till nästkommande år kan
#    medföra stor påverkan på FMV:s leveransindex men kan samtidigt ha begränsad påverkan på
#    Försvarsmaktens förmåga" (FMV:s egen varning, ÅR 2025 PDF s.27; samma lydelse ÅR 2022-2024).
# 3. ORDALYDELSESKIFT I VIKTNINGSBAS 2022->2023: "viktat efter objektsbudget i investeringsplanen"
#    (ÅR 2021-2022) -> "viktat efter leveransens värde" (ÅR 2023-). FMV intygar själv
#    jämförbarheten över skiftet (kedjecitaten ovan spänner över bytet).
# 4. AVGRÄNSNING: endast ap. 1:3.1 (anskaffning till Försvarsmakten); Ukraina-donationer ingår EJ
#    (FMV redovisar donationsanskaffning separat).
# Skadan begränsad av modellens standard: D tar bara TECKNET på årsförändringen + 20 %-vikt +
# makt-/ansvarsviktning. v0 tills formell sign-off (->v1).
version: 0
