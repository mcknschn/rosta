# Rösta — scoringregler (helt automatisk betygssättning)
#
# All betygssättning är deterministisk. Inget partibetyg sätts för hand.
# Mänskligt omdöme får bara finnas här (versionsstyrd config) och i config/claims.yaml.
#
# Kedja:  observations + actions + responsibility + indicator_effects
#         -> A/B/C/D per (parti, kategori)  -> kategoribetyg 0-5 (+ osäkerhetsintervall)
#
# Kategoribetyg = 0.30*A + 0.50*B + 0.20*D              (A,B,D i [0,5])
# C väger 0 och ger inga poäng. Den räknas ut som förut och redovisas som maktandel,
# alltså som upplysning om vem som haft makten.
# Se docs/adr/0002-kategoripoangens-ansprak-och-vikter.md

version: 2

subscore_weights:        # speglar categories.yaml subscore_weights (0-1)
  A: 0.30
  B: 0.50
  C: 0.00      # maktandel, inte delpoäng (ADR 0002). Nyckeln behålls, pipeline/config.py kräver den.
  D: 0.20

# Skalsemantik:
#   relativa delpoäng rangordnas över de 8 partierna (C=5 = "mest av alla", ej "absolut mycket")
#   absoluta delpoäng är oberoende av andra partier (net_support=0 -> 2.5; uppmätt förändring)
# A flyttades från relative till absolute 2026-08-21 (ADR 0005 punkt 1). Skälet är härlett ur
# ADR 0002 punkt 3, som ger A dess vikt med orden "ett parti som lägger lite kraft på rätt
# åtgärd förbättrar något". "Lite kraft" är ett absolut påstående; ett rangmått kan bara säga
# "minst kraft av de åtta". pipeline/config.py hard-failar om A står under relative igen.
scale_semantics:
  relative: [C]
  absolute: [A, B, D]

# Normalisering till 0-5. Bara C-makt normaliseras nu: den har få datapunkter (8 partier) och
# tunga svansar -> rank (outlier-robust). A, B och D är absoluta och normaliseras inte.
# per_subscore.A är BORTTAGEN (ADR 0005 punkt 3): A:s båda halvor mäts mot en historisk
# förankring, q = (andel - förankring) / (andel + förankring), och avbildas med
# net_support_to_score. En kvarlämnad nyckel hard-failar i pipeline/config.py.
normalization:
  default: { method: minmax, min: 0, max: 5, neutral: 2.5 }
  per_subscore:
    C: rank

# A - Prioritering (ADR 0001). A mäter omfattning, aldrig riktning och aldrig kvalitet.
# Frågan är: hur stor andel av partiets föreslagna anslag och egna motioner går till
# kategorin? a1 budgetprioritering väger 0,6 och a2 motionsprioritering 0,4. Båda är
# riktningsneutrala andelar. Riktningen ligger i B, där voteringarna hör hemma.
# ADR 0005: andelen mäts mot en HISTORISK FÖRANKRING, inte mot de sju andra partierna. För
# varje parti och kategori gäller q = (andel - förankring) / (andel + förankring), som ligger i
# [-1, 1] av konstruktion och är 0 vid jämnhöjd; betyget blir net_support_to_score(q), samma
# linjära avbildning som B använder. Ingen konstant väljs. Förankringen står i
# config/a_forankring.yaml: a1 mot de beslutade utgiftsramarna i bet. FiU1 och a2 mot kammarens
# samtliga motioner, båda som medel över ett gemensamt historiskt fönster.
A_agerande:
  components:
    a1_budgetprioritering: 0.6      # andel av föreslagna anslag till kategorins UO (Fas 1b)
    a2_lagstiftningsprioritering: 0.4  # ANDEL av partiets egna motioner som rör kategorin
  # Blandningen 0,6/0,4 står orörd efter ADR 0005 punkt 4. Båda halvorna får SAMMA form, för
  # att blanda ett rangmått med ett kvotmått i en viktad summa vore ett formfel i sig.
  # a2 mäter andel (motioner i kategorins utskott / partiets totala motioner), INTE rå volym
  # -> stora partier blir inte höga i varje kategori.
  # a1 (Fas 1b, byggd): andel av partiets föreslagna utgiftsramar (Σ kategorins UO / Σ alla UO) ur
  # officiella källor (config/budget_ramar.yaml, version 0). HÅRD GRIND (pipeline/budget.py): a1 vägs
  # in för en (budgetår, kategori) endast när alla 8 partier har verifierad ram för varje kategori-UO;
  # annars A = a2 (flagga A_a2_only). Saknad/ogiltig cell -> hård fail, aldrig tyst 0. Se
  # docs/done/fas1b_budget_metod.md. A = a1*0.6 + a2*0.4 där a1 aktiv, annars A = a2.
  notes: Mäter prioritering relativt partiets storlek, inte om politiken är rätt. Rättheten fångas av B och D.

# B — Evidens. Hur stor förbättring väntas av de åtgärder partiet driver?
# Storlek, inte riktning (docs/adr/0004-vad-delpoang-b-mater.md). Ett rent tecken kan inte
# svara på "hur mycket", och kategoribetyget svarar på hur mycket kategorin väntas förbättras
# (ADR 0002). Storleken (effect_strength) bär poängen; kvaliteten (evidence_level,
# confidence) bär säkerhetsetiketten och därmed bandet.
# Bygger på indicator_effects (config/claims.yaml).
B_evidens:
  # B per (parti, kategori) = submåttsviktat medel av indikatorernas net_support_to_score.
  rollup: submeasure_weighted_mean
  per_indicator: net_support_to_score      # net_support[-1,1] -> [0,5]: 5*(net_support+1)/2
  missing_indicator: skip                  # indikator utan effekt utelämnas ur medlet (inte 2.5)
  missing_all_score: 2.5                   # HELA kategorin saknar effekter -> neutral
  missing_all_confidence: low
  # B:s säkerhet per kategori härleds ur indicator_effects-aggregatets confidence (ADR 0004
  # punkt 5): conf_kat = Σ(w_undermått · confidence) / Σ w_undermått, med SAMMA vikter som
  # B_raw. conf_kat >= confidence_numeric.high OCH minst claims.yaml
  # min_claims_for_high_confidence claims i kategorin -> high; >= confidence_numeric.medium
  # -> medium; annars low. Nivån sänks sedan ETT steg vid tunn täckning (samma
  # _step_down_confidence som C och D), eftersom evidenssäkerhet och täckningssäkerhet är två
  # skilda osäkerheter som ska förstärka varandra, inte ersätta varandra.
  # Coverage-viktning (Fas 4b'): B_just = 2.5 + (B_raw - 2.5) * coverage, där
  # coverage = kodade åtgärdstyper / kategorins kodbara åtgärdstyper. Frånvaro av ståndpunkt =
  # "vet ej" och drar B mot neutral (straffar ej, belönar ej tom täckning); ett ensamt
  # supports-claim ger alltså inte längre maxbetyg. Tunn täckning -> B_thin_coverage-flagga och
  # ett steg ned i säkerhet; flaggan beskriver täckningen, inte säkerheten.
  # B5 — täckningsmått-läge (docs/done/b_coverage_krympning_spec.md). Två lägen:
  #   policy_type_count:         legacy (byte-identisk baseline). coverage = kodade åtgärdstyper /
  #                              kategorins kodbara åtgärdstyper (ANTAL; nämnaren = liggarens
  #                              innehåll, undermått utan kodbart instrument osynliga). Flagga:
  #                              B_coverage_<num>/<den> (antal).
  #   weighted_submeasure_depth: viktad undermåttsdjuptäckning (spec §3.3). cov_B =
  #                              Σ w_s·|K_s|/|T_s| / Σ w_s över kategorins icke-target-undermått
  #                              (SAMMA nämnare som D, _non_target_submeasures); B-väggar stannar
  #                              i nämnaren med bidrag 0. Flagga: B_coverage_<covered_weight>/
  #                              <total_weight> (LÅST format, spec §4). thin_coverage_threshold
  #                              mäts då på cov_B.
  # OBS: switch till weighted_submeasure_depth kräver mänsklig sign-off av spec §10 —
  # ändringen är RANKINGRELEVANT (byter KD<->MP i totalranking, spec Bilaga A). Ogiltigt
  # värde hard-failar i config.validate (aldrig tyst fallback till legacy).
  coverage_mode: weighted_submeasure_depth
  # Krympningen på eller av. true = committat läge (B_just = 2.5 + (B_raw - 2.5) * cov_B).
  # false ger B = B_raw, alltså okrympt. Reglaget finns för att ADR 0003 punkt 5 kräver att
  # "B:s krympning på eller av" går att dra i känslighetsanalysen, och för scenario 3. Att
  # ändra det committade värdet är RANKINGRELEVANT och kräver mänsklig sign-off; täcknings-
  # flaggan står kvar i båda lägena eftersom den beskriver täckningen, inte krympningen.
  coverage_shrink: true
  coverage_denominator: non_target_submeasure_weight  # nämnarens semantik i nya moden (samma som D)
  thin_coverage_threshold: 0.5
  # Åtgärdstyper som lyfts ur coverage-nämnaren. GENERALISERAD regel (docs/done/fas4c_rubrik.md §7):
  # en policy_type får exkluderas ENDAST på en principiell grund, som måste anges i
  # coverage_exclude_reasons nedan. Inga ad hoc-undantag. Grunder:
  #   E1 = sidoeffekt-negativ (direction:negative men evidensen avser en sidoeffekt, inte
  #        instrumentets kärnvärde -> stance-kodning ger missvisande B-sign; faller på negativ-grinden §5.3)
  #   E2 = inert per konstruktion (mixed/unclear -> signed_direction 0 -> kan aldrig ge B-effekt)
  coverage_exclude: [internationella_materielsamarbeten]
  coverage_exclude_reasons:
    internationella_materielsamarbeten: "E1: RiR 2011:13 mäter leveranstidsrisk (sidoeffekt), inte om materielsamarbete i sig är sämre försvarspolitik; negativ B-sign skulle bli missvisande."

# C — Maktandel. Hur mycket makt partiet haft. Vikt 0: ger inga poäng utan redovisas som
# upplysning (ADR 0002). "Genomförbarhet/ansvar" är ett retirerat namn; confignyckeln heter
# fortfarande C_ansvar tills en byggslice byter den.
C_ansvar:
  components:
    c1_makt: 0.7
    c2_finansiering: 0.3
  # c2 (finansiering) är UPPSKJUTET (beslut Fas 1c) -> C = c1 (makt) tills vidare; koden väger
  # inte in c2 (category_c returnerar c1). Skäl: ett objektivt, RIKTNINGSNEUTRALT och
  # differentierande finansieringsmått går inte att bygga ur officiell svensk data — alla
  # partibudgetar är formellt fullt finansierade (rambeslutsmodellen) => likformigt; ett
  # saldo-/ramverksmått skulle gynna åtstramning => bryter neutraliteten (CLAUDE.md); och
  # "driver de det de lovar" fångas redan distribuerat av A (prioritering) + B (källbelagda
  # ståndpunkter) + D (resultat under makt). Komponentvikterna behålls som dokumenterad
  # avsikt om en neutral källa skulle uppstå. Se docs/done/fas1c_subnational_metod.md §c2.
  # Nationellt vs regionalt/kommunalt ansvar vägs per kategori.
  level_weights_default:
    national: 0.7
    regional_municipal: 0.3
  level_weights_overrides:
    valfard:   { national: 0.4, regional_municipal: 0.6 }
    trygghet:  { national: 0.8, regional_municipal: 0.2 }
    forsvar:   { national: 1.0, regional_municipal: 0.0 }
  # Inom den KOMBINERADE regional_municipal-bucketen: hur mycket bärs av REGION resp. KOMMUN
  # per kategori (vikterna summerar till 1). Bestäms av den lagstadgade ansvarsfördelningen —
  # vilken nivå som faktiskt driver verksamheten — INTE av ideologi. Båda nivåerna har nu full
  # datatäckning (21 regioner + 290 kommuner × 3 mandatperioder, SKR-styren, Fas 1c).
  subnational_split_default: { region: 0.30, municipal: 0.70 }   # kommuner är fler/tyngre lokal utförare
  subnational_split_overrides:
    valfard:     { region: 0.45, municipal: 0.55 }   # region=hälso/sjukvård; kommun=skola, äldreomsorg, IFO
    trygghet:    { region: 0.0,  municipal: 1.0 }    # regioner saknar lagstadgat trygghetsansvar (polis=nat, brottsförebyggande/socialtjänst=kommun)
    integration: { region: 0.0,  municipal: 1.0 }    # mottagande/SFI/ekonomiskt bistånd = kommunalt
    klimat:      { region: 0.40, municipal: 0.60 }   # region=kollektivtrafik; kommun=fysisk planering/energi/avfall
    # ekonomi, demokrati -> default (region: regional utveckling/kultur; kommun: mark/näringsliv/lokal demokrati)
  # Fallback när subnationell data saknas/ej är en giltig proxy (ej samma sak som vikt=0 per
  # design, t.ex. forsvar): omvikta level_weights till 100 % national OCH sänk C:s confidence.
  # Med full region+kommun-täckning triggas detta i praktiken bara om en datafil saknas (guard).
  missing_subnational:
    reweight_to_national: true
    confidence_penalty_steps: 1            # high->medium->low

# D — Resultat. Förbättrades indikatorerna där partiet hade ansvar?
# Metod (v0, Fas 5b): för varje nationell årsindikator (up/down; 'target' hoppas över) tar
# vi TECKNET på den riktningsjusterade årsförändringen (förbättring +1 / försämring -1 /
# oförändrat 0 inom en relativ dödzon). Varje förändring (år y-1 -> y) tillskrivs regeringen
# som satt år (y - attribution_lag_years), viktad med dess maktvikt (regering 1.0, stöd 0.5).
# Per (parti, kategori): viktat teckenmedel per indikator -> submåttsviktat medel -> net i
# [-1,1] -> betyg via net_support_to_score (samma 0->2.5-skala som B). Tecken (inte magnitud)
# håller måttet robust och ödmjukt — i linje med IDEA.md-brasklappen om att inte ge ett parti
# hela äran/skulden för konjunkturen. Magnitudviktning är en framtida förfining.
D_resultat:
  attribution_lag_years: 1     # utfallsförändring år y tillskrivs den som styrde år y-1
  # min_responsibility och thin_basis_threshold mäts på SAMMA storhet: kategorins
  # ansvarsunderlag = Σ maktvikt över de år partiet faktiskt attribueras (per kategori).
  # Stege:  < min_responsibility = ej tillämplig · [min, thin) = uppmätt men tunt (D_thin_basis)
  #         >= thin_basis_threshold = uppmätt.
  min_responsibility: 0.15     # kategorins ansvarsunderlag (Σ maktvikt) under detta -> ej tillämplig
  change_dead_zone: 0.005      # |relativ årsförändring| <= 0.5 % räknas som oförändrad (brus)
  thin_basis_threshold: 1.0    # ansvarsunderlag (Σ maktvikt) under detta -> flagga D_thin_basis
  # D-undermåttsbredd (docs/done/d_coverage_krympning_spec.md): saknade icke-target-undermått
  # bidrar neutralt (net 0) i D-rollupen i stället för att renormaliseras bort ur nämnaren —
  # D gör då inget oavkortat kategorianspråk utifrån en delmängd av kategorin. Nämnaren är
  # viktsumman av kategorins icke-target-undermått (target-only = alla indikatorer 'target');
  # numeratorn är per (parti, kategori) eftersom attribution kan saknas i korta serier.
  # false = legacy-beteende (renormalisering över observerade undermått), byte-identisk baseline.
  coverage_shrink: true
  coverage_denominator: non_target_submeasure_weight  # dokumenterar nämnarens semantik
  thin_coverage_threshold: 0.75  # viktad D-täckning under detta -> D_thin_coverage + säkerhetssteg ned
  not_applicable_score: 2.5    # rättvisa: opposition straffas inte för utfall den ej rådde över
  not_applicable_confidence: low   # ej-tillämplig D -> BRED osäkerhet (markeras som flagga i utdata)
  measured_confidence: medium      # uppmätt D med faktiskt ansvar -> smalare
  # not_applicable markeras i scores.json (flags: D_not_applicable) så neutral 2.5
  # aldrig förväxlas med ett uppmätt resultat på 2.5.
  # C3 — SUBNATIONELL D (docs/done/c3_subnational_d_metod.md). Kopplar subnationell makt till
  # subnationellt utfall: ett regionalt utfall (t.ex. vårdköer) attribueras till det parti som
  # styrde DEN regionen det året, parallellt med den nationella attributionen. Blandas in på
  # SUBMÅTTSNIVÅ — bara för submått med en subnationell serie — så regionsignalen rör bara det
  # konstrukt den mäter (vård), inte skola/omsorg. national/region-vikten per submått speglar den
  # LAGSTADGADE ansvarsnivån för just det utfallet (vård = region = sjukvårdshuvudman); den
  # återanvänder MEDVETET INTE C:s subnational_split (region 0.45) som är ett kategorisnitt med
  # kommunstyrd skola/omsorg inblandad. enabled:false -> byte-identisk med ren nationell D (legacy).
  subnational:
    enabled: true
    # submått -> {national, region} ansvarsvikt (summerar till 1). Bara listade submått får
    # subnationell D; region får hela regional_municipal-vikten (0.6) eftersom utfallet är region-styrt.
    submeasure_level_weights:
      vard_tillganglighet: { national: 0.4, region: 0.6 }   # valfard: region = sjukvårdshuvudman
    # Regionalt ansvarsunderlag normaliseras till ÅR-EKVIVALENT (Σ maktvikt över alla region-år /
    # antal regioner med serie) så min_responsibility/thin_basis_threshold behåller samma skala som
    # nationellt (annars spränger 21 regioner × år grindarna). Räknas additivt in i D-grinden med det
    # nationella underlaget -> ett parti med ENBART regional vård-makt blir measured (rättvisa).
    region_weighting: equal     # lika per region (ej befolkningsviktat); pop-vikt körs som robusthetskoll

# Osäkerhet. Varje delpoäng har en DEFAULT-säkerhetsnivå som kan ÖVERSKRIDAS per
# (parti, kategori) av datan (B från effekter, C vid saknad subnational, D vid not_applicable).
# Halvbredd per kategori = max_halfwidth * Σ(subscore_weight * (1 - confidence_numeric[nivå])).
uncertainty:
  # Samma tabell som claims.yaml numeric.confidence. Efter ADR 0004 går evidensens confidence
  # hela vägen till bandet: claims-tabellen sätter B:s nivå, den här översätter nivån till
  # halvbredd. De hålls ihop av tests/test_config.py.
  confidence_numeric:
    high: 0.85
    medium: 0.60
    low: 0.30
  default_subscore_certainty:
    A: high      # voteringar, budgetbelopp
    B: medium    # evidenssammanvägning, förväntade effekter
    C: high      # makt, finansiering
    D: low       # attribution av utfall
  max_interval_halfwidth: 1.5
