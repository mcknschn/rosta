      - { id: municipality, query: "/municipality", note: "Kommuner OCH regioner (type K=kommun, L=region)" }
      - { id: data, query: "/data/kpi/{kpi_id}/municipality/{id}/year/{period}", note: "Tidsserie per kommun/region" }
    gotchas:
      - "v2 är NEDLAGT (HTTP 410). All integration måste använda /v3."
      - "Regioner ligger i SAMMA municipality-endpoint (skilj via type-fältet K/L)."
      - "Gruppvärden är OVÄGT medelvärde av medlemskommuner — ej befolkningsviktat."
    coverage: "God; KPI årsvis, långa tidsserier."
    verified: true
    confidence: high

