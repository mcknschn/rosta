    gotchas:
      - "PxWeb v1 (inte SCB v2): data via POST med json-query; GET på tabell-id ger metadata."
      - "Energivara-koder slås upp via valueText (Kol och koks/Petroleumprodukter/Natur- och stadsgas) så en omnumrering inte tyst byter serie."
    verified: true
    confidence: high

