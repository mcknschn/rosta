# Konstaterade (bekräftade) skjutningar i Sverige per år — Polisen.
#
# DELPOÄNG D, kategori trygghet, kanonisk indikator skjutningar_sprangningar (riktning down,
# färre = bättre). Polisen för på regeringens uppdrag (sedan nov 2016) officiell statistik över
# bekräftade skjutningar, men den publiceras ENDAST som PDF per polisregion och år — ingen
# maskinläsbar tabell. Den nationella årstotalen är därför TROGET TRANSKRIBERAD ur respektive
# års-PDF (samma mönster som config/budget_ramar.yaml och SKR-styrena; ingen runtime-PDF-parser
# som kan korrumpera D tyst). Varje årsvärde är KORSVERIFIERAT vid transkribering: summan av de
# 7 polisregionernas årstotaler == PDF:ens nationella "Totalt"-rad. Reproducerbart via
# pipeline/tools/skjutningar_transcribe.py.
#
# SEMANTIK: indikatorn heter skjutningar_sprangningar, men endast SKJUTNINGAR transkriberas —
# det är den etablerade, jämförbara serien (helår fr.o.m. 2017). Polisens sprängningsstatistik
# är en separat, kortare serie; skjutningar används som proxy för indikatorn (grov vapenvåld).
# Dokumenterat val (jfr personuppklaring för uppklaringsgrad). Värdet = ANTAL bekräftade
# skjutningar (ej döda/skadade, som finns i samma PDF men inte används här).
#
# PRELIMINÄR: Polisens källnotis anger att statistiken är preliminär och kan ändras i efterhand.
# Jämförbar fr.o.m. 2017 (första helår under uppdraget). Version 0 — transkriberad 2026-06-03.
version: 0
