# Antal kontinuerligt tjänstgörande i Försvarsmakten (stående personalvolym) per 31 dec, per år.
#
# DELPOÄNG D, kategori forsvar, kanonisk indikator personalstyrka_kontinuerligt (riktning UP, större
# stående personalvolym = mer bemannad förmåga; submått militar_formaga). Försvarets FJÄRDE D-serie.
# Spår D, försvar 2026-06-12.
#
# KONSTRUKT: "Summa kontinuerligt tjänstgörande" = yrkesofficerare + GSS/K (gruppbefäl/soldater/
# sjömän, kontinuerligt) + civila arbetstagare. Detta är den STÅENDE styrkan (faktisk bemannad
# numerär), distinkt från personal_varnpliktiga (rekryteringsbasen — antal som påbörjar GU) och från
# "tidvis tjänstgörande" (reservofficerare + GSS/T, mer volatil). Hammare-test: en bemannad numerär
# är ett FÖRMÅGEUTFALL (hur många faktiskt tjänstgör), inte pengar/anslag (delpoäng A) eller aktivitet.
#
# VÄRDEKÄLLA: Försvarsmaktens årsredovisning (FM ÅR), bilaga 1 "Personalberättelsen", Tabell 1 "Antal
# anställda per personalkategori per 31 dec", raden "Summa kontinuerligt tjänstgörande". Varje års-
# tabell redovisar 3 år (innevarande + 2 bakåt), vilket ger ÖVERLAPPANDE KORSVERIFIERING. Officiell
# svensk myndighetskälla. Värdena transkriberade direkt ur PDF-tabellerna (pdfplumber), korsverifierade.
#
# SERIE 2019-2024 (6 år, STRIKT MONOTON uppåt): värnpliktsåtertagandet + upprustningen gav en stadigt
# växande stående styrka. 2025 ÄNNU EJ publicerad i separat Personalberättelse-bilaga (endast huvud-
# dokumentet finns) → serien slutar 2024 tills 2025 års bilaga kommer. D tar bara TECKEN; alla
# årsövergångar är + (robust mot sifferosäkerhet).
#
# REVIDERING 2021: värdet reviderades +720 (23 633 → 24 353) pga en felsummering i FM ÅR 2021, rättad i
# FM ÅR 2022 (not 4 i Tabell 1). Vi lagrar det RÄTTADE värdet (24 353). Påverkar inget D-tecken
# (monoton upp oavsett). v0 tills formell sign-off (→v1).
