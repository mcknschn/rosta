# V-Dem (Varieties of Democracy) — Sveriges demokrati-/institutionsindex per år (delpoäng D).
#
# DELPOÄNG D, kategori demokrati. Fyra NYA kanoniska indikatorer som ger var sitt tidigare D-tomt
# demokrati-submått sin FÖRSTA D-serie. Spår D, färsk session 2026-06-09. Ditt sign-off-val
# 2026-06-09 (frågan "Vilket fält ska V-Dem få?"): **Svensk akademisk D-källa**.
#
# ── KÄLLREGEL: VARFÖR V-DEM ÄR TILLÅTET ──────────────────────────────────────────────────────
# 1. V-Dem-institutet är värdat vid GÖTEBORGS UNIVERSITET (Statsvetenskapliga institutionen) →
#    räknas som *svensk akademisk källa*, vilket CLAUDE.md uttryckligen tillåter "när officiell
#    statistik saknas". De fyra demokrati-submåtten nedan saknar svensk officiell årsserie
#    (självutvärdering ur statsapparaten är dessutom metodiskt olämplig här — se p. 3).
# 2. CLAUDE.md (uppdaterad 2026-06-09, commit 7fa9337) tillåter dessutom *internationella vedertagna
#    källor när neutraliteten kan antas högre än en svensk myndighetskälla*. En oberoende EXTERN
#    bedömare av statens egna institutioner är mer neutral än att staten betygsätter sig själv.
# 3. "HAMMARE"-PRINCIPEN (D = verkliga effekter/tillstånd, ej aktivitet): V-Dem-indexen är
#    TILLSTÅNDSbedömningar (graden av rättsstat/yttrandefrihet/frihet/ansvarsutkrävande), inte
#    aktivitets-/insatsräkningar → passar D-principen bra (till skillnad från "antal anmälningar/
#    granskningar" som ratades i djupsvepet).
#
# ── CAVEAT (största neutralitetsreservationen, därför version 0) ──────────────────────────────
# V-Dem är EXPERT-KODAT: landexperter sätter subjektiva bedömningar som aggregeras via en
# Bayesiansk mätmodell (IRT) med konfidensintervall — INTE en hård räkning som SCB:s arbetslöshet.
# Det är den enskilt största invändningen mot objektiviteten. Mildras av att (a) D tar bara TECKEN
# på årsförändringen och väger 10 %, (b) det är den metodiskt lämpligaste mätningen för en kategori
# som är svår att mäta objektivt med svensk officiell statistik, (c) flaggad v0 (kräver granskning).
# TAKEFFEKT: Sverige ligger nära skalans tak (0,94–0,995) → de ABSOLUTA värdena säger lite; bara
# TRENDEN/tecknet är meningsfullt, vilket är precis vad D använder. rattsstatsindex är i praktiken
# platt (allt i dödzonen) → dess D ≈ neutralt (ärligt: stabil svensk rättsstat), men submåttet är
# inte längre D-tomt.
#
# ── INDEXVAL (princip: maximalt DISTINKTA signaler, undvik att dubbelräkna samma nedgång) ─────
#   rattsstat_maktdelning  → v2x_rule          (Rule of Law index)
#   yttrandefrihet_medier  → v2x_freexp_altinf (Freedom of Expression & Alternative Sources of Info)
#   personlig_frihet       → v2x_clpriv        (Private Civil Liberties index)
#   transparens_ansvar     → v2x_horacc_osp    (Horizontal Accountability, OSP 0-1) — institutionellt
#       ansvarsutkrävande. VALT FRAMFÖR diagonal accountability (v2x_diagacc), som delar medie-
#       komponenter med yttrandefrihetsindex och skulle dubbelräkna samma 2018-2024-nedgång över två
#       submått. Transparens-aspekten av submåttsnamnet fångas indirekt. (v1: ompröva mappningen.)
# AVSTÅR: v2x_corr (politisk korruption) — ingen meningsfull varians för Sverige (0,004-0,009 på
#   25 år) OCH korruption_tillit har redan en svensk officiell D (Brå NTU förtroende, fortroende_
#   domstolar_myndigheter). Att tvinga in V-Dem-korruption vore brus utan signal.
#
# Riktning för alla fyra: UP (högre index = bättre demokratitillstånd). Alla är 0-1-skala.
# Reproducerbar avläsning/audit: pipeline/tools/vdem_transcribe.py (laddar V-Dems officiella
# dataset, filtrerar Sverige, korsverifierar dessa värden). De tre OWID-tillgängliga indexen
# (rule/freexp/clpriv) korsverifierades dessutom exakt mot Our World in Data 2026-06-09. Pipelinen
# läser bara denna pinnade config (ingen runtime-parser). v0 → v1 vid expertgranskning av indexvalet.
