      - slag: styckat_olika
        sida: 3
        a_rader: '82-89,92-93'
        b_rader: '82-89'
        a: "Vilka som verkligen bidrar till samhället och vilka som inte gör det har visat sig ännu tydligare under pandemin. De av oss som måste gå till jobbet för att samhället ska fungera, det är vi som jobbar i mataffären, vi som kör bussen, vi som städar. Det är vi som sliter i vården och omsorgen och vi som ser till att förskolor och skolor fungerar. Det är lågbetalda samhällsbärande arbetarklassyrken som plötsligt synliggjorts, precis så viktiga som de är. Det är för oss, alla vi som bor i Sverige, som vi nu också ska återuppbygga landet - bättre och tryggare. Ett land där vi bidrar efter förmåga och våra olika förutsättningar. Det är möjligt, men det kräver en annan politik och att vi omfördelar resurserna från rika till fattiga människor, från rika områden till fattiga områden och förorter."
