        b: "Att som individ försöka minska sin klimat- och miljöpåverkan är bra, men det kommer aldrig att räcka. Vi måste ta oss an klimatkrisen som samhälle. Mycket av det vi konsumerar behöver vi för att leva bra liv - mat, kläder, boende och resor men sättet sakerna och energin framställs på behöver ändras. För de flesta av oss sker en stor del av konsumtionen och resandet för att hållbara alternativ saknas. Det gäller inte minst på landsbygden. Det är samhället och politikens ansvar att se till att alternativen finns. Där inte teknikskiften räcker för att minska utsläppen måste konsumtionen styras bort från det smutsiga och alla ges förutsättningar att leva mer hållbart. Vi ser ett hållbart liv som ett bättre liv. Kortare arbetsdagar med mer tid för"
