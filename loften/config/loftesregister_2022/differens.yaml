        a: null
        b: "Det är genom en grön politik från vänster som vi kan skapa fler jobb, företag och framtidstro även utanför storstäderna. Sverige är en liten industri- och kunskapsnation som en gång i tiden, genom stora investeringar och politiska satsningar, skapade en stark, modern och väl utvecklad ekonomi, där växande företag balanserades av en stark arbetarrörelse och stat som såg till att de stora ekonomiska värden som skapades kunde fördelas relativt jämnt över hela landet och befolkningen. Det byggde världens mest jämlika land. Politiken tog ansvar för problem, byggde bort bostadsbristen, byggde ut välfärden och gjorde stora investeringar i telenät, järnväg och annan infrastruktur. Idag står samhället inför nya utmaningar. Välfärden är urholkad genom åratal av nyliberal politik och"
        beslut: 'ingen'
        skal: "Projektagaren 2026-09-16: andra halvan av ett stycke som bryts av en sidbrytning. Raderna ligger redan i den hopfogade posten, och en egen post har skulle ta samma rader tva ganger."
      - slag: styckat_olika
        sida: 4
        a_rader: '124-133,136-157'
        b_rader: '136-157'
        a: "Det är genom en grön politik från vänster som vi kan skapa fler jobb, företag och framtidstro även utanför storstäderna. Sverige är en liten industri- och kunskapsnation som en gång i tiden, genom stora investeringar och politiska satsningar, skapade en stark, modern och väl utvecklad ekonomi, där växande företag balanserades av en stark arbetarrörelse och stat som såg till att de stora ekonomiska värden som skapades kunde fördelas relativt jämnt över hela landet och befolkningen. Det byggde världens mest jämlika land. Politiken tog ansvar för problem, byggde bort bostadsbristen, byggde ut välfärden och gjorde stora investeringar i telenät, järnväg och annan infrastruktur. Idag står samhället inför nya utmaningar. Välfärden är urholkad genom åratal av nyliberal politik och ojämlikheten ökar. Vi måste lösa klimatkrisen och skydda den biologiska mångfalden - omställningen går alldeles för sakta. Över hela världen orsakar klimatkatastrofer förödelse - bränder, översvämningar, djur- och växtarter som försvinner och människor som drivs på flykt. Vi befinner oss i ett klimatnödläge. Omställningen behöver ske omgående och alla politiska beslut behöver ta hänsyn till den akuta kris som vi befinner oss i. Det är politikens, och inte individens, ansvar att skapa möjligheter för människor att välja enkla och billiga klimatsmarta alternativ. En del lösningar behöver vara internationella men mycket går att genomföra nationellt, om bara den politiska viljan finns. Investeringar i grön teknik, industri och infrastruktur, utbyggd energikapacitet och stärkt styrning utifrån nya, skärpta klimatmål behövs. Återanvändning och återvinning av material behöver öka. Över hela världen växer en ung klimatrörelse sig stark med stora krav på politiken för en snabb och genomgripande omställning. Det är en rörelse som med rätta ställer krav på systemförändringar, för kapitalismen håller på att göra jorden obeboelig. Ett ständigt överutnyttjande av naturens resurser leder till kraftig utarmning av den biologiska mångfalden och växthusgasutsläpp. Skogens roll att naturligt minska och lagra utsläpp behöver stärkas och torrlagda våtmarker som läcker utsläpp ska återställas. Skyddet av skogs- och strandområden är en viktig del för att värna den svenska allemansrätten och den biologiska mångfalden. För att uppnå klimatmålen behöver skogens funktion som kolsänka bevaras de kommande decennierna, därför behöver kalhyggesbruket fasas ut. Den skog som avverkas måste användas klokt där endast restprodukter ska användas till biobränsle."
