        b_rader: null
        a: "Alla som kan jobba ska jobba och bidra för att bli en del av samhället. Det gäller oavsett var man är född. Att lära sig god svenska, delta i arbetsmarknadsinsatser och studier är centralt. Barn ska ha goda förebilder och se båda sina föräldrar gå till jobbet."
        b: null
        beslut: 'a'
        skal: "Princip 1. Rad 165 slutar `...ga till jobbet.` med punkt och rad 168 borjar `Fler insatser kravs` med versal. Det sprakliga provet ger tva poster, inte en over sidbrytningen. Pass C stoder A."
      - slag: styckat_olika
        sida: 7
        a_rader: '168-177'
        b_rader: '162-165,168-177'
        a: "Fler insatser krävs för att utlandsfödda kvinnor ska komma i arbete och vi säger nej till alla förslag om vårdnadsbidrag eller barnomsorgspeng, som låser fast utlandsfödda kvinnor i hemmet. Det bör även ställas språkkrav för att få permanent uppehållstillstånd. Att kunna lära sig ett yrke parallellt med studier i svenska är ytterligare ett sätt att öka chansen att få jobb. Vi vill införa språkkrav för anställda inom förskola och äldreomsorg, med möjlighet till språkutbildning för den som inte har tillräckliga kunskaper. För att ingen ska fastna i passivitet behöver det ställas krav på aktivitet för att få försörjningsstöd. Diskrimineringen på arbetsmarknaden ska motarbetas."
