        a: "Sverige är extremt. Som enda land i världen råder det fri dragningsrätt på de skattemedel som ska gå till våra barns utbildning. Pengarna du och jag betalar för våra barns skolgång och framgång går till vinster i skolkoncerner och hamnar i skatteparadis. Dessutom leder den marknadsanpassade skolan till betygsinflation, segregation och ökad ojämlikhet. Privatiseringsexperimentet med marknadsskolan har förstört möjligheterna för tusentals barn. Om dina föräldrar är låg- eller höginkomsttagare, akademiskt skolade eller inte, invandrade eller svenskfödda, spelar en allt större roll för dina möjligheter att klara skolan. Marknadsskolan är ett monumentalt misslyckande. Det tycker en majoritet av svenska folket och stora delar av lärarkåren. Vänsterpartiet vill avskaffa marknadsskolan med start nästa mandatperiod. Barnens rätt till utbildning kan inte vänta. Varje år är det nya elever som skickas igenom systemet utan tillräckliga kunskaper. För varenda en av dem är det en förlorad livschans."
