    fall:
      - slag: bara_a
        sida: 3
        a_rader: '58-60'
        b_rader: null
        a: "Därför vill Vänsterpartiet använda valrörelsen till ett avstamp för att genom öppna samtal lägga grunden till en bred folkrörelse där vi tillsammans kämpar för omställningen till ett mer rättvist, tryggt och hållbart samhälle."
        b: null
        beslut: null
        skal: null
      - slag: bara_b
        sida: 8
        a_rader: null
        b_rader: '291-297'
        a: null
        b: "Välfärdsskulden som uppstått innebär att hundratusentals jobb försvunnit ur skola, vård och omsorg sedan 1990-talet, och det behövs en politisk vilja för att successivt börja bygga upp en bättre kvalitet igen. Men politikens ansvar stannar inte vid offentliganställda. Det som gjorde Sverige till en ledande industrination var de politiska beslut som då innebar byggandet av en miljon bostäder under kort tid, byggandet av infrastruktur och utbyggnad av välfärd åt alla. Investeringar i jämlikhet, jämställdhet och trygghet är bra också för de svenska företagen."
        beslut: null
        skal: null
      - slag: bara_b
        sida: 8
        a_rader: null
        b_rader: '298-302'
        a: null
        b: "Genom en politik för högre löner för dem med lägst inkomster så skapas efterfrågan. Pensionärer som får högre pension gör så att affären kan hålla öppet på en liten ort. När politiken levererar välfärd, försäkringar som a-kassa, pensioner och sjukpenning, om staten satsar stort på klimatomställning och infrastruktur, då skapas jobb i företagen och möjligheter att leva och bo i hela landet."
        beslut: null
        skal: null
      - slag: bara_b
        sida: 8
        a_rader: null
        b_rader: '303-315'
        a: null
        b: "När högern och näringslivets lobbyorganisationer talar om flexibilitet på arbetsmarknaden menar de i klarspråk försämrad anställningstrygghet, och sanningen är att arbetslivet har blivit allt mer otryggt för många av oss som arbetar. Otryggheten skapas genom tillfälliga anställningar, sms-jobb, gig-jobb, deltidsjobb och bemanningsjobb. Otrygga anställningar leder till tysta arbetsplatser och lägre facklig organisationsgrad. Du bråkar inte gärna med den chef som dagen efter kan avsluta din anställning. Du tar inte strid mot sexuella trakasserier eller diskriminering om det kan kosta dig nästa jobbpass. Få av oss väljer den osäkra arbetssituationen frivilligt. De flesta av oss vill ha en viss trygghet för att kunna planera våra liv, skaffa en bostad, kunna ta semester eller veta att vi lugnt kan sätta barnen i skola utan att behöva flytta från orten inom några år. Samhällsutvecklingen går stick i stäv med människors behov. Sedan förra valet har andelen unga som tycker att kollektivavtal och fast anställning är viktigt ökat kraftigt."
        beslut: null
        skal: null
      - slag: bara_b
        sida: 9
        a_rader: null
        b_rader: '332-341'
        a: null
        b: "Ett tryggt samhälle ställer inte människor mot varandra. När högerpartier förespråkar låglönejobb och begränsad välfärd för de av oss som inte är födda i Sverige bygger det på ett cyniskt utnyttjande av människor, ibland förklätt till antirasism. När människors utsatta situation utnyttjas pressas allas våra löner och våra möjligheter ner. Därför behöver vi hålla ihop. Det är inte när någon annan får sämre villkor som du får bättre villkor. Tvärtom, vi har ett gemensamt intresse av att förbättra villkoren istället för att öka den vinst som ett fåtal kan göra på våra arbetsinsatser. Det är inte genom tidsbegränsade uppehållstillstånd som integrationen förbättras. Tvärtom, det är genom en trygg och permanent tillvaro i samhället som vi människor rotar oss. Genom att hålla ihop skapar vi trygga liv för alla."
        beslut: null
        skal: null
      - slag: bara_b
        sida: 12
        a_rader: null
        b_rader: '471-477'
        a: null
        b: "De massiva skattesänkningar som genomförts av högerpartier och socialdemokrater under många år har resulterat i att det nu finns 350 miljarder mindre per år till välfärden än 1990. Därför är det färre som jobbar inom välfärden, trots att vi har blivit fler i Sverige. I takt med att skatterna på de mest förmögna minskat ökar trycket på lokal- och regionalpolitiker att höja skatten för att slippa skära ner ytterligare. Det är en omvänd fördelningspolitik, där pengar flyttas från allas vår välfärd till ett fåtal redan rika."
        beslut: null
        skal: null
      - slag: bara_a
        sida: 16
        a_rader: '628-635'
        b_rader: null
        a: "Det är hög tid för förändring. Vänsterpartiet satte ner foten kring marknadshyror för att nu är gränsen nådd. Ska vi alla ha en framtid som vi kan tro på, så är det Vänsterpartiet som ska leda den politiska förändringen. Vänsterpartiet är ett parti som lägger sin energi på konkreta politiska reformer för att återuppbygga och utveckla de trygghetssystem som rivits ner, en kraftfull grön omställning med jobb och välfärd i hela landet, i både storstad och glesbygd, förort och landsbygd. Ett parti som står upp för oss alla, inte bara en liten rik elit. Vänsterpartiet ställer krav på kollektivavtal vid offentliga upphandlingar."
        b: null
        beslut: null
        skal: null
      - slag: bara_a
        sida: 16
        a_rader: '636-651'
        b_rader: null
        a: "Politik är inte något som händer någon annanstans. Det är tillsammans med folkrörelser som Vänsterpartiet driver fram förändringar. Vårt parti är också en stolt del av en internationellt växande vänster som i åratal kritiserat politikens blinda tro på marknaden och agerat mot dess konsekvenser. Kapitalismen och klimathotet har inga landgränser. Därför är vi en rörelse som sätter den internationella solidariteten högt på dagordningen. Vänsterpartiet är ett socialistiskt, feministiskt och antirasistiskt parti på ekologisk grund. Asylrätten undergrävs just nu i land efter land. När rasismen växer, länder sluter sig och EU bygger murar ska Sverige agera för flyktingars rättigheter och försvara asylrätten både i Sverige och internationellt. Vänsterpartiet anser att Sverige ska vara en röst för fred och rättvisa, inte för ökad militarisering. Sverige ska öka biståndet, stärka FN och skriva under kärnvapenkonventionen. Därför är Vänsterpartiet motståndare till Sveriges allt djupare militära samarbete med NATO och EU, och vi är det enda riksdagspartiet som konsekvent värnar och vill återupprätta svensk alliansfrihet. Vänsterpartiet vill att Sverige river upp värdlandsavtalet med NATO. I en rättvis värld måste den globala ojämlikheten kraftigt minskas."
        b: null
        beslut: null
        skal: null
      - slag: bara_a
        sida: 16
        a_rader: '652-660'
        b_rader: null
        a: "Vänsterpartiet vill ha en regering som står till vänster i svensk politik. Vänsterpartiet kommer att arbeta för att en sådan regering har modet att driva vänsterpolitik och stå emot nyliberalism och rasism. Vänsterpartiet samarbetar gärna med andra partier, men bara om resultatet av arbetet innebär ökad jämlikhet, grön omställning och kraftigt stärkt välfärd. För oss står inte valet mellan två dåliga alternativ. Du som väljare håller förmodligen inte med oss i alla frågor. Det är ok. Men detta valår är det viktigt att lägga sin röst på ett vänsterparti som du kan lita på och som har modet att stå upp för sina ideal. För den som vill ha mer vänsterpolitik så finns det bara Vänsterpartiet att rösta på i detta val."
        b: null
        beslut: null
        skal: null
      - slag: bara_a
        sida: 17
        a_rader: '674-679'
        b_rader: null
        a: "Vi står vid en vändpunkt. Det som måste göras kommer att ta tid. Men det viktiga är att bryta trenden, och att istället för att acceptera fler försämringar börja bygga framtiden. Det finns självklara och brådskande problem att lösa för att rädda jorden från klimathotet. Välfärden måste byggas upp, jämlikheten stärkas och framförallt måste politiken ta ansvar för samhällsutvecklingen och lösa de behov som finns hos människor och miljö."
        b: null
        beslut: null
        skal: null
