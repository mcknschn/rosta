        a_rader: '263-274,277-278'
        b_rader: '263-274'
        a: "Barn, sjuka och arbetslösa måste självklart ha samma rätt som arbetande människor att ha goda liv. Alla har vi varit barn. Alla kan vi bli sjuka eller förlora jobbet. När vi blir gamla blir vi förhoppningsvis pensionärer. När du blir sjuk eller föder barn ska du kunna lita på att få ersättning från Försäkringskassan utan att behöva stånga dig blodig. När du blir gammal ska du kunna leva på din pension, inte bara överleva. På samma sätt ska du som lever med funktionsnedsättning kunna lita på att du får det stöd du behöver, och på att din rätt att delta i samhället på det sätt du vill inte ständigt ifrågasätts och försvåras. Tryggheten i ett samhälle hänger ihop med hur våra trygghetssystem fungerar - a-kassan, sjukförsäkringen, LSS och pensionerna. Vänsterpartiet vill se en mänsklig sjukförsäkring och ett slut på utförsäkrandet av sjuka. Du som blir arbetslös ska veta att du får en bra a-kassa och inte behöva oroa dig över att du måste flytta till en billigare lägenhet, sälja huset eller inte kunna ha mat på bordet. Men politiska beslut har gjort att a-kassans ersättningar är lägst i Norden."
