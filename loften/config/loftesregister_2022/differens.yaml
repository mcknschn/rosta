        a: "Välfärden är samhällets ansvar och borde styras demokratiskt. Det är politikens uppgift att se till att den fungerar, kommer alla till del och att de anställda ges inflytande. De som jobbar på sjukhusen, skolorna eller hemtjänsten idag har burit skattesänkningarnas konsekvenser på sina axlar, med att arbeta hårdare, avstå löneökningar och se kollegorna bli färre och det egna lasset större varje år. Istället för att lösa resursbristen har styrande politiker svarat med ineffektiva modeller, minutstyrning och idéer som optimerad schemaläggning, där ingen som arbetar i verksamheten tillfrågats. Läkare och sjuksköterskor, undersköterskor, lärare och socialsekreterare, alla som behövs i välfärden, förvandlas till administratörer i ett system där politiker kräver att allt dokumenteras i modeller som inte hade behövts. Det är resurser som främst behövs, inte formulär för kvalitetssäkring, nya bokningssystem för sjukhussängar eller ännu en managementkonsult som inte kan något om verksamheten. Kombinationen av marknadslösningar, byråkrati och resursbrist har skapat närmast omänskliga villkor för de samhällsbärare vi inte klarar oss utan. Dessa samhällsbärare förtjänar att bli lyssnade på. De har handfast kunskap som är avgörande för att lyfta välfärden, och den behöver tas om hand. De anställda i välfärden bör också få ett kraftigt utökat inflytande över verksamheterna de arbetar i."
