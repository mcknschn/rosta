      - slag: styckat_olika
        sida: 13
        a_rader: '534-543,546-549'
        b_rader: '534-543'
        a: "Många år av privatiseringar och ständig jakt på effektiviseringar i arbetslivet, skolan, vården och omsorgen har påverkat både hälsa, vårdbehov och tillgången till vård negativt. Stressrelaterade sjukdomar blir allt vanligare och psykisk ohälsa ökar särskilt bland kvinnor och hos unga utan att det leder till utbyggd vård eller förändrad arbetsmiljö. Du ska ha rätt till hjälp snabbt oavsett om du har brutit benet eller blivit utbränd. Men Sverige har idag minst antal vårdplatser i EU och en alldeles för dåligt utbyggd primärvård. Att du är beroende av omsorg ska inte, som idag, begränsa dina möjligheter att styra över ditt liv. Vittnesmålen om äldre som nästan aldrig får gå ut eller som måste äta sin middag tidigt på eftermiddagen för att personalen ska få tiden att gå ihop vittnar om en förskjutning i synen på människovärde. Vård och omsorg måste ges efter behov oavsett om du bor på ett särskilt boende eller har insatser av hemtjänsten. Därför vill Vänsterpartiet satsa mer resurser på hälso- och sjukvården och äldreomsorgen, samt satsa på personalen så att vi samtidigt får bort personalbristen och stärker personalens villkor och arbetsmiljö."
