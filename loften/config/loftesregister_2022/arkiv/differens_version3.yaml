        a: "Mitt i klimatkrisen tvingas Sverige elda 140 000 liter olja i timmen i Karlshamnsverket för att elen ska räcka. Det är inte en hållbar energipolitik. Och en helt ohållbar klimatpolitik. Utan ren och stabil el till rimligt pris blir det ingen klimatomställning. Moderaterna tänker genomdriva en ny energipolitik - med mer kärnkraft - både för klimatets och för energiförsörjningens skull."
        b: "Mitt i klimatkrisen tvingas Sverige elda 140 000 liter olja i timmen i Karlshamnsverket för att elen ska räcka. Det är inte en hållbar energipolitik. Och en helt ohållbar klimatpolitik. Utan ren och stabil el till rimligt pris blir det ingen klimatomställning. Moderaterna tänker genomdriva en ny energipolitik - med mer kärnkraft - både för klimatets och för energiförsörjningens skull. Vi ska som land ta fullt ansvar här hemma och nå nettonollutsläpp senast år 2045. Det gör vi genom att ersätta fossil energi med ren el och innovativa tekniker som minskar eller tar bort utsläppen. Samtidigt ska vi hjälpa andra länder att minska sina utsläpp genom effektivt internationellt samarbete."
        beslut: 'a'
        skal: "Princip 1, ett stycke ar ett stycke. Rad 904-910 ar block 366 och slutar med punkt. Rad 911 borjar en ny mening i block 367. Tva stycken, alltsa tva poster."
