    fall:
      - slag: bara_a
        sida: 2
        a_rader: '7-20'
        b_rader: null
        a: "Det har gått åtta år sedan Kristdemokraterna senast satt i regeringen. Sedan dess har utvecklingen gått åt fel håll och vanligt folk har fått det sämre. Vårdköerna har tredubblats. 140 000 människor har väntat olagligt länge på besök hos specialist eller på behandling. Gängkrigen har tagit mer än tvåhundra liv de senaste fem åren. El- och drivmedelspriserna pressar hushållen, inte minst i Sveriges hjärtland. Drivmedelspriserna har skenat och den gångna vinterns elpriser låg periodvis tusen procent högre än året innan. Sverige har blivit dyrare, otryggare och med sämre tillgång till vård för den som behöver - det är orimligt."
        b: null
        beslut: 'a'
        skal: "Princip 3, innehallet avgor aldrig. Forordets forsta stycke. Den korta uteslutningslistan i `Avsnitt utan liststruktur` namner namnunderskrifter men inte forordstext, och ett forord ar ett listlost avsnitt."
      - slag: bara_a
        sida: 2
        a_rader: '21-42'
        b_rader: null
        a: "Det behöver inte vara så här. Det går att vända utvecklingen. Sverige är ett fantastiskt land med en stark ekonomisk grund och ett välfärdssystem som stödjer människor utifrån behov genom hela livet. Köer i vården, gängkrig och upplopp på gatorna är inte värdigt vårt land. Det är inte det Sverige vi växte upp i och det är inte det Sverige vi ska lämna över till våra barn. Kristdemokraterna vill bygga ett samhälle där ingen hålls tillbaka och ingen lämnas efter. Vi når dit genom att i vår demokrati främja goda värden som medmänsklighet ansvarstagande, förvaltarskap, hederlighet, måttfullhet och jämställdhet. Vi prioriterar välfärdens viktigaste delar, samtidigt som vi ger människor utrymme att forma sina egna liv i gemenskap med andra. De problem vi har fått på senare år är djupa, men de kan lösas och de ska lösas. Det är dags nu. Vi är redo för en ny regering."
        b: null
        beslut: 'a'
        skal: "Princip 1, ett stycke ar ett stycke. Rad 29 slutar `...ska lamna over till vara` och rad 30 borjar `barn.` Satsen har brutit en mening mellan block 5 och block 6. Avsnittet `Sidbrytningen` sager att ett spaltbyte fogas ihop. Pass C delade dar i tva."
      - slag: bara_a
        sida: 2
        a_rader: '43-52,54-57'
        b_rader: null
        a: "Vi prioriterar vården, för alla dem som lider i väntan på vård. Vi prioriterar samhällets äldsta och yngsta, dem som inte längre orkar höja sin röst eller ännu inte lärt sig att använda den. Vi prioriterar lantbruket, det som sällan syns i media men som producerar vår mat. Vi ser den som bor utanför storstäderna och är beroende av sin bil. Vi prioriterar tryggheten, vi är redo att bekämpa brotten. Vi ser människors behov av välfärd och vi ser företagaren vars affärsidéer gör det möjligt att betala för välfärden. Vi ser den som drabbats av elfattigdom och som tvingades ha ytterjackan på sig hemma i vintras för att uppvärmningen blivit för dyr."
        b: null
        beslut: 'a'
        skal: "Princip 3, innehallet avgor aldrig. Forordets stycke, buret av tva spann eftersom rubrikresten `ING` pa rad 53 inte hor till det."
      - slag: bara_a
        sida: 3
        a_rader: '58-65'
        b_rader: null
        a: "I Sverige ska vi ha råd med värme. Både den värme som kommer från element och den som kommer från mänsklig gemenskap. Om du har läst ända hit så ber vi dig att läsa i en minut till, så ska vi berätta hur det ska gå till."
        b: null
        beslut: 'a'
        skal: "Princip 3, innehallet avgor aldrig. Forordets sista stycke."
      - slag: styckat_olika
        sida: 12
        a_rader: '286-287'
        b_rader: '286'
        a: "Fyra prioriterade områden. Men vi går också till val på förslag som rör andra viktiga områden. Förslag för"
        b: "Fyra prioriterade områden. Men vi går också till val på"
        beslut: 'a'
        skal: "Princip 1, ett stycke ar ett stycke. `Fyra prioriterade omraden. Men vi gar ocksa till val pa forslag som ror andra viktiga omraden.` ar en mening som satsen delat i tva block."
      - slag: bara_b
        sida: 12
        a_rader: null
        b_rader: '287'
        a: null
        b: "förslag som rör andra viktiga områden. Förslag för"
        beslut: 'ingen'
        skal: "Princip 1, ett stycke ar ett stycke. Andra halvan av samma mening, och den ligger redan i posten 286-287. En egen post har skulle ta samma rad tva ganger."
      - slag: bara_a
        sida: 12
        a_rader: '302-304'
        b_rader: null
        a: "Vill du läsa mer om våra förslag eller om vår politik på alla politikområden, läs mer på kristdemokraterna.se"
        b: null
        beslut: 'a'
        skal: "Princip 3, innehallet avgor aldrig. `Vill du lasa mer om vara forslag...` ar satt i 12,2 punkter, sidans brodtextgrad, och star i ett listlost avsnitt."
