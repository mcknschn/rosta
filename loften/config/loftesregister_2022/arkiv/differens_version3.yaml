      - slag: styckat_olika
        sida: 17
        a_rader: '997-1008'
        b_rader: '994-1008'
        a: "Ska vi klara det behövs en elproduktion där alla fossilfria energikällor är med och bidrar. I det läge Sverige har hamnat i på grund av dåliga politiska beslut kommer en utbyggnad av kärnkraften att vara helt central. Det är avgörande både för energiförsörjningen och klimatet. Inte minst finns ett behov av att bygga många nya, mindre reaktorer snarare än ett fåtal stora för att säkerställa att det finns elproduktion som fungerar oberoende av väder och vind. Moderaterna vill att staten garanterar lån för byggandet av ny kärnkraft - det skulle möjliggöra att 10 nya reaktorer byggs."
        b: "Den gröna omställningen förpliktigar. Fram till 2045 kommer Sveriges elbehov mer än fördubblas. Ska vi klara det behövs en elproduktion där alla fossilfria energikällor är med och bidrar. I det läge Sverige har hamnat i på grund av dåliga politiska beslut kommer en utbyggnad av kärnkraften att vara helt central. Det är avgörande både för energiförsörjningen och klimatet. Inte minst finns ett behov av att bygga många nya, mindre reaktorer snarare än ett fåtal stora för att säkerställa att det finns elproduktion som fungerar oberoende av väder och vind. Moderaterna vill att staten garanterar lån för byggandet av ny kärnkraft - det skulle möjliggöra att 10 nya reaktorer byggs."
