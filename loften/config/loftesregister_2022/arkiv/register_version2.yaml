    lydelse: "Ge Socialstyrelsen i uppdrag att ändra i riktlinjerna för blodgivning så att sexuell läggning inte längre ska vara avgörande för vem som får donera blod"
  - id: M-251
    parti: M
    sida: 39
    rader: '2093'
    lydelse: "Värna och stärka public services kärnuppdrag och kravet på saklighet och opartiskhet"
  - id: M-252
    parti: M
    sida: 39
    rader: '2094-2095'
    lydelse: "Reformera mediestödet för att stödja den digitala transformationen och omställningen"
  - id: M-253
    parti: M
    sida: 39
    rader: '2096-2098'
    lydelse: "Stärka det straffrättsliga skyddet för journalister, i syfte att värna tryck- och yttrandefriheten, motverka hot, våld och andra olagliga angrepp mot journalister och medieredaktioner"
  - id: SD-001
    parti: SD
    sida: 3
    rader: '35-38'
    lydelse: "Den ekonomiska politiken ska föras på ett ansvarsfullt sätt. När andra partier lovar hundratals miljarder mer till klimatpolitik, invandring och bistånd lovar vi att prioritera Sverige och att fullt ut finansiera våra reformer på ett sätt som inte spär på inflation och som är långsiktigt hållbart."
  - id: SD-002
    parti: SD
    sida: 3
    rader: '39-41'
    lydelse: "Återupprättandet av tryggheten ska ha den allra främsta prioriteten. Att säkerställa säkerheten för och i Sverige är en grundförutsättning för alla andra reformer."
  - id: SD-003
    parti: SD
    sida: 3
    rader: '42-45'
    lydelse: "Satsningar ska finansieras på andra sätt än med nya skatter. Inflationen har redan gjort att marginalerna snabbt minskat för många. Vi säger nej till Socialdemokraternas förslag om ny fastighetsskatt, ytterligare höjda drivmedelsskatter och beredskapsskatt på arbete."
  - id: SD-004
    parti: SD
    sida: 3
    rader: '46-47'
    lydelse: "Nya steg ska tas för att bygga ut välfärden. Genom att byta prioriteringar kan nya steg framåt tas för att göra de sociala trygghets-systemen starka."
  - id: SD-005
    parti: SD
    sida: 5
    rader: '69-73'
    lydelse: "Sänk bensin- och dieselpriset kraftigt. Skatten på drivmedel ska permanent sänkas och de kostnadsdrivande kraven på inblandning av biodrivmedel, reduktionsplikten, ska minskas till ett minimum. Klimatet räddas inte genom att svenskar får betala mer för drivmedel och varor. Tvärtom riskerar det att slå ut våra förutsättningar att kunna investera för framtiden."
  - id: SD-006
    parti: SD
    sida: 5
    rader: '74-77'
    lydelse: "Sänk arbetsgivaravgiften för alla företag. Särskilt företag i gles- och landsbygd behöver stimuleras för att klara tuffare tider och få fler att kunna anställa. Ineffektiva riktade lönesubventioner och andra särlösningar för utvalda grupper ska avskaffas för att istället göra det billigare att anställa generellt."
  - id: SD-007
    parti: SD
    sida: 5
    rader: '78-80'
    lydelse: "Satsa på kärnkraften. Politiken måste aktivt verka för att skapa förutsättningar för ny modern och miljöanpassad kärnkraft i Sverige. En färdplan för byggandet av SMR-reaktorer ska tas fram."
  - id: SD-008
    parti: SD
    sida: 5
    rader: '81-84'
    lydelse: "Stoppa nedläggning av befintlig vattenkraft. Vattenkraften utgör tillsammans med kärnkraften ryggraden i elsystemet. Den behöver därför öka, inte minska. Sverige har i nuvarande akuta läge inte råd att förlora vattenkraft genom negativa beslut från miljöprövningar."
  - id: SD-009
    parti: SD
    sida: 5
    rader: '85-86'
    lydelse: "Elskatten ska sänkas permanent. Planerade skattehöjningar ska stoppas. Under kommande vinter bör både skatt och moms på el helt slopas."
  - id: SD-010
    parti: SD
    sida: 5
    rader: '87-89'
    lydelse: "Se över villkoren för energimarknaden. Konkurrenskraften för fjärr- och kraftvärme ska stärkas för att snabbt kunna öka elproduktionen från dessa källor. Ompröva målet för energipolitiken från förnybarhet till fossilfrihet."
  - id: SD-011
    parti: SD
    sida: 5
    rader: '90-92'
    lydelse: "Bevara det lokala självbestämmandet vid vindkraftsetablering. Sverigedemokraterna säger nej till regeringens planer att slopa det kommunala vetot vid etablering av stora vindkraftsparker."
  - id: SD-012
    parti: SD
    sida: 6
    rader: '111-114'
    lydelse: "Stärk och förstatliga A-kassan. Tillfällig arbetslöshet ska inte behöva bli en privatekonomisk kris. Tryggheten för den som drabbas av arbetslöshet ska öka. Fler ska få ersättning vid arbetslöshet genom att A-kassan fullt ut inryms i det gemensamma välfärdsåtagandet."
  - id: SD-013
    parti: SD
    sida: 6
    rader: '115-119'
    lydelse: "Tandvården ska helt ingå i den allmänna välfärden. Sverigedemokraterna vill slutligen fullt ut inrymma tandvården i den allmänna välfärden för svenska medborgare. Samma högkostnadsskydd som gäller i sjukvården ska gälla för tandvård. Den kraftigt subventionerade tandvården för asylsökande, illegala invandrare och i övrigt ej svenska medborgare ska samtidigt avskaffas."
  - id: SD-014
    parti: SD
    sida: 6
    rader: '120-124'
    lydelse: "Höj pensionerna för alla och mest för dem som arbetat. Sverigedemokraterna vill öka de ekonomiska villkoren för alla pensionärer, inte bara för dem med ingen eller lägst inkomstpension. Skatten på pension ska sänkas och avsättningarna inom den allmänna pensionen ska ses över i syfte att kännbart öka pensionerna."
  - id: SD-015
    parti: SD
    sida: 6
    rader: '125-128'
    lydelse: "Öka statens ansvar för sjukvården. Utred hur delar av sjukvården skulle kunna överföras till statligt huvudmannaskap med inslag från framgångsrika nordiska exempel. Antalet utbildningsplatser ska öka i bristyrken som t.ex. barnmorskor och fler händer i vården ska leda till bättre arbetsmiljö."
  - id: SD-016
    parti: SD
    sida: 7
    rader: '129-136'
    lydelse: "Gör skolan kunskapsfokuserad igen. Återinför ett statligt huvudmannaskap för skolan, med större likvärdighet med nationell skolpeng och tydliga riktlinjer och regelverk. Samtidigt ska den socialdemokratiska flumskolan nedmonteras och en kunskapsfokuserad skola införas med betyg från årskurs fyra. Sverigedemokraterna säger nej till regeringens förslag om bussning av elever i integrationssyfte. Nolltolerans mot hot, våld och kriminella attribut ska råda i skolan. Elever som inte fungerar i skolsituationen ska flyttas till jourskolor. Särskilt stökiga elever ska placeras på pliktskolor."
  - id: SD-017
    parti: SD
    sida: 7
    rader: '137-139'
    lydelse: "Stärk välfärden i hela landet. Läkare, specialistsjuksköterskor och behöriga lärare som väljer att ta anställning i landsbygd och glesbygd, där stor brist på deras kompetens råder, ska få en årlig avskrivning av sina studieskulder."
  - id: SD-018
    parti: SD
    sida: 7
    rader: '140-144'
    lydelse: "Gör det billigare att bygga och möjliggör för fler att äga sitt boende. Många har drömmar om att bilda familj i ett boende som passar dem. Men för många med vanlig ekonomi stannar boendedrömmen där. Krångliga regler och kostsamma krav för att bygga har i kombination med bostadsbrist gjort situationen svår för många."
  - id: SD-019
    parti: SD
    sida: 7
    rader: '145-148'
    lydelse: "Stoppa fusket med välfärdens pengar. 20 miljarder försvinner från välfärden varje år i felaktiga utbetalningar och fusk. Sverigedemokraterna vill säkra utbetalningar ifrån välfärdsystemen genom biometriska data som avläser att det är rätt person som får rätt utbetalning."
  - id: SD-020
    parti: SD
    sida: 7
    rader: '149-152'
    lydelse: "Begränsa tillgången till välfärden för icke-medborgare. Bosättningsbaserade socialförsäkringsförmåner som barnbidrag, bostadsbidrag, efterlevandestöd och föräldrapenning ska begränsas för dem som inte är medborgare eller har kvalificerat sig genom arbete."
  - id: SD-021
    parti: SD
    sida: 7
    rader: '153-158'
    lydelse: "Gör om flerbarnstillägget till ett flerbarnsavdrag. Flerbarnstillägget i barnbidraget har bidragit till segregation och blivit ett verktyg för att hålla kvar utlandsfödda kvinnor i hemmet. För att komma tillrätta med problemen krävs stora förändringar. Som ett första steg föreslår Sverigedemokraterna att dagens flerbarnstillägg slopas och ersätts med ett skatteavdrag som tillkommer dem som arbetar."
  - id: SD-022
    parti: SD
    sida: 7
    rader: '159-164'
    lydelse: "Inför arbetsplikt. Sverige har i dag närmare 700 000 utrikes födda som försörjer sig på bidrag. Det ska inte vara möjligt att leva på bidrag i åratal utan motprestation. Sverigedemokraterna vill införa en svensk motsvarighet av den danska arbetsplikten som innebär att den som får försörjningsstöd också måste prestera genom uppföljningsbara ansträngningar som stärker möjligheten till integration och anställning."
  - id: SD-023
    parti: SD
    sida: 8
    rader: '188-195'
    lydelse: "Skärp straffen. Kriminalpolitiken ska i högre grad inriktas på att skydda samhället från kriminella. Inriktningen ska vara att inkapacitera och avskräcka kriminella och att skapa upprättelse åt brottsoffer. Mängd- och ungdomsrabatterna samt förtida frigivning ska avskaffas. Brottsbalken ska ses över för att ytterligare skärpa straffen för bl.a. vålds- och sexualbrott. Särskilt farliga kriminella återfallsförbrytare ska kunna dömas till förvarsdom utan bortre tidsgräns till dess att återfallsrisken bedöms ha försvunnit. Ingen ska släppas ut i väntan att avtjäna en dom i fängelse och fler utdömda straff ska avtjänas i fängelse."
  - id: SD-024
    parti: SD
    sida: 8
    rader: '196-202'
    lydelse: "Ge brottsoffren upprättelse och frid. Det ska bli lättare för brottsoffer att få ut ett skadestånd som står i proportion till brottets allvar, utan att själv behöva driva processen. Vittnesskyddet ska stärkas och det ska införas en möjlighet att vittna anonymt. Möjligheten till permission för gärningsmän ska underkastas brottsoffrets inflytande. Gärningsmän ska också kunna förbjudas att återvända till platser med anknytning till brottet eller brottsoffret och möjligheterna till elektroniskt övervakade kontaktförbud och vistelseförbud ska utökas."
  - id: SD-025
    parti: SD
    sida: 9
    rader: '203-207'
    lydelse: "Fler anstaltsplatser. Både häkten och anstalter är överfulla och fängelsedömda får gå fria för att det inte finns någon plats för dem att avtjäna sitt straff. Om fler kriminella ska avskärmas från samhället måste fler platser fram. Sverigedemokraterna vill dubblera antalet anstaltsplatser, hyra fängelseplatser i utlandet och låta fler utländska medborgare avtjäna straff i sina hemländer."
  - id: SD-026
    parti: SD
    sida: 9
    rader: '208-212'
    lydelse: "Utvisa utländska kriminella. Sveriges främsta ansvar är våra egna medborgare. När utländska medborgare kommer hit, oavsett skäl, och begår brott försakar de också rätten att vara kvar här. De ska utvisas. Vi måste prioritera tryggheten i Sverige framför utländska våldtäktsmän, gängmedlemmar och mördare."
  - id: SD-027
    parti: SD
    sida: 9
    rader: '213-217'
    lydelse: "Rättsväsendet ska vara närvarande. Alla måste kunna känna sig trygga att röra sig i sitt eget samhälle, i sitt eget bostadsområde. Vi ska skapa ett tryggare samhälle med hög närvaro av polis och ordningsvakter, övervakningskameror och belysning. Poliserna måste bli många fler och ges rätt verktyg och mer uppbackning av samhället genom ett resursstarkt rättsväsende i övrigt."
  - id: SD-028
    parti: SD
    sida: 9
    rader: '218-221'
    lydelse: "Förbjud deltagande i kriminella gäng. Den organiserade brottsligheten ska bekämpas. Deltagande i, och samröre med dessa organisationer, ska förbjudas. Den som begår brott relaterade till gängkriminalitet ska dömas till dubbla strafftiden."
  - id: SD-029
    parti: SD
    sida: 9
    rader: '222-225'
    lydelse: "Stoppa gängens inkomster. Gränskontrollerna måste stärkas för att öka kontrollen av inflöden av narkotika och vapen. Det ska bli lättare att förverka misstänkta brottsvinster, värdesaker och statussymboler från gängkriminella och deras anhöriga."
  - id: SD-030
    parti: SD
    sida: 9
    rader: '226-231'
    lydelse: "Öka föräldraansvaret. Inför strikt skadeståndsansvar för föräldrar till ungdomar som begår brott. Utred möjligheten att under vissa förhållanden begränsa tillgången till ekonomiska förmåner och bidrag till föräldrar till omyndiga kriminella. För icke-medborgare bör formerna utredas för att kunna återkalla uppehållstillstånd för familjer där bristande föräldraskap eller missanpassning bidragit till allvarlig brottslighet."
  - id: SD-031
    parti: SD
    sida: 9
    rader: '232-236'
    lydelse: "Sänk straffmyndighetsåldern. Grova brott begås allt oftare av mycket unga gärningsmän. Avsaknaden av skarpa reaktioner gör att unga ofta kommit att präglas av en kriminell livsstil under många år innan de döms första gången. Sverigedemokraterna vill sänka straffmyndighetsåldern så att även brott som begås innan 15 år kan utredas och lagföras."
  - id: SD-032
    parti: SD
    sida: 9
    rader: '237-243'
    lydelse: "Ökade möjligheter att utreda brott. Asylsökande och andra som söker uppehållstillstånd i Sverige bör i anslutning till ansökan åläggas att bidra med DNA och andra biometriska data till ett nytt sökbart register. Registret bör användas både av myndigheter som hanterar utlänningsärenden, för att t.ex. identifiera sökanden som tidigare utvisats eller avvisats från Sverige, och av brottsbekämpande myndigheter. Samverkan mellan polis och andra myndigheter måste också underlättas genom förenklade sekretessregler."
  - id: SD-033
    parti: SD
    sida: 10
    rader: '267-272'
    lydelse: "Asyllagstiftningen ska anpassas efter den rättsliga miniminivån enligt EU-rätten. Det innebär att Sveriges lagstiftning inte ska vara mer generös än vad vi är bundna till. Ett omfattande reformarbete ska genomföra sådana restriktiva åtgärder som tillåts enligt EU-rätten. Permanenta uppehållstillstånd ska avskaffas och uppehållstillstånd ska omprövas löpande, beviskraven för asylsökanden ska skärpas och fler som inte sökt skydd vid första säkra tillfälle ska utvisas."
  - id: SD-034
    parti: SD
    sida: 10
    rader: '273-276'
    lydelse: "Begränsa rätten till anhöriginvandring och skärp försörjningskraven. Endast svenska medborgare eller den som enligt internationell lagstiftning har rätt till familjeåterförening ska kunna vara anknytningsperson. Kraven på bostad, inkomst och vandel ska skärpas kraftigt för anhöriginvandring."
  - id: SD-035
    parti: SD
    sida: 10
    rader: '277-282'
    lydelse: "Minska tilldragningsfaktorerna. Förväntningar som ställs i mottagarlandet - vilken service som erbjuds och på vilka språk, vilken diaspora som redan finns från ursprungslandet, kulturella normer, frikostigheten med välfärd och ekonomiska villkor - är avgörande för Sveriges attraktivitet som destinationsland för invandring. En bred politik ska föras för att ur sådana aspekter göra Sverige mindre attraktivt för kulturellt belastande migration."
  - id: SD-036
    parti: SD
    sida: 11
    rader: '283-291'
    lydelse: "Storskaligt och effektivt återvändandearbete. Ett särskilt uppdrag ska ges till Polismyndigheten att särskilt prioritera återvändandearbete och insatser för att identifiera och omhänderta personer som befinner sig i Sverige illegalt. Personer som kan antas sakna rätt att vara i Sverige ska omhändertas och fler ska sättas i förvar eller övervakas i väntan på utvisning om sådan inte kan genomföras omedelbart. En folkräkning ska genomföras och inre utlänningskontroller ska göras till en naturlig komponent i polisens kontakter med allmänheten. Fler moderna verktyg, som fingeravtryck, DNA-test, kamerateknik och AI-analys, ska användas för att hitta och identifiera personer som befinner sig olagligt i Sverige."
  - id: SD-037
    parti: SD
    sida: 11
    rader: '292-298'
    lydelse: "Möjligheten att utvisa en utlänning p.g.a. asocialitet ska utredas. Sverigedemokraterna vill se över en ny grund för återkallande av uppehållstillstånd för utländska medborgare som genom en asocial livsstil uppvisar brister i sina förpliktelser gentemot det svenska samhället eller utgör särskild risk eller belastning för Sverige. Personer som besvarar Sveriges givmildhet genom att uppvisa fientlighet gentemot samhället eller majoritetsbefolkningen bör kunna utvisas p.g.a. asocialitet."
  - id: SD-038
    parti: SD
    sida: 11
    rader: '299-304'
    lydelse: "Reglerna för arbetskraftsinvandring ska skärpas. Arbetskraftsinvandring ska inte kunna komma ifråga för lågkvalificerad arbetskraft eller till yrken där det inte råder yrkesbrist. Kontrollen av arbetskraftsinvandringen måste öka och reglerna behöver skärpas kraftigt genom t.ex. utökade lönekrav och arbetsmarknadsprövning för den som söker uppehållstillstånd för att arbetskraftsinvandra."
  - id: SD-039
    parti: SD
    sida: 11
    rader: '305-309'
    lydelse: "Stimulera frivillig återvandring. Ekonomiska incitamentsstrukturer och myndigheternas arbetssätt ska anpassas för att uppmuntra fler att återvandra frivilligt. Det ska göras relativt mer attraktivt för den som inte anstränger sig för att bli självförsörjande eller söker tillhörighet till det svenska samhället att återvända till sitt ursprungsland eller dess närområde, än att leva i parallellsamhällen i Sverige."
  - id: SD-040
    parti: SD
    sida: 11
    rader: '310-313'
    lydelse: "Uppvärdera medborgarskapet. Hemvistkravet ska utökas till tio år. För att få svenskt medborgarskap ska man kunna tala svenska på god nivå och ha god förståelse för svenskt samhälle, kultur och normer. Hederlig vandel och självförsörjning ska vara ett villkor för att erhålla medborgarskap i Sverige."
  - id: SD-041
    parti: SD
    sida: 11
    rader: '314-317'
    lydelse: "Återupprätta gränskontroller. Kontrollen över vilka som tar sig in i Sverige ska öka för att minska illegal migration till Sverige. Berörda myndigheter ska få de möjligheter och de verktyg som de behöver för att upprätthålla inre gränskontroller."
  - id: SD-042
    parti: SD
    sida: 11
    rader: '318-323'
    lydelse: "Stoppa EU-förslag om migrationspakten. EU driver för närvarande ett förslag som skulle innebära att principen om att asyl ska sökas i första land ersätts med en omfördelning baserad på anknytning. Det skulle riskera att straffa svenskarna dubbelt för den massinvandring som varit. Länder som inte önskar ta emot asylsökande skulle om förslaget går igenom kunna straffas ekonomiskt av EU. Sverigedemokraterna kommer göra allt för att Sverige ska stoppa EU-förslaget."
  - id: C-001
    parti: C
    sida: 5
    rader: '159-161'
    lydelse: "Sverige behöver ett handlingskraftigt klimatledarskap som gör skillnad på riktigt. För att övervinna klimathotet måste vi ta vara på teknikens möjligheter och företagens innovationskraft."
  - id: C-002
    parti: C
    sida: 5
    rader: '162-164'
    lydelse: "Hela landet behövs, från förort till industriort, från storstad till landsbygd. Alla delar av Sverige ska se ökad frihet, trygghet och tillgänglighet nästa mandatperiod. Det är dags att frigöra landsbygdens enorma potential."
  - id: C-003
    parti: C
    sida: 5
    rader: '165-168'
    lydelse: "Vi ska bygga ett jämställt Sverige med möjligheter och rättvisa för alla. Vi ska stärka kvinnors trygghet och egenmakt. Förebyggande åtgärder mot mäns våld mot kvinnor ska genomsyra hela samhället och män som slår ska inte komma undan."
  - id: C-004
    parti: C
    sida: 5
    rader: '169-171'
    lydelse: "Småföretagen är motorer för jobb, integration och möjligheter. Vi ska skapa bättre förutsättningar för dem att lyckas, med lägre skatt, mindre regelkrångel och en starkare arbetslinje."
  - id: C-005
    parti: C
    sida: 5
    rader: '172-174'
    lydelse: "Sveriges och hushållens ekonomi måste stärkas, idag och långsiktigt. Vi ska sänka det totala skattetrycket och skapa stabilitet i statsfinanserna genom att hushålla med skattebetalarnas pengar."
  - id: C-006
    parti: C
    sida: 5
    rader: '175-176,178'
    lydelse: "Vi ska bygga en vård och omsorg som sätter människan i centrum. Den ska bedrivas närmare den som behöver hjälp och med bättre arbetsvillkor för medarbetarna. Så kortar vi köerna och stärker likvärdigheten i hela landet."
  - id: C-007
    parti: C
    sida: 6
    rader: '179-180'
    lydelse: "Den liberala demokratin får aldrig tas för given. Den ska vårdas, värnas och vidareutvecklas - idag och för kommande generationer."
  - id: C-008
    parti: C
    sida: 6
    rader: '181-183'
    lydelse: "Vi ska stärka samhällskontraktet för ett tryggare och starkare Sverige, från landets gränser till ditt kvarter. Vi behöver rusta Sveriges totalförsvar, stärka hela rättskedjan, satsa på förebyggande insatser och en likvärdig skola."
  - id: C-009
    parti: C
    sida: 6
    rader: '184-188'
    lydelse: "Centerpartiet söker samarbete för en politik som är tydligt förankrad i mitten. Vi står för grön, liberal politik och för att bryta den splittring och polarisering som riskerar att förlama Sveriges politiska handlingskraft. Sverige behöver vare sig främlingsfientlig högernationalism eller socialistisk vänsterpolitik."
  - id: C-010
    parti: C
    sida: 7
    rader: '245-250'
    lydelse: "Sverige ska bli Europas gröna batteri och exportera el till grannländer som fasar ut sitt fossilberoende. Vi vill fördubbla produktionen av utsläppsfri el, och rusta och bygga ut elnätet. Minst 50 TWh utsläppsfri el måste börja byggas nästa mandatperiod. Det krävs en kriskommission för att snabbare öka Sveriges utsläppsfria elproduktion och tillstånd för vindkraft ska få ta max två år."
  - id: C-011
    parti: C
    sida: 7
    rader: '251-253'
    lydelse: "Stryp Putins krigskassa nu. Vi vill stoppa all energihandel med Ryssland och fasa ut fossila bränslen. Sveriges energioberoende måste stärkas, bland annat genom att mångdubbla produktionen av biobränslen och biogas."
  - id: C-012
    parti: C
    sida: 7
    rader: '254-257'
    lydelse: "Skogen är en nyckel i den gröna omställningen. Ett hållbart skogsbruk förutsätter ett aktivt brukande av skogen. Den lagrar koldioxid, skapar jobb och är källan till framtidens biobränslen och byggmaterial. Skogsbruket behöver goda förutsättningar grundade i en stark äganderätt."
  - id: C-013
    parti: C
    sida: 8
    rader: '260-265'
    lydelse: "Det ska vara enkelt och billigt att installera solpaneler, bygga laddning till elbilar och minska energianvändningen hemma - vare sig man bor i hus eller lägenhet. Det kan vi lösa genom att bredda och skala upp det gröna avdraget och göra det enklare att installera solpaneler på flerfamiljshus. Det ska finnas gott om laddplatser längs våra vägar och på våra parkeringar i hela landet."
  - id: C-014
    parti: C
    sida: 8
    rader: '266-268'
    lydelse: "Klimatet kan inte vänta på dyra och krångliga regelverk. Det är dags att halvera tiden det tar att få tillstånd för gröna investeringar och reformera miljöbalken så att ett projekts klimatnytta ges större vikt i miljöprövningen."
  - id: C-015
    parti: C
    sida: 8
    rader: '269-271'
    lydelse: "Sverige ska bli världens mest resurseffektiva land och ekonomin mer cirkulär. Med rätt stöd och regelförenklingar kan vi återvinna och återbruka allt från kläder till mineral och metaller."
  - id: C-016
    parti: C
    sida: 8
    rader: '272-275'
    lydelse: "För att klara den gröna omställningen måste vi ta vara på Sveriges naturresurser. Det är bättre att Sverige tar ansvar och utvinner mer mineral och metaller istället för att fortsätta importera dem från länder med större klimatavtryck och sämre arbetsvillkor."
  - id: C-017
    parti: C
    sida: 8
    rader: '277-279'
    lydelse: "Rädda Sveriges sjöar, vattendrag och hav. Våra barn ska kunna bada utan att utsättas för gifter, nedskräpning eller algblomning. Skadlig bottentrålning ska inte få förstöra för varken havsmiljön, den småskaliga fiskenäringen eller sportfisket."
  - id: C-018
    parti: C
    sida: 8
    rader: '280-283'
    lydelse: "Sveriges natur ska vårdas och den biologiska mångfalden utvecklas. Mer måste göras för att restaurera våtmarker, bekämpa invasiva arter och underlätta för markägare att bidra, då frivillighet och äganderätt är grunden för en bättre naturvård."
  - id: C-019
    parti: C
    sida: 8
    rader: '284-286'
    lydelse: "Vi ska arbeta för mer närodlad och klimatsmart mat och ett levande, hållbart jordbruk som bidrar till den biologiska mångfalden. Vi vill stärka de gröna näringarnas konkurrenskraft."
  - id: C-020
    parti: C
    sida: 8
    rader: '287-291'
    lydelse: "Sveriges städer ska bli grönare. Utsläppsfria transporter, cyklar, elbilar och kollektivtrafik ska bli smidigare och attraktivare. Vi vill se fler grönområden nära där människor bor, renare vatten och mer biologisk mångfald. Det ska bli enklare att producera mer av sin egen el, med bland annat solpaneler och bättre elförsörjning inne i tätorter."
  - id: C-021
    parti: C
    sida: 10
    rader: '337-339'
    lydelse: "Dyra, krångliga och innovationshämmande regelverk ligger som en våt filt över delar av landsbygden. Vi ska rensa upp bland överflödiga regler och byråkrati."
  - id: C-022
    parti: C
    sida: 10
    rader: '340-343'
    lydelse: "Strandskyddet ska reformeras så att det blir lättare att bygga och bo på landsbygden. Det är dags att ge landsbygdsborna mer självbestämmande över sin egen mark, och genom regelförenklingar göra det enklare att bygga och bo på landsbygden."
  - id: C-023
    parti: C
    sida: 10
    rader: '344-346'
    lydelse: "Det är orimligt att lokala producenter av alkoholhaltiga drycker inte kan sälja sina produkter till besökare. Tillåt gårdsförsäljning av alkohol för att stärka besöksnäringen och utveckla landsbygden."
  - id: C-024
    parti: C
    sida: 10
    rader: '347-351'
    lydelse: "Sverige behöver ett ännu mer konkurrenskraftigt jordbruk. En långsiktigt hållbar livsmedelsförsörjning med ökad försörjningstrygghet och ökad matproduktion kräver regelförenklingar och skattesänkningar, inklusive ett kraftfullt jordbruksavdrag och en biodrivmedelspremie som gör det hållbara lantbruket mer lönsamt."
  - id: C-025
    parti: C
    sida: 10
    rader: '353-356'
    lydelse: "Vi vill rusta upp regionala järnvägar, bygga nya stambanor från norr till söder, höja standarden på det nationella stambanenätet i hela landet och storsatsa på morgondagens tågtrafik - för klimatets och landsbygdens bästa."
  - id: C-026
    parti: C
    sida: 10
    rader: '357-360'
    lydelse: "Landsbygden behöver bättre vägar och bättre tillgång till cykelvägar. Vi vill rusta upp vägarna, göra dem mer trafiksäkra för alla trafikanter, förbättra belysningen, vägunderhållet året runt och bygga fler laddstolpar och snabbladdare i hela landet."
  - id: C-027
    parti: C
    sida: 10
    rader: '361-363'
    lydelse: "Det regionala flyget håller ihop Sverige. Flyginfrastrukturen ska fungera i hela landet. Vi vill säkerställa att de regionala flygplatserna står redo med rätt infrastruktur när elflyget utvecklas i snabb takt."
  - id: C-028
    parti: C
    sida: 10
    rader: '364-366'
    lydelse: "Alla ska ha tillgång till bredband, mobiltelefoni och surf i hela landet. Vi vill fortsätta bygga ut bredbandet och stärka mobiltäckningen i hela landet, inklusive på tågen."
  - id: C-029
    parti: C
    sida: 10
    rader: '367-368'
    lydelse: "Det reformerade reseavdraget måste i större utsträckning kompensera för de kostnader som följer med de långa avstånden på landsbygden."
  - id: C-030
    parti: C
    sida: 10
    rader: '370-371'
    lydelse: "Offentlig service ska vara nära och pålitlig i hela landet. Alla ska ha en trygg polisnärvaro, en likvärdig skola och en trygg och nära vård och omsorg oavsett var de bor."
  - id: C-031
    parti: C
    sida: 11
    rader: '373-375'
    lydelse: "Den som bor på landsbygden men betalar för sådant som det offentliga står för i tätort ska bli kompenserad. Därför vill vi införa ett avdrag för avgifterna till väg-, brygg- och bredbandssamfälligheter."
  - id: C-032
    parti: C
    sida: 11
    rader: '376-378'
    lydelse: "Den gröna omställningen kräver lokal förankring. Den som bor eller äger mark nära ett vindkraftverk ska kunna få ersättning. Mer av värdet som skapas från naturresurser - exempelvis vindkraft, vattenkraft och gruvor ska stanna kvar lokalt."
  - id: C-033
    parti: C
    sida: 11
    rader: '379-381'
    lydelse: "Statliga myndigheter måste samverka och arbeta marksnålt när man tar ny mark i anspråk för väg, tåg, el, etcetera. Likaså ska ersättning för ianspråktagen mark ersättas till avsevärt större belopp än idag."
  - id: C-034
    parti: C
    sida: 12
    rader: '438-440'
    lydelse: "Män som slår ska inte komma undan. Vi vill höja straffen för sexualbrott, grov fridskränkning och grov kvinnofridskränkning. Dessutom vill vi kriminalisera kontrollerande beteende."
  - id: C-035
    parti: C
    sida: 12
    rader: '441-445'
    lydelse: "Det förebyggande arbetet måste börja tidigt och genomsyra hela samhället. Alla kommuner ska ha handlingsplaner för att förebygga mäns våld mot kvinnor och alla skolor ska ha handlingsplaner mot hedersförtryck. Skolpersonal och vårdpersonal bör utbildas och nationell frånvarostatistik införas för att snabbare kunna upptäcka hedersvåld."
  - id: C-036
    parti: C
    sida: 12
    rader: '446-449'
    lydelse: "Brottsofferperspektivet måste stärkas och eftervåldet upphöra. Vi vill att elektronisk fotboja används i fler fall vid kontaktförbud och säkra det lång siktiga stödet till kvinnojourer, tjejjourer och skyddade boenden. Kvinnor med skyddad identitet ska enklare kunna byta efternamn på sina barn."
  - id: C-037
    parti: C
    sida: 12
    rader: '450-452'
    lydelse: "Ingen ska utsättas för hedersförtryck i Sverige. Utöver tidiga insatser i skolan vill vi bland annat kriminalisera oskuldskontroller och kontrollerande beteende."
  - id: C-038
    parti: C
    sida: 13
    rader: '455-457'
    lydelse: "Vi vill uppvärdera statusen för kvinnodominerande yrken och förbättra arbetsvillkoren inom offentlig sektor, bland annat genom karriärtjänster och rätt till kompetensutveckling."
  - id: C-039
    parti: C
    sida: 13
    rader: '458-460'
    lydelse: "Sverige rankas lågt i internationella jämförelser över kvinnors företagande. Vi vill reformera trygghetssystemet så att fler kvinnor kan satsa på entreprenörskap och se till att statligt riskkapital fördelas mer jämställt."
  - id: C-040
    parti: C
    sida: 13
    rader: '461-463'
    lydelse: "Fler utrikesfödda kvinnor måste få en chans att jobba, lära sig svenska och till fullo komma in i det svenska samhället. Det är en vinst både för den enskilda och samhället i stort."
  - id: C-041
    parti: C
    sida: 13
    rader: '464-467'
    lydelse: "Vi vill göra förskola och fritidsverksamhet tillgänglig för alla, utan att dessa kostnader drabbar kommunerna, för att underlätta integrationen, stärka jämställdheten och ge varje barn en chans att utvecklas tillsammans med pedagoger och andra barn."
  - id: C-042
    parti: C
    sida: 13
    rader: '468-470'
    lydelse: "Vi vill modernisera föräldraförsäkringen så att fler kvinnor kan komma i arbete och göra karriär, bland annat genom att införa en kraftigt förstärkt jämställdhetsbonus."
  - id: C-043
    parti: C
    sida: 13
    rader: '472-476'
    lydelse: "Stressrelaterad psykisk ohälsa drabbar den enskilda människan och samhället mycket hårt. Vi vill att den som söker vård ska erbjudas en enkel väg in för stöd och hjälp, att vården ska få bättre verktyg för behandling och att sjukskrivningen ska bli mer flexibel. Arbetsgivare bör ta ett större ansvar för förebyggande insatser och rehabilitering."
  - id: C-044
    parti: C
    sida: 13
    rader: '477-479'
    lydelse: "Kvinnor och män ska få lika bra vård. Det borde vara en självklarhet. Vi vill inrätta ett nationellt forskningsprogram om kvinnosjukdomar och stärka den genusmedicinska kompetensen i hela vårdkedjan."
  - id: C-045
    parti: C
    sida: 13
    rader: '480-481'
    lydelse: "Förlossningsvården bör organiseras så att samma barnmorska kan följa kvinnan under graviditet, förlossning och eftervård."
  - id: C-046
    parti: C
    sida: 15
    rader: '532-533'
    lydelse: "Sänk skatten på jobb och företagande, särskilt för småföretag och egenföretagare. Det ska löna sig att driva företag och skapa jobb."
  - id: C-047
    parti: C
    sida: 15
    rader: '534-536'
    lydelse: "Rensa upp i regelträsket för entreprenörer, stora som små. Vi vill införa en ny och förenklad företagsform för mikroföretag, så att fler ska våga testa att driva företag."
  - id: C-048
    parti: C
    sida: 15
    rader: '537-540'
    lydelse: "Kapitalförsörjning är avgörande för många småföretag. Vi vill att det statliga riskkapitalet blir mer effektivt och att investeraravdraget breddas och fördjupas. Därtill behöver det statliga riskkapitalet bli mer jämställt och nå hela landet, inte minst de utsatta områdena."
  - id: C-049
    parti: C
    sida: 15
    rader: '542-545'
    lydelse: "Det måste bli billigare och lättare att anställa, särskilt personer som står långt från arbetsmarknaden. Arbetsgivaravgiften behöver sänkas, i ett första skede för ett företags första anställda, för människor som står långt från arbetsmarknaden liksom de som har låga inkomster."
  - id: C-050
    parti: C
    sida: 15
    rader: '546-547'
    lydelse: "Skapa fler dörrar in till arbetsmarknaden genom fler enkla jobb, det vill säga jobb som inte kräver kvalificerad utbildning. Förenkla och förstärk nystartsjobben och bredda de så kallade etableringsjobben."
  - id: C-051
    parti: C
    sida: 15
    rader: '548-550'
    lydelse: "Matchningen måste förbättras. Alla ska ha rätt till en effektiv matchningstjänst och det ska bli lättare att hitta medarbetare inom alla yrken. Utbildningssystemet behöver i betydligt större utsträckning utgå från arbetsmarknadens behov."
  - id: C-052
    parti: C
    sida: 15
    rader: '551-552'
    lydelse: "Svensk arbetsmarknad behöver både mer flexibilitet och mer trygghet. Stödet vid omställning och vidareutbildning måste bli bättre."
  - id: C-053
    parti: C
    sida: 15
    rader: '553-555'
    lydelse: "Gör det enklare att anställa elever i yrkesprogram som lärlingar genom att stärka ersättningen för företagens kostnader förknippade med utbildningen. Detta ökar attraktiviteten för yrkesprogram och höjer kvaliteten på yrkesutbildningen."
  - id: C-054
    parti: C
    sida: 16
    rader: '558-560'
    lydelse: "Sverige klarar sig inte utan frihandel. Öppna upp fler marknader för svenska varor och tjänster. Ställ hårdare krav på arbetsvillkor, miljö och klimat i handelsavtal."
  - id: C-055
    parti: C
    sida: 16
    rader: '561-566'
    lydelse: "Skapa ett intensivår för snabbare integration. Den som får uppehållstillstånd ska snabbt integreras och ges möjlighet att försörja sig själv. Det kräver intensiva språkstudier, praktik, en effektiv matchning och jobb - inklusive möjligheten att lära sig svenska på jobbet. Integrationsinsatser ska präglas av hårt arbete och höga förväntningar. Nyanlända bör kvalificera sig in i trygghetssystemen."
  - id: C-056
    parti: C
    sida: 16
    rader: '567-570'
    lydelse: "Värna arbetskraftsinvandringen. För att svenska företag ska kunna konkurrera måste de ha möjlighet att snabbt hitta, rekrytera och anställa rätt kompetens. Låt arbetskraftsinvandrare räkna in studietiden i Sverige vid ansökan om permanent uppehållstillstånd."
  - id: C-057
    parti: C
    sida: 17
    rader: '616-618'
    lydelse: "Sverige behöver en ekonomisk politik som skapar fler jobb, mer frihet och starkare hushåll. Därför vill vi sänka skatten, särskilt för de med lägre inkomster och för de viktiga småföretagen."
  - id: C-058
    parti: C
    sida: 17
    rader: '619-622'
    lydelse: "Sveriges pensionärer ska ha god trygghet, nu och många år framöver. Däreför bidrog Centerpartiet till en stor höjning av pensionerna, särskilt för de med lägre inkomster. Vi måste försvara pensionssystemets långsiktiga rättvisa och hållbarhet."
  - id: C-059
    parti: C
    sida: 17
    rader: '623-625'
    lydelse: "Sänk skatten maximalt på biodrivmedel som blandas in i bensin och diesel. Det skulle sänka bilisternas kostnader, gynna klimatet, skapa jobb och minska Sveriges oljeberoende. Och med ett grönt avdrag för energieffektiviseringar i hemmet kan vi sänka hushållens elkostnader."
  - id: C-060
    parti: C
    sida: 17
    rader: '626-627'
    lydelse: "Boendet är den största investeringen många människor gör. Det förstärkta amorteringskravet - ett påtvingat sparande för dem med lägst inkomster bör avskaffas när ränteläget nu normaliseras."
  - id: C-061
    parti: C
    sida: 17
    rader: '629-631'
    lydelse: "Det totala skattetrycket måste ner nästa mandatperiod. Vi kommer inte att medverka till några skattehöjningar som skadar jobben, det egna sparandet eller gör det dyrare att bo."
  - id: C-062
    parti: C
    sida: 17
    rader: '632-635'
    lydelse: "Det finanspolitiska ramverket ska värnas och förstärkas, och Sveriges långsiktiga ekonomiska stabilitet ska försvaras. Politiken ska hushålla med skattebetalarnas pengar. Mer pengar ska läggas på välfärdens kärna, mindre på bidrag."
  - id: C-063
    parti: C
    sida: 19
    rader: '691-693'
    lydelse: "Köerna måste kortas och man ska ha rätt att välja bort köerna genom att söka vård i andra regioner. Vi vill skapa fler vårdplatser där det behövs med hjälp av en platsmiljard och bättre stöd till regionerna."
  - id: C-064
    parti: C
    sida: 19
    rader: '694'
    lydelse: "Vi vill ge alla rätt till en fast läkarkontakt."
  - id: C-065
    parti: C
    sida: 19
    rader: '695-698'
    lydelse: "Stödet för personer med psykisk ohälsa måste förbättras, inte minst för unga. Den som söker hjälp ska ha en enkel och samlad väg in till vården. Köerna till BUP måste arbetas bort. Vi vill förbättra rehabiliteringen och göra sjukskrivningen mer flexibel."
  - id: C-066
    parti: C
    sida: 19
    rader: '699-701'
    lydelse: "Gör mer för att förebygga, motverka och rehabilitera stressrelaterad psykisk ohälsa. Vi vill göra sjukskrivningen mer flexibel och förbättra rehabiliteringen."
  - id: C-067
    parti: C
    sida: 19
    rader: '702-704'
    lydelse: "Vi vill försvara valfriheten inom vård och omsorg och bedriva verksamheten nära vårdtagarna. Ansvaret för vården ska inte flyttas från regionerna till staten."
  - id: C-068
    parti: C
    sida: 19
    rader: '706-707'
    lydelse: "Den som jobbar i vård och omsorg ska kunna växa och vidareutvecklas i sitt yrke. Vi vill ge alla undersköterskor och sjuksköterskor rätt till kompetensutveckling."
  - id: C-069
    parti: C
    sida: 19
    rader: '708-710'
    lydelse: "Den administrativa bördan inom vården måste minska, bland annat med hjälp av digitala verktyg som är användbara och efterfrågade av medarbetarna."
  - id: C-070
    parti: C
    sida: 19
    rader: '711-713'
    lydelse: "Att anställa fler sjuksköterskor leder till mindre stress på jobbet och bättre resultat för patienten. Vi vill rekrytera fler sjuksköterskor genom att införa en examenspremie och ge lön under specialiststudietiden."
  - id: C-071
    parti: C
    sida: 19
    rader: '714-717'
    lydelse: "Mer och bättre stöd från chefer skapar trygghet på jobbet. Därför vill vi införa en obligatorisk utbildning för alla som får en chefstjänst i vård och omsorg, och skapa mindre arbetsgrupper med ett mål om max 25 medarbetare per chef."
  - id: C-072
    parti: C
    sida: 20
    rader: '749-751'
    lydelse: "Våra demokratiska institutioner behöver skydd. Vi vill göra det svårare att ändra grundlagen, skydda oppositionens ställning i riksdagen och stärka domstolarnas oberoende."
  - id: C-073
    parti: C
    sida: 20
    rader: '752'
    lydelse: "Sverige ska bli ännu mer transparent. Vi vill inrätta en antikorruptionsmyndighet, skärpa regler mot korruption och införa ett lobbyregister."
  - id: C-074
    parti: C
    sida: 21
    rader: '754-756'
    lydelse: "De politiska partierna är sårbara mot påverkan och infiltration. Reglerna för finansiering av politiska partier bör skärpas och deras motståndskraft mot yttre påverkan och infiltration rustas."
  - id: C-075
    parti: C
    sida: 21
    rader: '757-759'
    lydelse: "Få investeringar är lika viktiga och värdefulla för samhället och individen som utbildning, från förskola till universitet. Därför ska vi ha en likvärdig förskola och skola i hela landet."
  - id: C-076
    parti: C
    sida: 21
    rader: '760-763'
    lydelse: "Den akademiska och konstnärliga friheten liksom den fria kulturen är grund bultar i ett vitalt civilsamhälle. Politiken ska bidra till goda förutsättningar men hålla armlängds avstånd. En fristående folkbildning har mycket stor betydelse i tider då demokratiska värden ifrågasätts."
  - id: C-077
    parti: C
    sida: 21
    rader: '765-769'
    lydelse: "Våra grundläggande rättigheter får inte tas för givna. Vi vill stärka bland annat äganderätten, diskrimineringsförbudet, minoritetsskyddet och minoritetsspråkens ställning, och grundlagsskydda rätten till abort och reproduktiv hälsa. En författningsdomstol är viktig för att värna bland annat dessa rättigheter."
  - id: C-078
    parti: C
    sida: 21
    rader: '770-772'
    lydelse: "Rättsstaten och individens rättigheter gentemot staten måste försvaras. Vi säger därför nej till visitationszoner, kollektiv bestraffning, omvänd bevisbörda, anonyma vittnen, preventiv avlyssning och inskränkningar av religionsfriheten."
  - id: C-079
    parti: C
    sida: 21
    rader: '773-774'
    lydelse: "Alla som bor i Sverige ska kunna få sin sak prövad. Ledtiderna för handläggning och myndighetsutövning i domstolar och myndigheter måste kortas och tillgången till ombud förbättras."
  - id: C-080
    parti: C
    sida: 21
    rader: '775-779'
    lydelse: "Möjligheten att processa mot stat eller kommun, då man har goda skäl att få sin sak prövad, ska i en liberal demokrati inte vara en rätt förbehållen de med hög inkomst. Vi vill skapa en möjlighet för enskilda att kunna få ersättning för ombud i förvaltningsärenden då denne haft skäl att få sin sak prövad."
  - id: C-081
    parti: C
    sida: 21
    rader: '780-782'
    lydelse: "Mer måste göras mot diskriminering. Vi vill stärka myndigheternas arbete mot diskriminering och höja ersättningen till dem som utsatts, samt lägga till kön och funktionsnedsättning som hatbrottsgrunder."
  - id: C-082
    parti: C
    sida: 21
    rader: '784-785'
    lydelse: "Decentralisera mera. Människor ska få bestämma mer själva, och politiska beslut ska fattas nära dem som berörs."
  - id: C-083
    parti: C
    sida: 21
    rader: '786-788'
    lydelse: "En allsidig, oberoende och livskraftig mediebevakning i hela landet är avgörande för demokratin. Pressfriheten ska skyddas och oberoende public service försvaras."
  - id: C-084
    parti: C
    sida: 21
    rader: '789-791'
    lydelse: "Hat, hot, trakasserier och våld riktade mot demokratibärande institutioner måste upphöra. Vi ska stärka skyddet för personer verksamma bland annat i media, religiösa samfund och offentlig förvaltning."
  - id: C-085
    parti: C
    sida: 23
    rader: '839-841'
    lydelse: "Sverige ska försvaras. Vi vill rusta det militära försvaret snabbt, kraftfullt och långsiktigt. Sverige behöver satsa två procent av BNP på försvaret så snart det är praktiskt möjligt och gå med i Nato."
  - id: C-086
    parti: C
    sida: 23
    rader: '842-843'
    lydelse: "Även det civila försvaret är livsviktigt. Vi måste rusta civilförsvaret och samhällets beredskap inför krig och kris."
  - id: C-087
    parti: C
    sida: 23
    rader: '844-846'
    lydelse: "Samhället ska inte vika ned sig för gängen. För att besegra dem krävs bättre insatser som förebygger nyrekrytering, mer resurser till polis, åklagare, domstolar och kriminalvården och strängare straff. Dessutom bör en utredning om gängens inkomster och hur dessa kan strypas genomföras."
  - id: C-088
    parti: C
    sida: 23
    rader: '847-850'
    lydelse: "Tryggheten ska förbättras i hela landet och fler brott som drabbar folk i deras vardag ska klaras upp. Fler poliser ska finnas närvarande i vardagen, både i utsatta områden och på landsbygden. Vi vill öka polistätheten till EU-snittet och öppna nedlagda polisstationer på nytt."
  - id: C-089
    parti: C
    sida: 23
    rader: '851-852'
    lydelse: "Brottsofferperspektivet måste stärkas. Den som utsatts för brott ska få upprättelse och bättre stöd."
  - id: C-090
    parti: C
    sida: 23
    rader: '855-857'
    lydelse: "Att förbättra skolresultaten måste vara en huvudprioritering. Det vill vi åstadkomma med bättre stöd och fortbildning för lärare och rektorer, och rätt stöd till alla elever."
  - id: C-091
    parti: C
    sida: 23
    rader: '858-860'
    lydelse: "Skolan ska bli bättre och mer likvärdig i hela landet. Det fria skolvalet ska värnas och små skolor och förskolor på landsbygden ges förutsättningar att fortsätta sin verksamhet."
  - id: C-092
    parti: C
    sida: 23
    rader: '861-864'
    lydelse: "Styrningen av skolan ska kännetecknas av strikta kvalitetskrav och likvärdighet. Skolpengen ska anpassas efter huvudmännens ansvar och elevernas förutsättningar och behov. Vi vill ställa kvalitetskrav för vinstutdelning och stärka rättssäkerheten i betygssystemet. Dåliga skolor ska stängas."
  - id: C-093
    parti: C
    sida: 23
    rader: '865-868'
    lydelse: "Vi vill också skärpa tillståndsprövningen för utländska ägare, se till att skolorna delar mer information och skapa ett mer aktivt skolval för alla. Högst hälften av platserna bör få fördelas efter kötid, och anmälan ska ske tidigast två år innan skolstart."
  - id: C-094
    parti: C
    sida: 23
    rader: '869-871'
    lydelse: "Skolan ska vara en trygg plats - fri från rasism, homofobi och trakasserier grundade på kön - där barn kan växa och utvecklas. En bättre elevhälsa är en förutsättning för det."
  - id: V-001
    parti: V
    sida: 2
    rader: '2-4'
    lydelse: "Det är tillsammans vi bygger framtiden. Alla vi människor som lever våra liv här i landet. Sverige är ett rikt och välorganiserat land där alla borde kunna ha möjlighet att utveckla sina drömmar och förhoppningar, tillsammans och som individer. Men så är det inte idag."
  - id: V-002
    parti: V
    sida: 2
    rader: '5-16'
    lydelse: "Vi är många som upplevt att delar av tryggheten försvunnit och att gemenskapen slagits sönder när marknadsideologin fått styra och politiken flytt ansvar. I skolorna behandlas elever och lärare som siffror, där billigast vinner. Du som blir sjuk måste oroa dig, inte enbart över din hälsa, utan också över hur möjligheterna till sjukvård ser ut och över att Försäkringskassan kanske inte godkänner läkarintyget. I stora delar av Sverige är det svårt att få tag på medicin, fast i storstädernas rikare områden finns det flera olika apotek i varje gathörn. Sverige har dessutom under flera år varit det land i Europa där de ekonomiska klyftorna vuxit snabbast, vilket är negativt för såväl den ekonomiska utvecklingen som samhällsutvecklingen i stort, samt bidrar till att skapa oro och otrygghet. Behovet av massiva investeringar i klimatåtgärder, infrastruktur och jobb är stort och akut, men effektiva politiska åtgärder dröjer, samtidigt som klimatförändringarna får konsekvenser redan nu."
  - id: V-003
    parti: V
    sida: 2
    rader: '17-23'
    lydelse: "Coronapandemin har satt privatiseringarnas och den underfinansierade välfärdens konsekvenser i blixtbelysning, men också solidariteten människor emellan. Vi har tagit hand om varandra och visat omsorg genom att hålla avstånd, gå samman och organisera matleveranser åt de mest utsatta, och begränsat våra liv för att så många som möjligt ska klara sig igenom krisen. Många har tagit extrapass på sina jobb inom vården och omsorgen, och gjort en heroisk insats med alltför knappa resurser."
  - id: V-004
    parti: V
    sida: 2
    rader: '24-29'
    lydelse: "Pandemin har också visat upp klassamhällets brutala konsekvenser. De som blivit mest drabbade har varit äldre, men också de av oss med arbetaryrken som inte kunnat stanna hemma från jobbet för att samhället ska fungera. Det har varit människor som bor trångt och som inte har kunnat ta sig säkert till jobbet som fått ta de stora riskerna. Precis som att klass påverkar människor i en pandemi, påverkar klass vår livslängd och möjlighet till ett bra liv utanför en pandemi."
  - id: V-005
    parti: V
    sida: 2
    rader: '30-32'
    lydelse: "Samhällets oförmåga att hantera klimatomställningen har varit tydlig. Medvetet avsäger sig politiker förmågan att förändra, trots att all vetenskap pekar på att förändring är nödvändig och akut."
  - id: V-006
    parti: V
    sida: 2
    rader: '33-44'
    lydelse: "De som är ansvariga för att det ser ut så här är de politiker och den ekonomiska elit som styrt Sverige. Att det finns fattigpensionärer i Sverige beror på pensioner som beslutats politiskt. Tragedin i äldreomsorgen beror på att resurser har dragits undan och verksamheter sålts ut så att skattepengar som skulle gått till de äldre istället blivit miljardvinster för lägstbjudande företag. Att de stora klimatåtgärder som vi alla vet är akuta för vår överlevnad uteblir beror på att de som bestämt har flytt undan politiskt ansvar. De har så klart inte gjort det för att de vill att allt ska bli dåligt, utan för att det har funnits starka ekonomiska intressen. Det är högerns idéer, men trenden i samhället har varit stark, och även socialdemokratiska regeringar har i grunden fört samma politik. Fortfarande lyser reella förslag på hur man ska öka den ekonomiska jämlikheten och jämställdheten, stärka välfärden och göra de satsningar som behövs i förorter, bruksorter och på landsbygd, med sin frånvaro."
  - id: V-007
    parti: V
    sida: 3
    rader: '47-57'
    lydelse: "I trettio år har det förts samma konsekventa politik. Område efter område har underställts privata företagsintressen och allt som inte bedömts som lönsamt har prioriterats ned. Politiken har ett ansvar. Inte att lägga sig i sådant som fungerar, utan att lösa de saker som bara kan bli riktigt bra när vi gör det gemensamt. Skola, vård, omsorg, klimatsatsningar, jobb, infrastruktur, välfärd och trygghetssystem är alla exempel på områden där du inte ska nöja dig med att marknaden gör ett uselt jobb. Det är hög tid att agera och ta tillbaka den samhällsviktiga verksamhet och infrastruktur som har privatiserats. Ju längre tiden går utan att något görs, desto mer förvärras problemen, oavsett om det rör ojämlikhet eller stigande medeltemperatur. Den blinda tron på marknaden och att blunda för klimatkrisen är gårdagens politik. Vänsterpartiet har politiken för framtiden."
  - id: V-008
    parti: V
    sida: 3
    rader: '58-60'
    lydelse: "Därför vill Vänsterpartiet använda valrörelsen till ett avstamp för att genom öppna samtal lägga grunden till en bred folkrörelse där vi tillsammans kämpar för omställningen till ett mer rättvist, tryggt och hållbart samhälle."
  - id: V-009
    parti: V
    sida: 3
    rader: '62-71'
    lydelse: "Vänsterpartiet drog upp en gräns och stoppade marknadshyrorna sommaren 2021. Regeringen kunde inte tillåtas sitta kvar samtidigt som de genomförde nästa stora marknadsreform, som i längden skulle ha lett till högre hyror för praktiskt taget alla hyresgäster. Regeringen fick många chanser och i Vänsterpartiet fanns länge ett hopp om att regeringen skulle lyssna på Vänsterpartiet. När regeringen tillträdde på Vänsterpartiets mandat, trots att regeringen uttryckligen hade ett avtal om att hålla Vänsterpartiet utanför, sa Vänsterpartiet att villkoret var att en försämring av arbetsrätten och marknadshyror inte skulle genomföras. Nu är det tydligt att det är Vänsterpartiet som måste ta tillbaka framtiden, det är upp till Vänsterpartiet att stå upp för tryggheten och jämlikheten."
  - id: V-010
    parti: V
    sida: 3
    rader: '72-81'
    lydelse: "Det gör Vänsterpartiet inte ensamt. Vi är många som bygger landet. Du som jobbar inom vården, med märken från munskydd och visir, du som bygger vägar, kör lastbil eller ger våra barn kunskap och självkänsla, du som tränar barnen i fotboll eller organiserar den lokala hyresgästföreningen. Du som har slitit ut lederna i förtid på jobbet, men som varje jul är med och ordnar gemensamt julbord för områdets ensamma. Du som arbetar hårt inom ditt eget småföretag, i konkurrens med storbolag. Du är den som skapar värdet i samhället. Det är inte riskkapitalisten eller börsspekulanten som äger skolan, vårdcentralen eller tillverkningsföretaget som skapar värde i verksamheten. De snor bara åt sig av värdet för sin egen del. Det är något som möjliggjorts av politiska beslut."
  - id: V-011
    parti: V
    sida: 3
    rader: '82-89,92-93'
    lydelse: "Vilka som verkligen bidrar till samhället och vilka som inte gör det har visat sig ännu tydligare under pandemin. De av oss som måste gå till jobbet för att samhället ska fungera, det är vi som jobbar i mataffären, vi som kör bussen, vi som städar. Det är vi som sliter i vården och omsorgen och vi som ser till att förskolor och skolor fungerar. Det är lågbetalda samhällsbärande arbetarklassyrken som plötsligt synliggjorts, precis så viktiga som de är. Det är för oss, alla vi som bor i Sverige, som vi nu också ska återuppbygga landet - bättre och tryggare. Ett land där vi bidrar efter förmåga och våra olika förutsättningar. Det är möjligt, men det kräver en annan politik och att vi omfördelar resurserna från rika till fattiga människor, från rika områden till fattiga områden och förorter."
  - id: V-012
    parti: V
    sida: 4
    rader: '94-104'
    lydelse: "Sverige har aldrig varit rikare än idag men rikedomarna fördelas orättvist. Kapital samlas på hög hos ett fåtal, ofta män, och klyftorna växer. Sverige sticker ut internationellt och har nu fler dollarmiljardärer per person än många andra länder. Samtidigt har antalet personer som lever med låg ekonomisk standard fördubblats de senaste decennierna. Många barn växer upp i fattigdom och Sverige har högst andel fattigpensionärer av de nordiska länderna, oftast är det kvinnor som drabbas av orättvisan. Arbetarkvinnors livslängd sjunker. När tryggheten minskar växer misstro och splittring. Rasismen gror mellan grannar och arbetskamrater, människor som egentligen har allt att vinna på att hålla ihop. Samtidigt tjänar en direktör över 60 gånger mer än en arbetare. Så ska det inte vara. Vi har rätt att förvänta oss något bättre."
  - id: V-013
    parti: V
    sida: 4
    rader: '105-113'
    lydelse: "Tillsammans kan vi förändra, det har vi gjort förr. Under 1900-talet har vi genom organisering i folkliga rörelser och med beslut i parlamenten stärkt arbetsrätten, investerat bort bostadsbristen, ökat jämställdheten, byggt upp välfärden och förbättrat samhällets skyddsnät. Reform på reform har byggt välfärden större och bättre. Sverige skulle kunna vara världens mest jämlika och trygga land, där vi tar hand om varandra, och där alla, oavsett vem du är, har rätt till ett gott liv, med frihet att utveckla dig och trygghet när du blir gammal eller om det inte går bra. Men då krävs stora satsningar, omfördelning och massiva investeringar för att ge människor goda levnadsvillkor, ta itu med klimatkrisen och skapa jobb i hela landet."
  - id: V-014
    parti: V
    sida: 4
    rader: '114-122'
    lydelse: "Det är ett stort uppdrag. I den här valplattformen presenteras några viktiga områden att börja med. Men du behövs om det ska lyckas. Länge har politiken tappat relevans när samma politik, i samma ödesdigra riktning, förts efter många val. Att återupprätta politikens roll, och utkräva ansvar från de som bestämmer, är något som du är med och gör. När du röstar, och kanske också pratar med dina släktingar och vänner, grannar och arbetskamrater, organiserar dig i folkrörelser som fackklubben, klimatrörelsen eller kvinnojouren, eller kanske till och med blir medlem i Vänsterpartiet. Du behövs. Tillsammans bygger vi framtidens rörelse för ett samhälle för alla."
  - id: V-015
    parti: V
    sida: 4
    rader: '124-133,136-157'
    lydelse: "Det är genom en grön politik från vänster som vi kan skapa fler jobb, företag och framtidstro även utanför storstäderna. Sverige är en liten industri- och kunskapsnation som en gång i tiden, genom stora investeringar och politiska satsningar, skapade en stark, modern och väl utvecklad ekonomi, där växande företag balanserades av en stark arbetarrörelse och stat som såg till att de stora ekonomiska värden som skapades kunde fördelas relativt jämnt över hela landet och befolkningen. Det byggde världens mest jämlika land. Politiken tog ansvar för problem, byggde bort bostadsbristen, byggde ut välfärden och gjorde stora investeringar i telenät, järnväg och annan infrastruktur. Idag står samhället inför nya utmaningar. Välfärden är urholkad genom åratal av nyliberal politik och ojämlikheten ökar. Vi måste lösa klimatkrisen och skydda den biologiska mångfalden - omställningen går alldeles för sakta. Över hela världen orsakar klimatkatastrofer förödelse - bränder, översvämningar, djur- och växtarter som försvinner och människor som drivs på flykt. Vi befinner oss i ett klimatnödläge. Omställningen behöver ske omgående och alla politiska beslut behöver ta hänsyn till den akuta kris som vi befinner oss i. Det är politikens, och inte individens, ansvar att skapa möjligheter för människor att välja enkla och billiga klimatsmarta alternativ. En del lösningar behöver vara internationella men mycket går att genomföra nationellt, om bara den politiska viljan finns. Investeringar i grön teknik, industri och infrastruktur, utbyggd energikapacitet och stärkt styrning utifrån nya, skärpta klimatmål behövs. Återanvändning och återvinning av material behöver öka. Över hela världen växer en ung klimatrörelse sig stark med stora krav på politiken för en snabb och genomgripande omställning. Det är en rörelse som med rätta ställer krav på systemförändringar, för kapitalismen håller på att göra jorden obeboelig. Ett ständigt överutnyttjande av naturens resurser leder till kraftig utarmning av den biologiska mångfalden och växthusgasutsläpp. Skogens roll att naturligt minska och lagra utsläpp behöver stärkas och torrlagda våtmarker som läcker utsläpp ska återställas. Skyddet av skogs- och strandområden är en viktig del för att värna den svenska allemansrätten och den biologiska mångfalden. För att uppnå klimatmålen behöver skogens funktion som kolsänka bevaras de kommande decennierna, därför behöver kalhyggesbruket fasas ut. Den skog som avverkas måste användas klokt där endast restprodukter ska användas till biobränsle."
  - id: V-016
    parti: V
    sida: 5
    rader: '158-168'
    lydelse: "Även om vi alla försöker minska vår klimatpåverkan så är det tydligt att det inte är allas vår individuella sopsortering eller bilanvändning som kommer att påverka framtiden mest. Idag står hundra företag i världen för sjuttio procent av koldioxidutsläppen. Politiken kan och måste ställa krav på att industrin ställer om och hjälpa företagen med ett massivt grönt investeringsprogram och satsningar på ny teknik, ett program med utgångspunkt i uppdaterade klimatmål för alla utsläpp som svensk politik har inflytande över, som svarar mot den senaste forskningen och bygger på solidaritet med framtida generationer och andra delar av världen. Det är investeringar som ökar statens ägande och därmed allas demokratiska inflytande. Det går inte att överlåta framtiden till marknadskrafternas godtycke, framtiden tillhör oss alla."
  - id: V-017
    parti: V
    sida: 5
    rader: '169-180'
    lydelse: "De stora förändringar som behövs för att klara av klimatomställningen gör att vi behöver bygga ett delvis nytt samhälle, och det ger oss också möjlighet att rätta till mycket av det som var fel i det gamla. Vänsterpartiet föreslår ett massivt investeringsprogram för den gröna industrin. Sverige ska vara världsledande i omställningsarbetet. Industrier ska ställa om från fossilt till förnybart med hjälp av stora statliga investeringar och Vänsterpartiet föreslår en grön omställningsfond där staten använder sina ekonomiska muskler och där pengar förs över från företag som smutsar ner till miljö- och klimatvänlig produktion. Det är viktiga och nödvändiga investeringar, och det kommer också skapa väldigt många nya jobb över hela landet genom infrastruktursatsningar på järnväg, vägar, energi, bostäder och välfärd. Det är investeringar som vi tillsammans genom den svenska staten behöver göra."
  - id: V-018
    parti: V
    sida: 6
    rader: '183-194'
    lydelse: "Det gröna investeringsprogrammet gör att vi kan ta itu med många av de områden som varit eftersatta under många år, när fokus istället legat på kortsiktiga vinster och spekulation. Att se till att alla som bor i Sverige har en bra bostad är ett sådant exempel. Omställningen kräver att det finns bra bostäder och möjligheter att leva gott för de som ska genomföra den, oavsett var i landet det gäller. Bostadsbristen är en bromskloss både för lokalsamhällen, arbetstagare och arbetsgivare som vill vara delaktiga i att ställa om Sverige. När vi gör de nödvändiga framtidsinvesteringarna i nya bostäder har vi en fantastisk chans. Med större kontroll och planering från samhällets sida, kan byggandet både öka i takt och bli miljösmart och lagra kol istället för att släppa ut koldioxid. Så bygger vi samhället och stärker människors rätt till en trygg bostad, samtidigt som vi lägger grunden för ett hållbart klimatsmart samhälle."
  - id: V-019
    parti: V
    sida: 6
    rader: '195-207'
    lydelse: "Vägnätet och järnvägen behöver rustas upp i stora delar av Sverige, när industrierna nu expanderar på nya platser. Tunga transporter behöver styras till järnväg och hållbar sjöfart. För att göra såväl person- som godstransporter hållbara behöver vägnätet både elektrifieras och kompletteras med infrastruktur för andra hållbara drivmedel. Staten måste öka sin kontroll över infrastruktur och resurser som behövs för att genomföra klimatomställningen. Produktionen av både el och exempelvis vätgas behöver öka kraftigt när vi ställer om från användning av fossila bränslen, därför behöver staten gå in med satsningar på förnybar energi. Staten måste öka sin kontroll över infrastruktur och resurser som behövs för att genomföra klimatomställningen. Det offentliga ska ta över ansvaret för elnätet, vilket kommer leda till minskade avgifter för hushållen. För att såväl öka alla människors rörelsefrihet som för att minska utsläppen av växthusgaser så behöver även kollektivtrafiken byggas ut och göras billigare och mer tillgänglig i hela landet."
  - id: V-020
    parti: V
    sida: 6
    rader: '208-218'
    lydelse: "En annan viktig del i den gröna omställningen är satsningar på hållbar livsmedelsproduktion. Stora delar av den mat och energi vi konsumerar kommer från landsbygden, men samtidigt blir det allt svårare att bygga ett bra liv när service och välfärd koncentreras till storstäderna. Oavsett var i landet vi bor så har vi ett gemensamt intresse av att landsbygden inte utarmas. Mer av naturresursernas värden måste stanna kvar där de utvinns och produceras. Vindkraften ska gynna både kommun och boende i närområdet. Äldreomsorg, förskola, skola och matbutik behöver finnas på fler mindre orter. Ett ökat bostadsbyggande måste också ske på landsbygden, med hyresrätter med rimliga hyror och småhus. Utbyggnaden av transportinfrastruktur och fiber går alldeles för sakta, staten behöver gå in och ta ett större ansvar för utbyggnaden. Välfärden måste vara till för alla och finnas överallt."
  - id: V-021
    parti: V
    sida: 6
    rader: '219-226,229-238'
    lydelse: "Att som individ försöka minska sin klimat- och miljöpåverkan är bra, men det kommer aldrig att räcka. Vi måste ta oss an klimatkrisen som samhälle. Mycket av det vi konsumerar behöver vi för att leva bra liv - mat, kläder, boende och resor men sättet sakerna och energin framställs på behöver ändras. För de flesta av oss sker en stor del av konsumtionen och resandet för att hållbara alternativ saknas. Det gäller inte minst på landsbygden. Det är samhället och politikens ansvar att se till att alternativen finns. Där inte teknikskiften räcker för att minska utsläppen måste konsumtionen styras bort från det smutsiga och alla ges förutsättningar att leva mer hållbart. Vi ser ett hållbart liv som ett bättre liv. Kortare arbetsdagar med mer tid för relationer och egna intressen, produkter som håller och lätt kan återanvändas och delas istället för slit- och släng. Renare storstadsluft, billig och fungerande tåg- och kollektivtrafik. Hälsosammare mat från vår egen svenska landsbygd. Men för ett fåtal är konsumtion en livsstil av lyx och överflöd. Den rikaste procenten släpper ut tio gånger mer utsläpp än majoriteten av befolkningen. Det är denna elit som behöver dra ner sin konsumtion mest. Hos samma personer samlas rikedomar på hög istället för att gå till investeringar i framtiden. Det är hög tid att de få som har stora kapitaltillgångar bidrar mer till omställningen. För alla oss andra kommer omställningen att skapa större möjligheter, nya jobb, friskare liv och mer framtidstro."
  - id: V-022
    parti: V
    sida: 7
    rader: '240-249'
    lydelse: "Att välfärden omfattar alla som bor i vårt land har länge varit en viktig del i det som gjort Sverige till ett tryggt och jämlikt land. Nu ifrågasätter högerpartierna den idén. I dagens ekonomi ses värdet i en människa i hennes förmåga att producera och högerns politik går ut på att angripa invandrare, sjuka, arbetslösa och personer med funktionsnedsättning och att begränsa vår tillgång till välfärden. Högerns idé är att invandrade, sjuka och arbetslösa är lata och om vi får det sämre så tvingas vi prestera bättre. Samtidigt har de en idé om att det absoluta toppskiktet måste få det bättre, genom sänkta skatter, bonusar och andra morötter, för att de ska prestera mer. Det är en haltande logik och en politik som skapar konflikter och misstro mellan människor."
  - id: V-023
    parti: V
    sida: 7
    rader: '250-262'
    lydelse: "Möjligheten att bo bra till en rimlig kostnad har spelat en viktig roll i det jämlika samhällsbygget, men efter att också bostäderna lämnats åt marknaden ökar bostadsbristen, boendekostnader och segregation. Byggtakten har hållits nere för att bostadspriserna ska fortsätta att stiga, hyresgäster krävs på allt högre hyror medan den som köper bostadsrätt lägger allt större del av sin inkomst på bostaden. Efter att Vänsterpartiet tagit och vunnit fajten om att stoppa marknadshyrorna tillsammans med Hyresgästföreningen och en bred massiv rörelse är det tid för nästa steg. Vänsterpartiets nästa steg handlar om en politik för massivt bostadsbyggande, klimatsmarta renoveringar och sänkta hyror som går hand i hand med den gröna omställningen. Vänsterpartiet vill se ett statligt byggbolag, investeringsstöd för ökat bostadsbyggande och en aktiv markpolitik. Med en progressiv fastighetsskatt skulle lyxfastigheter taxeras högre medan majoriteten av husägarna inte skulle få högre skatt."
  - id: V-024
    parti: V
    sida: 7
    rader: '263-274,277-278'
    lydelse: "Barn, sjuka och arbetslösa måste självklart ha samma rätt som arbetande människor att ha goda liv. Alla har vi varit barn. Alla kan vi bli sjuka eller förlora jobbet. När vi blir gamla blir vi förhoppningsvis pensionärer. När du blir sjuk eller föder barn ska du kunna lita på att få ersättning från Försäkringskassan utan att behöva stånga dig blodig. När du blir gammal ska du kunna leva på din pension, inte bara överleva. På samma sätt ska du som lever med funktionsnedsättning kunna lita på att du får det stöd du behöver, och på att din rätt att delta i samhället på det sätt du vill inte ständigt ifrågasätts och försvåras. Tryggheten i ett samhälle hänger ihop med hur våra trygghetssystem fungerar - a-kassan, sjukförsäkringen, LSS och pensionerna. Vänsterpartiet vill se en mänsklig sjukförsäkring och ett slut på utförsäkrandet av sjuka. Du som blir arbetslös ska veta att du får en bra a-kassa och inte behöva oroa dig över att du måste flytta till en billigare lägenhet, sälja huset eller inte kunna ha mat på bordet. Men politiska beslut har gjort att a-kassans ersättningar är lägst i Norden."
  - id: V-025
    parti: V
    sida: 8
    rader: '279-286'
    lydelse: "Du ska vara trygg när du blir gammal. Vänsterpartiet vill ha ett nytt pensionssystem som inte gör människor fattiga och kräver därför att det nuvarande systemet rivs upp. De låga pensionerna är också en jämställdhetsfråga och rättvisefråga - en stor andel av fattigpensionärerna är kvinnor och invandrade. I ett av världens rikaste länder, Sverige, måste det gå att ha ett gott liv även som äldre. Det förutsätter en annan fördelningspolitik där värdet av det som vi skapar tillsammans fördelas efter behov. Robusta trygghetssystem kräver också en starkare och mer inkluderande arbetsmarknad där fler människor har bra och trygga jobb."
  - id: V-026
    parti: V
    sida: 8
    rader: '288-290'
    lydelse: "Arbetslöshet är ett enormt slöseri med människors kompetens och erfarenheter. Ändå är det bara ett parti i riksdagen som har en politik för full sysselsättning - Vänsterpartiet."
  - id: V-027
    parti: V
    sida: 8
    rader: '291-297'
    lydelse: "Välfärdsskulden som uppstått innebär att hundratusentals jobb försvunnit ur skola, vård och omsorg sedan 1990-talet, och det behövs en politisk vilja för att successivt börja bygga upp en bättre kvalitet igen. Men politikens ansvar stannar inte vid offentliganställda. Det som gjorde Sverige till en ledande industrination var de politiska beslut som då innebar byggandet av en miljon bostäder under kort tid, byggandet av infrastruktur och utbyggnad av välfärd åt alla. Investeringar i jämlikhet, jämställdhet och trygghet är bra också för de svenska företagen."
  - id: V-028
    parti: V
    sida: 8
    rader: '298-302'
    lydelse: "Genom en politik för högre löner för dem med lägst inkomster så skapas efterfrågan. Pensionärer som får högre pension gör så att affären kan hålla öppet på en liten ort. När politiken levererar välfärd, försäkringar som a-kassa, pensioner och sjukpenning, om staten satsar stort på klimatomställning och infrastruktur, då skapas jobb i företagen och möjligheter att leva och bo i hela landet."
  - id: V-029
    parti: V
    sida: 8
    rader: '303-315'
    lydelse: "När högern och näringslivets lobbyorganisationer talar om flexibilitet på arbetsmarknaden menar de i klarspråk försämrad anställningstrygghet, och sanningen är att arbetslivet har blivit allt mer otryggt för många av oss som arbetar. Otryggheten skapas genom tillfälliga anställningar, sms-jobb, gig-jobb, deltidsjobb och bemanningsjobb. Otrygga anställningar leder till tysta arbetsplatser och lägre facklig organisationsgrad. Du bråkar inte gärna med den chef som dagen efter kan avsluta din anställning. Du tar inte strid mot sexuella trakasserier eller diskriminering om det kan kosta dig nästa jobbpass. Få av oss väljer den osäkra arbetssituationen frivilligt. De flesta av oss vill ha en viss trygghet för att kunna planera våra liv, skaffa en bostad, kunna ta semester eller veta att vi lugnt kan sätta barnen i skola utan att behöva flytta från orten inom några år. Samhällsutvecklingen går stick i stäv med människors behov. Sedan förra valet har andelen unga som tycker att kollektivavtal och fast anställning är viktigt ökat kraftigt."
  - id: V-030
    parti: V
    sida: 8
    rader: '316-319'
    lydelse: "Anställda med utländsk bakgrund är överrepresenterade i osäkra, lågbetalda och stressiga jobb. Ingen av oss ska behöva utstå rasism på arbetsplatsen eller vara beroende av arbetsgivaren för att få stanna i Sverige. Diskrimineringen och rasismen på arbetsmarknaden måste stoppas."
  - id: V-031
    parti: V
    sida: 9
    rader: '322-331'
    lydelse: "Trygghet på arbetsmarknaden är också att alla ska orka jobba hela vägen fram till pensionen. I många arbetaryrken, särskilt de kvinnodominerade, är det verkligen ingen självklarhet. Arbetslivet måste utvecklas och arbetstiden förkortas. Det är ingen naturlag att vi ska jobba åtta timmar om dagen. Livet är så mycket mer än arbete. Med dagens tekniska utveckling finns förutsättningar att inleda en arbetstidsförkortning, med sikte på sex timmars arbetsdag, med bibehållen lön. En arbetstidsförkortning skulle vara ett viktigt steg för ökad jämställdhet eftersom det också skulle möjliggöra för en mer jämställd fördelning av det obetalda hemarbetet. Vänsterpartiet tycker att det är viktigare med en arbetstidsförkortning som kommer alla till del än sänkta skatter för ett fåtal."
  - id: V-032
    parti: V
    sida: 9
    rader: '332-341'
    lydelse: "Ett tryggt samhälle ställer inte människor mot varandra. När högerpartier förespråkar låglönejobb och begränsad välfärd för de av oss som inte är födda i Sverige bygger det på ett cyniskt utnyttjande av människor, ibland förklätt till antirasism. När människors utsatta situation utnyttjas pressas allas våra löner och våra möjligheter ner. Därför behöver vi hålla ihop. Det är inte när någon annan får sämre villkor som du får bättre villkor. Tvärtom, vi har ett gemensamt intresse av att förbättra villkoren istället för att öka den vinst som ett fåtal kan göra på våra arbetsinsatser. Det är inte genom tidsbegränsade uppehållstillstånd som integrationen förbättras. Tvärtom, det är genom en trygg och permanent tillvaro i samhället som vi människor rotar oss. Genom att hålla ihop skapar vi trygga liv för alla."
  - id: V-033
    parti: V
    sida: 9
    rader: '342-359'
    lydelse: "Fackens och kollektivavtalens roll är central både för ekonomin och demokratin. Rätten att gemensamt förhandla lönerna, och att arbetsgivaren inte kan anställa någon annan för sämre villkor eller lön än vad som är överenskommet med facket, gör att vi kan ha en stabil och positiv löneutveckling och att vi klarar dåliga tider i ekonomin utan att behöva få sämre betalt. Kollektivavtalen och arbetsrättslagstiftningen säkerställer ett grundläggande inflytande och skyddar oss anställda från maktfullkomlighet och godtycke. Det gör också att en sektor eller ett enskilt företag inte kan driva en verksamhet som inte bär sig genom att tvinga ner löner och villkor. Lönedumpning, ekonomisk brottslighet och utnyttjande är centrala hot idag. I Sverige pågår en dragkamp om makten och villkoren där löntagarna tappat mark en tid. En del av striderna sker i politiken och andra sker vid förhandlingsbordet mellan parterna på arbetsmarknaden. Men för att förhandlingarna ska vara rättvisa behöver politiken respektera den svenska modellen, där politiker inte hotar den ena parten med försämringar om den inte ger med sig. Det var vad som hände med lagen om anställningsskydd under 2020. Du som enskild löntagare kan bidra genom att vara organiserad fackligt, och se till att din arbetsplats har kollektivavtal. Vänsterpartiet kommer att fortsätta försvara förhandlingsrätten och en stark arbetsrättslagstiftning."
  - id: V-034
    parti: V
    sida: 9
    rader: '360-363'
    lydelse: "En politik för full sysselsättning, investeringar i välfärd och infrastruktur, arbetstidsförkortning, starkt anställningsskydd, trygga försäkringssystem och för att en hög andel av arbetsplatserna ska omfattas av kollektivavtal, det ger förutsättningar för starka, trygga löntagare och en fungerande samhällsekonomi."
  - id: V-035
    parti: V
    sida: 10
    rader: '366-370'
    lydelse: "En central uppgift i valet 2022 är att driva frågan om de anställdas makt över sitt arbete och att stödja fackligt aktivas kamp för avtal som ger reell beslutanderätt till de fackliga organisationerna. Den offentliga sektorn kan här gå före och genom beslut och avtal överföra makten över frågor som arbetstid, bemannings- och anställningsfrågor och arbetets organisering till de anställda."
  - id: V-036
    parti: V
    sida: 10
    rader: '371-375'
    lydelse: "Som ett skydd mot kortsiktig vinstjakt så vill Vänsterpartiet ge löntagare och samhällskooperativ laglig rätt och offentligt finansiellt stöd att ta över verksamheter och industrier som hotas stängas ner och flytta utomlands. Detta skulle skydda arbetstillfällen, löntagares inkomster och värna hela den stadsdel eller ort där arbetsplatsen finns."
  - id: V-037
    parti: V
    sida: 10
    rader: '377-384'
    lydelse: "Vänsterpartiet arbetar för alla människors frihet och har därför politiken för trygga jobb, ett robust välfärdssystem och för att samhällets rikedomar ska fördelas efter behov. Men frihet handlar också om rätten till fysisk trygghet. Risken för att drabbas av våld beror idag till stor del på vem du är och var du bor. Om du är arbetarklass, kanske med utländsk bakgrund, och bor i ett fattigt område är sannolikheten större att du utsätts för våld. Om du är kvinna löper du högre risk att bli utsatt för våld av någon som du lever i en nära relation med. Och om du är en hbtqi-person är risken stor att trakasserier, hot, hat och våld blir en del av vardagen."
  - id: V-038
    parti: V
    sida: 10
    rader: '385-401'
    lydelse: "När samhällets orättvisor och klassklyftorna ökar skapas en mer gynnsam grogrund för kriminalitet. Det gör den i hela samhället men särskilt i de fattigaste områdena. De av oss som bor i dessa områden är särskilt utsatta för våld och det finns en uppgivenhet över att samhället övergivit området. Istället för framtidsdrömmar om utbildning och bra jobb känner många en desperation inför en hopplös framtid. Droghandel har därför blivit ett alternativ för alltför många barn och ungdomar i eftersatta förorter, detta gäller särskilt för pojkar och unga män. Det är ett svek från samhällets sida. Alltför ofta lyfts repression och hårdare tag upp som lösningar istället för att ta itu med problemen på allvar. Det kräver nämligen omfattande förebyggande insatser. För att få ner brottsligheten går det inte bara att vara hård mot de kriminella, det gäller att vara smartare än de kriminella. Vissa straff kan behöva höjas men mycket mer fokus måste riktas mot att förhindra rekryteringen av nya barn till gängkriminalitet. Skola och fritidsverksamheter behöver ges bättre resurser, likaså socialtjänsten. Ge barn och ungdomar möjligheter till kommunalt stödda fritidsaktiviteter, ge skolan bättre resurser för att stödja elever som behöver det för att klara betygen och förstärk socialtjänsten med tillräckliga resurser och kunskap för att arbeta både förebyggande och med barnskydd."
  - id: V-039
    parti: V
    sida: 10
    rader: '402-407,410-413'
    lydelse: "Föräldrar ska inte behöva oroa sig över skjutvapenvåld och drömma mardrömmar om att deras barn ska drabbas. Kriminaliteten behöver mötas både med ett fungerande och närvarande rättssystem som fler patrullerande poliser, arbete mot narkotikahandel, kamp mot tillgången till illegala skjutvapen och ett effektivt avhopparprogram, men framför allt med en kamp mot kriminalitetens djupare orsaker - klassamhället, segregationen, rasismen på arbetsmarknaden, trångboddheten och bristen på framtidstro. Många unga, särskilt med utländsk bakgrund, som bor i fattiga områden, utsätts även för rasism och övervåld från polisen, vilket blev tydligt i diskussionen kring Black Lives Matter-rörelsen. Att återupprätta tilltron till polisen kräver stora förändringar av hur polisen arbetar."
  - id: V-040
    parti: V
    sida: 11
    rader: '414-419'
    lydelse: "Droganvändningen är jämt fördelad över alla samhällsklasser men det är de mest utsatta i samhället som drabbas hårdast. Det som händer i fattiga områden hänger ofta samman med droganvändning generellt. Därför måste kriminaliteten ses just som ett samhällsproblem, inte något som händer på vissa platser. Tullens och polisens resurser måste öka för att komma åt de pengar som driver narkotikahandeln."
  - id: V-041
    parti: V
    sida: 11
    rader: '420-423'
    lydelse: "I ett tryggt samhälle tar vi krafttag mot våld, hedersförtryck och sexuella kränkningar mot kvinnor, barn och hbtqi-personer. Otrygghet har varit många kvinnors vardag under stora delar av historien. Ingen ska behöva leva i en sådan verklighet. Ojämställdheten har ett högt pris."
  - id: V-042
    parti: V
    sida: 11
    rader: '424-427'
    lydelse: "Vänsterpartiet anser att den inhumana flyktingpolitik som råder, med tillfälliga och villkorade uppehållstillstånd, är en form av psykologiskt våld mot en redan utsatt grupp. Rätten att söka asyl kan aldrig tummas på, vi kräver att endast permanenta uppehållstillstånd ska utfärdas vid beviljad asyl."
  - id: V-043
    parti: V
    sida: 11
    rader: '428-445'
    lydelse: "Det är viktigt att rättssystemet fungerar, att kvinnors erfarenheter tas på allvar och att de som begår brott döms. För det behövs det fler poliser, ökad kunskap inom rättsväsendet om samtycke och om våld mot kvinnor och barn, och straff som gör att brotten prioriteras av rättsvårdande instanser. Skolor och förskolor behöver arbeta förebyggande mot destruktiva normer för att alla barn, oavsett kön, ska kunna leva fria. Många kvinnor kan inte lämna destruktiva förhållanden för att deras ekonomi är för dålig, därför hänger arbetet med att uppvärdera kvinnors arbete och höja löner i låglöneyrken ihop med arbetet mot våld mot kvinnor. Ett ökat statligt ansvar för att bygga bort bostadsbristen kommer också att göra det möjligt för många av de kvinnor som idag inte har något boendealternativ att lämna den bostad som hon delar med en förövare. Vänsterpartiet anser att det därutöver måste vara en rättighet att få hjälp med en långsiktig trygg boendelösning för den som behöver det för att lämna våldsutsatthet. Socialtjänsten måste garanteras ett varaktigt och stabilt stöd för arbetet mot våld i nära relationer. Barnperspektivet måste stärkas i vårdnadstvister och det ska inte vara möjligt för våldsutövare att behålla gemensam vårdnad. Vänsterpartiet vill motverka den privatisering som sker av kvinnojourernas verksamhet. Det är ett samhällsansvar att stoppa mäns våld mot kvinnor, inte en möjlighet för privata bolag att göra vinst."
  - id: V-044
    parti: V
    sida: 11
    rader: '447-451,454-462'
    lydelse: "De senaste decennierna har politiken förlitat sig på att marknaden ska lösa våra behov av trygghet, men marknadslösningar har urholkat vår gemensamma välfärd samtidigt som en allt större del av våra skattemedel går till administration och kontroll. Privatiseringar har lett till dyrare elpris, att apoteken flyttar från landsbygd till städer och från fattiga till rika områden, att du har olika tillgång till vård, skola och omsorg beroende på var du bor, att det gått inflation i betygen och till en allt sämre kvalitet på service och välfärd. Även kulturen och idrotten har utarmats när skolbibliotek läggs ned, simskolan blivit dyrare och biografer finns på färre orter. Det borde vara nog med skandaler om hur välfärdsprofitörer roffar åt sig vinster men låter äldre dö i ensamhet på boendet eller sparar på lärare och material så att skolbarn inte får tillräckliga kunskaper. Privatiseringarna av välfärden öppnar upp för kriminella att sko sig på skattemedel. Välfärdsbrott bekämpas inte bäst genom ytterligare tandlös kontroll. Brotten mot välfärden bekämpas bäst genom att det inte går att göra vinster vare sig på barn eller på sjuka och gamla människor."
  - id: V-045
    parti: V
    sida: 12
    rader: '463-470'
    lydelse: "En betydande majoritet av Sveriges befolkning vill sätta stopp för de nyliberala privatiseringarna och stoppa vinstjakten i välfärden. Trots det är det bara Vänsterpartiet som går i takt med väljarna. Vänsterpartiet vill införa ett totalförbud mot alla vinstdrivande verksamhetsformer inom välfärden. Men motståndet från många partier är stort och intresset från andra partier är halvhjärtat. Vänsterpartiet behöver växa och få större inflytande för att åter kunna göra välfärden till en gemensam angelägenhet och inte främst en vinstmöjlighet för riskkapitalister."
  - id: V-046
    parti: V
    sida: 12
    rader: '471-477'
    lydelse: "De massiva skattesänkningar som genomförts av högerpartier och socialdemokrater under många år har resulterat i att det nu finns 350 miljarder mindre per år till välfärden än 1990. Därför är det färre som jobbar inom välfärden, trots att vi har blivit fler i Sverige. I takt med att skatterna på de mest förmögna minskat ökar trycket på lokal- och regionalpolitiker att höja skatten för att slippa skära ner ytterligare. Det är en omvänd fördelningspolitik, där pengar flyttas från allas vår välfärd till ett fåtal redan rika."
  - id: V-047
    parti: V
    sida: 12
    rader: '478-490'
    lydelse: "Eftersom välfärdsyrkena är kvinnodominerade så slår neddragningarna särskilt hårt mot kvinnors arbetsvillkor och möjlighet till makt och inflytande. En fungerande välfärd, så som bra förskola och trygg äldreomsorg, är också en förutsättning för att många kvinnor ska kunna lönearbeta istället för att göra traditionellt hemarbete. Vänsterpartiet har en skattepolitik som ser till vilka behov som finns och där de med stora kapitaltillgångar eller höga löner får bidra mer till välfärden än de gör idag. Vi vill inte höja skatten för vanliga löntagare utan på mångmiljonarv, lyxvillor och stora aktievinster som man inte ens behöver jobba för. Vänsterpartiet har en fördelningspolitik som gör att samhällets rikedomar kommer fler till del. Istället för rut-bidrag till städning hos fullt friska personer så kan vi använda skattekronorna till att förbättra hemtjänsten. Istället för pengar i fickan på de privata skolbolagen kan vi satsa på att alla barn ska få en bra utbildning. Istället för fortsatt ökande klyftor kan vi göra Sverige mer jämlikt."
  - id: V-048
    parti: V
    sida: 12
    rader: '491-494'
    lydelse: "Kultur som konst, musik och film bidrar till att skapa ett rikare samhälle att leva i för alla. Det är viktigt att kulturen står fri från såväl kommersiell som politisk styrning och finns i hela landet. Kulturen spelar en viktig roll och är en del av välfärden. Kulturen kan spegla samhället, motverka segregation och klasskillnader."
  - id: V-049
    parti: V
    sida: 12
    rader: '495-497,500-513'
    lydelse: "Välfärden är samhällets ansvar och borde styras demokratiskt. Det är politikens uppgift att se till att den fungerar, kommer alla till del och att de anställda ges inflytande. De som jobbar på sjukhusen, skolorna eller hemtjänsten idag har burit skattesänkningarnas konsekvenser på sina axlar, med att arbeta hårdare, avstå löneökningar och se kollegorna bli färre och det egna lasset större varje år. Istället för att lösa resursbristen har styrande politiker svarat med ineffektiva modeller, minutstyrning och idéer som optimerad schemaläggning, där ingen som arbetar i verksamheten tillfrågats. Läkare och sjuksköterskor, undersköterskor, lärare och socialsekreterare, alla som behövs i välfärden, förvandlas till administratörer i ett system där politiker kräver att allt dokumenteras i modeller som inte hade behövts. Det är resurser som främst behövs, inte formulär för kvalitetssäkring, nya bokningssystem för sjukhussängar eller ännu en managementkonsult som inte kan något om verksamheten. Kombinationen av marknadslösningar, byråkrati och resursbrist har skapat närmast omänskliga villkor för de samhällsbärare vi inte klarar oss utan. Dessa samhällsbärare förtjänar att bli lyssnade på. De har handfast kunskap som är avgörande för att lyfta välfärden, och den behöver tas om hand. De anställda i välfärden bör också få ett kraftigt utökat inflytande över verksamheterna de arbetar i."
  - id: V-050
    parti: V
    sida: 13
    rader: '515-527'
    lydelse: "Det är när vi står tillsammans som vi bäst kan klara utmaningar och kriser. Pandemin har gjort bristerna i sjukvården och äldreomsorgen tydliga. Konsekvenserna av många år av nedskärningar och privatiseringar syntes i att äldre inte skyddades från smittan trots löften från vårdföretagen och trots att personalen gjorde sitt bästa med knappa resurser. Det fanns för få vårdplatser, alltför belastade vårdcentraler, för lite personal och för dåliga förberedelser med skyddsutrustning. Sverige behöver rusta upp hela vårdsektorn för att kunna klara de mer normala skiftningarna i vårdbehov men också för att kunna växla upp kapaciteten i kristider. Om personalen redan går på knäna och vårdköerna redan är för långa är det svårt att hantera en kris utan att både personal och patienter blir lidande. Det är inte acceptabelt att stora resurser, som behövs till människor med komplext eller långvarigt behov av vård istället går till nätläkartjänster för att behandla vanlig snuva och andra mindre åkommor hos friska människor."
  - id: V-051
    parti: V
    sida: 13
    rader: '528-533'
    lydelse: "När vården inte räcker till tvingas anhöriga, särskilt kvinnor, att ta ett allt större ansvar. Vården och omsorgen har styckats upp, mellan nivåer och aktörer, människor bollas runt i en stor administrativ apparat och det är ofta en kamp för den enskilde och dess anhöriga att få rätt tillgång till vård. Vård måste ges efter människors behov och inte efter kapaciteten i felaktigt konstruerade system. Din försäkring eller position i samhället ska inte avgöra vilken vård du får."
  - id: V-052
    parti: V
    sida: 13
    rader: '534-543,546-549'
    lydelse: "Många år av privatiseringar och ständig jakt på effektiviseringar i arbetslivet, skolan, vården och omsorgen har påverkat både hälsa, vårdbehov och tillgången till vård negativt. Stressrelaterade sjukdomar blir allt vanligare och psykisk ohälsa ökar särskilt bland kvinnor och hos unga utan att det leder till utbyggd vård eller förändrad arbetsmiljö. Du ska ha rätt till hjälp snabbt oavsett om du har brutit benet eller blivit utbränd. Men Sverige har idag minst antal vårdplatser i EU och en alldeles för dåligt utbyggd primärvård. Att du är beroende av omsorg ska inte, som idag, begränsa dina möjligheter att styra över ditt liv. Vittnesmålen om äldre som nästan aldrig får gå ut eller som måste äta sin middag tidigt på eftermiddagen för att personalen ska få tiden att gå ihop vittnar om en förskjutning i synen på människovärde. Vård och omsorg måste ges efter behov oavsett om du bor på ett särskilt boende eller har insatser av hemtjänsten. Därför vill Vänsterpartiet satsa mer resurser på hälso- och sjukvården och äldreomsorgen, samt satsa på personalen så att vi samtidigt får bort personalbristen och stärker personalens villkor och arbetsmiljö."
  - id: V-053
    parti: V
    sida: 14
    rader: '550-557'
    lydelse: "Sjukvården måste vara jämlik, jämställd och tillgänglig, oavsett var i landet du bor och oavsett vem du är. Så är det inte idag. Behoven ska styra, du ska inte behöva lösa en privat försäkring för att få en bra sjukvård och tandvård eller en trygg förlossning. Lösningen är inte att förstatliga sjukvården men för att säkerställa en jämlik vård i Sverige måste staten ta ett större ansvar för att skapa lika förutsättningar. Omfördelningen från stat till region och kommun måste öka och särskild hänsyn ska tas till de många kommuner och regioner som idag inte får ihop sin ekonomi samtidigt som de redan har bland landets högsta skatter totalt sett."
  - id: V-054
    parti: V
    sida: 14
    rader: '558-564'
    lydelse: "Trots att tandhälsan i befolkningen som helhet har förbättrats kvarstår betydande socioekonomiska skillnader. En viktig orsak är att det för vuxna patienter saknas ett högkostnadsskydd värt namnet och dessa får därför stå för en stor del av tandvårdskostnaderna själva. Detta innebär att en ganska stor grupp avstår från tandvård av ekonomiska skäl. Vänsterpartiet vill därför införa en tandvårdsförsäkring liknande den som finns inom övrig hälso- och sjukvård med ett högkostnadsskydd som gör att vuxna människor med behov inte ska behöva tacka nej till god tandvård."
  - id: V-055
    parti: V
    sida: 14
    rader: '565-567'
    lydelse: "En vård och omsorg som är solidariskt finansierad av skattemedel och där pengarna går till verksamhet och inte till företagens vinster är en grundförutsättning för att uppnå en jämlik vård i hela Sverige."
  - id: V-056
    parti: V
    sida: 14
    rader: '569-576'
    lydelse: "Svensk förskola och skola ska vara jämlik och jämställd, där alla barn och unga ges samma rätt till utbildning. En skola som ger barn lika chanser är också kompensatorisk, det vill säga den förmår ge mer stöd till den som kommer från sämre förutsättningar. Under lång tid fanns det en vilja till detta. Politiska reformer la grunden för en av världens bästa skolor. Så är det inte längre. Alldeles för många barn går idag miste om en bra skolgång, särskilt barn som växer upp i socioekonomisk utsatthet. Det är ett misslyckande, inte bara för det enskilda barnet, utan också för samhället i stort."
  - id: V-057
    parti: V
    sida: 14
    rader: '577-586,589-591'
    lydelse: "Sverige är extremt. Som enda land i världen råder det fri dragningsrätt på de skattemedel som ska gå till våra barns utbildning. Pengarna du och jag betalar för våra barns skolgång och framgång går till vinster i skolkoncerner och hamnar i skatteparadis. Dessutom leder den marknadsanpassade skolan till betygsinflation, segregation och ökad ojämlikhet. Privatiseringsexperimentet med marknadsskolan har förstört möjligheterna för tusentals barn. Om dina föräldrar är låg- eller höginkomsttagare, akademiskt skolade eller inte, invandrade eller svenskfödda, spelar en allt större roll för dina möjligheter att klara skolan. Marknadsskolan är ett monumentalt misslyckande. Det tycker en majoritet av svenska folket och stora delar av lärarkåren. Vänsterpartiet vill avskaffa marknadsskolan med start nästa mandatperiod. Barnens rätt till utbildning kan inte vänta. Varje år är det nya elever som skickas igenom systemet utan tillräckliga kunskaper. För varenda en av dem är det en förlorad livschans."
  - id: V-058
    parti: V
    sida: 15
    rader: '592-597'
    lydelse: "Det räcker inte att åtgärda systemfelen med den privatiserade skolan. Skolan måste också tillföras mer resurser, det är bara så vi kan skapa en skola som kan möta barn utifrån deras olikheter och skiftande behov. De senaste årtiondena har pengarna till skolan minskat. Det krävs satsningar inte bara på undervisning utan också på elevhälsa, specialpedagoger, fritidsverksamhet och socialt stöd. Alltför många barn far illa idag och den psykiska ohälsan bland unga är utbredd."
  - id: V-059
    parti: V
    sida: 15
    rader: '598-611'
    lydelse: "En framgångsrik klimatomställning kräver många nya och kunskapsintensiva arbeten, hög kompetens och satsningar på utbildningsväsendet. Arbetare, som idag är anställda i privata företag och offentlig verksamhet ska inte drabbas av arbetslöshet när samhället ställer om från fossilberoende. Deras yrkeskompetens behövs också i den gröna omställningen, men för att kunna hantera de nya gröna jobben behövs massiva satsningar på omställningsstöd, kompetensutveckling och utbildning i vad hållbar samhällsutveckling innebär. Det måste bli lättare att utbilda sig efter grundskolan oavsett vem du är, tjockleken på din plånbok eller var i landet du bor. Alltför många barn börjar aldrig gymnasieskolan eller hoppar av i förtid. Gymnasieskolan ska kunna möta alla barns behov, och inte som idag bygga på konkurrens. Vänsterpartiet vill värna universitetens oberoende och finansiering och höja studiestödet så att fler kan välja att vidareutbilda sig. Folkhögskolor och Komvux behövs i hela landet. Bildning sker genom hela livet. Därför behöver vi också värna studieförbundens ställning."
  - id: V-060
    parti: V
    sida: 15
    rader: '612-617'
    lydelse: "Vänsterpartiet vill satsa på hela utbildningssystemet. Från förskola till universitet och yrkeshögskola behöver kvaliteten och tillgängligheten öka. Det ska inte spela någon roll om du bor i ett miljonprogramsområde eller på landsbygden, rätten till likvärdig utbildning och bildning är grundläggande. Vänsterpartiet vill se fler lärare, tidigare insatser för barn som har det kämpigt och förbättrad tillgång till lärande genom hela livet."
  - id: V-061
    parti: V
    sida: 15
    rader: '619-624'
    lydelse: "Vänsterpartiet försvarar den oberoende kulturen. Politiken ska skapa förutsättningar för en bred kultur som kommer alla till del och hålla armlängds avstånd till innehållet. Vi lever i en tid då högerpopulistiska krafter försöker styra information och innehåll allt hårdare. Därför är det särskilt viktigt att satsa på och utveckla folkbiblioteken, folkbildningen och public services oberoende ställning. En fri kultur är avgörande för en stark demokrati."
  - id: V-062
    parti: V
    sida: 16
    rader: '628-635'
    lydelse: "Det är hög tid för förändring. Vänsterpartiet satte ner foten kring marknadshyror för att nu är gränsen nådd. Ska vi alla ha en framtid som vi kan tro på, så är det Vänsterpartiet som ska leda den politiska förändringen. Vänsterpartiet är ett parti som lägger sin energi på konkreta politiska reformer för att återuppbygga och utveckla de trygghetssystem som rivits ner, en kraftfull grön omställning med jobb och välfärd i hela landet, i både storstad och glesbygd, förort och landsbygd. Ett parti som står upp för oss alla, inte bara en liten rik elit. Vänsterpartiet ställer krav på kollektivavtal vid offentliga upphandlingar."
  - id: V-063
    parti: V
    sida: 16
    rader: '636-651'
    lydelse: "Politik är inte något som händer någon annanstans. Det är tillsammans med folkrörelser som Vänsterpartiet driver fram förändringar. Vårt parti är också en stolt del av en internationellt växande vänster som i åratal kritiserat politikens blinda tro på marknaden och agerat mot dess konsekvenser. Kapitalismen och klimathotet har inga landgränser. Därför är vi en rörelse som sätter den internationella solidariteten högt på dagordningen. Vänsterpartiet är ett socialistiskt, feministiskt och antirasistiskt parti på ekologisk grund. Asylrätten undergrävs just nu i land efter land. När rasismen växer, länder sluter sig och EU bygger murar ska Sverige agera för flyktingars rättigheter och försvara asylrätten både i Sverige och internationellt. Vänsterpartiet anser att Sverige ska vara en röst för fred och rättvisa, inte för ökad militarisering. Sverige ska öka biståndet, stärka FN och skriva under kärnvapenkonventionen. Därför är Vänsterpartiet motståndare till Sveriges allt djupare militära samarbete med NATO och EU, och vi är det enda riksdagspartiet som konsekvent värnar och vill återupprätta svensk alliansfrihet. Vänsterpartiet vill att Sverige river upp värdlandsavtalet med NATO. I en rättvis värld måste den globala ojämlikheten kraftigt minskas."
  - id: V-064
    parti: V
    sida: 16
    rader: '652-660'
    lydelse: "Vänsterpartiet vill ha en regering som står till vänster i svensk politik. Vänsterpartiet kommer att arbeta för att en sådan regering har modet att driva vänsterpolitik och stå emot nyliberalism och rasism. Vänsterpartiet samarbetar gärna med andra partier, men bara om resultatet av arbetet innebär ökad jämlikhet, grön omställning och kraftigt stärkt välfärd. För oss står inte valet mellan två dåliga alternativ. Du som väljare håller förmodligen inte med oss i alla frågor. Det är ok. Men detta valår är det viktigt att lägga sin röst på ett vänsterparti som du kan lita på och som har modet att stå upp för sina ideal. För den som vill ha mer vänsterpolitik så finns det bara Vänsterpartiet att rösta på i detta val."
  - id: V-065
    parti: V
    sida: 16
    rader: '661-671'
    lydelse: "Att vi i Vänsterpartiet anser att mycket mer resurser ska och kan satsas på välfärd, klimatinvesteringar, vård och jobbpolitik än vad de andra partierna gör beror inte på att vi kan trolla fram pengar som andra inte kan hitta. Det beror på att vi inte tror på den ekonomiska politik som fört Sverige in i passiv underkastelse inför marknadskrafter, privat riskkapital och starka lobbyister från bolag som tjänar sina pengar på att ta dem från elever, gamla och sjuka. Vi vet att de stora revor som skadat samhället, de snabbt växande klyftorna och förlusten av trygghet och gemenskap, inte varit oundvikliga. Det är politiker som fattat beslut om varje enskild privatisering. Varje systemskifte. Varje skattesänkning och därpå följande nedskärning av viktig verksamhet. Varje icke-beslut, där klimatomställningen skjutits på framtiden."
  - id: V-066
    parti: V
    sida: 17
    rader: '674-679'
    lydelse: "Vi står vid en vändpunkt. Det som måste göras kommer att ta tid. Men det viktiga är att bryta trenden, och att istället för att acceptera fler försämringar börja bygga framtiden. Det finns självklara och brådskande problem att lösa för att rädda jorden från klimathotet. Välfärden måste byggas upp, jämlikheten stärkas och framförallt måste politiken ta ansvar för samhällsutvecklingen och lösa de behov som finns hos människor och miljö."
  - id: V-067
    parti: V
    sida: 17
    rader: '680-685'
    lydelse: "Ingen av oss vet vad som händer efter valet, men vi vet att det är din röst som avgör. Vi vill att den rösten räknas. Därför tycker vi att du ska lägga den på ett parti som står upp för de förändringar som behöver göras i Sverige. Vänsterpartiet kommer inte att acceptera den utgångspunkt som hela tiden består i att välja det mindre dåliga alternativet. Respekten för väljarna och demokratin kräver att en regering vi stödjer också ska vara en regering som driver vänsterpolitik."
  - id: V-068
    parti: V
    sida: 17
    rader: '686-688'
    lydelse: "Det är tillsammans vi bygger framtiden. Du som vill ha en politik för att förhindra klimatkatastrofen, skapa nya jobb i hela landet, förbättra trygghetssystemen och stärka välfärd, jämlikhet och jämställdhet, rösta på Vänsterpartiet!"
  - id: KD-001
    parti: KD
    sida: 5
    rader: '91-96'
    lydelse: "Avskaffa regionernas ansvar för sjukvården. Låt staten ta över ansvaret för vården med en gemensam organisation i stället för 21 olika. Det ger en högkvalitativ, effektiv och jämlik vård på lika villkor till hela befolkningen."
  - id: KD-002
    parti: KD
    sida: 5
    rader: '97-101'
    lydelse: "Inför en nationell vårdförmedling som matchar vårdbehovet med den vårdkapacitet som finns i hela landet - och inte bara i regionen där personen bor."
  - id: KD-003
    parti: KD
    sida: 5
    rader: '102-106'
    lydelse: "Fler vårdplatser. Sverige har lägst antal vårdplatser per capita i Europa, trots att vi är ett av de länder som lägger mest pengar på vården."
  - id: KD-004
    parti: KD
    sida: 5
    rader: '107-110'
    lydelse: "Fler vårdcentraler på landsbygden och enklare för enskilda läkare att starta egen verksamhet - så att vården finns nära till hands."
  - id: KD-005
    parti: KD
    sida: 5
    rader: '111-115'
    lydelse: "Inför fast läkarkontakt med en namngiven läkare och tak för antal patienter för att möjliggöra relationsbyggande mellan patient och läkare."
  - id: KD-006
    parti: KD
    sida: 5
    rader: '116-119'
    lydelse: "Ökad möjlighet att vårdas i egna hemmet, särskilt för multisjuka, genom mobila sjukvårdsenheter som kan ge vård i hemmet."
  - id: KD-007
    parti: KD
    sida: 5
    rader: '120-123'
    lydelse: "En nationell förlossningsplan och öppna fler förlossningskliniker, ökad bemanning och ett barnmorsketeam genom hela vårdkedjan - Före, under och efter förlossningen."
  - id: KD-008
    parti: KD
    sida: 5
    rader: '124-126'
    lydelse: "Utbilda mer personal för sjukvården. Förbättrade villkor i vårdens bristyrken och minska behovet av dyr inhyrd personal."
  - id: KD-009
    parti: KD
    sida: 5
    rader: '127-129'
    lydelse: "Kraftigt stärkt elevhälsa med en sammanhållen barn- och ungdomshälsovård och föräldrastödsprogram som erbjuds alla föräldrar."
  - id: KD-010
    parti: KD
    sida: 5
    rader: '130-134'
    lydelse: "Trygg patientsäkerheten med nationella standarder och tekniska specifikationer för all digital vårdinformation. Information om patienten ökar möjligheterna för en god vård."
  - id: KD-011
    parti: KD
    sida: 7
    rader: '149-151'
    lydelse: "Förebygg brott genom att stärka familjerna och föräldraansvaret och göra det obligatoriskt med föräldrastöd i alla Sverige kommuner."
  - id: KD-012
    parti: KD
    sida: 7
    rader: '152-154'
    lydelse: "Förebygg brott genom att stärka föreningslivet samt inrättande av mentorskapsprogram och nationellt avhopparprogram."
  - id: KD-013
    parti: KD
    sida: 7
    rader: '155-157'
    lydelse: "Fler poliser och höjda polislöner. Polisyrket behöver bli mer attraktivt för att behålla poliser och attrahera nya."
  - id: KD-014
    parti: KD
    sida: 7
    rader: '158-160'
    lydelse: "Renodla polisens uppdrag. Polisen fokuserar idag alldeles för mycket på annat än brottsbekämpning."
  - id: KD-015
    parti: KD
    sida: 7
    rader: '161-164'
    lydelse: "Hela rättsväsendet behöver byggas ut. Fler poliser kräver fler åklagare, domstolar på fler platser i landet och en kraftigt utbyggd kriminalvård."
  - id: KD-016
    parti: KD
    sida: 7
    rader: '165-166'
    lydelse: "Skärp straffet för vapenbrott till lägst fem års fängelse."
  - id: KD-017
    parti: KD
    sida: 7
    rader: '167-172'
    lydelse: "Skärp straffen för sexualbrott kraftigt. 25 års fängelse för grov våldtäkt, kemisk kastrering som villkor för villkorlig frigivning och livstids fängelse för grov våldtäkt mot barn."
  - id: KD-018
    parti: KD
    sida: 7
    rader: '173-175'
    lydelse: "Stram migrationspolitik krävs för att ta itu med integrationsproblem och utanförskap."
  - id: KD-019
    parti: KD
    sida: 7
    rader: '176-180'
    lydelse: "Stärk sociala insatser och socialtjänstens möjligheter till tvingande åtgärder gentemot barn och unga som begår brott. Inrätta en nationell social insatsstyrka, så det förebyggande arbetet stärks och blir mer lika i landet."
  - id: KD-020
    parti: KD
    sida: 7
    rader: '181-182'
    lydelse: "Total översyn av sekretessreglerna, så att myndigheter kan dela uppgifter mellan sig för att förebygga och klara upp brott."
  - id: KD-021
    parti: KD
    sida: 7
    rader: '183-185'
    lydelse: "Beslagta kriminellas statussymboler och bekämpa på så sätt negativa förebilder som rekryterar unga in i gängkriminalitet."
  - id: KD-022
    parti: KD
    sida: 7
    rader: '186-188'
    lydelse: "Inför brottsrubriceringen missfirmelse mot tjänsteman, dvs att skrika okvädningsord till poliser, ska förbjudas."
  - id: KD-023
    parti: KD
    sida: 7
    rader: '189-191'
    lydelse: "Inför anonyma vittnen. Det finns i flera andra länder och har bidragit till fler fällande domar."
  - id: KD-024
    parti: KD
    sida: 9
    rader: '206-208'
    lydelse: "Sänk bensin- och dieselpriserna rejält för alla, främst genom minskad inblandningen av dyrt biobränsle."
  - id: KD-025
    parti: KD
    sida: 9
    rader: '209-210'
    lydelse: "Miljardsatsning för att rusta eftersatta vägar i hela landet - istället för att bygga dyra höghastighetståg."
  - id: KD-026
    parti: KD
    sida: 9
    rader: '211-215'
    lydelse: "Fler poliser med lokal närvaro, utbyggd primärvård, enklare starta lokal läkarmottagning och inrätta fler statliga servicekontor. Du ska känna dig trygg i hela landet."
  - id: KD-027
    parti: KD
    sida: 9
    rader: '216-219'
    lydelse: "Underlätta personalägande och generationsskifte av företag - så att fler företag kan drivas vidare av personalen om ägaren vill sluta."
  - id: KD-028
    parti: KD
    sida: 9
    rader: '220-221'
    lydelse: "Rädda lanthandeln genom att bredda driftstödet till dagligvarubutiker."
  - id: KD-029
    parti: KD
    sida: 9
    rader: '222-223'
    lydelse: "Den svenska vargstammen ska minskas till 170 individer."
  - id: KD-030
    parti: KD
    sida: 9
    rader: '224-226'
    lydelse: "Satsa på kärnkraften med långsiktiga villkor att utvecklas. Förläng befintliga reaktorers drift och bygg ut med nya reaktorer."
  - id: KD-031
    parti: KD
    sida: 9
    rader: '227-229'
    lydelse: "Inför en “stötdämpare” i elskatten så att den sänks om elpriserna ökar."
  - id: KD-032
    parti: KD
    sida: 9
    rader: '230-231'
    lydelse: "Värna vattenkraften, både den storskaliga och småskaliga."
  - id: KD-033
    parti: KD
    sida: 9
    rader: '232-236'
    lydelse: "Bygg ut vindkraften men med respekt för den lokala demokratin och anpassa storleken efter lokala villkor. Vindkraft kan dock bara vara ett komplement."
  - id: KD-034
    parti: KD
    sida: 9
    rader: '237-239'
    lydelse: "Regeländringar och kostnadslättnader för svenskt lantbruk för att öka Sveriges självförsörjning och stärka lantbrukets konkurrenskraft."
  - id: KD-035
    parti: KD
    sida: 11
    rader: '251'
    lydelse: "Sänkt skatt på pension."
  - id: KD-036
    parti: KD
    sida: 11
    rader: '252-253'
    lydelse: "Skattelättnad för äldre (69+) som vill och kan fortsätta arbeta."
  - id: KD-037
    parti: KD
    sida: 11
    rader: '254-260'
    lydelse: "Gör det möjligt att arbeta längre och mer flexibelt för den som kan genom att förlänga rätten att arbeta (LAS-åldern) i två steg till 75 års ålder, med ömsesidig rätt att minska arbetstiden till 50%. Ta samtidigt bort arbetsgivaravgiften helt från 69 år."
  - id: KD-038
    parti: KD
    sida: 11
    rader: '261-262'
    lydelse: "Inför trygghetsersättning, för dem som har ett fåtal år kvar till pensionen men som slitit ut kroppen."
  - id: KD-039
    parti: KD
    sida: 11
    rader: '263'
    lydelse: "Höjd garantipension och höjt bostadstillägg för pensionärer."
  - id: KD-040
    parti: KD
    sida: 11
    rader: '264'
    lydelse: "Fler trygghetsboenden, gemenskapsboenden för äldre."
  - id: KD-041
    parti: KD
    sida: 11
    rader: '265-267'
    lydelse: "Förbättrade villkor för personalen i äldreomsorgen - bort med delade turer."
  - id: KD-042
    parti: KD
    sida: 11
    rader: '268-269'
    lydelse: "Ökad medicinsk kompetens inom äldreomsorgen."
  - id: KD-043
    parti: KD
    sida: 11
    rader: '270-272'
    lydelse: "Tid och resurser till demensvården och ökade kunskaper om demenssjukdomar och psykisk ohälsa hos äldre."
  - id: KD-044
    parti: KD
    sida: 11
    rader: '273-276'
    lydelse: "Bryt äldres ofrivilliga ensamhet och isolering genom äldresamtal i alla kommuner, gemenskapsfrämjande insatser i omsorgen samt digitala hjälpmedel."
  - id: KD-045
    parti: KD
    sida: 11
    rader: '277-278'
    lydelse: "Stärkt tandvård för äldre bland annat genom att sänka högkostnadsskyddet för tandvård."
  - id: KD-046
    parti: KD
    sida: 11
    rader: '279-281'
    lydelse: "Säkerställ att personal inom hemtjänst och äldreboenden har möjlighet till kontinuerlig kompetensutveckling."
  - id: MP-001
    parti: MP
    sida: 3
    rader: '30-31'
    lydelse: "investera minst 100 miljarder per år i att ställa om så att Sverige blir ett fossilfritt välfärdsland senast år 2030."
  - id: MP-002
    parti: MP
    sida: 3
    rader: '32'
    lydelse: "ta fram en svensk utsläppsbudget som gör att vi når klimatmålen."
  - id: MP-003
    parti: MP
    sida: 3
    rader: '33-34'
    lydelse: "införa en omställningslag så att all industri fasar ut kol, olja och fossilgas till senast 2030."
  - id: MP-004
    parti: MP
    sida: 3
    rader: '35'
    lydelse: "fasa ut fossila subventioner."
  - id: MP-005
    parti: MP
    sida: 3
    rader: '36-37'
    lydelse: "att biståndet ska hjälpa till att bygga hållbara, klimatsmarta samhällen, skydda hav, främja biologisk mångfald och ekosystemtjänster."
  - id: MP-006
    parti: MP
    sida: 3
    rader: '38-41'
    lydelse: "att de med mest pengar, som också orsakar större utsläpp, ska bidra mer till omställningen och välfärden genom en progressiv beskattning av kapital. De med minst resurser ska få mer samhällsservice, lägre skatt och mer stöd i omställningen."
  - id: MP-007
    parti: MP
    sida: 3
    rader: '42-43'
    lydelse: "höja priset på utsläppsrätter i EU, inkludera utsläpp från flyg och sjöfart i systemet och införa klimattullar på varor från länder utanför EU."
  - id: MP-008
    parti: MP
    sida: 4
    rader: '53-54'
    lydelse: "bygga ut vindkraften till havs snabbt i hela landet, med hänsyn till livet i havet. Ge rejäl ekonomisk återbäring till de kommuner där det byggs och finns vindkraft."
  - id: MP-009
    parti: MP
    sida: 4
    rader: '55'
    lydelse: "införa ett kraftfullt stöd för energieffektivisering till både hushåll och industrier."
  - id: MP-010
    parti: MP
    sida: 4
    rader: '56'
    lydelse: "storsatsa på solceller och solvärme."
  - id: MP-011
    parti: MP
    sida: 4
    rader: '57'
    lydelse: "bygga ut elnäten, investera i energilager och satsa på ett smart energisystem."
  - id: MP-012
    parti: MP
    sida: 4
    rader: '58'
    lydelse: "helt ta bort energiskatten för företag som producerar el för eget bruk."
  - id: MP-013
    parti: MP
    sida: 4
    rader: '70'
    lydelse: "att Sverige verkar för en ekocidlagstiftning."
  - id: MP-014
    parti: MP
    sida: 4
    rader: '71-72'
    lydelse: "skydda 30 procent av Sveriges natur, bland annat våra unika sammanhängande fjällskogar och skyddsvärda skogar i hela landet."
  - id: MP-015
    parti: MP
    sida: 4
    rader: '73'
    lydelse: "återställa våtmarker som torrlagts i snabbare takt."
  - id: MP-016
    parti: MP
    sida: 4
    rader: '74'
    lydelse: "att mer skogsbruk bedrivs med hyggesfria metoder."
  - id: MP-017
    parti: MP
    sida: 4
    rader: '75'
    lydelse: "ge mer pengar till friluftsorganisationerna så att fler kan njuta av svensk natur."
  - id: MP-018
    parti: MP
    sida: 4
    rader: '76'
    lydelse: "investera i mer natur och grönska i städer och tätorter."
  - id: MP-019
    parti: MP
    sida: 4
    rader: '77'
    lydelse: "försvara allemansrätten och stärka strandskyddet."
  - id: MP-020
    parti: MP
    sida: 4
    rader: '78'
    lydelse: "rädda kustens ekosystem - återskapa förstörda miljöer ."
  - id: MP-021
    parti: MP
    sida: 4
    rader: '79-80'
    lydelse: "låt ekosystemen i haven sätta gränserna för hur mycket fisk som får fångas, inför en ekosystembaserad havsförvaltning och gå över till skonsamma fiskemetoder."
  - id: MP-022
    parti: MP
    sida: 4
    rader: '81'
    lydelse: "skydda minst 30 procent av världens hav."
  - id: MP-023
    parti: MP
    sida: 4
    rader: '82-83'
    lydelse: "ge mer stöd till lantbruket för omställning till ekologisk odling, återskapande av naturbetesmarker och andra miljöinsatser."
  - id: MP-024
    parti: MP
    sida: 5
    rader: '93-94'
    lydelse: "bygga ut och rusta upp järnvägsnätet för snabba tåg i hela landet och skynda på bygget av nya stambanor för höghastighetståg."
  - id: MP-025
    parti: MP
    sida: 5
    rader: '95-96'
    lydelse: "säkra och utveckla nattågstrafiken i hela Sverige och knyt oss närmare våra nordiska grannländer och övriga Europa med fler avgångar."
  - id: MP-026
    parti: MP
    sida: 5
    rader: '97-98'
    lydelse: "bygga ut kollektivtrafiken i hela landet, och gör det billigare att åka buss och tåg, särskilt för unga och pensionärer."
  - id: MP-027
    parti: MP
    sida: 5
    rader: '99'
    lydelse: "minska bilåkandet i storstäderna och främja gång-, cykel- och kollektivtrafik."
  - id: MP-028
    parti: MP
    sida: 5
    rader: '100-101'
    lydelse: "investera i laddning i hela landet - staten ska ta ansvar där marknaden inte räcker till, så att bilar och lastbilar kan köra på el oavsett vart i landet de ska."
  - id: MP-029
    parti: MP
    sida: 5
    rader: '102-103'
    lydelse: "att den som behöver bil ska ha råd med ett klimatsmart alternativ, och att bara fossilfria bilar ska säljas från 2025."
  - id: MP-030
    parti: MP
    sida: 5
    rader: '104-106'
    lydelse: "minska flygets utsläpp - höja flygskatten, minska flygresandet och skynda på omställningen till förnybara bränslen, elektrobränslen och elflyg för de flygresor som inte kan ersättas på annat sätt. Staten borde sälja SAS och investera pengarna i järnväg."
  - id: MP-031
    parti: MP
    sida: 5
    rader: '113-114'
    lydelse: "sänka momsen kraftigt på bilpooler och andra delningstjänster och underlätta för de som vill dela, istället för äga, en bil."
  - id: MP-032
    parti: MP
    sida: 5
    rader: '115'
    lydelse: "förbjuda produkter som är tillverkade för att gå sönder i förtid."
  - id: MP-033
    parti: MP
    sida: 5
    rader: '116'
    lydelse: "ställa lagkrav på att produkter ska vara enkla och billiga att reparera och uppdatera."
  - id: MP-034
    parti: MP
    sida: 5
    rader: '117'
    lydelse: "fasa ut giftiga ämnen omgående, speciellt från produkter för barn."
  - id: MP-035
    parti: MP
    sida: 5
    rader: '123'
    lydelse: "stänga minkfarmerna."
  - id: MP-036
    parti: MP
    sida: 5
    rader: '124'
    lydelse: "förbjuda burhållning av höns."
  - id: MP-037
    parti: MP
    sida: 5
    rader: '125'
    lydelse: "minimera djurs lidande vid transport och slakt."
  - id: MP-038
    parti: MP
    sida: 5
    rader: '126-127'
    lydelse: "minska användningen av antibiotika i djurhållningen och införa en skatt på kött som producerats med hög antibiotikaanvändning."
  - id: MP-039
    parti: MP
    sida: 6
    rader: '139'
    lydelse: "höja den lägsta nivån i sjuk- och aktivitetsersättningarna."
  - id: MP-040
    parti: MP
    sida: 6
    rader: '140-141'
    lydelse: "höja garantipensionen och reformera pensionssystemet med syfte att höja pensionerna, mest för de med de lägsta pensionerna."
  - id: MP-041
    parti: MP
    sida: 6
    rader: '142'
    lydelse: "höja bostadsbidraget för barnfamiljer och bostadstillägget för pensionärer."
  - id: MP-042
    parti: MP
    sida: 6
    rader: '143'
    lydelse: "höja studiestödet och förbättra studenters a-kassa och sjukförsäkring."
  - id: MP-043
    parti: MP
    sida: 6
    rader: '144-145'
    lydelse: "förändra sjukförsäkringen så den ger bättre trygghet vid sjukskrivning och se till att människor inte bollas mellan myndigheter när de behöver samhällets stöd."
  - id: MP-044
    parti: MP
    sida: 6
    rader: '146'
    lydelse: "slopa karensdagen i sjukförsäkringen."
  - id: MP-045
    parti: MP
    sida: 6
    rader: '147'
    lydelse: "korta arbetstiden så att fler människor orkar jobba ett helt arbetsliv."
  - id: MP-046
    parti: MP
    sida: 6
    rader: '155'
    lydelse: "bygga fler klimatsmarta hyresrätter med rimliga hyror, utveckla och utöka investeringsstödet som gjorde det billigare att bygga och se till att fler kan äga sin bostad."
  - id: MP-047
    parti: MP
    sida: 6
    rader: '156-158'
    lydelse: "minska hemlösheten, genom en nationell strategi som på riktigt minskar hemlösheten och en bostadsstiftelse som finansierar en bostad för dem som inte har ett tryggt boende."
  - id: MP-048
    parti: MP
    sida: 6
    rader: '159-160'
    lydelse: "stoppa renovräkningar. Renovering ska inte vara så lyxig att människor måste vräkas från sina hem. Vi vill stärka hyresgästernas ställning vid renovering."
  - id: MP-049
    parti: MP
    sida: 6
    rader: '161-162'
    lydelse: "införa ett rot-stöd för hyresrätter och stimulera hållbar renovering genom statligt långsiktigt stöd."
  - id: MP-050
    parti: MP
    sida: 6
    rader: '170'
    lydelse: "höja lönerna och säkra en god arbetsmiljö i vården."
  - id: MP-051
    parti: MP
    sida: 6
    rader: '171'
    lydelse: "förbättra förlossningsvården och satsa på barnmorskorna."
  - id: MP-052
    parti: MP
    sida: 6
    rader: '172'
    lydelse: "förbättra vård och omsorg för äldre och stärka resurserna till hemsjukvården."
  - id: MP-053
    parti: MP
    sida: 6
    rader: '173-174'
    lydelse: "att tandvården ska jämställas med övrig hälso- och sjukvård, och ingå i samma högkostnadsskydd."
  - id: MP-054
    parti: MP
    sida: 6
    rader: '175'
    lydelse: "att hjälpmedel ska ingå i högkostnadsskyddet."
  - id: MP-055
    parti: MP
    sida: 6
    rader: '176'
    lydelse: "satsa på primärvården och öka tillgången till vård för psykisk ohälsa."
  - id: MP-056
    parti: MP
    sida: 6
    rader: '177'
    lydelse: "korta köerna till behandling i hela landet."
  - id: MP-057
    parti: MP
    sida: 7
    rader: '178'
    lydelse: "att preventivmedel ska vara avgiftsfritt upp till 26 år."
  - id: MP-058
    parti: MP
    sida: 7
    rader: '179-181'
    lydelse: "förbättra stödet för personer med funktionsnedsättning och sällsynta diagnoser oavsett var du bor i landet. Den som har rätt till stöd ska inte behöva planera sitt liv flera veckor i förväg för att ha ett fullvärdigt liv."
  - id: MP-059
    parti: MP
    sida: 7
    rader: '188'
    lydelse: "sätta stopp för vinstjakten i skolan."
  - id: MP-060
    parti: MP
    sida: 7
    rader: '189'
    lydelse: "bryta skolsegregationen och göra skolvalet fritt och rättvist för alla."
  - id: MP-061
    parti: MP
    sida: 7
    rader: '190-191'
    lydelse: "göra det attraktivt att vara lärare genom att säkra höjda löner och en god arbetsmiljö i skolan."
  - id: MP-062
    parti: MP
    sida: 7
    rader: '192-193'
    lydelse: "förstärka elevhälsan och satsa på fler skolsköterskor, specialpedagoger, psykologer och kuratorer i skolan."
  - id: MP-063
    parti: MP
    sida: 7
    rader: '194-195'
    lydelse: "satsa mer på fritidshemmen och se till att även de barn vars föräldrar inte arbetar får tillgång till fritids."
  - id: MP-064
    parti: MP
    sida: 7
    rader: '196'
    lydelse: "satsa på mindre barngrupper och mer personal i förskolan."
  - id: MP-065
    parti: MP
    sida: 7
    rader: '203-204'
    lydelse: "satsa på en bred återhämtningsplan för kulturlivet i hela landet, som omfattar både offentliga, fria, professionella och ideella aktörer."
  - id: MP-066
    parti: MP
    sida: 7
    rader: '205'
    lydelse: "stärka kulturskolan och inrätta en kulturskolelag."
  - id: MP-067
    parti: MP
    sida: 7
    rader: '206-207'
    lydelse: "satsa på barns kultur i skolan, med utbildad personal på alla skolbibliotek och estetiska ämnen i alla gymnasieprogram."
  - id: MP-068
    parti: MP
    sida: 7
    rader: '208-209'
    lydelse: "förbättra kulturskaparnas ekonomiska och sociala villkor och modernisera upphovsrätten så att kulturskaparnas rättigheter värnas."
  - id: MP-069
    parti: MP
    sida: 7
    rader: '210'
    lydelse: "stärka biblioteken i deras viktiga arbete för läsning och demokrati."
  - id: MP-070
    parti: MP
    sida: 7
    rader: '216'
    lydelse: "skydda Sveriges grundlag mot snabba förändringar."
  - id: MP-071
    parti: MP
    sida: 7
    rader: '217'
    lydelse: "förstärka yttrandefriheten och stödja oberoende medier i hela landet."
  - id: MP-072
    parti: MP
    sida: 7
    rader: '218-220'
    lydelse: "stärka nationella minoriteters och urfolket samernas rättigheter och att Sverige ska förbinda sig att följa den internationella konventionen om urfolks rättigheter (ILO 169)."
  - id: MP-073
    parti: MP
    sida: 7
    rader: '221'
    lydelse: "skydda ett oberoende public service i grundlagen."
  - id: MP-074
    parti: MP
    sida: 8
    rader: '228-230'
    lydelse: "skapa en dörr ut för våldsutsatta i hela landet, så att ansvaret för skydd, boende och vård samordnas direkt efter uppbrottet. Även de med husdjur som de inte vågar lämna kvar hos förövaren, ska få den hjälp som krävs för att ta sig ur förhållandet."
  - id: MP-075
    parti: MP
    sida: 8
    rader: '231-232'
    lydelse: "skärpa samtyckeslagen så att det blir tydligt att prostitution inte innebär samtycke till sex."
  - id: MP-076
    parti: MP
    sida: 8
    rader: '233-234'
    lydelse: "stärka arbetet mot hedersrelaterat våld och förtryck så att likvärdig hjälp ges i hela landet."
  - id: MP-077
    parti: MP
    sida: 8
    rader: '235'
    lydelse: "skydda barn från att tvingas till umgänge med en våldsam förälder."
  - id: MP-078
    parti: MP
    sida: 8
    rader: '236-237'
    lydelse: "att våldsutsatta kvinnor som tvingas gömma sig ska få starkare skydd och att fler som utövar våld ska få fotboja."
  - id: MP-079
    parti: MP
    sida: 8
    rader: '248-249'
    lydelse: "dubblera pappornas uttag av föräldraledighet - varje förälder ska ta ut minst en tredjedel av föräldradagarna."
  - id: MP-080
    parti: MP
    sida: 8
    rader: '250-251'
    lydelse: "höja lönerna i kvinnodominerade yrken till samma nivåer som i mansdominerade yrken med motsvarande ansvar och utbildningskrav."
  - id: MP-081
    parti: MP
    sida: 8
    rader: '252-253'
    lydelse: "att en samtyckeskultur ska genomsyra samhället - alla elever ska få en likvärdig sex- och samlevnadsundervisning, där samtycke står i fokus."
  - id: MP-082
    parti: MP
    sida: 8
    rader: '254-255'
    lydelse: "stärk utrikesfödda kvinnors etablering genom SFI kombinerad med praktik och yrkesutbildning och jämställda insatser från arbetsförmedlingen."
  - id: MP-083
    parti: MP
    sida: 8
    rader: '261-262'
    lydelse: "stärka lagstiftningen mot diskriminering och se över rätten till rättshjälp i diskrimineringsfall."
  - id: MP-084
    parti: MP
    sida: 8
    rader: '263'
    lydelse: "ta fram systematisk statistik för att belysa diskriminering och rasism i samhället."
  - id: MP-085
    parti: MP
    sida: 8
    rader: '264-265'
    lydelse: "stärka transpersoners rättigheter genom en ny könstillhörighetslag, och införa ett tredje juridiskt kön."
  - id: MP-086
    parti: MP
    sida: 8
    rader: '266-267'
    lydelse: "anpassa familjepolitiken så att den blir könsneutral och stärka rättigheterna för stjärnfamiljer, det vill säga alla olika typer av familjer."
  - id: MP-087
    parti: MP
    sida: 9
    rader: '268-269'
    lydelse: "stärka och utveckla läsa-skriva-räkna-garantin för att fler barn med funktionsnedsättning ska få insatser i tid."
  - id: MP-088
    parti: MP
    sida: 9
    rader: '270-272'
    lydelse: "att lagen om stöd och service till vissa funktionshindrade (LSS) förtydligas och statligt huvudmannaskap införs i den personliga assistansen så att människor får det stöd de behöver och har rätt till."
  - id: MP-089
    parti: MP
    sida: 9
    rader: '282'
    lydelse: "storsatsa på det förebyggande arbetet i socioekonomiskt eftersatta områden."
  - id: MP-090
    parti: MP
    sida: 9
    rader: '283-284'
    lydelse: "se fler och bättre betalda poliser för att bekämpa den organiserade brottsligheten och för att motverka parallellsamhällen."
  - id: MP-091
    parti: MP
    sida: 9
    rader: '285-287'
    lydelse: "höja maxtiden för sluten ungdomsvård och förstärka vårdinsatser och utbildning under tiden den unge är frihetsberövad, samt införa en utslussningsverksamhet när straffet är avtjänat."
  - id: MP-092
    parti: MP
    sida: 9
    rader: '288-290'
    lydelse: "lätta på sekretessen mellan områdespoliser, skola, socialtjänst och stärka samarbetet med civilsamhälle så att inga barn faller mellan stolarna i det förebyggande arbetet."
  - id: MP-093
    parti: MP
    sida: 9
    rader: '291-295'
    lydelse: "stoppa finansieringen av de kriminella gängen genom att stärka myndighetssamverkan så att myndigheterna kan slå till mot den organiserade brottslighetens företag från flera håll: svartklubbar och gästarbetarbostäder utan bygglov, restauranger som missköter hygien, skattebrott och varenda spelautomat som saknar tillstånd. Det ska vara dyrt, jobbigt och svårt att vara kriminell."
  - id: MP-094
    parti: MP
    sida: 9
    rader: '304-305'
    lydelse: "satsa en större andel av försvarets pengar på det civila försvaret, och öka anslagen till krisberedskap."
  - id: MP-095
    parti: MP
    sida: 9
    rader: '306'
    lydelse: "investera i klimatanpassning för att möta effekterna av klimatförändringarna."
  - id: MP-096
    parti: MP
    sida: 9
    rader: '307'
    lydelse: "anpassa äldreboenden, skolor och förskolor för att klara skyfall och hetta."
  - id: MP-097
    parti: MP
    sida: 9
    rader: '308-309'
    lydelse: "införa en civiltjänstgöring som komplement till värnplikten för att ge fler den kunskap och träning som behövs i kris."
  - id: MP-098
    parti: MP
    sida: 9
    rader: '310-312'
    lydelse: "stärka det svenska jordbruket för ökad självförsörjning med baslivsmedel, och stödja övergången till ett ekologiskt och hållbart jordbruk med fossiloberoende arbetsmaskiner."
  - id: MP-099
    parti: MP
    sida: 10
    rader: '313-314'
    lydelse: "stärka skyddet av våra dricksvattentäkter och se till att det finns fungerande reservvattentäkter."
  - id: MP-100
    parti: MP
    sida: 10
    rader: '327-329'
    lydelse: "att mer än 1 procent av Sveriges bruttonationalinkomst fortsatt ska gå till bistånd, att biståndet ska styras av principer om effektivitet och fattigdomsbekämpning och inte villkoras mot Sveriges inrikespolitiska intressen."
  - id: MP-101
    parti: MP
    sida: 10
    rader: '330'
    lydelse: "utveckla och förstärka Sveriges feministiska utrikes- och utvecklingspolitik."
  - id: MP-102
    parti: MP
    sida: 10
    rader: '331-333'
    lydelse: "att utvecklingssamarbetet ska bidra till att bekämpa fattigdom, förebygga och hantera klimatförändringarna, bevara och skapa fred, förebygga konflikter, bygga upp demokratiska samhällen och motverka korruption."
  - id: MP-103
    parti: MP
    sida: 10
    rader: '334-335'
    lydelse: "ratificera konventionen om kärnvapenförbud och arbeta för ett totalförbud mot att använda autonoma vapensystem."
  - id: MP-104
    parti: MP
    sida: 10
    rader: '336'
    lydelse: "införa en lag som förbjuder kärnvapen på svensk mark."
  - id: MP-105
    parti: MP
    sida: 10
    rader: '337-338'
    lydelse: "inte att Sverige ska anpassa sin utrikespolitik efter auktoritära staters krav för kunna att bli medlem i Nato och Sverige ska inte börja sälja vapen till Turkiet."
  - id: MP-106
    parti: MP
    sida: 10
    rader: '346'
    lydelse: "försvara asylrätten och kvotflyktingsystemet."
  - id: MP-107
    parti: MP
    sida: 10
    rader: '347-348'
    lydelse: "att fler familjer ska kunna återförenas i Sverige. Inga asylsökande barn ska kunna skiljas från sina föräldrar."
  - id: MP-108
    parti: MP
    sida: 10
    rader: '349'
    lydelse: "att barn på flykt ska få permanent uppehållstillstånd."
  - id: MP-109
    parti: MP
    sida: 10
    rader: '350-351'
    lydelse: "stärka rättssäkerheten i asylprocessen och stödet för hbtqi-flyktingar och andra sårbara grupper."
  - id: MP-110
    parti: MP
    sida: 10
    rader: '352-353'
    lydelse: "korta handläggningstiderna för arbetstillstånd och asylbeslut så att det går fortare att komma in i samhället."
  - id: MP-111
    parti: MP
    sida: 10
    rader: '354-355'
    lydelse: "förlänga etableringsprogrammet för nyanlända till minst fyra år för att skapa bättre förutsättningar för etablering, så att fler kommer i arbete snabbare."
  - id: L-001
    parti: L
    sida: 4
    rader: '78-81'
    lydelse: "1. Satsa på Sveriges viktigaste yrke. Allt börjar med en bra lärare. Därför vill vi se högre krav för att komma in på lärarutbildningen, högre krav på lärarutbildningen och se en bättre arbetsmiljö för lärare ute på landets skolor. Lärare ska avlastas för att kunna vara just lärare, kunna göra karriär, få betald fortbildning och få ordentligt bra betalt. En storsatsning på läromedel måste göras så att eleverna får riktiga skolböcker och landets lärare slipper stå och kopiera."
  - id: L-002
    parti: L
    sida: 4
    rader: '82-87'
    lydelse: "2. Studiero för alla - fler speciallärare och fler mindre undervisningsgrupper. Alla förlorar när skolgången inte fungerar för en elev. Därför vill vi se fler särskilda undervisningsgrupper utanför det vanliga klassrummet, för att elever som annars stökar och stör ska få bättre chanser. För att göra det möjligt skjuter vi till pengar för minst 1 000 fler speciallärare. Dessutom vill vi kunna förlänga skoldagarna för de elever som annars riskerar att halka efter, och ha mer av obligatorisk lovskola tidigare i skolåren."
  - id: L-003
    parti: L
    sida: 4
    rader: '88-91'
    lydelse: "3. Förstatliga skolan. Vi vill att staten tar över ansvaret från skolan från kommunerna så att alla elever får gå i bra skolor - inte bara de som råkar bo på rätt ställe. I ett första steg kommer vi att införa en statlig skolpeng som ger likvärdiga villkor i hela landet och ha statliga skolakuter som kan ta över de skolor som inte fungerar."
  - id: L-004
    parti: L
    sida: 4
    rader: '92-95'
    lydelse: "4. Vinstbegränsning och valfrihet i en ny friskolereform. Friheten för föräldrar och elever att själv välja skola är här för att stanna - men inte friskolornas vinstuttag på bekostnad av elevernas kunskaper. Vi vill se en ny friskolereform med en samlad friskolelag som sätter stopp för friskolor där kortsiktiga vinster går före elevernas kunskaper."
  - id: L-005
    parti: L
    sida: 5
    rader: '97-100'
    lydelse: "5. Stopp för religiösa friskolor. Ingen skola ska tvinga en elev att leva efter religiösa seder och ingen skola ska kunna användas för att sprida religiös fundamentalism. Vi vill sätta stopp för religiösa friskolor och hindra utländska icke-demokratiska aktörer från att äga skolor i Sverige. Skolor med inriktning mot de lagskyddade nationella minoriteterna ska alltid kunna finnas."
  - id: L-006
    parti: L
    sida: 5
    rader: '101-104'
    lydelse: "6. Nej till lottning. Integrationsproblemen är så stora att de inte går att blanda bort genom rödgröna förslag om att manipulera skolområden, flytta runt elever eller lotta vilken skola de ska gå i. Vi vill i stället stärka skolvalet genom att göra det obligatoriskt och samordnat, så att fler i stället för färre får välja vilken skola de vill gå i."
  - id: L-007
    parti: L
    sida: 5
    rader: '105-109'
    lydelse: "7. Flytta på mobbaren - inte den mobbade. Ordningsproblemen i den svenska skolan slår hårdast mot de barn som inte har stöd hemifrån. Rektorer ska enklare kunna omplacera elever som allvarligt stör verksamhet. Elever som kränker, hotar eller slår lärare och klasskamrater ska tillfälligt kunna få sitt studiebidrag indraget, precis som i dag är möjligt vid skolkande. Att inte markera tydligt och tidigt mot våld och hot är en otjänst mot alla."
  - id: L-008
    parti: L
    sida: 5
    rader: '110-112'
    lydelse: "8. Öka lärarnas befogenheter. Det är läraren som ska bestämma i klassrummet. Vi vill ge lärare ökad rätt att agera mot elever som förstör för klasskompisar och sig själv och tydliggöra i skollaget att det är läraren - inte eleverna - som ska bestämma över undervisningens upplägg."
  - id: L-009
    parti: L
    sida: 5
    rader: '113-115'
    lydelse: "9. En jämställd skola. Flickor och pojkar ska alltid känna sig trygga i skolan och aldrig begränsas av sitt kön. Förskolans och skolans arbete mot hedersrelaterat förtryck ska stärkas och både flickor och pojkar ska mötas av samma höga förväntningar i sitt skolarbete."
  - id: L-010
    parti: L
    sida: 5
    rader: '116-118'
    lydelse: "10. Alla ska uppmuntras och utmanas. Elever som vill och kan ska kunna gå före i stället för att hållas tillbaka. Det kräver fler spetsklasser runt om i Sverige, men också att alla elever oavsett skola ska kunna få stöd i att sikta högre än godkänt."
  - id: L-011
    parti: L
    sida: 5
    rader: '119-122'
    lydelse: "11. Mer tid och plats för kunskap. Att Sverige har kortare skoldagar än andra länder drabbar hårdast de elever som behöver skolan allra mest. Vi vill bygga ut undervisningstiden i bland annat svenska och matematik så att det finns tid till att lära sig mer. Läroplanerna ska revideras och få ett större fokus på fakta och kunskap."
  - id: L-012
    parti: L
    sida: 5
    rader: '123-127'
    lydelse: "12. Mer förskola. Vi vill bygga ut förskolan och satsa på det svenska språket. För att se till att alla barn får rätt start i livet vill vi både införa en obligatorisk språkförskola för nyanlända barn och barn till nyanlända och göra den allmänna förskolan obligatorisk från fem års ålder. Inget barn ska halka efter redan från start - därför vill vi att barn utan tillräckliga språkkunskaper alltid ska få den fördel det innebär att delta i förskolan."
  - id: L-013
    parti: L
    sida: 5
    rader: '128-129'
    lydelse: "13. En högre utbildning med högre ambitioner. Vi vill öka den lärarledda undervisningen, skärpa utvärderingen och bygga ut de utbildningar och lärosäten som håller högst kvalitet."
  - id: L-014
    parti: L
    sida: 5
    rader: '130-133'
    lydelse: "14. Fri och framstående forskning. Sverige ska ta emot Nobelpris - inte bara dela ut dem. Vi vill öka forskningsanslagen och både skapa bättre karriärvägar för yngre forskare och se riktade satsningar på att svenska universitet ska kunna locka hit världens främsta forskare. Den akademiska friheten ska ges skydd i grundlagen."
  - id: L-015
    parti: L
    sida: 6
    rader: '150-152'
    lydelse: "15. Inga utsatta områden 2030. Alla i Sverige förtjänar trygghet där de bor. Men i dag bor var tjugonde svensk - och en ännu högre andel nya svenskar - i ett utsatt område där kriminaliteten tagit över. Vårt viktigaste mål är detta: Sverige ska år 2030 inte ha ett enda utsatt område."
  - id: L-016
    parti: L
    sida: 6
    rader: '153-156'
    lydelse: "16. Stoppa separatisterna och parallellsamhällena. Islamister och kriminella klaner spär på segregationen och hotar sammanhållningen i Sverige. Vi vill ta tillbaka makten från separatister i utsatta områden, värna en skolgång fri från separatistisk påverkan och pröva möjligheten att införa vistelseförbud för dömda kriminella i utsatta områden."
  - id: L-017
    parti: L
    sida: 6
    rader: '157-160'
    lydelse: "17. Stå på de goda krafternas sida. Riktig förändring börjar underifrån. Därför ska vi stötta förortens demokrater, feminister och företagsamma människor. Det demokratiska civilsamhället i utsatta områden ska stödjas mer - särskilt kvinnors och flickors organisering. Genom att göra de 100 000 första intjänade kronorna från arbete eller företagande skattefria stärker vi de välståndsbildande krafterna i hela Sverige, men inte minst i de utsatta områdena."
  - id: L-018
    parti: L
    sida: 6
    rader: '161-164'
    lydelse: "18. Svenska språket är nyckeln till Sverige. Bristande språkkunskaper permanentar utanförskap. Därför vill vi bland annat öka kraven och kvaliteten i SFI och erbjuda fler flexibla former för undervisning, exempelvis i kombination med öppna förskolan Den som låter bli att lära sig svenska i normalfallet kunna få sitt försörjningsstöd nedsatt."
  - id: L-019
    parti: L
    sida: 7
    rader: '166-170'
    lydelse: "19. Höga krav för medborgarskap. Vi har i tjugo år argumenterat att du ska kunna svenska för att bli medborgare i Sverige. Nästa mandatperiod ska inte bara ett språktest äntligen komma på plats, utan också villkoret att du förstår hur det svenska demokratiska samhället fungerar och har förutsättningar att försörja dig. Vi ska helt enkelt ställa höga krav på den som vill bli svensk medborgare."
  - id: L-020
    parti: L
    sida: 7
    rader: '171-175'
    lydelse: "20. Integration börjar i skolan. Det finns skolor i utsatta områden där mer än varannan elev går ut nian utan tillräckliga kunskaper. För att ändra det krävs att de skolor som har tuffast förutsättning ges möjlighet att rekrytera de bästa lärarna, fler verktyg för lärare och rektor att hantera stök och oordning och sociala team på utsatta skolor som kan komma tillrätta med unga på glid."
  - id: L-021
    parti: L
    sida: 7
    rader: '176-181'
    lydelse: "21. Bekämpa hedersbrott och hedersförtryck. Parallella samhällen med odemokratiska värderingar och parallell rättsskipning får aldrig accepteras. Vi vill göra mycket mer för att alla ska få kunskap om sina rättigheter, bland annat genom obligatorisk samhällsundervisning för nyanlända. Samtidigt ska stöden till offren byggas ut, kunskapen hos yrkesverksamma öka, straffen för hedersrelaterade brott skärpas och kriminaliseringen breddas till uttryck för hederstänkande såsom oskuldskontroller och uppfostringsresor."
  - id: L-022
    parti: L
    sida: 7
    rader: '182-188'
    lydelse: "22. Mer bostadsrätter och mindre bidragsberoende. Det är områden med eftersatt underhåll, otrygga gatumiljöer och en låg andel ägt boende som blir socialt utsatta. Därför måste vi också bygga bort utsattheten med tryggare kvarter där fler kan äga sitt boende och där fastighetsägare och det offentliga samarbetar långsiktigt. Så skapas positiva spiraler där fler tar ansvar för sitt närområde i stället för att flytta därifrån så fort möjligheten ges. Kommunala bostadsbolag ska både arbeta för att fler hyresrätter i utsatta områden omvandlas till bostadsrätter och för att få fler med egen försörjning och färre med försörjningsstöd att flytta till utsatta områden."
  - id: L-023
    parti: L
    sida: 8
    rader: '204-208'
    lydelse: "23. Fler poliser med bättre betalt. Sverige har i dag färre poliser i förhållande till vår folkmängd än nästan något annat land i EU. Så kan det inte fortsätta. Därför vill vi på sikt nå 33 000 poliser så att polistätheten blir minst lika hög som i övriga Europa. För att nå dit måste det bli mer attraktivt att både bli och fortsätta som polis - därför ska villkoren ska bli bättre och lönerna höjas. Samtidigt behöver vi fler domare och fler åklagare, och fler häkten och fängelser med fler kriminalvårdare."
  - id: L-024
    parti: L
    sida: 8
    rader: '209-213'
    lydelse: "24. En grövre brottslighet kräver längre straff. Livsstilskriminella ska hållas inlåsta i stället för att släppas ut på våra gator. Vi vill avskaffa dagens mängdrabatt på brott, slopa den närmast automatiska frigivningen från fängelsestraff och skärpa straffen för bland annat vapenbrott, våldtäkt och utpressning. Ett nationellt avhopparprogram ska införas för att fler ska kunna lämna ett kriminellt liv bakom sig."
  - id: L-025
    parti: L
    sida: 8
    rader: '214-217'
    lydelse: "25. Ge polisen fler verktyg och vapen. Avlyssning och andra hemliga tvångsmedel ska kunna användas både vid misstanke om fler brott än i dag och efter domstolsbeslut mot organiserade gängmedlemmar även utan konkret brottsmisstanke. För att stoppa upplopp och kravaller ska polisen kunna använda mer effektiv och modern utrustning så att fler kan gripas och lagföras."
  - id: L-026
    parti: L
    sida: 8
    rader: '218-221'
    lydelse: "26. Stoppa kriminaliteten redan i klassrummen. En starkare skola i Sveriges utsatta områden kommer göra att färre unga glider in i kriminaliteten. Alla skolor ska stärka sitt våldspreventiva arbete. För att polis och socialtjänst alltid ska få kännedom om barn som är på fel väg i livet ska huvudregeln bli att skolan alltid gör polisanmälan och orosanmälan vid misstänkt brottslighet."
  - id: L-027
    parti: L
    sida: 9
    rader: '223-227'
    lydelse: "27. Rätt förutsättningar för förebyggande insatser. Socialtjänstens brottsförebyggande arbete hindras i dag av en lagstiftning och utbildning i otakt med tiden. Vi vill göra ungdomskriminalitet till ett obligatoriskt utbildningsmoment på socionomutbildningen och införa en specialisering för socialsekreterare med fokus på unga lagöverträdare. Polis och socialtjänst ska som huvudregel alltid kunna utbyta information sinsemellan och ska oftare dela lokaler. Kommuners brottsförebyggande arbete ska lagstadgas."
  - id: L-028
    parti: L
    sida: 9
    rader: '228-232'
    lydelse: "28. Bryt brottsbanan i tid. Tidigare, tydligare och tuffare insatser för att förebygga och förhindra att unga glider in i brottslighet måste till. Vi vill se nationella hembesöksprogram från socialtjänsten för nyblivna förstagångsföräldrar i utsatta områden, att socialtjänsten ska kunna göra fler insatser för familjer obligatoriska och att betydligt fler barn som fostras in i kriminalitet eller själva begår grova brott ska kunna omhändertas."
  - id: L-029
    parti: L
    sida: 9
    rader: '233-238'
    lydelse: "29. Inrätta ungdomsfängelser och fler särskilda boenden för unga på glid. Det ska inte som i dag råda kö till de anläggningar som ska akut ska kunna omhänderta unga våldsutövare. Vi vill inrätta särskilda fängelser så att unga kriminella både kan få bättre vård under sitt straff och hållas undan äldre brottslingar. Den maximala vårdtiden för sluten ungdomsvård ska förlängas, så att unga mördare som i dag inte ska kunna släppas fria efter fyra år. Fler unga i behov av omfattande sociala insatser ska placeras på särskilda ungdomshem."
  - id: L-030
    parti: L
    sida: 9
    rader: '239-242'
    lydelse: "30. Mäns våld mot kvinnor ska upphöra. Kvinnor ska vara trygga både hemma och ute. Vi vill se en ökad handlingskraft mot sexuellt våld och våld mot kvinnor genom bland annat högre straff för sexualbrott och ett bättre skydd och stöd för offren. Ett nationellt stöd för skyddade boenden ska införas."
  - id: L-031
    parti: L
    sida: 9
    rader: '243-246'
    lydelse: "31. Utvisa fler kriminella från Sverige. Återfall i brott ska lättare leda till utvisning för den som inte är svensk medborgare, och vid grova vålds- och sexualbrott liksom hat- eller hedersrelaterade brott ska utvisning alltid prövas. Fler som väntar på både utvisning och avvisning ska hållas i förvar. Vi ska kräva att länder som tar emot svenskt bistånd också tar emot egna medborgare som dömts för brott i Sverige."
  - id: L-032
    parti: L
    sida: 9
    rader: '247-251'
    lydelse: "32. Inrätta ett europeiskt FBI. Gränsöverskridande brottslighet måste mötas med en gränsöverskridande polis. Sverige ska delta fullt ut i EU:s brottsbekämpning och den europeiska polismyndigheten Europol ska ges ett tydligare operativt mandat att bekämpa internationell brottslighet och terrorism. Förundersökningar och brottsutredningar där flera länder berörs ska kunna bedrivas på europeisk nivå. För att stärka det yttre gränsskyddet och rättssäkerheten behöver EU på sikt helt ta över ansvaret för kontrollen av unionens yttre gränser."
  - id: L-033
    parti: L
    sida: 10
    rader: '268-270'
    lydelse: "33. Klimatmålen kräver tillväxt och teknik. Medan andra gröna partier grundades för att stoppa tillväxten vet vi att ny teknik och nya lösningar är en del av lösningen på klimatutmaningen. Vi ska nå klimatmålen - inga nettoutsläpp av växthusgaser senast 2045 och därefter negativa utsläpp inom ramen för en växande ekonomi."
  - id: L-034
    parti: L
    sida: 10
    rader: '271-274'
    lydelse: "34. Utveckla - inte avveckla - kärnkraften. Klimatomställningen kräver dubbelt så mycket el som i dag. Då kan vi inte avveckla kärnkraften. I stället vill vi möjliggöra fler nya reaktorer på fler ställen, möjliggöra återstart av Ringhals 1 och 2, se till att statliga lånegarantier omfattar kärnkraften, modernisera regelverken och ge kärnkraften betalt för att den alltid finns tillgänglig."
  - id: L-035
    parti: L
    sida: 10
    rader: '275-279'
    lydelse: "35. Billig el och pålitlig el i hela landet. Rödgrön energipolitik har lett till mångdubblade elpriser för svenska hushåll och industrier. Ska vi få ner elpriserna krävs att vi bygger inte bara kärnkraft utan också mer sol- och vindkraft i hela landet, investerar i kraftsystemet och satsar på energilagring. Vi vill både sänka elmomsen och den särskilda extraskatten på el för att mildra elprischocken här och nu."
  - id: L-036
    parti: L
    sida: 10
    rader: '280-283'
    lydelse: "36. Den som förorenar ska betala. Det är den som förorenar - ingen annan - som ska betala. Därför är vi för riktiga klimatskatter i stället för att göra klimatpolitiken till en tävling i högst bidrag och flest symbolskatter. Subventioner, inklusive skattelättnader och stöd, till fossila bränslen i Sverige såväl som globalt ska successivt avskaffas."
  - id: L-037
    parti: L
    sida: 11
    rader: '285-289'
    lydelse: "37. Den som fångar in koldioxid ska få betalt. Det brådskar att ta hand om den koldioxid som finns i atmosfären. Därför ska vi skala upp arbetet med infångning, avskiljning och lagring av koldioxid. De tekniska lösningarna finns - nu måste staten se till att den som minskar mängden växthusgaser i atmosfären också får betalt. Den naturliga koldioxidinlagringen ska stärkas genom att fler tidigare våtmarker återställs."
  - id: L-038
    parti: L
    sida: 11
    rader: '290-295'
    lydelse: "38. Elektrifiera transporterna. Fossilutsläppen från transportsektorn ska bort. Fler ska välja elbilen och en inblandning av fossilfria bränslen ska fortsätta. Det behövs laddstolpar där vi bor, arbetar och reser. Fler flygresor ska göras fossilfria och all kollektivtrafik på väg och spår ska vara fossilfri senast 2030. Vi vill bygga bort järnvägsnätets flaskhalsar och så att tågen går i tid här och nu i stället för att lägga hundratals miljarder på en höghastighetsjärnväg som inte är klar ens om 20 år."
  - id: L-039
    parti: L
    sida: 11
    rader: '296-300'
    lydelse: "39. EU - för klimatets skull. EU är världens viktigaste miljöorganisation - det är bara genom samarbete i Europa och globalt som klimatutmaningen kan mötas. Det finns två problem med rysk gas: att det är gas och att den är rysk. Det brådskar att få på plats en tidssatt plan för att fullt ut avveckla kol- och gasanvändningen i Europa. Det behövs en europeisk koldioxidskatt och klimattullar för att höja kostnaden för utsläpp, samtidigt som det europeiska klimatbiståndet ökar."
  - id: L-040
    parti: L
    sida: 11
    rader: '301-306'
    lydelse: "40. Grön politik för skogen och miljön. Sveriges fjäll, skogar och marker är fantastiska - och ska vara det också för nästa generation. Då behöver vi fortsätta arbetet med att skydda både värdefull natur och den biologiska mångfalden. Allemansrätten och det svenska skogsbruket ska värnas, samtidigt som strandskyddet reformeras så att det blir enklare att bygga strandnära på landsbygden medan skyddet upprätthålls där det finns känsliga ekosystem och högt tryck på byggande. Det kommunala vetot mot vindkraft ska bestå."
  - id: L-041
    parti: L
    sida: 11
    rader: '307-310'
    lydelse: "41. Rädda hav och vatten. Våra hav och vatten är i dåligt skick. Kampen mot övergödningen ska fortsätta, industrifisket ska begränsas och de mest värdefulla havsområdena skyddas som marina reservat. Samtidigt behövs fortsatta insatser för att förhindra att skräp och föroreningar, som plast och läkemedel, sprids i våra vatten."
  - id: L-042
    parti: L
    sida: 12
    rader: '330-335'
    lydelse: "42. Återupprätta arbetslinjen. Sverige är fortfarande ett av de länder i världen som har högst skatt på arbete. Det gör att arbete och ansträngning här lönar sig mindre - och ibland inte alls. För att stärka arbetslinjen och hushållens ekonomi i ett oroligt ekonomiskt läge vill vi skyndsamt genomföra ett nytt brett jobbskatteavdrag. För dig som studerat och tagit studielån vill vi dessutom införa en femårig CSN-paus, så att du när du vill ska kunna ta ett uppehåll från din återbetalning. På sikt vill vi permanent sänka skatten på de lägsta lönerna med minst 1 000 kronor i månaden samtidigt som marginalskatterna för alla fortsätter att minska."
  - id: L-043
    parti: L
    sida: 12
    rader: '336-337'
    lydelse: "43. Inför ett bidragstak. Det ska alltid löna sig att arbeta. Därför vill vi modernisera bidragssystemet genom ett bidragstak - de samlade bidragen ska inte kunna vara högre än de lägsta kollektivavtalade lönerna."
  - id: L-044
    parti: L
    sida: 12
    rader: '338-342'
    lydelse: "44. Ett försörjningsstöd för fler i arbete. Försörjningsstödet ska vara en hjälp på vägen vidare, inte en återvändsgränd. Vi vill införa en ny dagersättning för arbetsföra personer med ett tydligt krav på motprestation i form av anvisat arbete, språkutbildning eller annan kompetenshöjande verksamhet. Samtidigt ska dagens jobbonus förstärkas så att den som går från försörjningsstöd till arbete får behålla mer av sin inkomstökning."
  - id: L-045
    parti: L
    sida: 13
    rader: '344-347'
    lydelse: "45. Alla ska arbeta - även utrikes födda kvinnor. Fler utrikes födda kvinnor ska komma i arbete genom reformer av föräldraförsäkringen och flerbarnstillägget och ett mer individualiserat försörjningsstöd. Arbetsförmedlingen, Försäkringskassan och socialtjänsten ska bli bättre i sitt stöd men också tydligare i förväntningen på att alla som kan ska försörja sig själva."
  - id: L-046
    parti: L
    sida: 13
    rader: '348-349'
    lydelse: "46. Stå upp för Sveriges entreprenörer. Fler företagare och entreprenörer skapar fler jobb och mer välstånd. Därför vill vi att det ska bli enklare och billigare att anställa genom att arbetsgivaravgifterna sänks för både småföretagare och för dem som vill anställa unga."
  - id: L-047
    parti: L
    sida: 13
    rader: '350-355'
    lydelse: "47. Sänk skatterna på kunskap. Sveriges skattenivåer ska vara konkurrenskraftiga och lättförståeliga för att uppmuntra till företagande, utbildning och investeringar. Det gäller inte minst bolags-, kunskaps- och kapitalskatterna. Vi vill göra optionsbeskattningen internationellt konkurrenskraftig och sänka expertskatten så att svenska företag ska kunna locka hit utländska nyckelmedarbetare. Tillfälliga arbetstillstånd ska kunna ges för en längre period än i dag. Kompetensutvisningarna av högkvalificerad arbetskraft måste få ett slut. En startup-kommission ska tillsättas och skattesystemet anpassas bättre till den växande delningsekonomin."
  - id: L-048
    parti: L
    sida: 13
    rader: '356-359'
    lydelse: "48. Gynna spara i stället för slösa. I stället för att som regeringen gång på gång höja skatten på sparande vill vi sänka den. Det ska helt enkelt löna sig att ta personligt ansvar för sin egen ekonomiska framtid. Vi vill sänka skatten på investeringssparkonton genom att bland annat göra de första 300 000 kronorna på ett ISK helt skattefria."
  - id: L-049
    parti: L
    sida: 13
    rader: '360-364'
    lydelse: "49. Jobb och framtidstro i hela landet. Företagandet i hela Sverige hämmas när skatten kan vara fem, sex eller sju kronor högre per hundralapp i glesbygd än i Stockholm. Vi vill skapa mer likvärdiga villkor och skatter genom att flytta finansieringsansvaret för bland annat skolan och LSS till staten. Vägnätet ska fungera och statliga myndigheter ska finnas närvarande i alla delar av Sverige."
  - id: L-050
    parti: L
    sida: 13
    rader: '365-368'
    lydelse: "50. Fler nya bostäder och fler första bostäder. Att få uppleva frihetskänslan av en egen bostad är något många fler ska få göra. Vi vill införa en stimulans för att spara ihop till den första insatsen, slopa det förhöjda amorteringskravet, korta överklagandeprocesserna och fortsätta förenkla byggreglerna. Så får vi fler nya bostäder och fler som har råd med bostäder."
  - id: L-051
    parti: L
    sida: 13
    rader: '369-373'
    lydelse: "51. En fungerande bostadsmarknad med kortare köer. För att få upp byggandet av fler hyresrätter och korta köerna vill vi kombinera ett starkt besittningsskydd med att hyran i nybyggda hyresrätter ska få avtalas fritt mellan hyresvärd och hyresgäst. Dagens dyra byggsubventioner ska avskaffas och ett nytt system med behovsbostäder ska införas för grupper med särskilt stora bostadsbehov, såsom våldsutsatta och familjer med mycket svag ekonomi."
  - id: L-052
    parti: L
    sida: 14
    rader: '390-395'
    lydelse: "52. Fler bemannade vårdplatser i hela Sverige. Sveriges sjukhus har för små marginaler. Kompetensbristen har orsakat långa vårdköer och färre vårdplatser än våra nordiska grannländer. Vi vill därför nästa mandatperiod se en nationell kraftsamling för fler bemannade vårdplatser i hela landet så att du som patient kan få vård snabbare. För att klara det måste de som arbetar inom vården mötas av goda arbetsvillkor, fler kollegor och bra löneutveckling. Bristyrken ska bli drömjobb."
  - id: L-053
    parti: L
    sida: 14
    rader: '396-400'
    lydelse: "53. En tydligare roll för staten i sjukvården. Det behövs en bred översyn av vårdens organisering och finansiering. Staten ska ta ett större ansvar för sjukvårdens strategiska planering, placering av högspecialiserad vård, beredskap och långsiktig kompetensförsörjning. Samtidigt ska detaljstyrningen och byråkratin minska i verksamheterna. Särskilda initiativ krävs för att mödra- och förlossningsvården ska stärkas i hela Sverige."
  - id: L-054
    parti: L
    sida: 14
    rader: '401-404'
    lydelse: "54. En personlig husläkare när du behöver. Du ska ha rätt till en fast läkare på din vårdcentral som har tid för - och som lär känna - just dig. Dessutom ska de barn och vuxna som har många och täta kontakter i specialistsjukvården där också ha rätt till en fast vårdkontakt som kan guida och stötta. På så sätt blir mötet med vården både enklare, tryggare och snabbare."
  - id: L-055
    parti: L
    sida: 14
    rader: '405-407'
    lydelse: "55. Nätläkaren är här för att stanna. Vi vill se en digital valfrihetsreform och vårdgaranti där alla regioner ska åläggas att erbjuda en minst lika bra digital tillgänglighet som fysisk, där du utifrån din situation alltid ska välja hur du vill möta vården."
  - id: L-056
    parti: L
    sida: 15
    rader: '409-411'
    lydelse: "56. Laga hålen i tandvården. Tandvårdens finansiering ska steg för steg likna annan sjukvård där du som patient betalar mindre och samhället mer. Nästa steg är gradvis ökande subventionsgrad för de grupper som har sämst munhälsa och nationella tandvårdsprogram för särskilda riskgrupper."
  - id: L-057
    parti: L
    sida: 15
    rader: '412-415'
    lydelse: "57. Mer trygghet i äldreomsorgen. Vi vill att du som har hemtjänst ska ha ett eget team av omvårdnadspersonal så att du slipper möta nya ansikten varje dag. All personal ska ha tillräckliga kunskaper i det svenska språket. För att öka tryggheten vill vi ta bort förbudet för kommuner att anställa läkare i äldreomsorgen."
  - id: L-058
    parti: L
    sida: 15
    rader: '416-420'
    lydelse: "58. Återupprätta assistansen. Bristerna i dagens assistansersättning - vårt viktigaste stöd till många med funktionsnedsättning - är så allvarliga att det krävs en kriskommission. Vi vill även under nästa mandatperiod inrätta en LSS-inspektion som bevakar den enskildes rättigheter gentemot staten och får bukt med de oseriösa aktörer inom assistansen där brukare eller anställda far illa."
  - id: L-059
    parti: L
    sida: 15
    rader: '421-425'
    lydelse: "59. Högre pensioner och ett gynnat pensionssparande. Vi vill fortsätta stärka Sveriges pensionärers inkomster så att det alltid lönat sig att ha arbetat. Därför vill vi bland annat sänka skatten på pensioner, och införa en pensionsgas så att dagens och morgondagens pensionärer får del av det överskott som byggts upp i pensionssystemet. Dessutom vill vi återinföra rätten till avdrag för privat pensionssparade så att alla kan spara 1 000 kronor månaden skattefritt."
  - id: L-060
    parti: L
    sida: 16
    rader: '445-448'
    lydelse: "60. Värna den liberala demokratin. Den svenska demokratin ska stå stark och dina rättigheter ska försvaras. Vi vill se ett förstärkt grundlagsskydd för vårt demokratiska statsskick, öka domstolarnas oberoende och verka för en författningsdomstol som ska kunna häva lagar eller bestämmelser som strider mot grundlagsskyddade fri- och rättigheter."
  - id: L-061
    parti: L
    sida: 16
    rader: '449-453'
    lydelse: "61. Stärk public service och granskande medier. Mediernas oberoende roll och kritiska granskning är grunden i varje demokrati. Därför ska Sveriges Television, Sveriges Radio och Utbildningsradion ha ökat skydd i lagen för sitt oberoende från politisk styrning, och public service-bolagen ska fortsätta ha ett brett programutbud. Vi vill göra om press- och mediestödet för att främja en lokal granskande kvalitetsjournalistik i hela landet."
  - id: L-062
    parti: L
    sida: 16
    rader: '454-458'
    lydelse: "62. Försvara kulturens oberoende. Kulturpolitiken ska utgå från frihet, mångfald och kvalitet men ska inte lägga sig i innehållet i kulturen. Därför vill vi att staten ska styra mindre och att det ska vara kulturskapare och inte politiker som fattar besluten om stöd. Kulturpolitiken ska värna kulturens eget värde gentemot rena nyttoändamål. Alla barn och elever ska få läsa både svenska och internationella skönlitterära klassiker i skolan."
  - id: L-063
    parti: L
    sida: 17
    rader: '460-463'
    lydelse: "63. Skydda svensk aborträtt i grundlagen. Kvinnans rätt att bestämma över sin kropp ska skyddas i grundlagen tillsammans med andra fri- och rättigheter som yttrandefrihet, religionsfrihet och äganderätt. Sverige ska arbeta långsiktigt för att rätten till abort erkänns internationellt som en del av de mänskliga rättigheterna."
  - id: L-064
    parti: L
    sida: 17
    rader: '464-468'
    lydelse: "64. Feminism utan socialism. Jämställdheten måste fortsätta gå framåt. Vi vill se ny föräldraförsäkring som både värnar valfriheten och stärker jämställdheten på arbetsmarknaden. Vi vill öka trycket på arbetsgivare att erbjuda jämställda löner och villkor, och sänka skatten på sparande så att fler kan bygga upp en buffert. En ojämställd arbetsmarknad gör att kvinnor oftast har mycket lägre tjänstepension än män - för att öka jämställdheten vill vi därför att en större andel av pensionen, precis som bilen och huset, delas vid en skilsmässa."
  - id: L-065
    parti: L
    sida: 17
    rader: '469-473'
    lydelse: "65. Hbtqi-reformer handlar om frihet. Sverige ska vara världens bästa land att leva i som hbtqi-person. Vi vill möjliggöra altruistiskt värdmödraskap här i Sverige och underlätta för de par som i utlandet använder värdmödraskap att i här i Sverige erkännas som barnets föräldrar. Hbtqi-kompetensen i vård, skola och omsorg ska stärkas och ett lagskydd mot omvändelseterapi ska införas."
  - id: L-066
    parti: L
    sida: 17
    rader: '474-478'
    lydelse: "66. Samhället är större än staten. Samhället byggs underifrån - civilsamhället är inte ett komplement till utan en förutsättning för demokratin. Vi vill fortsätta förbättra civilsamhällets finansiering genom både bredare skatteavdrag för gåvor och långsiktiga statsbidrag. Regelverk och upphandlingar bör utformas så att det är oftare är möjligt för idéburna aktörer att bidra i välfärden."
  - id: L-067
    parti: L
    sida: 17
    rader: '479-483'
    lydelse: "67. Säkra demokratin mot separatisterna. När Säpo säger att flera organisationer från extremistmiljöer finansieras av skattepengar måste mycket mer göras. Vi vill både stärka uppföljningen av bidragsgivning och stoppa dold finansiering av trossamfund så att de inte blir verktyg för extremistiska krafter. Socialsekreterare och andra offentliganställda ska skyddas mot förföljelse och utsatthet genom att ett nytt brott - tjänstemannaförföljelse - införs."
  - id: L-068
    parti: L
    sida: 17
    rader: '484-487'
    lydelse: "68. En human och långsiktigt hållbar migrationspolitik. Människor som flyr krig och förföljelse ska få skydd. Asylrätten ska värnas där den med asylskäl ska stanna och den utan skäl lämnar landet. Ska integrationen lyckas måste Sverige få en migrationspolitik med en lagstiftning i linje med andra EU-länder."
  - id: L-069
    parti: L
    sida: 17
    rader: '488-491'
    lydelse: "69. Din bakgrund ska inte avgöra din framtid. Rättigheter och möjligheter ska vara lika för alla i Sverige. Därför ska staten med kraft bekämpa all slags rasism, diskriminering och intolerans. Vi vill modernisera diskrimineringslagen, prioritera polisens hatbrottsverksamhet och säkerställa att alla skolor står upp för alla människors lika värde."
  - id: L-070
    parti: L
    sida: 18
    rader: '509-515'
    lydelse: "70. Ja till Nato sedan 1999. I dag skapas trygghet i allianser, inte i allianslöshet. Därför ska Sverige gå med i Nato och tillsammans med USA, Kanada och våra europeiska grannar försvara både Sverige och vår del av världen. Vi har arbetat för ett svenskt Natomedlemskap i årtionden och tänker inte låta rödgröna Natomotståndare stoppa ett svenskt medlemskap. Sverige ska inom Nato särskilt kunna bidra med den infrastruktur som behövs för att skapa ett nödvändigt och strategiskt djup för försvaret av Finland och Baltikum. Globalt behöver försvarsalliansen vidare stärka sitt arbete mot hotet från Kina. Ensam är inte stark utan bara ensam."
  - id: L-071
    parti: L
    sida: 18
    rader: '516-521'
    lydelse: "71. Stärk försvaret av Sverige. Sverige behöver ett betydligt starkare militärt försvar än i dag. Vi vill därför redan 2025 se ett försvarsanslag om 2 procent av BNP och därmed skapa tillräckliga förutsättningar att stärka både armen, marinen och flygvapnet. Antalet anställda och värnpliktiga i krigsorganisationen ska öka, ny materiel tillföras och det civila försvaret stärkas i samma takt som det militära. För att stärka Sveriges samlade försvarsförmåga ska fler vapenföra än i dag genomgå en grundläggande militär utbildning."
  - id: L-072
    parti: L
    sida: 18
    rader: '522-527'
    lydelse: "72. Stå upp mot Ryssland. Sverige ska helhjärtat stödja Ukraina i att Rysslands oprovocerade anfallskrig måste sluta i fullständig rysk militär reträtt. Med det ryska anfallskriget mot Ukraina - detta angrepp mot hela Europa - är hotet mot vår säkerhetsordning akut. Sverige ska vara pådrivande för att så breda globala koalitioner som möjligt bygger ut en så heltäckande sanktionsregim mot Ryssland som möjligt. En ny regering ska vara garanten för att Ukraina ges ökat ekonomiskt, politiskt och militärt stöd."
  - id: L-073
    parti: L
    sida: 19
    rader: '529-533'
    lydelse: "73. Ja till Europa. Europa behöver mer - inte mindre - samarbete. Inte minst vill vi öka de europeiska klimatambitionerna samt se en tätare samverkan mot inre och yttre hot. Vi ska stärka EU som frihandelsunion med en fördjupad inre marknad, värna den fria rörligheten i Europa och verka för fler frihandelsavtal med omvärlden. Sverige ska verka för ett snabbspår för ukrainskt EU-medlemskap och ge landet stöd i att nå de villkor som då måste uppfyllas."
  - id: L-074
    parti: L
    sida: 19
    rader: '534-537'
    lydelse: "74. En friare värld är möjlig. Liberalernas frihetskamp börjar i våra värderingar. Målet med vår utrikespolitik är en friare värld för alla. Därför vill vi att Sverige gör mycket mer, både som enskilt land och inom internationella samarbeten, för fri- och rättigheter, frihandel, fria val och samarbete i den fria världen. Vi kallar det för vad det är: en ny värderingsstyrd utrikespolitik."
  - id: L-075
    parti: L
    sida: 19
    rader: '538-544'
    lydelse: "75. Handel och bistånd för demokrati. Biståndet spelar en viktig roll i en orolig värld. Därför vill vi att det svenska biståndet ska uppnå till en procent av BNI. Samtidigt finns i dag allvarliga problem med bristande öppenhet och korruption med svenska biståndspengar. Den svenska biståndspolitiken måste genomgå stora reformer med fokus på demokrati, jämställdhet och minskad korruption. Handels- och främjandepolitiken ska stärka Sverige som aktör för en friare värld och dra nytta av frihandelns fördelar utan den naivitet som alltför länge uppvisats för kinesisk och rysk maktpolitik."

