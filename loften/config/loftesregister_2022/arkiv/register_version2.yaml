poster:
  - id: S-001
    parti: S
    sida: 4
    rader: '81-84'
    lydelse: "Kraftigt öka antalet poliser på våra gator och torg. Vi vill säkra och stärka polisnärvaron i hela landet. Polisen behöver också fler verktyg, som bättre möjligheter till avlyssning och husrannsakan. Sekretesshinder mellan myndigheter ska rivas så att polisen och andra yrkesgrupper kan göra sitt jobb."
  - id: S-002
    parti: S
    sida: 4
    rader: '85-86,89-92'
    lydelse: "Skärpa straffen för att hålla de kriminella borta från gatorna. Vi vill skärpa straffen bland annat för gängrelaterad brottslighet, för den som begår upprepade och allvarliga brott och för den som understödjer organiserad kriminalitet. Vi vill fördubbla straffet för grova vapenbrott."
  - id: S-003
    parti: S
    sida: 5
    rader: '93-97'
    lydelse: "Slå hårt mot den organiserade brottslighetens finansiering och organisation. Vi vill ta krafttag mot införsel av vapen och narkotika, bland annat genom stärkt gränskontroll. Skattefusk, välfärdsbrottslighet och penningtvätt ska stoppas."
  - id: S-004
    parti: S
    sida: 5
    rader: '98-103'
    lydelse: "Ingen ung ska bli kriminell. Nyrekryteringen måste stoppas. Vi vill se fler och mer långtgående sociala insatser och föräldrar ska vara skyldiga att medverka när deras barn behöver socialtjänstens åtgärder. Det behövs mer samarbete mellan polis, elevhälsa, socialtjänst och skola."
  - id: S-005
    parti: S
    sida: 5
    rader: '104-109'
    lydelse: "Krafttag mot arbetslivskriminaliteten. Arbetslivskriminalitet ska inte finnas på svensk arbetsmarknad och offentliga arbetsgivare och upphandlare ska vara föredömen i att verka för en sund konkurrens. Det ska aldrig löna sig att begå brott eller skaffa sig konkurrensfördelar genom att försumma de anställdas rätt till en trygg arbetsmiljö."
  - id: S-006
    parti: S
    sida: 5
    rader: '110-114'
    lydelse: "Krafttag för att stoppa hedersrelaterat våld, sexualbrott och mäns våld mot kvinnor. Vi vill fortsätta den politiska riktning som skärpt straffen för våld och andra kränkningar i nära relationer, och som ökat resurserna till kvinno- och tjejjourernas viktiga arbete."
  - id: S-007
    parti: S
    sida: 5
    rader: '129-135'
    lydelse: "Bekämpa både brotten och brottens orsaker. För varje krona som läggs på fler poliser, ska minst en krona läggas på det förebyggande arbetet. Avgörande för att bryta nyrekryteringen är det viktiga arbete som personal inom skola, socialtjänst och civilsamhälle utför. Alla barn ska ha goda förebilder - inte omges av kriminella. Att socialtjänsten stärks är centralt för att fånga upp unga i tid."
  - id: S-008
    parti: S
    sida: 5
    rader: '136-138,141-146'
    lydelse: "Håll barn borta från kriminalitet och se till att de hamnar rätt från början. Förskola, skola och fritids är de bästa verktygen vi har för att lyfta barn ur dysfunktionella miljöer och ge dem en bättre framtid. Det ger mer tid till att lyckas med språket och skolarbetet. De mest utsatta skolorna och förskolorna måste få mer resurser. Tillgången till fritidsaktiviteter till rimliga kostnader, både vad gäller idrott och kultur, behöver öka. Föräldrarnas plånbok ska inte avgöra."
  - id: S-009
    parti: S
    sida: 6
    rader: '147-156'
    lydelse: "Gå till botten med orsakerna till boendesegrega tionen. Vi har stramat åt migrationspolitiken, och denna linje ligger fast. Alla kommuner, även de välbeställda, ska ta sin del av ansvaret. Asylsökande ska inte längre ha möjlighet att själva välja var de ska bo. Segregationen bryts inte med särlösningar för resurssvaga. Boende- och upplåtelseformer ska vara blandade. Trångboddheten ska bekämpas. Vi ska fortsätta att bygga hyresrätter som vanligt folk har råd att bo i."
  - id: S-010
    parti: S
    sida: 6
    rader: '157-161'
    lydelse: "Arbetskraftsinvandringen ska begränsas. I första hand ska arbetslösa i Sverige komma i arbete. Dessutom leder dagens arbetskraftsinvandring ofta till att människor utnyttjas. Vi vill införa en arbetsmarknadsprövning. Samtidigt behöver vi bättre säkra tillgången till högutbildad arbetskraft i bristyrken."
  - id: S-011
    parti: S
    sida: 6
    rader: '162-165,168-177'
    lydelse: "Alla som kan jobba ska jobba och bidra för att bli en del av samhället. Det gäller oavsett var man är född. Att lära sig god svenska, delta i arbetsmarknadsinsatser och studier är centralt. Barn ska ha goda förebilder och se båda sina föräldrar gå till jobbet. Fler insatser krävs för att utlandsfödda kvinnor ska komma i arbete och vi säger nej till alla förslag om vårdnadsbidrag eller barnomsorgspeng, som låser fast utlandsfödda kvinnor i hemmet. Det bör även ställas språkkrav för att få permanent uppehållstillstånd. Att kunna lära sig ett yrke parallellt med studier i svenska är ytterligare ett sätt att öka chansen att få jobb. Vi vill införa språkkrav för anställda inom förskola och äldreomsorg, med möjlighet till språkutbildning för den som inte har tillräckliga kunskaper. För att ingen ska fastna i passivitet behöver det ställas krav på aktivitet för att få försörjningsstöd. Diskrimineringen på arbetsmarknaden ska motarbetas."
  - id: S-012
    parti: S
    sida: 7
    rader: '196-207'
    lydelse: "Ta tillbaka kontrollen över skolan. Skolan ska vara till för barnen, inte ägarna. Vi vill förbjuda vinstuttagen i skolan och ta tillbaka kontrollen över var och när fristående skolor etablerar sig. Bara så kan vi sätta fokus på skolans kunskapsuppdrag. Vi vill ge alla elever samma möjlighet att välja skola, genom ett gemensamt skolval, slopad kötid och oberoende skolinformation. Skolpengen måste bli rättvisare så att fristående skolor inte överkompenseras på ett sätt som går ut över elever i kommunala skolor. Samhället ska ha full insyn i alla skolor genom offentlighetsprincipen. Religiös påverkan ska inte finnas i skolan. Därför vill vi förbjuda nya religiösa friskolor."
  - id: S-013
    parti: S
    sida: 7
    rader: '208-216'
    lydelse: "Ta tillbaka kontrollen över vården. Den som har en privat sjukvårdsförsäkring ska inte kunna få bättre eller snabbare hjälp i den offentligfinansierade vården. Inga akutsjukhus ska säljas ut. Privata vårdgivare ska vara skyldiga att bidra med personal och vårdplatser i händelse av kris eller krig. Privata vårdgivare ska också erbjuda verksamhetsförlagd utbildning till personalen. Offentlighetsprincipen ska gälla även privat vård och omsorg."
  - id: S-014
    parti: S
    sida: 8
    rader: '228-235'
    lydelse: "Ingen ska behöva känna oro över att få vård i tid. Om en region inte uppfyller vårdgarantin enligt lagen ska vård erbjudas i en annan region. Tillsynen av sjukvården ska växlas upp för att garantera kvaliteten. Vi vill korta väntetiderna om man ringer 1177 och göra webbtjänsten mer lättöverskådlig. För att säkra kvaliteten, hindra att råd ges av ekonomiska skäl och att förhindra att känsliga uppgifter hamnar i fel händer, vill vi att 1177 drivs i offentlig regi."
  - id: S-015
    parti: S
    sida: 8
    rader: '236-241'
    lydelse: "Stoppa stöket i klassrummen. Skolan ska ge varje barn möjlighet att lyckas utifrån sina förutsättningar. För det krävs mer resurser och att resurserna stannar i skolan genom ett stopp för marknadsskolan. Lärare och annan personal i skolan ska omedelbart kunna ingripa vid stök och oro."
  - id: S-016
    parti: S
    sida: 8
    rader: '242-243,246-250'
    lydelse: "Det ska vara tryggt att åldras i Sverige. Vi vill att alla med hemtjänst ska ha en fast omsorgskontakt för ökad trygghet. Fler ska utbildas och anställas inom äldreomsorgen och tillsynen av personalens arbetsmiljö ska förbättras. Vi vill ha en ny äldreomsorgslag som säkerställer att alla får en lika bra omsorg i hela landet och tillgång till sjuksköterskor dygnet runt. Vi vill fortsätta satsningen på att anställda inom äldreomsorgen ska kunna utbildas på arbetstid."
  - id: S-017
    parti: S
    sida: 9
    rader: '251-258'
    lydelse: "Personer med funktionsnedsättning ska kunna leva sitt liv som andra. Arbete och sysselsättning är centralt för delaktigheten i samhället. Vi ska säkra rätten till personlig assistans och arbeta vidare med förslagen om att förbättra sjukersättningen. Vinstjakten inom assistansen ska motverkas, liksom att brukare eller personliga assistenter utnyttjas i kriminella syften. Vi vill se mer individuellt utformade insatser för att skapa jobb eller utbildning för personer med funktionsnedsättningar."
  - id: S-018
    parti: S
    sida: 9
    rader: '259-270'
    lydelse: "Sverige ska ha ett levande, fritt och obundet kultur liv som både stärker samhörigheten och utmanar. Skolbiblioteken har en central roll att spela för ökad läskunnighet. Vi vill stärka kulturskolan för att säkra alla barns möjligheter till kulturella aktiviteter, och genomföra särskilda satsningar i resurssvaga områden. Folkbildning ger stark demokrati och möjligheter till personlig utveckling vid sidan av den formella utbildningen. Vi vill grundlagsskydda public service. Mediestödet ska ge förutsättningar för oberoende och lokalt förankrad nyhetsförmedling i hela landet."
  - id: S-019
    parti: S
    sida: 9
    rader: '282-293'
    lydelse: "Öka resurserna till välfärden i hela landet. Vi vill fortsätta öka statens bidrag till kommuner och regioner. Stora skattesänkningar omöjliggör det. Villkor ska ställas så att pengarna till välfärden verkligen går till dess medarbetare - inte mer byråkrati. För att säkra välfärden i hela landet behöver vi se över skatteutjämningssystemet, så att det garanterar offentlig service av hög kvalitet i hela landet, även i små kommuner som kämpar med sitt befolkningsunderlag. Staten ska finnas närvarande i hela landet. Arbetsvillkoren i välfärden måste spegla hur centrala jobben är för att samhället ska fungera. Vi vill att välfärden ska gå före och att fler ska kunna arbeta heltid i fasta jobb."
  - id: S-020
    parti: S
    sida: 10
    rader: '296-305'
    lydelse: "Säkerställ att det finns utbildad personal att anställa. Staten har ett ansvar för att säkra kompetensförsörjningen, inte minst i välfärden. Det ska finns en starkare koppling mellan de utbildningar som erbjuds och de behov av personal som finns i samhället. Det gäller både på gymnasiet och i den högre utbildningen. Vi vill se ett språklyft för barnomsorgen och mer stöd till specialistutbildningar i vården, exempelvis för sjuksköterskor och undersköterskor. Genom språkkrav och utbildningsinsatser vill vi säkerställa att alla som jobbar i välfärden talar god svenska."
  - id: S-021
    parti: S
    sida: 10
    rader: '316-319,322-326'
    lydelse: "En pension det går att leva på. Vårt mål är att alla ska få minst 70 procent av slutlönen i pension. För att det ska vara möjligt måste pensionsavgiften höjas. Vi vill också införa en gas i pensionssystemet. Det innebär att pensionen blir högre när det uppstår överskott i pensionssystemet. Vi står upp för trygghetspensionen, som utmanas av krafter från höger, och vill förbättra pensionstillägget så att fler får ta del av det och så att det bättre lönar sig att ha arbetat."
  - id: S-022
    parti: S
    sida: 11
    rader: '327-334'
    lydelse: "Sverige ska ha trygga försäkringar byggda på tan ken om plikt och rätt. En stark a-kassa ger trygghet i vardagen, stärker löntagares ställning på arbetsmarknaden och hjälper till att stabilisera samhällsekonomin genom lågkonjunkturer. Därför vill vi permanenta den höjda ersättningen i arbetslöshetsersättningen. Också vid sjukdom är det nödvändigt med större ekonomisk trygghet. Våra förbättringar av trygghetssystemen står på spel i höstens val - och vi slår vakt om principen att den som är för sjuk för att arbeta ska kunna lita på sjukförsäkringen."
  - id: S-023
    parti: S
    sida: 11
    rader: '335-339'
    lydelse: "Minska orättvisan i karensen. Karensavdraget skapar en ekonomisk orättvisa som slår hårt mot LO-förbundens medlemmar och andra som fysiskt måste vara på jobbet. Därför vill vi under nästa mandatperiod genomföra en miljardreform för att förändra karensavdraget och öka rättvisan för alla som inte kan jobba hemifrån."
  - id: S-024
    parti: S
    sida: 11
    rader: '355-356'
    lydelse: "Politiken måste ta ett större ansvar. Det klimatpolitiska ramverket ska ligga fast. Genom statliga investeringar kan vi öka takten i industrins omställning och underlätta ett klimatsmart liv."
  - id: S-025
    parti: S
    sida: 11
    rader: '357-362,365-370'
    lydelse: "Gör det möjligt att leva och resa klimatvänligt. Klimatkrisen kan aldrig lösas med att skuldbelägga människor som behöver ta bilen till affären - det är helt nödvändigt i stora delar av vårt land. Vi vill dubbla antalet laddstolpar till 2030 för att underlätta för den som har elbil. Genom massiva investeringar i både ny och befintlig järnväg kommer fler att kunna resa klimatsmart med tåg. Ett nytt reseavdrag ska förbättra möjligheterna att få avdrag också för mer klimatsmarta resor, och med rättvisare landsbygdsprofil. Vi vill ge möjligheten till gymnasieelever och studenter att resa avgiftsfritt i kollektivtrafiken under sommaren."
  - id: S-026
    parti: S
    sida: 12
    rader: '371-374'
    lydelse: "Säkra tillgången till bränsle. Bensin- och dieselpriserna har ökat kraftigt till följd av Rysslands invasion av Ukraina. Vi vill öka den svenska produktionen av förnybara drivmedel, så att det blir lättare att tanka fossilfritt i Sverige."
  - id: S-027
    parti: S
    sida: 12
    rader: '383-394'
    lydelse: "Bygg ut elproduktionen av alla slag. Vindkraft långt ute till havs kan bidra med mycket energi. Kommuner som medverkar till utbyggnad av vindkraftverk ska kunna få ekonomiskt stöd. Vi behöver också värna vattenkraften och se till att solpanelerna blir fler, bland annat på offentliga och kommersiella byggnader. Kärnkraften är en viktig del av svensk elproduktion och kommer att så vara under lång tid framöver. Vi ser positivt på de initiativ som nu tas för att undersöka potentialen framåt i samtliga energislag. Efter valet vill vi se en ny energiöverenskommelse för Sveriges bästa, och vill därför föra energipolitiska samtal med andra partier om allt från vindkraft till kärnkraft."
  - id: S-028
    parti: S
    sida: 12
    rader: '395-402'
    lydelse: "Riv de byråkratiska hindren för mer el. Långsamma tillståndsprocesser ska snabbas på. Vi vill minst fördubbla takten i utbyggnaden av elnätet. Samtidigt är det viktigt att kostnaderna för utbyggnaden av elnätet är rimliga för elkunderna, oavsett var i landet man bor. En översyn av indelningen av elprisområden ska göras. Vi vill se till att intäkterna från kapacitetsavgifter som inte används för nätinvesteringar används både för att minska prisskillnaderna och sänka kostnaderna."
  - id: S-029
    parti: S
    sida: 12
    rader: '403-408'
    lydelse: "Underlätta familjers energieffektivisering. Det finns stora vinster i att energieffektivisera sitt hem, både för samhället i stort och för den egna ekonomin. Takten behöver därför öka och kunskapen om hur rot-avdraget kan användas för energieffektivisering behöver breddas. Vi vill underlätta för fastighetsägare att vidta åtgärder för att spara energi i flerfamiljshus."
  - id: S-030
    parti: S
    sida: 13
    rader: '424-427'
    lydelse: "Öka de gröna statliga investeringarna. En del av de investeringar som minskar utsläpp och skapar jobb tycker marknaden är för riskfyllda. Genom att staten tar en del av risken kan de gröna investeringarna öka. Vi vill utöka de gröna kreditgarantierna."
  - id: S-031
    parti: S
    sida: 13
    rader: '428-431'
    lydelse: "Stärk beredskapen mot extremväder. Annars riskerar skyfall att svämma över städer, torka slå ut hela skördar och skogsbränder att breda ut sig. Vi vill fortsätta de stora investeringarna så att kommunerna kan klimatanpassa lokalt."
  - id: S-032
    parti: S
    sida: 13
    rader: '432-439'
    lydelse: "Exportera klimatsmarta lösningar och driv på andra länder. Sverige ska vara en stark kraft i FN och EU för att världens länder ska öka sina åtaganden för att göra verklighet av Parisavtalets ambitioner. Klimatfrågan är en global utmaning som kräver internationellt ansvarstagande, men också att vi är med och stöttar andra länder att ställa om. Därför vill vi dubblera klimatbiståndet. Vi ska verka för att ett globalt koldioxidpris införs med principen att förorenaren betalar. Det behövs också ett tak för hur mycket mer koldioxid som kan släppas ut i atmosfären."
  - id: S-033
    parti: S
    sida: 14
    rader: '463-469'
    lydelse: "Arbete är grunden för den ekonomiska politiken. Full sysselsättning är vårt övergripande mål. Ju fler människor som har ett jobb att gå till desto mindre kommer de ekonomiska klyftorna att vara. Människors arbete är Sveriges främsta tillgång. Arbete ger individen självständighet och frihet att forma sitt eget liv. En aktiv arbetsmarknadspolitik för fler jobb är särskilt viktig i ekonomiskt oroliga tider."
  - id: S-034
    parti: S
    sida: 14
    rader: '470-474'
    lydelse: "Minska trycket på elpriserna genom en snabbt utbyggd elproduktion. Det hjälper oss att stabilisera de energipriser som driver på inflationen. Vi är också beredda att göra ytterligare insatser vid fortsatt höga priser."
  - id: S-035
    parti: S
    sida: 14
    rader: '475-481'
    lydelse: "Stöd till de som drabbas hårdast av prisökningarna. Med riktade och smarta stöd kan vi stötta människor utan att driva på inflationen. Vi är beredda att stärka ekonomin för Sveriges barnfamiljer. Vi vill se höjda pensioner, billigare arbetsresor för dem som har långt till jobbet, avgiftsfri kollektivtrafik för gymnasieelever och studenter på sommaren och en fortsatt stark a-kassa och sjukförsäkring."
  - id: S-036
    parti: S
    sida: 14
    rader: '482-488'
    lydelse: "Garantera trovärdigheten för svensk ekonomi. Socialdemokraterna kommer aldrig att medverka till att underminera Sveriges ekonomi. Vi har sett till att Sverige har en låg statsskuld och ett starkt ekonomiskt manöverutrymme. Vi värnar Riksbankens oberoende och ansvar för att stabilisera den allmänna prisnivån och tror på parternas förmåga att ta ansvar för lönebildningen. Vi står upp för det finanspolitiska ramverket och vill utveckla det för att möta vår tids samhällsproblem. För att frigöra mer utrymme för nödvändiga investeringar vill vi övergå till ett balansmål."
  - id: S-037
    parti: S
    sida: 14
    rader: '489-493'
    lydelse: "Stärk de långsiktiga förutsättningarna för före tagande och innovation. Inflationen och den ekonomiska osäkerheten riskerar att skada svensk konkurrenskraft. Vi vill satsa på grön teknik, digitalisering och utbildning så att företagsklimatet stärks och kompetensförsörjningen förbättras."
  - id: S-038
    parti: S
    sida: 15
    rader: '512-514'
    lydelse: "Sverige ska gå med i Nato. Ett svenskt medlemskap i Nato är den bästa vägen för vårt lands säkerhet och Sverige har därför lämnat in sin medlemsansökan."
  - id: S-039
    parti: S
    sida: 15
    rader: '523-531'
    lydelse: "Kraftfullt stärka Sveriges militära förmåga. Anslagen till det militära försvaret ska öka till motsvarande två procent av BNP. Det ska ske så fort det är praktiskt möjligt och senast år 2028. Vi vill att ökningen ska omsättas i bland annat fler värnpliktiga, modern materiel samt förstärkt militär närvaro över hela landet. Vi vill införa en beredskapsskatt för de allra rikaste. Vi vill fortsätta internationella samarbeten och utveckla cyberförsvaret och underrättelseförmågan."
  - id: S-040
    parti: S
    sida: 15
    rader: '532-538'
    lydelse: "Rusta upp det civila försvaret. Arbetet att förstärka det civila försvaret och krisberedskapen måste fortsätta, bland annat genom ökade resurser för att rusta och bygga beredskapslager för sjukvården och öka beredskapen i transportsektorn. Arbetet för att stärka förmågan att stå emot cyberattacker och desinformation ska stärkas."
