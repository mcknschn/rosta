poster:
  - id: S-001
    parti: S
    sida: 3
    rader: '22-23'
    lydelse: "Sverige är ett fantastiskt land. Här finns alla förutsättningar för att leva ett gott liv: friheten, resurserna och omsorgen om varandra. Starka värderingar om jämlikhet, jämställdhet och en respekt mellan människor."
  - id: S-002
    parti: S
    sida: 3
    rader: '24-30'
    lydelse: "Det handlar om noggrannhet, pliktkänsla, solidaritet och det sunda förnuftet. Vårt land genomsyras av en känsla av att rätt ska vara rätt. Vi är lika inför lagbokens paragrafer och i våra myndigheter arbetar plikttrogna tjänstemän med hög integritet. När Sverige är som bäst får alla komma till sin rätt, alla är med och bidrar och ingen lämnas efter."
  - id: S-003
    parti: S
    sida: 3
    rader: '31-36'
    lydelse: "I Sverige ställer vi upp för varandra. Vi lämnar nyckeln till grannen för att få blommorna vattnade när vi åker på semester. Vi hjälps åt att sälja kakor så att barnens fotbollslag kan åka på turnering. Och självklart betalar vi gemensamt för okända medmänniskors förlossning, strålbehandling och insulinsprutor."
  - id: S-004
    parti: S
    sida: 3
    rader: '37-44'
    lydelse: "Hela vårt samhälle bygger på de här värderingarna. Före oss har andra svenskar skapat det här landet genom strävsamhet och hårt arbete. Grunden i den svenska modellen och målet med den ekonomiska politiken är full sysselsättning. På bara några generationer har vi byggt Sverige från trångboddhet och utedass till välstånd och betald semester. Och vi har byggt in värderingarna om gemenskap och tillit. I Sverige har viktiga jämställdhetsreformer som förskola och föräldraförsäkring möjliggjort kvinnors självständighet och frihet."
  - id: S-005
    parti: S
    sida: 3
    rader: '45-53'
    lydelse: "Men vårt land har också problem. Det handlar om gängkriminalitet och våld som sätter skräck i hela bostadsområden, en sönderprivatisering av välfärden som skapar klyftor mellan människor och delar av vårt land, och klimatutsläpp som hotar liv och hälsa. Rysslands brutala invasion av Ukraina har chockat en hel värld. Det medför ett enormt lidande och skapar också ekonomisk osäkerhet i hela världen, med prisökningar som slår hårt också mot svenska familjers plånböcker. Det kommer att krävas mer av oss alla."
  - id: S-006
    parti: S
    sida: 3
    rader: '54-60'
    lydelse: "Vi socialdemokrater står för ett ansvarstagande ledarskap för Sverige - både i kris och i medgång. Coronapandemin och det fruktansvärda kriget i Ukraina har än en gång visat att ensam inte är stark, utan att vår tids stora utmaningar måste mötas tillsammans. Det ansvaret är vi beredda att axla också framöver. Samhället ska flytta fram positionerna för att ta tillbaka kontrollen över utvecklingen. Tillsammans kan vi göra vårt Sverige bättre."
  - id: S-007
    parti: S
    sida: 3
    rader: '61-62'
    lydelse: "Det här är vår plan för de kommande fyra åren för att lösa de största samhällsproblemen."
  - id: S-008
    parti: S
    sida: 4
    rader: '70-75'
    lydelse: "Den grova brottsligheten undergräver den svenska tryggheten och den unika tillit vi svenskar har till varandra. Kriminella gäng sätter hela bostadsområden i skräck med skjutningar och narkotikaförsäljning på öppen gata. Barn och ungdomar utsätts för förnedringsrån och våld, ofta av andra unga. Stöldligor skapar oro i hela landet."
  - id: S-009
    parti: S
    sida: 4
    rader: '76-79'
    lydelse: "Det är inte värdigt Sverige. Kampen mot kriminaliteten ska vara kompromisslös. Samhällets fulla kraft ska mobiliseras för att trycka tillbaka de kriminella, kapa återväxten in i kriminaliteten och öka tryggheten."
  - id: S-010
    parti: S
    sida: 4
    rader: '81-84'
    lydelse: "Kraftigt öka antalet poliser på våra gator och torg. Vi vill säkra och stärka polisnärvaron i hela landet. Polisen behöver också fler verktyg, som bättre möjligheter till avlyssning och husrannsakan. Sekretesshinder mellan myndigheter ska rivas så att polisen och andra yrkesgrupper kan göra sitt jobb."
  - id: S-011
    parti: S
    sida: 4
    rader: '85-86,89-92'
    lydelse: "Skärpa straffen för att hålla de kriminella borta från gatorna. Vi vill skärpa straffen bland annat för gängrelaterad brottslighet, för den som begår upprepade och allvarliga brott och för den som understödjer organiserad kriminalitet. Vi vill fördubbla straffet för grova vapenbrott."
  - id: S-012
    parti: S
    sida: 5
    rader: '93-97'
    lydelse: "Slå hårt mot den organiserade brottslighetens finansiering och organisation. Vi vill ta krafttag mot införsel av vapen och narkotika, bland annat genom stärkt gränskontroll. Skattefusk, välfärdsbrottslighet och penningtvätt ska stoppas."
  - id: S-013
    parti: S
    sida: 5
    rader: '98-103'
    lydelse: "Ingen ung ska bli kriminell. Nyrekryteringen måste stoppas. Vi vill se fler och mer långtgående sociala insatser och föräldrar ska vara skyldiga att medverka när deras barn behöver socialtjänstens åtgärder. Det behövs mer samarbete mellan polis, elevhälsa, socialtjänst och skola."
  - id: S-014
    parti: S
    sida: 5
    rader: '104-109'
    lydelse: "Krafttag mot arbetslivskriminaliteten. Arbetslivskriminalitet ska inte finnas på svensk arbetsmarknad och offentliga arbetsgivare och upphandlare ska vara föredömen i att verka för en sund konkurrens. Det ska aldrig löna sig att begå brott eller skaffa sig konkurrensfördelar genom att försumma de anställdas rätt till en trygg arbetsmiljö."
  - id: S-015
    parti: S
    sida: 5
    rader: '110-114'
    lydelse: "Krafttag för att stoppa hedersrelaterat våld, sexualbrott och mäns våld mot kvinnor. Vi vill fortsätta den politiska riktning som skärpt straffen för våld och andra kränkningar i nära relationer, och som ökat resurserna till kvinno- och tjejjourernas viktiga arbete."
  - id: S-016
    parti: S
    sida: 5
    rader: '117-124'
    lydelse: "Sverige hade under lång tid en stor migration, samtidigt som integrationen inte har fungerat tillräckligt bra. Parallellt med detta har de ekonomiska klyftorna vuxit. Resultatet är segregation och fattigdom som driver normlöshet och våld. Barn som växer upp i dessa områden har ett sämre utgångsläge redan från början - i vissa områden är det för få som pratar svenska och går till jobbet. De kriminella gängen utnyttjar hänsynslöst situationen och drar in barn och unga i sin våldsfyllda verklighet."
  - id: S-017
    parti: S
    sida: 5
    rader: '125-127'
    lydelse: "Så ska det inte vara. Vårt lands värderingar bygger på gemenskap, tillit och jämlikhet. Integrationen måste förbättras och samhörigheten öka."
  - id: S-018
    parti: S
    sida: 5
    rader: '129-135'
    lydelse: "Bekämpa både brotten och brottens orsaker. För varje krona som läggs på fler poliser, ska minst en krona läggas på det förebyggande arbetet. Avgörande för att bryta nyrekryteringen är det viktiga arbete som personal inom skola, socialtjänst och civilsamhälle utför. Alla barn ska ha goda förebilder - inte omges av kriminella. Att socialtjänsten stärks är centralt för att fånga upp unga i tid."
  - id: S-019
    parti: S
    sida: 5
    rader: '136-138,141-146'
    lydelse: "Håll barn borta från kriminalitet och se till att de hamnar rätt från början. Förskola, skola och fritids är de bästa verktygen vi har för att lyfta barn ur dysfunktionella miljöer och ge dem en bättre framtid. Det ger mer tid till att lyckas med språket och skolarbetet. De mest utsatta skolorna och förskolorna måste få mer resurser. Tillgången till fritidsaktiviteter till rimliga kostnader, både vad gäller idrott och kultur, behöver öka. Föräldrarnas plånbok ska inte avgöra."
  - id: S-020
    parti: S
    sida: 6
    rader: '147-156'
    lydelse: "Gå till botten med orsakerna till boendesegrega tionen. Vi har stramat åt migrationspolitiken, och denna linje ligger fast. Alla kommuner, även de välbeställda, ska ta sin del av ansvaret. Asylsökande ska inte längre ha möjlighet att själva välja var de ska bo. Segregationen bryts inte med särlösningar för resurssvaga. Boende- och upplåtelseformer ska vara blandade. Trångboddheten ska bekämpas. Vi ska fortsätta att bygga hyresrätter som vanligt folk har råd att bo i."
  - id: S-021
    parti: S
    sida: 6
    rader: '157-161'
    lydelse: "Arbetskraftsinvandringen ska begränsas. I första hand ska arbetslösa i Sverige komma i arbete. Dessutom leder dagens arbetskraftsinvandring ofta till att människor utnyttjas. Vi vill införa en arbetsmarknadsprövning. Samtidigt behöver vi bättre säkra tillgången till högutbildad arbetskraft i bristyrken."
  - id: S-022
    parti: S
    sida: 6
    rader: '162-165,168-177'
    lydelse: "Alla som kan jobba ska jobba och bidra för att bli en del av samhället. Det gäller oavsett var man är född. Att lära sig god svenska, delta i arbetsmarknadsinsatser och studier är centralt. Barn ska ha goda förebilder och se båda sina föräldrar gå till jobbet. Fler insatser krävs för att utlandsfödda kvinnor ska komma i arbete och vi säger nej till alla förslag om vårdnadsbidrag eller barnomsorgspeng, som låser fast utlandsfödda kvinnor i hemmet. Det bör även ställas språkkrav för att få permanent uppehållstillstånd. Att kunna lära sig ett yrke parallellt med studier i svenska är ytterligare ett sätt att öka chansen att få jobb. Vi vill införa språkkrav för anställda inom förskola och äldreomsorg, med möjlighet till språkutbildning för den som inte har tillräckliga kunskaper. För att ingen ska fastna i passivitet behöver det ställas krav på aktivitet för att få försörjningsstöd. Diskrimineringen på arbetsmarknaden ska motarbetas."
  - id: S-023
    parti: S
    sida: 7
    rader: '181-189'
    lydelse: "Vi är med rätta stolta över välfärden i vårt land. Den generella välfärden är den starkaste omfördelande kraften som finns. Den gör Sverige rättvist och unikt. Men nu har marknadsexperimenten gått för långt. Drivkraften att tjäna pengar har fått stå i centrum, istället för dem välfärden är till för. Skattepengar delas ut till riskkapitalbolagens aktieägare, istället för att användas till skolböcker, fler anställda och bättre vård och omsorg."
  - id: S-024
    parti: S
    sida: 7
    rader: '190-194'
    lydelse: "Det räcker nu. Svenska folket ska styra över svensk välfärd och pengar ska inte göda riskkapitalister i stället för att säkra välfärden i hela vårt land. Det är dags att ta tillbaka den demokratiska kontrollen över välfärden och att stoppa sönderprivatiseringen."
  - id: S-025
    parti: S
    sida: 7
    rader: '196-207'
    lydelse: "Ta tillbaka kontrollen över skolan. Skolan ska vara till för barnen, inte ägarna. Vi vill förbjuda vinstuttagen i skolan och ta tillbaka kontrollen över var och när fristående skolor etablerar sig. Bara så kan vi sätta fokus på skolans kunskapsuppdrag. Vi vill ge alla elever samma möjlighet att välja skola, genom ett gemensamt skolval, slopad kötid och oberoende skolinformation. Skolpengen måste bli rättvisare så att fristående skolor inte överkompenseras på ett sätt som går ut över elever i kommunala skolor. Samhället ska ha full insyn i alla skolor genom offentlighetsprincipen. Religiös påverkan ska inte finnas i skolan. Därför vill vi förbjuda nya religiösa friskolor."
  - id: S-026
    parti: S
    sida: 7
    rader: '208-216'
    lydelse: "Ta tillbaka kontrollen över vården. Den som har en privat sjukvårdsförsäkring ska inte kunna få bättre eller snabbare hjälp i den offentligfinansierade vården. Inga akutsjukhus ska säljas ut. Privata vårdgivare ska vara skyldiga att bidra med personal och vårdplatser i händelse av kris eller krig. Privata vårdgivare ska också erbjuda verksamhetsförlagd utbildning till personalen. Offentlighetsprincipen ska gälla även privat vård och omsorg."
  - id: S-027
    parti: S
    sida: 8
    rader: '220-226'
    lydelse: "I de största och svåraste ögonblicken ska välfärden finnas där - när ett barn föds, när någon blir sjuk, kanske svävar mellan liv och död, när vi behöver extra stöd på ålderns höst eller när vi trampat snett i livet. Men vi vet alla att välfärden inte alltid fungerar som den ska. En avgörande fråga i höstens val är om vi ska fortsätta öka resurserna till välfärden, eller om stora skattesänkningar ska gå före."
  - id: S-028
    parti: S
    sida: 8
    rader: '228-235'
    lydelse: "Ingen ska behöva känna oro över att få vård i tid. Om en region inte uppfyller vårdgarantin enligt lagen ska vård erbjudas i en annan region. Tillsynen av sjukvården ska växlas upp för att garantera kvaliteten. Vi vill korta väntetiderna om man ringer 1177 och göra webbtjänsten mer lättöverskådlig. För att säkra kvaliteten, hindra att råd ges av ekonomiska skäl och att förhindra att känsliga uppgifter hamnar i fel händer, vill vi att 1177 drivs i offentlig regi."
  - id: S-029
    parti: S
    sida: 8
    rader: '236-241'
    lydelse: "Stoppa stöket i klassrummen. Skolan ska ge varje barn möjlighet att lyckas utifrån sina förutsättningar. För det krävs mer resurser och att resurserna stannar i skolan genom ett stopp för marknadsskolan. Lärare och annan personal i skolan ska omedelbart kunna ingripa vid stök och oro."
  - id: S-030
    parti: S
    sida: 8
    rader: '242-243,246-250'
    lydelse: "Det ska vara tryggt att åldras i Sverige. Vi vill att alla med hemtjänst ska ha en fast omsorgskontakt för ökad trygghet. Fler ska utbildas och anställas inom äldreomsorgen och tillsynen av personalens arbetsmiljö ska förbättras. Vi vill ha en ny äldreomsorgslag som säkerställer att alla får en lika bra omsorg i hela landet och tillgång till sjuksköterskor dygnet runt. Vi vill fortsätta satsningen på att anställda inom äldreomsorgen ska kunna utbildas på arbetstid."
  - id: S-031
    parti: S
    sida: 9
    rader: '251-258'
    lydelse: "Personer med funktionsnedsättning ska kunna leva sitt liv som andra. Arbete och sysselsättning är centralt för delaktigheten i samhället. Vi ska säkra rätten till personlig assistans och arbeta vidare med förslagen om att förbättra sjukersättningen. Vinstjakten inom assistansen ska motverkas, liksom att brukare eller personliga assistenter utnyttjas i kriminella syften. Vi vill se mer individuellt utformade insatser för att skapa jobb eller utbildning för personer med funktionsnedsättningar."
  - id: S-032
    parti: S
    sida: 9
    rader: '259-270'
    lydelse: "Sverige ska ha ett levande, fritt och obundet kultur liv som både stärker samhörigheten och utmanar. Skolbiblioteken har en central roll att spela för ökad läskunnighet. Vi vill stärka kulturskolan för att säkra alla barns möjligheter till kulturella aktiviteter, och genomföra särskilda satsningar i resurssvaga områden. Folkbildning ger stark demokrati och möjligheter till personlig utveckling vid sidan av den formella utbildningen. Vi vill grundlagsskydda public service. Mediestödet ska ge förutsättningar för oberoende och lokalt förankrad nyhetsförmedling i hela landet."
  - id: S-033
    parti: S
    sida: 9
    rader: '273-279'
    lydelse: "Välfärden blir svagare när personalen inte har förutsättningar att göra sitt bästa jobb. Det går ut över alla som använder välfärdens tjänster och som drabbas av att hemtjänstpersonalen springer på minutschema och att barnmorskor känner sådan desperation att de säger upp sig. På alltför många ställen råder brist på rätt utbildad personal. Förutom att det urholkar välfärdens kvalitet, ökar det också klyftorna mellan olika delar av landet."
  - id: S-034
    parti: S
    sida: 9
    rader: '280'
    lydelse: "Så ska det inte vara. Välfärden måste bli ännu bättre."
  - id: S-035
    parti: S
    sida: 9
    rader: '282-293'
    lydelse: "Öka resurserna till välfärden i hela landet. Vi vill fortsätta öka statens bidrag till kommuner och regioner. Stora skattesänkningar omöjliggör det. Villkor ska ställas så att pengarna till välfärden verkligen går till dess medarbetare - inte mer byråkrati. För att säkra välfärden i hela landet behöver vi se över skatteutjämningssystemet, så att det garanterar offentlig service av hög kvalitet i hela landet, även i små kommuner som kämpar med sitt befolkningsunderlag. Staten ska finnas närvarande i hela landet. Arbetsvillkoren i välfärden måste spegla hur centrala jobben är för att samhället ska fungera. Vi vill att välfärden ska gå före och att fler ska kunna arbeta heltid i fasta jobb."
  - id: S-036
    parti: S
    sida: 10
    rader: '296-305'
    lydelse: "Säkerställ att det finns utbildad personal att anställa. Staten har ett ansvar för att säkra kompetensförsörjningen, inte minst i välfärden. Det ska finns en starkare koppling mellan de utbildningar som erbjuds och de behov av personal som finns i samhället. Det gäller både på gymnasiet och i den högre utbildningen. Vi vill se ett språklyft för barnomsorgen och mer stöd till specialistutbildningar i vården, exempelvis för sjuksköterskor och undersköterskor. Genom språkkrav och utbildningsinsatser vill vi säkerställa att alla som jobbar i välfärden talar god svenska."
  - id: S-037
    parti: S
    sida: 10
    rader: '308-314'
    lydelse: "Alltför många pensionärer som har arbetat ett helt yrkesliv, särskilt kvinnor, har för låga pensioner. Det är inte värdigt vårt samhälle att år av slit belönas så dåligt. Pensionerna ska höjas. Det är en fråga om respekt för dem som har jobbat, byggt upp vårt land och lagt grunden för vår gemensamma välfärd - och det är avgörande för jämställdheten."
  - id: S-038
    parti: S
    sida: 10
    rader: '316-319,322-326'
    lydelse: "En pension det går att leva på. Vårt mål är att alla ska få minst 70 procent av slutlönen i pension. För att det ska vara möjligt måste pensionsavgiften höjas. Vi vill också införa en gas i pensionssystemet. Det innebär att pensionen blir högre när det uppstår överskott i pensionssystemet. Vi står upp för trygghetspensionen, som utmanas av krafter från höger, och vill förbättra pensionstillägget så att fler får ta del av det och så att det bättre lönar sig att ha arbetat."
  - id: S-039
    parti: S
    sida: 11
    rader: '327-334'
    lydelse: "Sverige ska ha trygga försäkringar byggda på tan ken om plikt och rätt. En stark a-kassa ger trygghet i vardagen, stärker löntagares ställning på arbetsmarknaden och hjälper till att stabilisera samhällsekonomin genom lågkonjunkturer. Därför vill vi permanenta den höjda ersättningen i arbetslöshetsersättningen. Också vid sjukdom är det nödvändigt med större ekonomisk trygghet. Våra förbättringar av trygghetssystemen står på spel i höstens val - och vi slår vakt om principen att den som är för sjuk för att arbeta ska kunna lita på sjukförsäkringen."
  - id: S-040
    parti: S
    sida: 11
    rader: '335-339'
    lydelse: "Minska orättvisan i karensen. Karensavdraget skapar en ekonomisk orättvisa som slår hårt mot LO-förbundens medlemmar och andra som fysiskt måste vara på jobbet. Därför vill vi under nästa mandatperiod genomföra en miljardreform för att förändra karensavdraget och öka rättvisan för alla som inte kan jobba hemifrån."
  - id: S-041
    parti: S
    sida: 11
    rader: '343-347'
    lydelse: "Klimatomställningen är vår tids ödesfråga. Vi riskerar att förstöra vår enda planet och förutsättningarna att leva och bo på många platser, vilket kommer att leda till ett enormt migrationstryck. Samtidigt accelererar artdöden och den biologiska mångfalden hotas."
  - id: S-042
    parti: S
    sida: 11
    rader: '348-351'
    lydelse: "Konsekvenserna av klimatförändringarna syns alltmer här i Sverige. Skogsbränder hotar folks hem. Skyfall svämmar över stadskärnor och torka slår ut skördar. Kalfjällen riskerar att växa igen."
  - id: S-043
    parti: S
    sida: 11
    rader: '352-353'
    lydelse: "Sverige och världen måste ställa om - och Sverige ska ha en klimatpolitik som fungerar för vanligt folk."
  - id: S-044
    parti: S
    sida: 11
    rader: '355-356'
    lydelse: "Politiken måste ta ett större ansvar. Det klimatpolitiska ramverket ska ligga fast. Genom statliga investeringar kan vi öka takten i industrins omställning och underlätta ett klimatsmart liv."
  - id: S-045
    parti: S
    sida: 11
    rader: '357-362,365-370'
    lydelse: "Gör det möjligt att leva och resa klimatvänligt. Klimatkrisen kan aldrig lösas med att skuldbelägga människor som behöver ta bilen till affären - det är helt nödvändigt i stora delar av vårt land. Vi vill dubbla antalet laddstolpar till 2030 för att underlätta för den som har elbil. Genom massiva investeringar i både ny och befintlig järnväg kommer fler att kunna resa klimatsmart med tåg. Ett nytt reseavdrag ska förbättra möjligheterna att få avdrag också för mer klimatsmarta resor, och med rättvisare landsbygdsprofil. Vi vill ge möjligheten till gymnasieelever och studenter att resa avgiftsfritt i kollektivtrafiken under sommaren."
  - id: S-046
    parti: S
    sida: 12
    rader: '371-374'
    lydelse: "Säkra tillgången till bränsle. Bensin- och dieselpriserna har ökat kraftigt till följd av Rysslands invasion av Ukraina. Vi vill öka den svenska produktionen av förnybara drivmedel, så att det blir lättare att tanka fossilfritt i Sverige."
  - id: S-047
    parti: S
    sida: 12
    rader: '376-378'
    lydelse: "Många har fått en chock när elräkningen kommit. De höga elpriserna slår mot människors plånböcker och skapar svårigheter för industrin."
  - id: S-048
    parti: S
    sida: 12
    rader: '379-381'
    lydelse: "Vi behöver bygga ut elproduktionen för att få mer billig el, snabbt, inte minst i södra Sverige. När det gäller att lösa Sveriges energibehov finns inga heliga kor."
  - id: S-049
    parti: S
    sida: 12
    rader: '383-394'
    lydelse: "Bygg ut elproduktionen av alla slag. Vindkraft långt ute till havs kan bidra med mycket energi. Kommuner som medverkar till utbyggnad av vindkraftverk ska kunna få ekonomiskt stöd. Vi behöver också värna vattenkraften och se till att solpanelerna blir fler, bland annat på offentliga och kommersiella byggnader. Kärnkraften är en viktig del av svensk elproduktion och kommer att så vara under lång tid framöver. Vi ser positivt på de initiativ som nu tas för att undersöka potentialen framåt i samtliga energislag. Efter valet vill vi se en ny energiöverenskommelse för Sveriges bästa, och vill därför föra energipolitiska samtal med andra partier om allt från vindkraft till kärnkraft."
  - id: S-050
    parti: S
    sida: 12
    rader: '395-402'
    lydelse: "Riv de byråkratiska hindren för mer el. Långsamma tillståndsprocesser ska snabbas på. Vi vill minst fördubbla takten i utbyggnaden av elnätet. Samtidigt är det viktigt att kostnaderna för utbyggnaden av elnätet är rimliga för elkunderna, oavsett var i landet man bor. En översyn av indelningen av elprisområden ska göras. Vi vill se till att intäkterna från kapacitetsavgifter som inte används för nätinvesteringar används både för att minska prisskillnaderna och sänka kostnaderna."
  - id: S-051
    parti: S
    sida: 12
    rader: '403-408'
    lydelse: "Underlätta familjers energieffektivisering. Det finns stora vinster i att energieffektivisera sitt hem, både för samhället i stort och för den egna ekonomin. Takten behöver därför öka och kunskapen om hur rot-avdraget kan användas för energieffektivisering behöver breddas. Vi vill underlätta för fastighetsägare att vidta åtgärder för att spara energi i flerfamiljshus."
  - id: S-052
    parti: S
    sida: 13
    rader: '412-416'
    lydelse: "Sverige ska bli världens första fossilfria välfärdsnation. År 2045 ska Sverige inte ha några nettoutsläpp av växthusgaser till atmosfären, för att därefter uppnå negativa utsläpp. Redan nu minskar utsläppen i vårt land, men takten måste öka."
  - id: S-053
    parti: S
    sida: 13
    rader: '417-422'
    lydelse: "Genom att gå före kan Sverige göra en insats både för klimatet och för tillväxten i vårt land. Nu tillverkar vi fossilfritt stål i Sverige, vi bygger elbilar och vi ser hur nedlagda industrier blir till batterifabriker. Det skapar tusentals jobb över hela landet här och nu - jobb med svenska löner och kollektivavtal."
  - id: S-054
    parti: S
    sida: 13
    rader: '424-427'
    lydelse: "Öka de gröna statliga investeringarna. En del av de investeringar som minskar utsläpp och skapar jobb tycker marknaden är för riskfyllda. Genom att staten tar en del av risken kan de gröna investeringarna öka. Vi vill utöka de gröna kreditgarantierna."
  - id: S-055
    parti: S
    sida: 13
    rader: '428-431'
    lydelse: "Stärk beredskapen mot extremväder. Annars riskerar skyfall att svämma över städer, torka slå ut hela skördar och skogsbränder att breda ut sig. Vi vill fortsätta de stora investeringarna så att kommunerna kan klimatanpassa lokalt."
  - id: S-056
    parti: S
    sida: 13
    rader: '432-439'
    lydelse: "Exportera klimatsmarta lösningar och driv på andra länder. Sverige ska vara en stark kraft i FN och EU för att världens länder ska öka sina åtaganden för att göra verklighet av Parisavtalets ambitioner. Klimatfrågan är en global utmaning som kräver internationellt ansvarstagande, men också att vi är med och stöttar andra länder att ställa om. Därför vill vi dubblera klimatbiståndet. Vi ska verka för att ett globalt koldioxidpris införs med principen att förorenaren betalar. Det behövs också ett tak för hur mycket mer koldioxid som kan släppas ut i atmosfären."
  - id: S-057
    parti: S
    sida: 13
    rader: '442-446'
    lydelse: "Rysslands olagliga invasion av Ukraina och agerande på energimarknaden har lett till höga energipriser, inflation och ökad ekonomisk osäkerhet i hela världen. EU och den europeiska ekonomin påverkas kraftigt. Utvecklingen märks tydligt också i Sverige och för svenska familjer. Prisökningarna äter sig in i människors plånböcker, vid bensinmacken och vid kassan i matbutiken."
  - id: S-058
    parti: S
    sida: 13
    rader: '447-454'
    lydelse: "Det behövs en politik för att lindra Putinprisernas konsekvenser. Men ingen ansvarsfull politiker kan lova full kompensation för varje prishöjning. Vi såg till att spara i ladorna under de goda åren och därför har nu Sverige starka statsfinanser, men det är ingen naturlag. Om partier skulle bjuda över varandra med lånade pengar slutar det med högre bolåneräntor och ännu högre priser."
  - id: S-059
    parti: S
    sida: 14
    rader: '457-461'
    lydelse: "Den ekonomiska politiken behöver bedrivas med stor varsamhet och respekt för vanliga hushålls ekonomi. Men att skuldsätta Sverige för att kompensera varenda prisökning skulle elda på inflationen och i förlängningen äventyra statsfinanser, välfärd och pensioner. Vi är emot införandet av en fastighetsskatt."
  - id: S-060
    parti: S
    sida: 14
    rader: '463-469'
    lydelse: "Arbete är grunden för den ekonomiska politiken. Full sysselsättning är vårt övergripande mål. Ju fler människor som har ett jobb att gå till desto mindre kommer de ekonomiska klyftorna att vara. Människors arbete är Sveriges främsta tillgång. Arbete ger individen självständighet och frihet att forma sitt eget liv. En aktiv arbetsmarknadspolitik för fler jobb är särskilt viktig i ekonomiskt oroliga tider."
  - id: S-061
    parti: S
    sida: 14
    rader: '470-474'
    lydelse: "Minska trycket på elpriserna genom en snabbt utbyggd elproduktion. Det hjälper oss att stabilisera de energipriser som driver på inflationen. Vi är också beredda att göra ytterligare insatser vid fortsatt höga priser."
  - id: S-062
    parti: S
    sida: 14
    rader: '475-481'
    lydelse: "Stöd till de som drabbas hårdast av prisökningarna. Med riktade och smarta stöd kan vi stötta människor utan att driva på inflationen. Vi är beredda att stärka ekonomin för Sveriges barnfamiljer. Vi vill se höjda pensioner, billigare arbetsresor för dem som har långt till jobbet, avgiftsfri kollektivtrafik för gymnasieelever och studenter på sommaren och en fortsatt stark a-kassa och sjukförsäkring."
  - id: S-063
    parti: S
    sida: 14
    rader: '482-488'
    lydelse: "Garantera trovärdigheten för svensk ekonomi. Socialdemokraterna kommer aldrig att medverka till att underminera Sveriges ekonomi. Vi har sett till att Sverige har en låg statsskuld och ett starkt ekonomiskt manöverutrymme. Vi värnar Riksbankens oberoende och ansvar för att stabilisera den allmänna prisnivån och tror på parternas förmåga att ta ansvar för lönebildningen. Vi står upp för det finanspolitiska ramverket och vill utveckla det för att möta vår tids samhällsproblem. För att frigöra mer utrymme för nödvändiga investeringar vill vi övergå till ett balansmål."
  - id: S-064
    parti: S
    sida: 14
    rader: '489-493'
    lydelse: "Stärk de långsiktiga förutsättningarna för före tagande och innovation. Inflationen och den ekonomiska osäkerheten riskerar att skada svensk konkurrenskraft. Vi vill satsa på grön teknik, digitalisering och utbildning så att företagsklimatet stärks och kompetensförsörjningen förbättras."
  - id: S-065
    parti: S
    sida: 14
    rader: '496-499'
    lydelse: "Vi lever i en omvälvande tid, med krig i Europa, en långvarig pandemi och en hotande klimatkris. I dessa tider behövs en socialdemokratisk utrikespolitik mer än någonsin."
  - id: S-066
    parti: S
    sida: 14
    rader: '500-502,505-510'
    lydelse: "Den 24 februari 2022 öppnades ett nytt, mörkt kapitel i Europas historia, när Ryssland inledde ett oprovocerat, olagligt och oförsvarligt krig mot sin granne, det demokratiska Ukraina. Sverige måste i alla lägen stå upp för Ukraina och mot det ryska invasionskriget. Samtidigt har Rysslands anfallskrig kraftigt försämrat säkerheten i vårt närområde. Den svenska alliansfriheten tjänade Sverige väl under lång tid. Men nu krävs ännu mer samarbete, med säkerhetsgarantier, för att trygga vår"
  - id: S-067
    parti: S
    sida: 15
    rader: '512-514'
    lydelse: "Sverige ska gå med i Nato. Ett svenskt medlemskap i Nato är den bästa vägen för vårt lands säkerhet och Sverige har därför lämnat in sin medlemsansökan."
  - id: S-068
    parti: S
    sida: 15
    rader: '516-519'
    lydelse: "Vi måste kunna försvara oss militärt, men också mot hybridattacker, spionage och cyberangrepp. Svenska folket är måltavla för påverkanskampanjer och desinformation. Dagens nya situation kräver en omläggning av svensk säkerhetspolitik."
  - id: S-069
    parti: S
    sida: 15
    rader: '520-521'
    lydelse: "Sverige behöver bygga ett starkt folkförsvar. Nu öppnar nya regementen, fler soldater utbildas och försvarsmateriel tillverkas och köps in. Vi har återinfört värnplikten. Takten i upprustningen ska öka ytterligare."
  - id: S-070
    parti: S
    sida: 15
    rader: '523-531'
    lydelse: "Kraftfullt stärka Sveriges militära förmåga. Anslagen till det militära försvaret ska öka till motsvarande två procent av BNP. Det ska ske så fort det är praktiskt möjligt och senast år 2028. Vi vill att ökningen ska omsättas i bland annat fler värnpliktiga, modern materiel samt förstärkt militär närvaro över hela landet. Vi vill införa en beredskapsskatt för de allra rikaste. Vi vill fortsätta internationella samarbeten och utveckla cyberförsvaret och underrättelseförmågan."
  - id: S-071
    parti: S
    sida: 15
    rader: '532-538'
    lydelse: "Rusta upp det civila försvaret. Arbetet att förstärka det civila försvaret och krisberedskapen måste fortsätta, bland annat genom ökade resurser för att rusta och bygga beredskapslager för sjukvården och öka beredskapen i transportsektorn. Arbetet för att stärka förmågan att stå emot cyberattacker och desinformation ska stärkas."
  - id: S-072
    parti: S
    sida: 15
    rader: '540-546'
    lydelse: "Sverige ska vara en stark global röst. Vi har en lång historia av att stå upp för folkrätten, solidaritet, nedrustning, demokrati och jämställdhet. Vi kommer att fortsätta arbetet för att öka respekten för de mänskliga rättigheterna, demokratin och en regelbaserad världsordning och global säkerhet. Arbetet för att minska fattigdomen måste fortsätta. Sveriges internationella engagemang för att öka takten i klimatomställningen är också helt avgörande."
  - id: S-073
    parti: S
    sida: 15
    rader: '547-551,554-555'
    lydelse: "Vi är övertygade om att EU-samarbetet är grunden för att lösa många av vår tids svåraste problem. Inte minst klimatfrågan, migrationen och hotet från terrorism och gränsöverskridande brottslighet. Vi vill se ett EU som står upp för våra gemensamma värderingar. Också det nordiska samarbetet är centralt, liksom samarbetet med de baltiska staterna."
  - id: S-074
    parti: S
    sida: 16
    rader: '556-558'
    lydelse: "Vi behöver förstärka det internationella arbetet mot brottsligheten. Vi vill se fler och intensifierande internationella samarbeten mot smuggling av bland annat vapen och narkotika."
  - id: S-075
    parti: S
    sida: 16
    rader: '559-566'
    lydelse: "Vi står upp för en öppen, fri och rättvis handel. För ett litet och exportberoende land som Sverige är den globala handeln helt avgörande, inte minst för att hålla nere priserna och motverka inflationen. EU behöver sluta fler handelsavtal där också våra värderingar om social dialog, mänskliga rättigheter och miljö är vägledande. Det globala samarbetet inom WTO ska stärkas, liksom samarbetet med likasinnade länder."
  - id: S-076
    parti: S
    sida: 16
    rader: '567-570'
    lydelse: "Flickors och kvinnors rättigheter måste stärkas globalt. Vi socialdemokrater står upp för alla kvinnors rätt att bestämma över sin egen kropp. Säkra aborter måste vara en rättighet för kvinnor i hela världen."
  - id: S-077
    parti: S
    sida: 16
    rader: '571-575'
    lydelse: "Svenskt bistånd ska tydligare bidra till att förhindra att människor tvingas på flykt. Detta genom att hantera grundorsakerna till det som driver ökade humanitära behov, som krig och konflikter samt klimatförändringens effekter. Fattiga människors perspektiv och kvinnor och barns rättigheter ska vara i centrum."
  - id: S-078
    parti: S
    sida: 16
    rader: '576-578'
    lydelse: "Kärnvapenhotet hörs allt oftare i offentlig retorik, inte minst från Ryssland. Vi fördömer allt hot om användning av kärnvapen och fortsätter verka för det enda rimliga slutmålet: en värld fri från kärnvapen."
  - id: S-079
    parti: S
    sida: 16
    rader: '579-585'
    lydelse: "Vi kommer att fortsätta värna FN:s roll i arbetet för folkrätten och det internationella samarbetet. Covid-19-pandemin har försvårat genomförandet av de globala hållbarhetsmålen. Det arbetet måste nu åter ta fart. FN måste fortsätta driva frågor om kvinnor, fred och säkerhet. Världen är global och vår omvärlds framgångar innebär också Sveriges trygghet."
  - id: S-080
    parti: S
    sida: 17
    rader: '588-590'
    lydelse: "Socialdemokraterna kommer aldrig att medverka till att ge makt åt Sverigedemokraterna, ett parti som inte står upp för alla människors lika värde och rätt."
  - id: S-081
    parti: S
    sida: 17
    rader: '591'
    lydelse: "Den 11 september bestämmer du."
  - id: M-001
    parti: M
    sida: 3
    rader: '32-33'
    lydelse: "Sverige kan bättre. Mycket bättre."
  - id: M-002
    parti: M
    sida: 3
    rader: '34-35'
    lydelse: "I höstens val söker Moderaterna väljarnas förtroende för att få ordning på Sverige, så att vi också kan ta vara på vårt lands alla möjligheter."
  - id: M-003
    parti: M
    sida: 3
    rader: '36-39'
    lydelse: "Svenska folket står inför ett viktigt vägskäl. Efter åtta år av socialdemokratiskt styre har Sverige fått EU:s fjärde högsta arbetslöshet, och lägsta tillväxt."
  - id: M-004
    parti: M
    sida: 3
    rader: '40-42'
    lydelse: "Dödsskjutningarna och utsattheten för sexualbrott har eskalerat, och ungdomsrånen har mer än fördubblats sedan 2014. Den pågående avvecklingen av kärnkraften har lett till skenande elpriser och hotar den gröna omställningen."
  - id: M-005
    parti: M
    sida: 3
    rader: '43-47'
    lydelse: "Sverige är på väg åt fel håll. Den utvecklingen måste vändas - och den kan vändas med en ny handlingskraftig regering och en offensiv reformpolitik som på allvar kan ta itu med samhällsproblemen och få något gjort."
  - id: M-006
    parti: M
    sida: 3
    rader: '48-51'
    lydelse: "För det finns ett Sverige där ordet utanförskapsområde är förpassat till historien, för att inget område längre är utanför. Ett Sverige utan gängvåld och klanvälden, där lagen och jämställdheten gäller lika för alla."
  - id: M-007
    parti: M
    sida: 3
    rader: '52-55'
    lydelse: "Där polisen kommer när man ringer och inte backar när det gäller. Där brottsoffren, inte gärningsmännen, får upprättelse och skadestånd. Där du kan vara trygg när du är ute, för att brottslingarna sitter inne."
  - id: M-008
    parti: M
    sida: 3
    rader: '56-61'
    lydelse: "Det finns ett Sverige där alla barn får se sina föräldrar gå till jobbet. Där det alltid lönar sig att arbeta och göra sitt bästa. Där slit och flit alltid trumfar fusk och dåliga ursäkter, och där välfärdens skyddsnät finns till för den som behöver det."
  - id: M-009
    parti: M
    sida: 3
    rader: '62-66'
    lydelse: "Det är ett Sverige där skolan är en trygg plats för kunskap och klassresor. Där alla barn får lära sig bra svenska tidigt. Där barn och föräldrar får välja själva, och inte en enda elev kvoteras in eller tvångsbussas ut."
  - id: M-010
    parti: M
    sida: 3
    rader: '67-71'
    lydelse: "Det är ett Sverige där ingen får ångest av att öppna elräkningen. Där du som behöver åka en bit för att skjutsa dina barn till fotbollsträningen eller musikskolan har råd att ta bilen, oavsett om den går på bensin eller el."
  - id: M-011
    parti: M
    sida: 3
    rader: '72-75'
    lydelse: "Det är ett Sverige där klimatsmart kärnkraft ger ren, stabil och billig el, och det sista oljekraftverket lagts ner. Där miljöbovar betalar för sig, men du kan unna dig en plastpåse när du veckohandlar."
  - id: M-012
    parti: M
    sida: 3
    rader: '76-81'
    lydelse: "Under ytan, runt hörnet, finns ett Sverige där rättsstaten vunnit över våldet. Där arbetslinjen ersatt bidragslinjen. Där gröna innovationer, världsledande utbildning, forskning och nya jobb - inte kravaller och dödsskjutningar - ger Sverige stora rubriker."
  - id: M-013
    parti: M
    sida: 3
    rader: '82-85'
    lydelse: "Det är frihetens och trygghetens och möjligheternas Sverige. Den hoppfulla framtidens Sverige. Detta Sverige finns inom räckhåll bara viljan och kraften finns att få allting gjort som måste göras."
  - id: M-014
    parti: M
    sida: 3
    rader: '86-87'
    lydelse: "Vi har både viljan och kraften. Nu får vi ordning på Sverige."
  - id: M-015
    parti: M
    sida: 4
    rader: '95-100'
    lydelse: "Sverige går in i ett nytt ekonomiskt läge med lägre tillväxt och ökande inflation. Räntehöjningar pressar hushållen och den socialdemokratiska regeringens nedläggning av kärnkraft har drivit upp elpriserna till rekordnivåer. Åtta år av rödgröna skattehöjningar gör nu att pengarna knappt räcker till att tanka bilen eller betala elräkningen."
  - id: M-016
    parti: M
    sida: 4
    rader: '101-106'
    lydelse: "Sverige behöver hitta tillbaka till en ansvarsfull ekonomisk politik som bygger upp motståndskraft mot kriser och genomföra reformer för fler i arbete. Att återupprätta arbetslinjen är det bästa sättet att se till att Sveriges hushåll har styrka nog att komma igenom den tuffa tid som ligger framför oss."
  - id: M-017
    parti: M
    sida: 4
    rader: '107-117'
    lydelse: "Moderaterna vill bygga ett Sverige där tydliga drivkrafter banar väg för egen försörjning. Där jobb och flit lönar sig bättre - så att du som jobbar får råd med vardagen och ibland kan unna dig något extra. Ett Sverige där barnen ser sina föräldrar gå till jobbet. Där alla ges förutsättningar att göra sin livsresa. Där bidragslinjen ersätts av arbetslinjen så att fler kan komma till sin rätt. Där dina skattepengar används till fler lärare och poliser i stället för att hamna i fickorna på kriminella."
  - id: M-018
    parti: M
    sida: 4
    rader: '118-126'
    lydelse: "I tuffa ekonomiska tider krävs ordning och reda i ekonomin. Överskottsmålet ska värnas och det är inte aktuellt att övergå till ett balansmål. Alla nya löften och reformer - som till exempel våra inkomstskattesänkningar - behöver finansieras eller rymmas inom överskottsmålet. De stora behoven inom rättsväsendet, försvaret och välfärden ställer stora krav på prioriteringar under åren som kommer."
  - id: M-019
    parti: M
    sida: 4
    rader: '127-128'
    lydelse: "Vi vet vad som måste göras - och vad som får vänta."
  - id: M-020
    parti: M
    sida: 4
    rader: '131-136'
    lydelse: "Klassresornas Sverige byggde på hög arbetsmoral och tydliga förväntningar på egen försörjning. Men idag har Sverige en mycket hög arbetslöshet. Och de samlade bidragen kan i vissa fall bli så höga att det inte lönar sig att jobba. Så kan vi inte ha det."
  - id: M-021
    parti: M
    sida: 4
    rader: '137-143'
    lydelse: "Du som ställer klockan varje morgon - eller kväll - för att arbeta, förtjänar lön för mödan. Det ska inte vara som idag att den som lever på bidrag kan få lika mycket i plånboken varje månad som den som jobbar. Och skatterna ska inte vara så höga att pengarna knappt räcker till att tanka bilen eller betala elräkningen."
  - id: M-022
    parti: M
    sida: 4
    rader: '144-149'
    lydelse: "Du som arbetat ett helt yrkesliv måste få bättre lön för mödan när du går i pension. Att du ska ha en betydligt bättre pension än den som aldrig arbetat i Sverige är, åtminstone för oss, en självklarhet. Vi värnar arbetslinjen i pensionssystemet - det ska alltid löna sig bättre att ha arbetat än att inte ha gjort det."
  - id: M-023
    parti: M
    sida: 4
    rader: '151-152'
    lydelse: "Sänka skatten på arbete så att din ansträngning lönar sig bättre"
  - id: M-024
    parti: M
    sida: 4
    rader: '153-155'
    lydelse: "Införa en jobbpremie som gör det extra lönsamt för långtidsarbetslösa att gå från bidrag till arbete"
  - id: M-025
    parti: M
    sida: 5
    rader: '193'
    lydelse: "Sänka skatten för alla Sveriges pensionärer"
  - id: M-026
    parti: M
    sida: 5
    rader: '194-196'
    lydelse: "Införa en ”gas” i pensionssystemet som ger högre pensioner när Sveriges ekonomi är god"
  - id: M-027
    parti: M
    sida: 5
    rader: '200-209'
    lydelse: "Det har blivit orimligt dyrt att vara svensk. Världens högsta dieselpriser. Rekordhöga elpriser. Dyrare att spara för framtiden. Några säger upp sig för att pendlingen till jobbet blivit för dyr och andra skruvar ner värmen för att kunna betala elräkningen. Så här kan inte samhället fungera. Ingen regering kan kompensera för alla prishöjningar men vi kan städa undan de värsta misstagen som begåtts under de senaste åren."
  - id: M-028
    parti: M
    sida: 5
    rader: '210-213,215-216'
    lydelse: "Till vår uppgift hör också att stoppa den socialdemokratiska regeringens skattechock. Under de senaste åtta åren har regeringen höjt 46 skatter, som krånglar till och fördyrar vardagen för både företagare och konsumenter. Sverige har redan ett av världens högsta skattetryck - mer skatt är ingen lösning."
  - id: M-029
    parti: M
    sida: 5
    rader: '217-222'
    lydelse: "När vår politik med sänkt skatt och sänkta bränslepriser får fullt genomslag, kan en tvåbarnsfamilj få 24 000 kronor mer per år. Dessutom vill vi se till att de höga elpriserna som drivits fram av nedlagd kärnkraft går tillbaka till hushållen."
  - id: M-030
    parti: M
    sida: 5
    rader: '224-225'
    lydelse: "Sänka priset på bensin och diesel så att du klarar din vardagsekonomi"
  - id: M-031
    parti: M
    sida: 5
    rader: '226-228'
    lydelse: "Sänka skatten på investeringssparkonton (ISK) - så att du lättare kan spara till en bostad eller till pensionen"
  - id: M-032
    parti: M
    sida: 5
    rader: '229-230'
    lydelse: "Stoppa återinförandet av fastighetsskatten och sänkta ränteavdrag"
  - id: M-033
    parti: M
    sida: 5
    rader: '231-233'
    lydelse: "Införa ett skattehöjarstopp under den kommande mandatperioden som innebär att de samlade skatterna inte höjs"
  - id: M-034
    parti: M
    sida: 6
    rader: '259-269'
    lydelse: "Ny kärnkraft är lösningen för att reparera Sveriges energisystem på lång sikt. Men för att mildra elkrisen i vinter behövs akuta åtgärder så att hushållen har råd att betala sina elräkningar. Det handlar både om att öka den planerbara elproduktionen från kraftvärmen och om att de höga intäkter som uppkommit efter den rödgröna nedläggningen av kärnkraft ska gå tillbaka till hushållen. I dag kan priserna skilja stort mellan elkunder i norra och södra Sverige. Detta bör åtgärdas - utan att elen blir dyrare i något område."
  - id: M-035
    parti: M
    sida: 6
    rader: '271-272'
    lydelse: "Skydda hushållen mot vinterns elräkningar genom ett högkostnadsskydd"
  - id: M-036
    parti: M
    sida: 6
    rader: '273-276'
    lydelse: "Göra det billigare för privatpersoner att minska sin elkonsumtion genom att förstärka och utvidga det gröna skatteavdraget"
  - id: M-037
    parti: M
    sida: 6
    rader: '277'
    lydelse: "Se över elprisområdenas utformning"
  - id: M-038
    parti: M
    sida: 6
    rader: '278-279'
    lydelse: "Ta bort avfallsförbränningsskatten för att öka elproduktionen från kraftvärmeverken"
  - id: M-039
    parti: M
    sida: 6
    rader: '283-291'
    lydelse: "Den som kan försörja sig själv och den som anstränger sig, ska belönas. Det handlar ytterst om moral och rättvisa. Varannan invandrad person i Sverige, totalt 700 000 personer, kan idag inte försörja sig själv fullt ut. Om utrikesfödda jobbade i samma utsträckning som inrikesfödda skulle skattebetalarna spara 57 miljarder kronor om året. De samlade bidragen ska aldrig bli så höga att det inte lönar sig att jobba."
  - id: M-040
    parti: M
    sida: 7
    rader: '330-340'
    lydelse: "Drivkrafter spelar roll. Genom att sänka skatten på låga inkomster och införa ett bidragstak, så att det alltid lönar sig bättre att jobba än att leva på staplade bidrag, kommer Moderaterna att stärka arbetslinjen. Genom att ställa krav på den som är ny i Sverige att göra sig anställningsbar tydliggörs att här räknar vi med att alla blir en del av samhället. Och när fler är med och bidrar blir det mer pengar till fler poliser och sjuksköterskor, till fler utbildningsplatser och till försvaret. Att fler försörjer sig själva gynnar alla."
  - id: M-041
    parti: M
    sida: 7
    rader: '342-343'
    lydelse: "Genomföra en stor bidragsreform för att bryta utanförskapet"
  - id: M-042
    parti: M
    sida: 7
    rader: '344-346'
    lydelse: "Införa ett bidragstak så att de samlade bidragen aldrig kan bli högre än lönen från ett arbete"
  - id: M-043
    parti: M
    sida: 7
    rader: '347-349'
    lydelse: "Se till att den som invandrat kvalificerar sig till olika välfärdsförmåner genom arbete och utbildning"
  - id: M-044
    parti: M
    sida: 7
    rader: '350'
    lydelse: "Bygga ut antalet praktikplatser med 30 000"
  - id: M-045
    parti: M
    sida: 7
    rader: '351-352'
    lydelse: "Kräva aktivitet på heltid av den som lever på försörjningsstöd"
  - id: M-046
    parti: M
    sida: 7
    rader: '353-354'
    lydelse: "Möjliggöra samhällsnyttiga insatser för den som lever på bidrag"
  - id: M-047
    parti: M
    sida: 7
    rader: '355-357'
    lydelse: "Införa hembesök hos den som lever på försörjningsstöd för att upptäcka missförhållanden"
  - id: M-048
    parti: M
    sida: 7
    rader: '358-359'
    lydelse: "Kraftigt sänka kostnaden för att anställa långtidsarbetslösa"
  - id: M-049
    parti: M
    sida: 7
    rader: '363-367'
    lydelse: "Sveriges välstånd bygger på ett dynamiskt och livskraftigt näringsliv. Men höga skatter, krångliga tillståndsprocesser och byråkrati sätter käppar i hjulet för innovation och tillväxt. Det kan vi aldrig acceptera."
  - id: M-050
    parti: M
    sida: 8
    rader: '371-376'
    lydelse: "Moderaterna vill bygga ett land där ett fritt näringsliv skapar ett välstånd som kommer alla till del. Där det är lätt att göra rätt - för att en tredjedel av regelkrånglet tagits bort. Där du som vill anställa har möjlighet att hitta rätt kompetens inom Sveriges gränser - men den som rekryterat utländsk spetskompetens inte behöver oroa sig för orättvisa kompetensutvisningar."
  - id: M-051
    parti: M
    sida: 8
    rader: '377-382'
    lydelse: "Villkoren för att starta, växa och expandera behöver vara goda för att fler ska våga lämna trygga och välbetalda jobb för att starta företag. Ska det ske måste skattesystemet bli enklare, och bolags-, kunskaps- och kapitalskatter vara konkurrenskraftiga och uppmuntra till investeringar i Sverige."
  - id: M-052
    parti: M
    sida: 8
    rader: '384-386'
    lydelse: "Ta bort en tredjedel av företagens administrationskostnader och en tredjedel av regelkrånglet"
  - id: M-053
    parti: M
    sida: 8
    rader: '387-389'
    lydelse: "Kraftigt sänka anställningskostnaderna för den som anställer nyanlända och långtidsarbetslösa"
  - id: M-054
    parti: M
    sida: 8
    rader: '390-392'
    lydelse: "Stärka drivkrafterna för investeringar, forskning och entreprenörskap, genom lägre skatter på företagande"
  - id: M-055
    parti: M
    sida: 8
    rader: '393-394'
    lydelse: "Möjliggöra för fler företag att kunna använda sig av reglerna för personaloptioner"
  - id: M-056
    parti: M
    sida: 8
    rader: '395'
    lydelse: "Förenkla 3:12-reglerna"
  - id: M-057
    parti: M
    sida: 8
    rader: '396-397'
    lydelse: "Korta myndigheternas handläggningstider genom en bortre tidsgräns"
  - id: M-058
    parti: M
    sida: 8
    rader: '398-399'
    lydelse: "Få på plats en nationell samordning över samhällets behov av antalet utbildningsplatser för att förbättra kompetensförsörjningen"
  - id: M-059
    parti: M
    sida: 8
    rader: '400'
    lydelse: "Sätta stopp för kompetensutvisningarna"
  - id: M-060
    parti: M
    sida: 8
    rader: '404-417'
    lydelse: "Företagare är många gånger måltavla för de kriminella gängens systemhotande angrepp. Det är ett grundläggande politiskt ansvar att rättsstaten finns där med sin fulla kraft när företagare blir utsatta för brott. Idag uppgår de belopp som företag lägger på att skydda sina verksamheter från kriminalitet till mycket höga summor. Och var femte företagare som drabbats av kriminalitet överväger att lägga ner sitt företag på grund av brottsligheten. Så här kan det inte fortsätta. Den otrygghet som idag drabbar Sveriges näringsliv är inte bara ett oacceptabelt hot mot den enskilde företagaren - utan mot hela landets välstånd."
  - id: M-061
    parti: M
    sida: 8
    rader: '419-420'
    lydelse: "Ge Brå i uppdrag att kartlägga brott mot företag"
  - id: M-062
    parti: M
    sida: 8
    rader: '421-422'
    lydelse: "Ge butiksägare rätt att bestämma vem som får vistas i butikslokalen"
  - id: M-063
    parti: M
    sida: 8
    rader: '423-425'
    lydelse: "Ge företag som är engagerade i säkerhetskänslig verksamhet bättre stöd från staten att kunna möta cyberattacker, spionage och stöldförsök från främmande makt"
  - id: M-064
    parti: M
    sida: 8
    rader: '428-438,443-445'
    lydelse: "Sverige är på många sätt ett föregångsland, men mycket återstår innan vårt samhälle kan beskrivas som jämställt. Kvinnor i Sverige äger bara hälften av vad män äger. Av totala kapitalinkomster står kvinnor för en knapp tredjedel. Kvinnor i Sverige förvärvsarbetar fortfarande i lägre utsträckning än män och är sjukskrivna i högre utsträckning. Kvinnors inkomster är 83 procent av mäns inkomster i åldern 20-64 år. Särskilt utrikes födda kvinnor är ekonomiskt ojämställda männen. Majoriteten av kvinnorna från de stora asylländerna - Afghanistan, Somalia och Syrien - har en mycket liten inkomst från eget arbete. I många fall nära noll. Ökad självförsörjning ger ökad egenmakt."
  - id: M-065
    parti: M
    sida: 9
    rader: '447-449'
    lydelse: "Avskaffa flerbarnstillägget från och med barn fyra så att inte kvinnor i stora familjer fastnar i hemmet"
  - id: M-066
    parti: M
    sida: 9
    rader: '450-451'
    lydelse: "Öka flexibiliteten i föräldraförsäkringen och göra fler dagar till dubbeldagar"
  - id: M-067
    parti: M
    sida: 9
    rader: '452-453'
    lydelse: "Minska förekomsten av delade turer i offentlig vård och omsorg"
  - id: M-068
    parti: M
    sida: 9
    rader: '454'
    lydelse: "Minska det ofrivilliga deltidsarbetet"
  - id: M-069
    parti: M
    sida: 9
    rader: '455-456'
    lydelse: "Betala ut försörjningsstöd till kvinnan i stället för till mannen"
  - id: M-070
    parti: M
    sida: 9
    rader: '460-466,468-476'
    lydelse: "Samtidigt som många jobbar hårt för att kunna betala räkningarna finns det de som systematiskt lurar till sig av våra gemensamma pengar. Det är orättvist. Det är dessutom brottsligt. Varje år försvinner runt 20 miljarder kronor av det som skulle ha gått till välfärden i stället ner i fickorna på bidragsfuskare och kriminella. För dessa pengar hade 29 000 poliser kunnat anställas. Ett viktigt första steg är att fastställa vilka som lever i Sverige och att stoppa fusket med tillfälliga personnummer - samordningsnummer. Moderaterna tänker ta kontroll över folkbokföringen för att stoppa bidragsbrotten och se till att de skattepengar du betalar in används till det de är avsedda för. I ett första steg är målet att halvera bidragsbrotten under nästa mandatperiod."
  - id: M-071
    parti: M
    sida: 9
    rader: '478-479'
    lydelse: "Genomföra en nationell folkräkning för att stoppa bidragsbrotten"
  - id: M-072
    parti: M
    sida: 9
    rader: '480-482'
    lydelse: "Kräva personlig inställelse för att bekräfta samordningsnummer, annars ska det återkallas"
  - id: M-073
    parti: M
    sida: 9
    rader: '483'
    lydelse: "Skärpa straffen för bidragsbrott"
  - id: M-074
    parti: M
    sida: 9
    rader: '484-485'
    lydelse: "Inrätta en bidragsbrottsenhet på Försäkringskassan"
  - id: M-075
    parti: M
    sida: 9
    rader: '486-487'
    lydelse: "Stoppa utbetalningar av skattemedel till extremister"
  - id: M-076
    parti: M
    sida: 9
    rader: '488-490'
    lydelse: "Inrätta ett effektiviseringskansli som ska gå inom alla myndigheters ekonomi för att frigöra resurser till försvaret"
  - id: M-077
    parti: M
    sida: 10
    rader: '501-507'
    lydelse: "Tryggheten har blivit vår tids stora frihetsfråga. Det finns idag inget annat EU-land där en så stor del av invånarna dör av gängskjutningar som i Sverige. Mammor vittnar om hur de inte vågar släppa ut sina barn för att leka på innergården. Föräldrar vågar inte låta sina barn gå hem själva efter fotbollsträningen av rädsla för att något ska hända på vägen hem."
  - id: M-078
    parti: M
    sida: 10
    rader: '508-515'
    lydelse: "Människor är rädda för att röra sig ute ensamma på kvällen. Personer utger sig för att exempelvis vara poliser och tränger sig in i äldres bostäder för att stjäla deras pengar och värdesaker. Näringslivet vittnar om att brottsligheten numera gör det svårt att rekrytera arbetskraft från övriga Norden. Folk från våra grannländer vågar helt enkelt inte flytta hit."
  - id: M-079
    parti: M
    sida: 10
    rader: '516-526'
    lydelse: "Sverige har samtidigt blivit hårt drabbat av utländska stöldligor - som plockar på sig bilar, bildelar, båtmotorer och dyra föremål och för dem ut ur landet. Så här kan vi inte ha det. Den som vill få ordning på Sverige måste därför först få ordning på vår inre och yttre säkerhet. Moderaterna tänker lägga om rättspolitiken för att återupprätta tryggheten, så att du kan känna dig trygg. Brottslingarna ska sitta inne - och du ska våga vara ute och få behålla det som är ditt."
  - id: M-080
    parti: M
    sida: 10
    rader: '530-537'
    lydelse: "På kort sikt är den mest effektiva brottsförebyggande åtgärden att sätta fler gängkriminella i fängelse. Där kan de inte begå fler brott och inte rekrytera in fler ungdomar och barn in i kriminalitet. Samtidigt behövs satsningar på socialtjänsten och skolan för att på sikt förhindra att fler dras in i kriminalitet. Moderaterna vill därför genomföra det största brottsförebyggande reformpaketet i modern tid. Det handlar om över 50 reformer för att stärka socialtjänst, skola och missbruksvård."
  - id: M-081
    parti: M
    sida: 10
    rader: '538-546'
    lydelse: "Utöver detta finns åtgärder att vidta för att öka människors trygghet i vardagen. Många känner sig otrygga utomhus under kvällstid på grund av dåligt belysta och mörka platser. Att göra obelysta platser tillgängliga och trygga är därför en av de viktigaste åtgärderna för att öka känslan av trygghet utomhus. Moderaterna vill komma till rätta med detta problem genom att satsa på trygga utemiljöer, med förbättrad belysning som en viktig del."
  - id: M-082
    parti: M
    sida: 10
    rader: '548'
    lydelse: "Betona och förstärka föräldraansvaret"
  - id: M-083
    parti: M
    sida: 10
    rader: '549'
    lydelse: "Säkerställa att fler omhändertas enligt LVU"
  - id: M-084
    parti: M
    sida: 10
    rader: '550-551'
    lydelse: "Se till att placerade ungdomar ges bättre utbildning"
  - id: M-085
    parti: M
    sida: 10
    rader: '552-553'
    lydelse: "Undanröja alla sekretesshinder mellan socialtjänst och polis"
  - id: M-086
    parti: M
    sida: 10
    rader: '554-556'
    lydelse: "Inrätta ett nationellt kunskapscentrum för brottsprevention och ett nationellt avhopparprogram för gängkriminella"
  - id: M-087
    parti: M
    sida: 10
    rader: '557-558'
    lydelse: "Genomföra ett särskilt idrottslyft för utsatta områden"
  - id: M-088
    parti: M
    sida: 10
    rader: '559-561'
    lydelse: "Satsa på trygga utemiljöer, där en viktig del är att lysa upp obelysta platser runtom i Sverige"
  - id: M-089
    parti: M
    sida: 11
    rader: '565-570'
    lydelse: "Brottsofferperspektivet behöver stärkas i svenskt rättsväsende. Det är inte rimligt att våldtäktsmannen kan få högre skadestånd för att ha suttit inlåst för länge, än vad våldtäktsoffret får för att ha blivit våldtagen. Rättssamhället måste alltid stå på brottsoffrets sida. Moderaterna kommer kraftigt stärka brottsoffrets ställning i rättsprocessen."
  - id: M-090
    parti: M
    sida: 11
    rader: '572'
    lydelse: "Dubbla skadestånden till brottsoffer"
  - id: M-091
    parti: M
    sida: 11
    rader: '573-574'
    lydelse: "Underlätta utbetalningen av ersättning till brottsoffer för att minska lidandet"
  - id: M-092
    parti: M
    sida: 11
    rader: '575'
    lydelse: "Stärka skyddet för vittnen och brottsoffer"
  - id: M-093
    parti: M
    sida: 11
    rader: '579-582'
    lydelse: "Rättspolitiken ska vara rättvis. Men i dag kan en våldtäktsman få högre skadestånd än sina brottsoffer. Och straffen som döms ut speglar ofta inte brottens allvar."
  - id: M-094
    parti: M
    sida: 11
    rader: '583-586'
    lydelse: "Nyligen dömde en dansk domstol en 17-årig svensk gängkriminell till 16 års fängelse för mord. I Sverige hade straffet stannat vid fyra års sluten ungdomsvård."
  - id: M-095
    parti: M
    sida: 11
    rader: '587-589'
    lydelse: "Den så kallade ”Nytorgsmannen” dömdes tidigare i år för en rad grova sexuella brott inklusive sju våldtäkter. På grund av straffrabatter och villkorlig frigivning kommer han att sitta i fängelse i knappt 3,5 år. Det är ett hån mot brottsoffren."
  - id: M-096
    parti: M
    sida: 11
    rader: '590-591'
    lydelse: "Våldtäktsmän ska inte få rabatt. Med Moderaternas straffskärpningar kommer samma brott i stället att leda till minst 12 år i fängelse."
  - id: M-097
    parti: M
    sida: 11
    rader: '593-594'
    lydelse: "Införa en ny brottsbalk för att skifta fokus från gärningsmannen till brottsoffer"
  - id: M-098
    parti: M
    sida: 11
    rader: '595'
    lydelse: "Skärpa straffen för vålds- och sexualbrott"
  - id: M-099
    parti: M
    sida: 11
    rader: '596-597'
    lydelse: "Ta bort alla straffrabatter för den som fyllt 18 år och slopa dagens mängdrabatter"
  - id: M-100
    parti: M
    sida: 11
    rader: '598'
    lydelse: "Införa ett system med kraftiga straffskärpningar vid återfall"
  - id: M-101
    parti: M
    sida: 11
    rader: '599-600'
    lydelse: "Utvisa den som har medborgarskap i annat land och begår brott på fängelsenivå"
  - id: M-102
    parti: M
    sida: 11
    rader: '601-602'
    lydelse: "Införa ett nytt äldrefridsbrott för att stävja brott mot äldre"
  - id: M-103
    parti: M
    sida: 11
    rader: '603-604'
    lydelse: "Se till att våld mot poliser alltid leder till långa fängelsestraff"
  - id: M-104
    parti: M
    sida: 11
    rader: '605-608'
    lydelse: "Införa en ny typ av förvaringsstraff så att serievåldtäktsmän och andra samhällsfarliga brottslingar kan sitta frihetsberövade så länge de är farliga för allmänheten"
  - id: M-105
    parti: M
    sida: 11
    rader: '612-616'
    lydelse: "Trots det ökade gängvåldet är polistätheten lägre nu än för tio år sedan. I vissa delar av landet finns ibland bara en polispatrull på en yta lika stor som Danmark. Ingen ska behöva vänta i flera timmar på att polisen kommer."
  - id: M-106
    parti: M
    sida: 11
    rader: '617-621'
    lydelse: "Moderaterna vill införa ett nytt polismål som innebär att polistätheten i Sverige motsvarar genomsnittet inom EU. Det innebär 10 000 fler poliser senast år 2028. För att det ska bli möjligt måste polisyrket blir mer attraktivt."
  - id: M-107
    parti: M
    sida: 11
    rader: '622-629,679-681'
    lydelse: "Moderaterna kommer att avsätta medel för höjda polislöner och se till att CSN-lån skrivs av i takt med att personen börjar arbeta som polis. En viktig del i att göra yrket mer attraktivt är också att se till att poliserna har rätt förutsättningar i sitt arbete. Det handlar till exempel om kroppskameror men också vattenkanoner vid upplopp likt de vi såg i våras - och om att kraftigt skärpa straffen för den som attackerar blåljuspersonal. Det handlar också om att renodla polisens uppdrag - att låta poliser vara poliser och överlåta exempelvis passhantering till andra myndigheter."
  - id: M-108
    parti: M
    sida: 13
    rader: '683-684'
    lydelse: "Arbeta efter målet om 10 000 fler poliser till år 2028 med fokus på fler poliser i yttre tjänst"
  - id: M-109
    parti: M
    sida: 13
    rader: '685-686'
    lydelse: "Rikta en särskild lönesatsning till poliser - så att fler stannar kvar och söker sig till yrket"
  - id: M-110
    parti: M
    sida: 13
    rader: '687-688'
    lydelse: "Skriva av studielånen för den som utbildar sig och börjar arbeta som polis"
  - id: M-111
    parti: M
    sida: 13
    rader: '689-690'
    lydelse: "Renodla Polisens uppdrag med fokus på att upptäcka, utreda och klara upp brott"
  - id: M-112
    parti: M
    sida: 13
    rader: '691-693'
    lydelse: "Satsa på polisens utrustning, exempelvis kroppskameror men också vattenkanoner att använda vid exempelvis upplopp"
  - id: M-113
    parti: M
    sida: 13
    rader: '694'
    lydelse: "Kraftigt öka antalet övervakningskameror"
  - id: M-114
    parti: M
    sida: 13
    rader: '695-696'
    lydelse: "Återinföra de specialiserade narkotikapoliserna"
  - id: M-115
    parti: M
    sida: 13
    rader: '697-699'
    lydelse: "Inrätta särskilda utredningsgrupper för sexualbrott och våld i nära relation samt en särskild klanbrottsenhet"
  - id: M-116
    parti: M
    sida: 13
    rader: '703-712'
    lydelse: "Svenskt rättsväsende är uppenbart underdimensionerat i förhållande till den kriminalitet som samhället drabbas av idag. Under 2020 klarades endast 1 av 4 av alla gängmord upp. Många brott kräver alltmer komplicerade och tidskrävande utredningar. En förutsättning för att fler brottslingar ska kunna lagföras och dömas är att åklagarna har möjlighet att göra sitt jobb. Det underlättas förstås när åklagarna bli fler. Det är därför angeläget att öka rekryteringen av åklagare så att utbyggnaden av Åklagarmyndigheten kan gå i takt med polisens utökning."
  - id: M-117
    parti: M
    sida: 13
    rader: '713-719'
    lydelse: "Trängseln på landets häkten och anstalter börjar på många håll i landet bli ohållbar. Att öka antalet fängelseplatser är därför mycket angeläget, både på kort och på lång sikt. Moderaternas satsningar på Polisen och åklagarna kommer i sig leda till att fler personer blir frihetsberövade och att fler kommer att avtjäna fängelsestraff."
  - id: M-118
    parti: M
    sida: 13
    rader: '721-722'
    lydelse: "Satsa på fler åklagare så att fler brott kan leda till fällande dom"
  - id: M-119
    parti: M
    sida: 13
    rader: '723'
    lydelse: "Öka antalet fängelseplatser och se över möjligheten att hyra fängelseplatser utomlands"
  - id: M-120
    parti: M
    sida: 13
    rader: '724-725'
    lydelse: "Stärka tullen med mer resurser och kraftfulla befogenheter för att stoppa stöldligor och vapensmugglare"
  - id: M-121
    parti: M
    sida: 13
    rader: '727-733'
    lydelse: "Under 2021 inträffade 342 skjutningar och 79 fullbordade sprängningar - i snitt mer än en skjutning eller sprängning om dagen. Och det här året har inletts med fler dödskjutningar än någonsin tidigare. Fram till mitten av augusti i år har det skett lika många dödskjutningar som under hela 2021."
  - id: M-122
    parti: M
    sida: 13
    rader: '734-744'
    lydelse: "Sverige tillhör numera europatoppen i antalet dödskjutningar. Samtidigt breder en tystnadskultur ut sig i de utsatta områdena där gängen styr. Människor vågar inte vittna. Gäng sätter upp egna vägspärrar för att kontrollera vilka som åker in och ut ur områden och begränsar på det sättet friheten för alla andra som bor där. Poliser vittnar om ett råare klimat med grova och personliga hot mot blåljuspersonal. Gängen är Sveriges inhemska terrorister - och lagstiftningen måste anpassas därefter så att fler ställs till svars och försvinner från gatan."
  - id: M-123
    parti: M
    sida: 13
    rader: '746-747'
    lydelse: "Göra det straffbart att vara med i ett kriminellt gäng"
  - id: M-124
    parti: M
    sida: 14
    rader: '762'
    lydelse: "Införa dubbla straff för gängkriminella"
  - id: M-125
    parti: M
    sida: 14
    rader: '763-764'
    lydelse: "Skärpa minimistraffen för grova vapenbrott från dagens 2 års fängelse till 6 års fängelse"
  - id: M-126
    parti: M
    sida: 14
    rader: '765-766'
    lydelse: "Införa visitationszoner så att Polisen får bättre möjligheter att leta efter vapen"
  - id: M-127
    parti: M
    sida: 14
    rader: '767-768'
    lydelse: "Tillåta anonyma vittnen så att fler vågar vittna"
  - id: M-128
    parti: M
    sida: 14
    rader: '769-770'
    lydelse: "Utvisa gängmedlemmar, som inte är svenska medborgare, oavsett om de dömts för brott"
  - id: M-129
    parti: M
    sida: 14
    rader: '771-772'
    lydelse: "Ta gängens pengar och införa en omvänd bevisbörda för att kunna beslagta gängmedlemmarnas lyxprylar"
  - id: M-130
    parti: M
    sida: 14
    rader: '773-774'
    lydelse: "Införa ett bidragsstopp för gängkriminella och göra det enklare att vräka dem"
  - id: M-131
    parti: M
    sida: 14
    rader: '775-776'
    lydelse: "Begränsa möjligheterna till permission och villkorlig frigivning för gängkriminella"
  - id: M-132
    parti: M
    sida: 14
    rader: '777'
    lydelse: "Införa en helt ny möjlighet till långtidsövervakning med fotboja"
  - id: M-133
    parti: M
    sida: 14
    rader: '780-783,791-797'
    lydelse: "Elva kvinnor misstänks ha blivit mördade under årets första månader. I sju av fallen tros förövaren vara en man de har eller har haft en relation med. Män som upprepade gånger slår, hotar eller utsätter sin kvinnliga partner för sexualbrott blir idag dömda för grov kvinnofridskränkning. Moderaterna vill skärpa straffen för detta brott och göra det lättare att häkta våldsutövaren så att en våldsam partner omedelbart kan sättas bakom lås och bom i avvaktan på att brottet utreds. Fler män som utsätter kvinnor för våld borde tvingas bära fotboja. Idag kan fotboja enbart bli aktuellt om mannen har brutit mot sitt kontaktförbud. Då är det för sent."
  - id: M-134
    parti: M
    sida: 14
    rader: '799-800'
    lydelse: "Ändra i lagen så att mord i nära relation alltid leder till livstids fängelse"
  - id: M-135
    parti: M
    sida: 14
    rader: '801-804'
    lydelse: "Sänka gränsen för obligatorisk häktning så att den gäller misstänkta för brott med ett straffvärde på minst ett års fängelse, inte två års fängelse som idag"
  - id: M-136
    parti: M
    sida: 14
    rader: '805-808'
    lydelse: "Införa särskilda grupper i varje polisregion som är specialiserade på sexualbrott och våld i nära relation för att fler anmälda brott ska leda till lagföring och straff"
  - id: M-137
    parti: M
    sida: 14
    rader: '809-812'
    lydelse: "Införa vistelseförbud för personer som dömts för våld i nära relation, så att den som utsatt sin tidigare partner för våld och övergrepp kan förbjudas att vara i ett visst bostadsområde även efter att ha släppts ur fängelset"
  - id: M-138
    parti: M
    sida: 14
    rader: '813-815'
    lydelse: "Införa kontaktförbud och fotboja direkt för en man som utsätter en kvinna för våld, om en riskbedömning visar att det finns behov"
  - id: M-139
    parti: M
    sida: 14
    rader: '816'
    lydelse: "Fortsätta stärka kvinnojourerna"
  - id: M-140
    parti: M
    sida: 15
    rader: '852-867'
    lydelse: "Sedan 2014 har antalet ungdomsrån mer än fördubblats. Fruktansvärda skildringar av brutala rån mot unga som karaktäriseras av råhet och vilja att förnedra brottsoffren har på senare tid blivit vanligare i media. Rånen visar på en utveckling där ungdomsbrottsligheten både har blivit allt grövre och gärningsmännen allt yngre. Idag kan unga personer som grips för mycket grova brott vara tillbaka på gatan redan samma dag - trots att risken för återfall i brottslighet är uppenbar. Moderaterna menar att samhällets skyddsnät ska fungera så pass bra att unga i riskzonen fångas upp långt innan de begår allvarliga brott - men att de som ändå väljer den brottsliga vägen ska mötas av tidiga och tydliga konsekvenser."
  - id: M-141
    parti: M
    sida: 15
    rader: '869-871'
    lydelse: "Se till att rån med förnedringsinslag rubriceras som grova rån, vilket alltid ska leda till strängare straff"
  - id: M-142
    parti: M
    sida: 15
    rader: '872-875'
    lydelse: "Ta bort sekretesshindren mellan polis och socialtjänst samt inrätta ett nationellt no entry-program för unga i riskzonen i syfte att snabbt stoppa en påbörjad kriminell karriär"
  - id: M-143
    parti: M
    sida: 15
    rader: '876'
    lydelse: "Se till att fler unga lagöverträdare omhändertas enligt lagen om vård av unga"
  - id: M-144
    parti: M
    sida: 15
    rader: '877-879'
    lydelse: "Se till att fler unga lagöverträdare häktas när det rör sig om allvarliga brott och det finns risk för återfall"
  - id: M-145
    parti: M
    sida: 15
    rader: '881-887'
    lydelse: "I skuggan av skjutningarna rapporteras allt oftare om rån mot äldre, som ibland utförs genom att okända personer tränger in i bostaden för att stjäla pengar eller värdesaker. Brotten sker även utomhus, där äldre kan ha svårt att värja sig mot fickstölder, väskryckningar eller bedragare som lurar till sig bankomatkort och kod. Också telefonbedrägerierna ökar kraftigt i antal. Kriminalitet som riktar sig mot sårbara människor är extra klandervärd."
  - id: M-146
    parti: M
    sida: 15
    rader: '889-890'
    lydelse: "Införa äldrefridsbrott som en ny brottsrubricering i syfte att skärpa straffen för dessa brott"
  - id: M-147
    parti: M
    sida: 15
    rader: '891'
    lydelse: "Satsa mer pengar på att utreda bedrägeribrott och annan brottslighet mot äldre"
  - id: M-148
    parti: M
    sida: 15
    rader: '892-893'
    lydelse: "Utreda införandet av en statlig stödlinje för äldre brottsoffer"
  - id: M-149
    parti: M
    sida: 15
    rader: '894-895'
    lydelse: "Utöka rätten till målsägandebiträde för äldre brottsoffer"
  - id: M-150
    parti: M
    sida: 15
    rader: '896-897'
    lydelse: "Utreda sänkt straffmyndighetsålder och inrätta ungdomsfängelser"
  - id: M-151
    parti: M
    sida: 16
    rader: '904-910'
    lydelse: "Mitt i klimatkrisen tvingas Sverige elda 140 000 liter olja i timmen i Karlshamnsverket för att elen ska räcka. Det är inte en hållbar energipolitik. Och en helt ohållbar klimatpolitik. Utan ren och stabil el till rimligt pris blir det ingen klimatomställning. Moderaterna tänker genomdriva en ny energipolitik - med mer kärnkraft - både för klimatets och för energiförsörjningens skull."
  - id: M-152
    parti: M
    sida: 16
    rader: '911-914,916-918'
    lydelse: "Vi ska som land ta fullt ansvar här hemma och nå nettonollutsläpp senast år 2045. Det gör vi genom att ersätta fossil energi med ren el och innovativa tekniker som minskar eller tar bort utsläppen. Samtidigt ska vi hjälpa andra länder att minska sina utsläpp genom effektivt internationellt samarbete."
  - id: M-153
    parti: M
    sida: 16
    rader: '919-922'
    lydelse: "Vår miljöpolitik tar sin utgångspunkt i människan samt i naturen och dess rika tillgångar. Människors rätt att äga ska värnas så att skogen kan brukas långsiktigt och hållbart till nytta för klimatet och miljön."
  - id: M-154
    parti: M
    sida: 16
    rader: '923-924,986-988'
    lydelse: "Våra rika mineraltillgångar ska kunna utvinnas ansvarsfullt och långsiktigt hållbart. Vi är övertygade om att politiska styrmedel i kombination med teknisk utveckling och ekonomisk tillväxt kan göra vårt klimatavtryck mindre och vår livsmiljö renare."
  - id: M-155
    parti: M
    sida: 17
    rader: '989-992'
    lydelse: "Sveriges fantastiska natur ska skyddas och vara tillgänglig så att var och en kan njuta av den. Vi ska slå vakt om allemansrätten och minska övergödning, försurning, utsläpp av farliga ämnen och nedskräpning, inte minst i Östersjön."
  - id: M-156
    parti: M
    sida: 17
    rader: '994-996'
    lydelse: "Den gröna omställningen förpliktigar. Fram till 2045 kommer Sveriges elbehov mer än fördubblas."
  - id: M-157
    parti: M
    sida: 17
    rader: '997-1008'
    lydelse: "Ska vi klara det behövs en elproduktion där alla fossilfria energikällor är med och bidrar. I det läge Sverige har hamnat i på grund av dåliga politiska beslut kommer en utbyggnad av kärnkraften att vara helt central. Det är avgörande både för energiförsörjningen och klimatet. Inte minst finns ett behov av att bygga många nya, mindre reaktorer snarare än ett fåtal stora för att säkerställa att det finns elproduktion som fungerar oberoende av väder och vind. Moderaterna vill att staten garanterar lån för byggandet av ny kärnkraft - det skulle möjliggöra att 10 nya reaktorer byggs."
  - id: M-158
    parti: M
    sida: 17
    rader: '1010-1011'
    lydelse: "Ändra det energipolitiska målet från 100 procent förnybart till 100 procent fossilfritt"
  - id: M-159
    parti: M
    sida: 17
    rader: '1012-1013'
    lydelse: "Ge resurser till Strålsäkerhetsmyndigheten för att ta fram ett regelverk för ny kärnkraft"
  - id: M-160
    parti: M
    sida: 17
    rader: '1014-1015'
    lydelse: "Avskaffa förbudet mot att bygga reaktorer på andra platser än vid de befintliga kärnkraftverken"
  - id: M-161
    parti: M
    sida: 17
    rader: '1016-1018'
    lydelse: "Ge Vattenfall i uppdrag att omedelbart genomföra en förstudie för att bygga ny kärnkraft vid Ringhals"
  - id: M-162
    parti: M
    sida: 17
    rader: '1019'
    lydelse: "Ge nybyggd kärnkraft rätten till drift och elproduktion under hela sin tekniska livslängd"
  - id: M-163
    parti: M
    sida: 17
    rader: '1020-1021'
    lydelse: "Ta bort förbudet mot att ha fler än tio kärnkraftsreaktorer i drift"
  - id: M-164
    parti: M
    sida: 18
    rader: '1025-1026'
    lydelse: "Införa gröna kreditgarantier för ny kärnkraft - staten ska underlätta finansieringen"
  - id: M-165
    parti: M
    sida: 18
    rader: '1027-1028'
    lydelse: "Införa ett statligt högkostnadsskydd för konstruktionen av ny kärnkraft"
  - id: M-166
    parti: M
    sida: 18
    rader: '1029-1030'
    lydelse: "Investera i det svenska elnätet och korta tillståndsprocesserna för elnätsutbyggnad"
  - id: M-167
    parti: M
    sida: 18
    rader: '1031-1032'
    lydelse: "Upphandla kraftproduktion som stärker stabiliteten"
  - id: M-168
    parti: M
    sida: 18
    rader: '1033-1034'
    lydelse: "Avskaffa avfallsförbränningsskatten för att öka kapaciteten i kraftvärmeverket"
  - id: M-169
    parti: M
    sida: 18
    rader: '1037-1045'
    lydelse: "Sverige står för cirka 0,1 procent av de totala utsläppen i världen. Här hemma utgör transporter och industrier tillsammans två tredjedelar av utsläppen. Vår politik syftar därför till att ställa om transportsektorn genom elektrifiering. Vi vill snabbt bygga ett nätverk av laddstationer för personbilar och lastbilar i hela landet. Utöver det vill vi förkorta och förenkla tillståndsprocesser för industrier som satsar på omställning och få på plats en storskalig satsning på tekniker för att fånga in och lagra koldioxid."
  - id: M-170
    parti: M
    sida: 19
    rader: '1067-1071'
    lydelse: "Samtidigt är kostnaden för att minska utsläppen genom internationella klimatinsatser ofta mycket lägre än för att minska utsläppen i Sverige - därför kommer Moderaterna också att rikta om biståndet för att minska utsläppen i andra länder."
  - id: M-171
    parti: M
    sida: 19
    rader: '1073-1074'
    lydelse: "Bygga ut laddstolpar och laddstationer i hela landet"
  - id: M-172
    parti: M
    sida: 19
    rader: '1075'
    lydelse: "Satsa på tillverkning av biodrivmedel"
  - id: M-173
    parti: M
    sida: 19
    rader: '1076-1077'
    lydelse: "Få på plats storskalig infångning av koldioxid"
  - id: M-174
    parti: M
    sida: 19
    rader: '1078-1079'
    lydelse: "Fortsätta satsa på Industriklivet som hjälper industrin att ställa om"
  - id: M-175
    parti: M
    sida: 19
    rader: '1080'
    lydelse: "Öka klimatbiståndets andel av det totala biståndet för att minska utsläppen utomlands"
  - id: M-176
    parti: M
    sida: 19
    rader: '1083-1090'
    lydelse: "Det nya säkerhetsläget i Europa gör att vi som land måste minska vår sårbarhet och öka vår självförsörjningsgrad. Samtidigt vittnar bönder om att det inte lönar sig att så inför sommarsäsongen. Det är ohållbart. Moderaterna vill förbättra förutsättningarna att driva lantbruk genom att sänka skatterna, vilket vi redan börjat göra på drivmedel, och minska regelkrånglet så att kostnaderna för administration går ner."
  - id: M-177
    parti: M
    sida: 19
    rader: '1091-1096'
    lydelse: "Nästan två tredjedelar av Sveriges yta är täckt av skog. Den svenska skogen och produkter från skogen binder årligen nästan lika mycket koldioxid som Sverige släpper ut under ett helt år. Skogsbruket är även viktigt för att tillverka bland annat biodrivmedel."
  - id: M-178
    parti: M
    sida: 19
    rader: '1097-1103'
    lydelse: "Äganderätten är en förutsättning för ett hållbart skogsbruk. Det man äger vårdar man, och egenansvar skapar de bästa förutsättningarna för en levande landsbygd. Idag är närmare 30 procent av skogsmarken tagen ur produktion. Det är dåligt för Sverige och för klimatet - mer skog ska brukas, inte mindre."
  - id: M-179
    parti: M
    sida: 20
    rader: '1116-1117'
    lydelse: "Minska antalet regler för jordbruket och korta handläggningstider för miljötillstånd"
  - id: M-180
    parti: M
    sida: 20
    rader: '1118'
    lydelse: "Förstärka livsmedelsstrategin"
  - id: M-181
    parti: M
    sida: 20
    rader: '1119-1120'
    lydelse: "Stärka ägande- och brukanderätten för jordbrukare"
  - id: M-182
    parti: M
    sida: 20
    rader: '1121'
    lydelse: "Sänka slakteriavgifterna"
  - id: M-183
    parti: M
    sida: 20
    rader: '1122-1123'
    lydelse: "Minska ytan av skog som är undantagen från skogsbruk"
  - id: M-184
    parti: M
    sida: 20
    rader: '1124-1125'
    lydelse: "Vårda redan skyddad skog bättre för att stärka den biologiska mångfalden"
  - id: M-185
    parti: M
    sida: 20
    rader: '1126-1127'
    lydelse: "Sälja av en större andel av statliga Sveaskogs innehav till personer med regional anknytning"
  - id: M-186
    parti: M
    sida: 20
    rader: '1128-1130'
    lydelse: "Stärka skogsägarnas äganderätt genom att formellt skydd av skog ska ske genom frivillighet"
  - id: M-187
    parti: M
    sida: 20
    rader: '1133-1147'
    lydelse: "Jakt och djurhållning är för många människor en viktig del av livet, kanske framför allt för de som bor utanför storstadsregionerna, med den närhet till naturen som det ofta innebär. Den svenska jakten är också en viktig del av vår kultur. Jägarnas insatser är en starkt bidragande orsak till att vi har livskraftiga viltstammar i landet. Det ska värnas. Det är viktigt att EU:s vapendirektiv inte genomförs i svensk lagstiftning så att du som är jägare, sportskytt eller vapensamlare drabbas negativt. Samtidigt ska du som äger tamboskap inte lida ekonomisk skada på grund av rovdjursangrepp som du inte haft möjlighet att förhindra. Fiskerinäringen har drabbats hårt av minskade bestånd på senare år inte minst på grund av det kustnära trålfisket - den utvecklingen måste brytas."
  - id: M-188
    parti: M
    sida: 20
    rader: '1149-1150'
    lydelse: "Verka för att minska vargstammen i Sverige till 170 vargar - genom ökad jakt"
  - id: M-189
    parti: M
    sida: 20
    rader: '1151'
    lydelse: "Värna den svenska löshundsjakten"
  - id: M-190
    parti: M
    sida: 20
    rader: '1152-1153'
    lydelse: "Se till att fjälljakten är tillgänglig för alla svenska jägare på lika villkor"
  - id: M-191
    parti: M
    sida: 20
    rader: '1154-1155'
    lydelse: "Arbeta för kortade handläggningstider för vapenlicenser"
  - id: M-192
    parti: M
    sida: 20
    rader: '1156'
    lydelse: "Inrätta en ny viltmyndighet"
  - id: M-193
    parti: M
    sida: 20
    rader: '1157-1158'
    lydelse: "Höja ersättningsnivåerna för rovdjursangrepp så att de ligger i nivå med de faktiska kostnaderna"
  - id: M-194
    parti: M
    sida: 20
    rader: '1159-1160'
    lydelse: "Stävja minskningen av sill-/strömmingsbestånden i Östersjön genom att flytta gränsen för trålfiske från fyra till tolv nautiska mil"
  - id: M-195
    parti: M
    sida: 20
    rader: '1162-1163'
    lydelse: "Låta jägare sälja vildsvinskött direkt till konsumenter"
  - id: M-196
    parti: M
    sida: 21
    rader: '1169-1173'
    lydelse: "Mer än hälften av världens största områden med döda bottnar finns i Östersjön. Moderaterna vill vidta kraftfulla åtgärder för att förbättra havs- och vattenmiljön. Det handlar om att minska övergödning, försurning, utsläpp av farliga ämnen och marin nedskräpning. Det handlar om att ta ansvar gentemot framtida generationer."
  - id: M-197
    parti: M
    sida: 21
    rader: '1174-1181'
    lydelse: "Antalet anmälda miljöbrott ökar samtidigt som uppklarningsgraden minskar. Straffet för den som blir dömd för brott mot miljöbalken stannar i många fall vid ett lågt bötesbelopp. Småskräp som till exempel fimpar, snus och tuggummi står för en stor andel av all nedskräpning och bidrar till att mikroplaster och kemikalier sprider sig till hav och natur. Dessutom kan djur som får i sig skräpet skadas. Det är dags för en nolltolerans mot nedskräpning för att göra Sverige skräpfritt."
  - id: M-198
    parti: M
    sida: 21
    rader: '1183'
    lydelse: "Bärga miljöfarligt avfall som hittats i haven"
  - id: M-199
    parti: M
    sida: 21
    rader: '1184-1185'
    lydelse: "Minska jordbrukets miljöpåverkan genom stöd till teknikutveckling och innovationer"
  - id: M-200
    parti: M
    sida: 21
    rader: '1186-1187'
    lydelse: "Satsa på forskning om vattenrening samt utbyggnad av avancerad vattenrening"
  - id: M-201
    parti: M
    sida: 21
    rader: '1188-1189'
    lydelse: "Förstärka det gemensamma Östersjöarbetet för åtgärder mot övergödning och nedskräpning"
  - id: M-202
    parti: M
    sida: 21
    rader: '1190-1191'
    lydelse: "Skärpa straffen för miljöbrott och nedskräpning och ge ordningsvakter befogenhet att dela ut böter för småskräp"
  - id: M-203
    parti: M
    sida: 21
    rader: '1194-1205'
    lydelse: "Friluftslivet och naturen ska vara tillgänglig för alla. Det behövs mer statliga resurser för att sköta och förvalta områden med värdefull natur, samt för att rusta upp befintliga och vid behov skapa nya leder i nationalparker och statliga naturreservat. Friluftsanordningar såsom rastplatser, toaletter och eldstäder behöver också byggas ut för att göra naturen tillgänglig för fler. Många markägare ser positivt på friluftsliv på sin mark om det sker med respekt för de rättigheter och skyldigheter som följer med allemansrätten. Detta vill Moderaterna uppmuntra."
  - id: M-204
    parti: M
    sida: 21
    rader: '1207-1208'
    lydelse: "Tydliggöra det offentligas ansvar för friluftslivet"
  - id: M-205
    parti: M
    sida: 21
    rader: '1209-1212'
    lydelse: "Göra naturupplevelser och friluftsliv i statliga naturreservat och nationalparker tillgängliga för fler genom satsningar på leder och friluftsanordningar"
  - id: M-206
    parti: M
    sida: 21
    rader: '1213-1214'
    lydelse: "Stödja privata markägare som vill tillgängliggöra sin mark för friluftslivet genom till exempel hjälp med skyltning och leder"
  - id: M-207
    parti: M
    sida: 21
    rader: '1215-1216'
    lydelse: "Förhindra missbruk av och värna allemansrätten"
  - id: M-208
    parti: M
    sida: 21
    rader: '1217-1219'
    lydelse: "Stärka kunskapen om och tillämpningen av allemansrätten och äganderätten genom utökad information"
  - id: M-209
    parti: M
    sida: 22
    rader: '1223-1227'
    lydelse: "Frihetens, trygghetens och möjligheternas Sverige finns inom räckhåll - bara viljan och kraften finns att få allting gjort som måste göras."
  - id: M-210
    parti: M
    sida: 24
    rader: '1235-1240'
    lydelse: "Invandringen till Sverige behöver minska för att integrationen ska fungera bättre. Förra året beviljades 95 000 uppehållstillstånd. Det motsvarar ett nytt Växjö på bara ett år. På tio år har nästan en halv miljon människor sökt asyl i Sverige och drygt 400 000 har fått asylrelaterade tillstånd. Oproportionerligt många har kommit till Sverige jämfört med våra nordiska grannländer."
  - id: M-211
    parti: M
    sida: 24
    rader: '1241-1249'
    lydelse: "Samtidigt har integrationen misslyckats. Arbetslösheten är idag fem gånger så hög bland utrikes födda som bland inrikes födda, och varannan invandrad person - runt 700 000 personer - är inte självförsörjande. Faktum är att inget annat land i EU har så stor skillnad i arbetslöshet mellan inrikes och utrikes födda. Den som vill få ordning på Sverige måste ta tag i detta."
  - id: M-212
    parti: M
    sida: 24
    rader: '1251-1257'
    lydelse: "En målstyrd, stram och hållbar migrationspolitik är en förutsättning för att integrationen ska fungera. Vår integrationsförmåga ska vara styrande för nivån på invandringen. Antalet asylsökande till Sverige behöver minska betydligt. Av största vikt är att den som fått ett nej på asylansökan så fort som möjligt lämnar landet. Vi riskerar annars ett växande skuggsamhälle, med social utsatthet, illegalt arbete och brottslighet - där särskilt barn drabbas hårt."
  - id: M-213
    parti: M
    sida: 25
    rader: '1269-1270'
    lydelse: "Införa ett volymmål för asylmottagandet på nordiska nivåer"
  - id: M-214
    parti: M
    sida: 25
    rader: '1271-1272'
    lydelse: "Anpassa asyllagstiftningen efter den rättsliga miniminivån enligt EU-rätten"
  - id: M-215
    parti: M
    sida: 25
    rader: '1273-1276'
    lydelse: "Avskaffa möjligheten till spårbyte, det vill säga möjligheten för en person som fått avslag på sin asylansökan att i stället få ett arbetstillstånd"
  - id: M-216
    parti: M
    sida: 25
    rader: '1277-1278'
    lydelse: "Prioritera kvinnor och hbtq-personer i kvotflyktingmottagandet"
  - id: M-217
    parti: M
    sida: 25
    rader: '1286-1296'
    lydelse: "Vem vill bli en del av ett samhälle där ingen räknar med en? Det måste bli ett slut på de låga förväntningarnas politik. Idag finns inga språkkrav för den som invandrat till Sverige inte heller några krav på aktivitet för den som är långtidsarbetslös och lever på bidrag. Och bidragen kan bli så höga när de staplas på varandra att det för många inte lönar sig alls att ta ett jobb. Det finns idag omkring 50 000 hushåll som skulle omfattas av vårt förslag på bidragstak, varav majoriteten består av utrikes födda."
  - id: M-218
    parti: M
    sida: 25
    rader: '1297-1304'
    lydelse: "Arbetslinjen försvagas ytterligare av att regeringens höjning av a-kassan gjort att även de som nyss blivit arbetslösa tackar nej till jobb. En förutsättning för att kunna få ett arbete är ofta att man kan tala begriplig svenska. Moderaterna vill därför göra SFI effektivare. Varje person som läser SFI ska få en individuell prestationsplan med kunskapsmål som han eller hon ska uppnå i sin utbildning."
  - id: M-219
    parti: M
    sida: 25
    rader: '1306-1308'
    lydelse: "Införa kvalificering till välfärden för nyanlända genom eget arbete eller genom permanent och laglig bosättning i landet"
  - id: M-220
    parti: M
    sida: 25
    rader: '1309-1310'
    lydelse: "Ställa krav på heltidsaktiviteter för att få bidrag"
  - id: M-221
    parti: M
    sida: 25
    rader: '1311-1312'
    lydelse: "Kräva grundläggande kunskaper i svenska för permanent uppehållstillstånd och medborgarskap"
  - id: M-222
    parti: M
    sida: 25
    rader: '1313-1314'
    lydelse: "Ställa högre krav på den som deltar i SFIundervisning - om individuella kunskapsmål inte uppnås ska bidragen kunna minska"
  - id: M-223
    parti: M
    sida: 25
    rader: '1315-1317'
    lydelse: "Införa obligatorisk samhällsorientering med prov, där godkänt ska vara ett krav för medborgarskap"
  - id: M-224
    parti: M
    sida: 25
    rader: '1318-1319'
    lydelse: "Utveckla samhällsorienteringen till att fokusera på grundläggande värderingar och hur vi lever i Sverige"
  - id: M-225
    parti: M
    sida: 26
    rader: '1326-1336'
    lydelse: "Inget barn ska behöva känna att möjligheterna i livet är uttömda redan innan det har börjat på allvar. De enskilt viktigaste åtgärderna för att bryta segregationen handlar om kvaliteten i undervisningen och det svenska språket. I dag börjar många barn som är födda i Sverige skolan utan att kunna tala eller förstå svenska, och får därför mycket sämre förutsättningar att klara sin skolgång. Vi föreslår därför omfattande satsningar på svenska språket redan i tidig ålder."
  - id: M-226
    parti: M
    sida: 26
    rader: '1338-1340'
    lydelse: "Införa obligatorisk språkuppföljning vid 3 års ålder för att upptäcka barn som inte kan tala svenska"
  - id: M-227
    parti: M
    sida: 26
    rader: '1341-1342'
    lydelse: "Införa obligatorisk språkförskola för barn som visar en bristande språkutveckling"
  - id: M-228
    parti: M
    sida: 26
    rader: '1343'
    lydelse: "Utöka lovskolan för barn som halkar efter"
  - id: M-229
    parti: M
    sida: 26
    rader: '1346-1354'
    lydelse: "Hederskultur, organiserad brottslighet, penningtvätt och systematiskt bidragsfusk. Det är några av de saker de kriminella klaner som etablerat sig i Sverige idag ägnar sig åt. Det finns nu runt 40 kriminella klaner i Sverige, som har ett omfattande våldskapital och uttalade ambitioner att konkurrera med den svenska staten om kontrollen. Klanen tillhandahåller ett eget system för rättsskipning, skydd mot yttre fiender och ett socialt skyddsnät till sina medlemmar."
  - id: M-230
    parti: M
    sida: 26
    rader: '1355-1358'
    lydelse: "I dessa familjer fostras barn tidigt in i en oacceptabel uppväxtmiljö med en tidigt utstakad brottsbana och ett liv i konflikt med det vanliga samhället."
  - id: M-231
    parti: M
    sida: 26
    rader: '1359-1360'
    lydelse: "Klanrättegångar hör inte hemma i Sverige. De kriminella klanerna ska bekämpas."
  - id: M-232
    parti: M
    sida: 26
    rader: '1362-1363'
    lydelse: "Ge Brå i uppdrag att kartlägga de kriminella klaner som är aktiva i Sverige idag"
  - id: M-233
    parti: M
    sida: 26
    rader: '1364-1365'
    lydelse: "Kriminalisera klanrättegångar och andra otillbörliga parallella rättsprocesser"
  - id: M-234
    parti: M
    sida: 26
    rader: '1366'
    lydelse: "Förbjuda kusinäktenskap"
  - id: M-235
    parti: M
    sida: 26
    rader: '1367-1368'
    lydelse: "Inrätta en särskild klanenhet inom Polisen enligt tysk modell"
  - id: M-236
    parti: M
    sida: 26
    rader: '1369-1370'
    lydelse: "Verka för att fler barn som växer upp i kriminella klaner ska omhändertas"
  - id: M-237
    parti: M
    sida: 26
    rader: '1371-1372'
    lydelse: "Se till att fler kriminella klanmedlemmar utvisas"
  - id: M-238
    parti: M
    sida: 27
    rader: '1377-1381'
    lydelse: "Rysslands invasion av Ukraina har skapat den allvarligaste säkerhetspolitiska krisen i Europa sedan andra världskriget. Sverige ska helhjärtat stå upp för Ukraina, även med fortsatta vapenleveranser. Men omvärldsläget kräver också att vår egen motståndskraft stärks på bred front."
  - id: M-239
    parti: M
    sida: 27
    rader: '1382-1384'
    lydelse: "Försvaret ska därför vara starkt och väl rustat för uppgiften. Det land som inte kan försvara sig, kan vilken dag som helst förlora sin frihet."
  - id: M-240
    parti: M
    sida: 27
    rader: '1385-1393'
    lydelse: "Samtidigt vet vi att ensam inte är stark när Ryssland än en gång står på krigsfot. I försvaret av demokratin är vi säkrare tillsammans med andra. Vi välkomnar därför att Sverige ska gå med i Nato, en fråga vi drivit under 20 års tid. En regering som leds av Moderaterna kommer att vara en garant för att Sverige också blir en aktiv och högt ansedd Natomedlem. Även detta ställer helt nya krav på Sveriges försvar."
  - id: M-241
    parti: M
    sida: 27
    rader: '1394-1405'
    lydelse: "Parallellt med ansökningsprocessen till Nato går Sverige snart in som ordförandeland i EU. Det innebär både ett stort ansvar och stora möjligheter. EU är tillsammans med Nato vårt allra viktigaste internationella samarbete. För Moderaterna är det självklart att Sverige som ordförandeland ska kliva fram och ta ansvar för gemensamma europeiska frågor, som säkerhet och klimat, och samtidigt driva frågor som är särskilt viktiga för Sverige, som villkoren för skogsnäringen. Moderaterna är Europapartiet i svensk politik, och vi är redo att axla uppgiften att leda det svenska EU-ordförandeskapet."
  - id: M-242
    parti: M
    sida: 27
    rader: '1406-1410'
    lydelse: "I en föränderlig omvärld finns skäl att se över Sveriges samlade utrikespolitiska verktygslåda. Exempelvis behöver biståndet som en del av Sveriges samlade utrikespolitik och ett ständigt växande utgiftsområde, reformeras i grunden."
  - id: M-243
    parti: M
    sida: 27
    rader: '1412-1423'
    lydelse: "Försvaret måste stärkas för att vi bättre ska kunna försvara vårt land, hävda vår territoriella integritet och värna svenska intressen. Vidare behöver det svenska försvaret i ökad utsträckning ta höjd för de möjligheter och risker som den allt snabbare teknikutvecklingen innebär. Sammantaget krävs kraftfulla satsningar på såväl det militära som det civila försvaret och att dessa satsningar går i takt för att skapa ett fungerande totalförsvar som stärker Sveriges säkerhet på bred front. Målet är att det svenska försvaret ska vara krigsavhållande och avskräcka en eventuell motståndare från att angripa Sverige."
  - id: M-244
    parti: M
    sida: 27
    rader: '1425'
    lydelse: "Förbereda försvaret för svenskt Natomedlemskap"
  - id: M-245
    parti: M
    sida: 27
    rader: '1426-1428'
    lydelse: "Verka för att försvarsanslagen uppgår till motsvarande 2 procent av BNP redan år 2025"
  - id: M-246
    parti: M
    sida: 27
    rader: '1429-1430'
    lydelse: "Stärka armén, flygpvapnet och marinen både när det gäller förmåga och materiel"
  - id: M-247
    parti: M
    sida: 27
    rader: '1431'
    lydelse: "Stärka försvarsunderrättelseförmågan"
  - id: M-248
    parti: M
    sida: 27
    rader: '1432-1433'
    lydelse: "Inrätta ett nationellt säkerhetsråd på Statsrådsberedningen"
  - id: M-249
    parti: M
    sida: 27
    rader: '1434'
    lydelse: "Utveckla cyberförsvaret"
  - id: M-250
    parti: M
    sida: 28
    rader: '1440-1449'
    lydelse: "Fungerar inte det civila försvaret så kan inte heller det militära försvaret lösa sina uppgifter. Rysslands invasion av Ukraina har lett till utbudsstörningar som kraftigt drivit upp kostnaderna i svensk livsmedelsproduktion. Redan före krigsutbrottet var svenska livsmedelsproducenter hårt pressade av kostnadsökningar. Sveriges självförsörjning av livsmedel är idag omkring 50 procent. Att stärka det civila försvaret är inte bara viktigt för att stärka kapaciteten i det samlade totalförsvaret i händelse av krig. Det civila försvaret är även en avgörande resurs i händelse av kris. Utöver bättre livmedelsberedskap behöver Sverige bygga upp bättre beredskapslager av till exempel läkemedel och sjukvårdsmateriel."
  - id: M-251
    parti: M
    sida: 28
    rader: '1451-1452'
    lydelse: "Införa en handlingsplan med konkreta åtgärder mot hybridhot och cyberattacker"
  - id: M-252
    parti: M
    sida: 28
    rader: '1453-1454'
    lydelse: "Stärka jordbruket för att öka den inhemska produktionen av livsmedel"
  - id: M-253
    parti: M
    sida: 28
    rader: '1455-1456'
    lydelse: "Säkra en långsiktig planering för det civila försvaret"
  - id: M-254
    parti: M
    sida: 28
    rader: '1457'
    lydelse: "Förstärka det civila försvarets personalförsörjning"
  - id: M-255
    parti: M
    sida: 28
    rader: '1458'
    lydelse: "Bygga bättre beredskapslager"
  - id: M-256
    parti: M
    sida: 28
    rader: '1459-1461'
    lydelse: "Ta fram en plan för hur animalieproduktion och växtodling ska kunna bedrivas vid höjd beredskap"
  - id: M-257
    parti: M
    sida: 28
    rader: '1464-1473'
    lydelse: "Moderaterna vill sätta en hög ambitionsnivå för Sverige som blivande Natomedlem. Sverige ska som medlem i Nato vara en säkerhetsproducent i vårt närområde och även få ut mesta möjliga effekt av medlemskapet. Vi kan bidra mer än de allra flesta exempelvis när det gäller stridsflyg och ubåtar, men även inom telekom och artificiell intelligens. Sverige bör bidra konkret till skyddet av våra vänner i de baltiska länderna, exempelvis genom att överväga att skicka bidrag till Natos stridsgrupper eller att delta med vårt stridsflyg i Natos incidentberedskap."
  - id: M-258
    parti: M
    sida: 28
    rader: '1475-1476'
    lydelse: "Verka för ett fördjupat samarbete i norra Europa"
  - id: M-259
    parti: M
    sida: 28
    rader: '1477-1478'
    lydelse: "Verka för att Sveriges teknologiska kunnande och kompetenta försvarsindustri kommer hela Nato till del"
  - id: M-260
    parti: M
    sida: 28
    rader: '1479-1482'
    lydelse: "Verka för att Sveriges Natomedlemskap tillsammans med Finland leder till ett fördjupat samarbete inom Norden och mellan Norden och Baltikum, inte bara på det försvars- och säkerhetspolitiska området."
  - id: M-261
    parti: M
    sida: 28
    rader: '1485-1493'
    lydelse: "Moderaternas syn på EU speglar vår syn på statens uppgifter: EU ska varken göra eller fatta beslut om allt. Beslut ska fattas på lägsta möjliga nivå, så nära medborgarna som möjligt. EU:s fokus ska ligga på att lösa problem som Sverige inte kan hantera ensamt, till exempel handel, klimat, migration och säkerhet. Sveriges EU-ordförandeskap 2023 ska användas till att få EU att fokusera på just dessa områden."
  - id: M-262
    parti: M
    sida: 28
    rader: '1495-1498'
    lydelse: "Arrangera ett EU-toppmöte om tillväxt under det svenska EU-ordförandeskapet i syfte att sätta i gång ett arbete med att få på plats en ny tillväxtstrategi för EU"
  - id: M-263
    parti: M
    sida: 28
    rader: '1499-1500'
    lydelse: "Fördjupa den inre marknaden, inte minst för tjänster och digitala produkter"
  - id: M-264
    parti: M
    sida: 29
    rader: '1502-1505'
    lydelse: "Minska regelkrånglet och onödig byråkrati, bland annat genom att motverka överimplementering i Sverige av EU-beslut - som huvudregel ska EU-direktiv genomföras på miniminivå"
  - id: M-265
    parti: M
    sida: 29
    rader: '1506-1508'
    lydelse: "Stärka EU:s gräns- och kustbevakning, Frontex, för att förbättra kontrollen över EU:s yttre gräns"
  - id: M-266
    parti: M
    sida: 29
    rader: '1509-1510'
    lydelse: "Kraftigt öka antalet utvisningar genom fler EU-gemensamma återtagandeavtal"
  - id: M-267
    parti: M
    sida: 29
    rader: '1513-1515'
    lydelse: "Biståndet är en del av Sveriges samlade omvärldsengagemang och en viktig del av den svenska utrikespolitiken. Men bistånd i sig driver inte samhällelig utveckling."
  - id: M-268
    parti: M
    sida: 29
    rader: '1516-1525'
    lydelse: "Moderaterna vill reformera biståndet och göra det mer fokuserat på de länder och insatser där Sverige kan göra mest nytta. Dina skattepengar ska inte försvinna i korruption eller hamna i fickorna på odemokratiska ledare, och inte heller okritiskt kanaliseras i ökande volymer genom oreformerade FN-organ som brister i transparens och uppföljning. En större andel av biståndet ska vara humanitärt. Svenska intressen och värderingar om demokrati, rättsstat och individuell frihet ska i högre grad styra valet av biståndsinsatser."
  - id: M-269
    parti: M
    sida: 29
    rader: '1526-1529'
    lydelse: "Biståndets storlek ska bygga på en bedömning av vilken budget som är rimlig när biståndet ställs mot andra behov, samt utifrån vilka resultat som bedöms kunna uppnås, snarare än på ett utbetalningsmål."
  - id: M-270
    parti: M
    sida: 29
    rader: '1531-1533'
    lydelse: "Avskaffa enprocentmålet och ersätta det med en fyraårig budgetram för biståndet som skapar förutsägbarhet och resultatfokus"
  - id: M-271
    parti: M
    sida: 29
    rader: '1534-1536'
    lydelse: "Fokusera det svenska biståndet till de länder, organisationer och tematiska områden där det gör störst nytta"
  - id: M-272
    parti: M
    sida: 29
    rader: '1537-1538'
    lydelse: "Prioritera insatser som stödjer arbetet för demokrati och mänskliga rättigheter"
  - id: M-273
    parti: M
    sida: 29
    rader: '1539-1540'
    lydelse: "Öka andelen humanitärt bistånd i den svenska biståndsbudgeten"
  - id: M-274
    parti: M
    sida: 29
    rader: '1541'
    lydelse: "Verka för ett reformerat FN"
  - id: M-275
    parti: M
    sida: 30
    rader: '1576-1581'
    lydelse: "Svensk hälso-och sjukvård fungerar väldigt bra när det kommer till medicinsk kvalitet, akut omhändertagande, ny medicinsk teknologi och användning av läkemedel. Bristerna handlar framför allt om långa vårdköer, väntetider och bristande tillgänglighet."
  - id: M-276
    parti: M
    sida: 30
    rader: '1582-1587'
    lydelse: "Du som betalar in skatt ska också få valuta för dina inbetalade skattepengar. Du ska kunna känna dig trygg med att välfärden fungerar oavsett var i landet du bor. Alla har rätt till likvärdig vård - som kan ges i rätt tid och håller hög kvalitet."
  - id: M-277
    parti: M
    sida: 30
    rader: '1588-1590'
    lydelse: "Samma krav ska naturligtvis kunna ställas på äldreomsorgen, när den behövs på ålderns höst. Det är en anständighetsfråga."
  - id: M-278
    parti: M
    sida: 30
    rader: '1595-1598'
    lydelse: "Fyra av tio patienter har i år väntat längre än lagstadgad tid på sin operation eller annan behandling. Vi tycker att du ska kunna förvänta dig mer av ett välfärdsland som Sverige."
  - id: M-279
    parti: M
    sida: 30
    rader: '1599-1601'
    lydelse: "Moderaterna vill korta tiden som du behöver vänta på att få vård men särskilt prioritera cancervård och barn- och ungdomspsykiatrin."
  - id: M-280
    parti: M
    sida: 30
    rader: '1603-1606'
    lydelse: "Utöka kömiljarden genom att rikta särskilda prestationsbaserade resurser till köerna inom cancervården respektive barn- och ungdomspsykiatrin (BUP)"
  - id: M-281
    parti: M
    sida: 30
    rader: '1607-1610'
    lydelse: "Stärka vårdens medarbetare, bland annat genom att förbättra arbetsmiljön och möjligheterna till vidareutbildning - det behövs fler händer i vården som kan korta vårdköerna och avlasta personalen"
  - id: M-282
    parti: M
    sida: 30
    rader: '1611-1614'
    lydelse: "Inrätta en nationell vårdförmedling som ska hjälpa patienter med lång väntetid att få vård i en annan del av landet där det finns ledig kapacitet"
  - id: M-283
    parti: M
    sida: 30
    rader: '1616-1626'
    lydelse: "Alla ska få sin cancervård när de behöver den. Så är det inte idag. Färre än hälften av alla kvinnor med bröstcancer får vård i tid. Färre än hälften av alla män med prostatacancer får vård i tid. Nästan varje dag drabbas ett barn i Sverige av cancer och barncancer är den vanligaste dödsorsaken i åldern 1-14 år. Samtidigt är det oerhört hoppfullt att ungefär 85 procent av alla barn i Sverige överlever sin cancer. Men sju av tio drabbas av komplikationer senare i livet. Det är tydligt att tillgängligheten och effektiviteten i cancervården idag är för låg. Det finns också stora regionala skillnader i kvalitet och väntetider."
  - id: M-284
    parti: M
    sida: 31
    rader: '1638-1641'
    lydelse: "Införa en förstärkt vårdgaranti för cancerpatienter - om inte vården kan ges inom angivna tidsgränser ska patienten ha rätt att vända sig till annan vårdgivare och bli ersatt för de merkostnader detta innebär"
  - id: M-285
    parti: M
    sida: 31
    rader: '1642-1644'
    lydelse: "Prioritera cancervården och fördubbla stödet till barncancervården, som ska ges särskilt riktade resurser varje år"
  - id: M-286
    parti: M
    sida: 31
    rader: '1647-1658'
    lydelse: "Kvinnor ska inte behöva ge uttryck för mer smärta och lidande för att få samma behandling som män. Men så är det idag. Kvinnors sjukdomar har både inom forskning och i det kliniska arbetet under lång tid varit eftersatta. På flera områden finns därför kunskapsluckor om hur skillnaden mellan könen tar sig uttryck både gällande symptom, smärta samt reaktion på läkemedel. Forskning pekar på att även vid sjukdomar som drabbar både kvinnor och män, är vården inte jämlik. Kvinnor får senare diagnos, sämre tillgång till nya läkemedel och det tar längre tid till dess att behandlingar sätts in."
  - id: M-287
    parti: M
    sida: 31
    rader: '1660-1663'
    lydelse: "Förbättra möjligheterna att ställa tidigare diagnoser, bland annat med hjälp av digitala beslutsstöd och strukturerade arbetssätt med till exempel riskprofilering"
  - id: M-288
    parti: M
    sida: 31
    rader: '1664-1665'
    lydelse: "Stärka forskningen gällande sjukdomar som drabbar kvinnor"
  - id: M-289
    parti: M
    sida: 31
    rader: '1666-1668'
    lydelse: "Modernisera aborträtten - genom att bland annat möjliggöra abort i hemmet och utreda ett grundlagsskydd för aborträtten"
  - id: M-290
    parti: M
    sida: 31
    rader: '1670-1678'
    lydelse: "Att bli förälder är något fantastiskt, som ska vara förenat med förväntan, spänning och lycka. Men många hamnar idag i stället i en situation där förlossningen leder till stress, oro och funderingar kring hur det ska gå. Några av de allra största problemen inom förlossningsvården handlar om kvalitet och ojämlikhet. Moderaterna kommer att arbeta för att förlossningsvården ska stärkas när det gäller möjligheterna till kontinuitet, jämlik vård samt uppföljning och återkoppling."
  - id: M-291
    parti: M
    sida: 31
    rader: '1680-1681'
    lydelse: "Se till att födande kvinnor får ha tillgång till samma team av barnmorskor från mödravård till eftervård"
  - id: M-292
    parti: M
    sida: 32
    rader: '1693-1702'
    lydelse: "Få saker är viktigare att prioritera än barns psykiska mående. En studie från Socialstyrelsen visar att orosanmälningar om barn som far illa har ökat under pandemin. Bris bekräftar den bilden. Samtal från barn med ångest och nedstämdhet har ökat med över 60 procent jämfört med året innan. Moderaterna vill lagstifta om att barn som mår psykiskt dåligt och behöver hjälp och stöd ska få det inom maximalt 30 dagar. Och inom ytterligare maximalt 30 dagar få den behandling som behövs."
  - id: M-293
    parti: M
    sida: 32
    rader: '1704-1705'
    lydelse: "Införa en ny lagstadgad vårdgaranti för barn"
  - id: M-294
    parti: M
    sida: 32
    rader: '1706-1708'
    lydelse: "Stärka barn- och ungdomspsykiatrin så att barn och unga som mår dåligt får hjälp snabbt"
  - id: M-295
    parti: M
    sida: 32
    rader: '1709-1711'
    lydelse: "Stärka Bris nationella stödlinje och andra stödlinjer så att de kan hålla öppet dygnet runt"
  - id: M-296
    parti: M
    sida: 32
    rader: '1712-1713'
    lydelse: "Ta fram en nationell strategi mot självmord, med särskilt fokus på barn och unga"
  - id: M-297
    parti: M
    sida: 32
    rader: '1715-1720'
    lydelse: "Den som behöver omsorg på ålderns höst ska känna sig trygg med det. Anhöriga ska veta att mamma eller pappa tas väl om hand - äter bra för att maten är god och näringsrik, får regelbunden vård och omsorg av personal de känner igen och som pratar svenska. Coronakommissionens slutsatser om att äldreomsorgen inte stod förberedd och rustad att möta samhällsspridningen i pandemin måste leda till förändring. Den medicinska kompetensen och kontinuiteten måste stärkas inom äldreomsorgen."
  - id: M-298
    parti: M
    sida: 32
    rader: '1721-1723'
    lydelse: "Att alla har tak över huvudet är en anständighetsfråga i ett välfärdsland som Sverige. Ändå ökar hemlösheten bland äldre, vilket är en oacceptabel utveckling."
  - id: M-299
    parti: M
    sida: 32
    rader: '1725-1726'
    lydelse: "Införa språkkrav för personal inom vård och äldreomsorg"
  - id: M-300
    parti: M
    sida: 32
    rader: '1727-1728'
    lydelse: "Minska förekomsten av delade turer i offentlig vård och omsorg"
  - id: M-301
    parti: M
    sida: 32
    rader: '1729'
    lydelse: "Se till att den patientansvariga läkarkontakten ska utgöra navet i äldres sjukvård"
  - id: M-302
    parti: M
    sida: 32
    rader: '1730-1731'
    lydelse: "Verka för ett systematiskt måltidslyft inom äldrevården och äldreomsorgen"
  - id: M-303
    parti: M
    sida: 32
    rader: '1732-1733'
    lydelse: "Införa en nollvision för hemlöshet bland pensionärer och öka den statliga finansieringen av boendestöd"
  - id: M-304
    parti: M
    sida: 33
    rader: '1737-1751'
    lydelse: "År 2021 lämnade 16 000 barn grundskolan utan behörighet till gymnasiet. Det motsvarar över 600 skolklasser. Samtidigt halkar även de barn som det går bäst för efter i internationella kunskapsjämförelser. En bra skola är avgörande för Sveriges välstånd. Men framför allt är skolgången avgörande för varje elevs möjlighet att skapa sig en ljus framtid. Moderaterna vill att svensk skola ska möjliggöra klassresor. Och då menar vi inte, som andra partier föreslår, att elever ska tvångsbussas från ett område till ett annat. Nej, i stället vill vi säkerställa att alla skolor är bra skolor - och slå vakt om din rätt att själv välja skola till dina barn. Moderaterna vill få ordning på svensk skola så att varje elev går ut nian med fullständiga betyg och möter vuxenlivet med rätt kunskaper och gott självförtroende."
  - id: M-305
    parti: M
    sida: 33
    rader: '1760-1770'
    lydelse: "De skolor som lyckas bra, även i Sveriges utanförskapsområden, pekar alla på samma framgångsrecept: fokus på studiero, kunskap och på ett tydligt ledarskap. Den dåliga nyheten är att dessa skolor i dag är alldeles för få. Den goda nyheten är att de flesta kan bli riktigt bra, om vi lägger om den svenska skolpolitiken. Att värderas utifrån kriterier som man inte förstår framkallar både stress och ångest. Idag slår otydliga mål, tidiga krav på abstrakta resonemang, och en vag kunskapssyn ut många helt i onödan."
  - id: M-306
    parti: M
    sida: 33
    rader: '1771-1780'
    lydelse: "Vår kunskapsskola är en annan. Det finns en ett samband mellan utökad undervisningstid och bättre skolresultat. Sverige har betydligt mindre undervisningstid i skolan jämfört med andra länder. Moderaterna kommer därför utöka undervisningstiden i skolan. Vi vill se mer lärarledd undervisning. Mätbara fakta i kurs- och läroplanerna. Betygskriterier som är begripliga och centralt rättade nationella prov, för att bekämpa betygsinflationen."
  - id: M-307
    parti: M
    sida: 33
    rader: '1782-1783'
    lydelse: "Utöka undervisningstiden med en timme om dagen i lågstadiet"
  - id: M-308
    parti: M
    sida: 33
    rader: '1784-1785'
    lydelse: "Fokusera på mätbara faktakunskaper, med inspiration från Finlands läroplan"
  - id: M-309
    parti: M
    sida: 33
    rader: '1786'
    lydelse: "Minska lärarnas dokumentationskrav"
  - id: M-310
    parti: M
    sida: 34
    rader: '1790-1794'
    lydelse: "Införa central rättning av betygsgrundande nationella prov samt ett slutprov efter årskurs nio - och ge Skolinspektionen i uppdrag att granska skolor som avviker från nationella prov"
  - id: M-311
    parti: M
    sida: 34
    rader: '1795-1796'
    lydelse: "Sätta stopp för betygsinflation och olämpliga påtryckningar från föräldrar"
  - id: M-312
    parti: M
    sida: 34
    rader: '1799-1807'
    lydelse: "Alla elever drabbas av en stökig skolmiljö, men det är särskilt elever som redan har det svårt som halkar efter. Var tredje niondeklassare upplever att han eller hon saknar studiero i skolan. Dessutom har nästan hälften av eleverna blivit utsatta för ett brott. Samtidigt uppger en fjärdedel av lärarna att de har blivit utsatta för hot, våld, sexuella trakasserier eller kränkningar på jobbet. I en sådan miljö kan inte skolan fungera som det är tänkt. Studiero är en förutsättning för lärande."
  - id: M-313
    parti: M
    sida: 34
    rader: '1809-1810'
    lydelse: "Införa våld mot skolpersonal som ny brottsrubricering"
  - id: M-314
    parti: M
    sida: 34
    rader: '1811-1812'
    lydelse: "Stärka lärares och rektorers auktoritet att kunna ingripa i stökiga situationer"
  - id: M-315
    parti: M
    sida: 34
    rader: '1813-1814'
    lydelse: "Skriva in ordning och studiero i skollagens portalparagraf och införa ordningsomdömen"
  - id: M-316
    parti: M
    sida: 34
    rader: '1817-1823'
    lydelse: "Forskning pekar på att tidiga insatser är avgörande för att höja kunskapsresultaten. Åtgärder måste vidtas i tid för elever som inte klarar av sin skolgång. De elever som halkar efter ska få gå i skola på loven. Idag är det många barn som börjar skolan utan att kunna tala svenska, och vi vet att de får en betydligt svårare resa än andra. Därför krävs också omfattande satsningar på svenska språket redan i tidig ålder."
  - id: M-317
    parti: M
    sida: 34
    rader: '1825-1828'
    lydelse: "Införa en skyldighet för kommuner att erbjuda lovskola från lågstadiet. Elever som ligger efter i skolan ska vara skyldiga att delta i lovskolan"
  - id: M-318
    parti: M
    sida: 34
    rader: '1829-1830'
    lydelse: "Göra det obligatoriskt för kommuner att erbjuda läxhjälp från lågstadiet"
  - id: M-319
    parti: M
    sida: 34
    rader: '1831-1832'
    lydelse: "Införa obligatorisk språkförskola för barn som visar en bristande språkutveckling"
  - id: M-320
    parti: M
    sida: 34
    rader: '1836-1846'
    lydelse: "Det fria skolvalet gör att alla barn oavsett bakgrund och ekonomi kan välja den skola som passar dem bäst. Den friheten vill vi bevara. Vi säger därför bestämt nej till storskaliga experiment med kvotering, lottning eller tvångsbussning av elever. Barn ska inte lottas till dåliga skolor - dåliga skolor ska stängas. Målet måste självklart vara att alla skolor ska vara bra - det ansvaret får inte politiken fly. Därför måste vi också bekämpa oseriösa aktörer och fusk. Skolor som misslyckas med sitt uppdrag ska inte få ta ut vinster. Moderaterna har nolltolerans mot dåliga skolor. Staten ska kunna ta över eller stänga skolor som inte är tillräckligt bra."
  - id: M-321
    parti: M
    sida: 34
    rader: '1848-1849'
    lydelse: "Införa ett aktivt och obligatoriskt skolval för alla"
  - id: M-322
    parti: M
    sida: 34
    rader: '1850-1853'
    lydelse: "Se till att skolor som drivs i företagsform lever upp till högt ställda kvalitetskriterier för att få göra vinstutdelning samt dra in tillståndet för skolor som allvarligt brister"
  - id: M-323
    parti: M
    sida: 34
    rader: '1854-1855'
    lydelse: "Ge Skolinspektionen i särskilt uppdrag att granska och stänga skolor som kan misstänkas främja radikalisering och segregation"
  - id: M-324
    parti: M
    sida: 34
    rader: '1856-1857'
    lydelse: "Stoppa alla förslag som rör tvångsbussning, kvotering och lottning av elever mellan skolor"
  - id: M-325
    parti: M
    sida: 35
    rader: '1859-1861'
    lydelse: "Öka likvärdigheten genom att införa ett gemensamt kommunalt kösystem och en tydligare statlig styrning av skolpengen"
  - id: M-326
    parti: M
    sida: 35
    rader: '1864-1867'
    lydelse: "Kompetensförsörjningen på svensk arbetsmarknad måste bli bättre. Då krävs att både den svenska skolan och all högre utbildning håller högsta internationella nivå - i en allt hårdare konkurrens."
  - id: M-327
    parti: M
    sida: 35
    rader: '1868-1873'
    lydelse: "Idag ställs allt högre krav på omställning inom en rad yrken, med betoning på tekniska utbildningar. Det finns därför behov av att snarast införa olika kortare utbildningar. De gymnasiala yrkesutbildningarna och vuxenutbildningarna i Sverige måste få ett innehåll som är relevant och eftertraktat."
  - id: M-328
    parti: M
    sida: 35
    rader: '1874-1878'
    lydelse: "Högre utbildning och forskning är en i högsta grad internationell verksamhet. Vi måste bättre värna den akademiska friheten i Sverige och se till att forskningen står fri från politiska pekpinnar och möjliggöra banbrytande forskningsresultat."
  - id: M-329
    parti: M
    sida: 35
    rader: '1880-1881'
    lydelse: "Få på plats en nationell samordning över samhällets behov av antalet utbildningsplatser för att förbättra kompetensförsörjningen"
  - id: M-330
    parti: M
    sida: 35
    rader: '1882-1884'
    lydelse: "Arbeta för ett resursfördelningssystem till högskolan så att akademisk kvalitet, genomströmning samt etablering på arbetsmarknaden premieras i högre utsträckning"
  - id: M-331
    parti: M
    sida: 35
    rader: '1885-1886'
    lydelse: "Värna den fria forskningen från politiska pekpinnar"
  - id: M-332
    parti: M
    sida: 36
    rader: '1893-1901'
    lydelse: "Moderaterna vill ta vara på hela Sveriges möjligheter. Men ska det gå att bo och verka i hela Sverige måste också hela Sverige fungera. Företag ska ha tillgång till el året runt. Bredband måste finnas så att alla har samma möjligheter att koppla upp sig mot en vårdcentral eller att jobba hemifrån. Mobiltäckning överallt ska vara en självklarhet, liksom vetskapen om att polisen kommer när du ringer oavsett var du bor. Vi vill ta ansvar för att tågen går i tid och att vägarna håller hög kvalitet i stället för låg hastighet."
  - id: M-333
    parti: M
    sida: 36
    rader: '1903-1909'
    lydelse: "En infrastruktur av hög kvalitet är viktig för jobb och tillväxt i alla delar av landet. Hastigheten på alla statliga vägar där hastigheten sänkts på grund av bristande underhåll bör på sikt återställas. Tillgången på laddstationer ska vara hög så att även den som bor i glesbygd har användning av en elbil. Dessutom behöver viktiga vägstråk stärkas så att de klarar tyngre lastbilar."
  - id: M-334
    parti: M
    sida: 36
    rader: '1910-1922'
    lydelse: "Tågtrafiken präglas alltjämt av förseningar och flaskhalsar. I stället för dyra och olönsamma skrytbyggen som höghastighetståg kommer Moderaterna rusta upp den järnväg som redan finns, så att tågen kan gå i tid och du slipper stå och frysa på perrongen. Flyget är mitt uppe i en snabb omställning med ökad användning av biobränslen, vätgas och utveckling av elflyg. Det är en utveckling som Moderaterna vill bejaka. Företagande ska underlättas i hela Sverige genom bättre tillgång till bredband. Samtidigt är behovet av nya isbrytare stort, inte minst för att underlätta transporter från och till industrin i Norrland."
  - id: M-335
    parti: M
    sida: 36
    rader: '1924-1926'
    lydelse: "Rusta upp dagens järnväg i stället för att satsa på höghastighetståg som riskerar att vara omoderna redan innan de är klara"
  - id: M-336
    parti: M
    sida: 36
    rader: '1927-1928'
    lydelse: "Laga Sveriges vägar så att du kan komma fram säkert och i tid"
  - id: M-337
    parti: M
    sida: 36
    rader: '1929-1930'
    lydelse: "Förbättra tillgången på laddstationer för elbilar"
  - id: M-338
    parti: M
    sida: 36
    rader: '1931-1932'
    lydelse: "Bygga ut Arlanda med målet att Arlanda ska bli den ledande flygplatsen i Norden"
  - id: M-339
    parti: M
    sida: 36
    rader: '1933-1934'
    lydelse: "Satsa på utvecklingen av fossilfria bränslen till flyget och utvecklingen av elflygplan"
  - id: M-340
    parti: M
    sida: 36
    rader: '1935-1936'
    lydelse: "Klassa bredband som nationell infrastruktur och prioritera därefter"
  - id: M-341
    parti: M
    sida: 36
    rader: '1937-1938'
    lydelse: "Förnya flottan av isbrytare för att underlätta för industrin i norra Sverige"
  - id: M-342
    parti: M
    sida: 37
    rader: '1945-1955'
    lydelse: "I 207 av landets 290 kommuner råder det idag bostadsbrist. En fungerande bostadsmarknad är en förutsättning för ökad tillväxt. I Moderaternas Sverige ska alla våga drömma om att äga sin egen bostad. Pensionärer ska inte tvingas att flytta från sina hus på ålderns höst för att fastighetsskatten har återinförts och barnfamiljers ekonomi ska inte slås sönder av avskaffade ränteavdrag. Vi vill genomföra reformer som ökar byggandet av såväl hyressom bostadsrätter. För att nå ökad acceptans hos allmänheten vill vi ge medborgarna större inflytande över arkitekturen."
  - id: M-343
    parti: M
    sida: 37
    rader: '1957-1958'
    lydelse: "Avskaffa dagens strandskydd för att möjliggöra ökat byggande"
  - id: M-344
    parti: M
    sida: 37
    rader: '1959-1960'
    lydelse: "Ersätta avancerade detaljplaner med enklare byggplaner"
  - id: M-345
    parti: M
    sida: 37
    rader: '1961-1962'
    lydelse: "Låta medborgare få större inflytande över arkitekturen för att minska överklaganden"
  - id: M-346
    parti: M
    sida: 37
    rader: '1963-1964'
    lydelse: "Stoppa vänstersidan från att återinföra fastighetsskatten"
  - id: M-347
    parti: M
    sida: 37
    rader: '1965'
    lydelse: "Behålla ränteavdraget för bolån"
  - id: M-348
    parti: M
    sida: 37
    rader: '1966-1968'
    lydelse: "Möjliggöra mer rättvisa hyror genom att potentiella hyresgästers värdering av boendet ges större vikt"
  - id: M-349
    parti: M
    sida: 38
    rader: '1974-1977'
    lydelse: "Moderaternas politik utgår från alla människors lika värde och varje individs rätt till frihet. Sverige ska vara ett fritt och öppet samhälle där rättigheter, skyldigheter och möjligheter gäller lika för alla."
  - id: M-350
    parti: M
    sida: 38
    rader: '1979-1984'
    lydelse: "Demokratins grundvalar behöver stärkas. Vår svenska grundlag ska ha en tydlig katalog av fri- och rättigheter. Vi måste se till att det inte bara är vackra ord, utan att grundlagen också ger ett praktiskt och effektivt skydd för enskilda människor i relation till exempelvis en kommun eller en statlig myndighet."
  - id: M-351
    parti: M
    sida: 38
    rader: '1985-1990'
    lydelse: "Sverige ska vara en demokratisk rättsstat. Det betyder att alla som utövar offentlig makt, och ytterst våra domstolar, ska garantera att grundlagarnas skydd för individens fri- och rättigheter efterlevs. Majoriteten får aldrig göra vad den vill mot minoriteten. Vi ser stora behov av att förstärka domstolarnas oberoende och förtydliga hur ansvar kan utkrävas för offentliga beslut."
  - id: M-352
    parti: M
    sida: 38
    rader: '1991-1993'
    lydelse: "Vi måste också stärka demokratins skydd mot våldsbejakande extremism och andra kriminella hot."
  - id: M-353
    parti: M
    sida: 38
    rader: '1995'
    lydelse: "Stärka domstolarnas oberoende och skyddet för medborgarnas fri- och rättigheter"
  - id: M-354
    parti: M
    sida: 38
    rader: '1996-1998'
    lydelse: "Slå vakt om trossamfundens säkerhet för alla ska kunna utöva sin tro utan att känna sig hotade"
  - id: M-355
    parti: M
    sida: 38
    rader: '1999-2001'
    lydelse: "Stärka Säkerhetspolisen för att öka deras förmåga att skydda den liberala demokratin och landets alla medborgare"
  - id: M-356
    parti: M
    sida: 38
    rader: '2002-2005'
    lydelse: "Stoppa utbetalningar av skattepengar till organisationer som inte delar det svenska samhällets grundläggande demokratiska värderingar utan som hotar människors frihet"
  - id: M-357
    parti: M
    sida: 38
    rader: '2006-2008'
    lydelse: "Förbjuda deltagande i organisationer med våldsbejakande verksamhet samt förbjuda deltagande i kriminella gäng"
  - id: M-358
    parti: M
    sida: 38
    rader: '2009-2012'
    lydelse: "Skärpa tjänstemannaansvaret så att du som skattebetalare vet att med all offentlig maktutövning följer ett ansvar för de beslut som fattas"
  - id: M-359
    parti: M
    sida: 38
    rader: '2014-2034'
    lydelse: "Kvinnofientliga traditioner och strukturer kan aldrig accepteras i ett fritt, öppet och jämställt samhälle. Det finns många exempel på hur hederskulturen breder ut sig i Sverige. Kvinnor ”faller” från balkonger. Flickor förs bort under sommarlovet och tvingas in i ett liv kantat av tvångsgiftermål, misshandel och våldtäkter. Bröder tvingas kontrollera sina systrar. Ingrepp som kallas reparation av mödomshinnan görs, där unga kvinnor som lever under hedersrelaterade normer betalar för att ”laga” något som inte finns. Kvinnor fråntas sin frihet och isoleras i hemmet. Kvinnor mördas av sina män, bröder och pappor. Att detta sker i Sverige idag är avskyvärt och något som politiken och samhället som helhet måste ägna betydligt mer kraft åt att motverka. Dessa flickor, pojkar och kvinnor förtjänar möjligheten att få välja hur de vill leva sina liv, i trygghet och utan att vara rädda att straffas för sina val. I Sverige ska alla kunna leva sina liv i frihet. Moderaterna vill införa en nolltolerans mot hedersbrott."
  - id: M-360
    parti: M
    sida: 39
    rader: '2037'
    lydelse: "Se till att personer utan svenskt medborgarskap som begår hedersbrott utvisas"
  - id: M-361
    parti: M
    sida: 39
    rader: '2038-2040'
    lydelse: "Införa jämställdhet och hbtq-personers rättigheter som en del i den obligatoriska samhällsorienteringen för nyanlända"
  - id: M-362
    parti: M
    sida: 39
    rader: '2041-2042'
    lydelse: "Genomföra en nationell kartläggning av hedersförtryckets utbredning"
  - id: M-363
    parti: M
    sida: 39
    rader: '2043-2044'
    lydelse: "Verka för att en nationell hedersscreening införs för asylsökande familjer"
  - id: M-364
    parti: M
    sida: 39
    rader: '2045-2046'
    lydelse: "Införa ett särskilt brott - olaga frihetsbegränsning"
  - id: M-365
    parti: M
    sida: 39
    rader: '2047'
    lydelse: "Förbjuda ”moralpoliser”"
  - id: M-366
    parti: M
    sida: 39
    rader: '2048'
    lydelse: "Kriminalisera oskuldskontroller"
  - id: M-367
    parti: M
    sida: 39
    rader: '2051-2065'
    lydelse: "I Sverige ska du kunna leva ett fritt liv, och öppet kunna visa din kärlek, bilda familj och få ett tryggt bemötande av det offentliga, oavsett vilken sexuell läggning du har. Men idag finns platser i Sverige där detta inte respekteras. Där människor inte vågar hålla hand med vem man vill eller visa en regnbågsflagga på grund av att otidsenliga normer slagit rot. I hederskulturer är hbtq-personer dubbelt utsatta. Och konverteringsterapi tillämpas i syfte att ändra en individs sexuella läggning eller könsidentitet. Samtidigt är familjepolitiken inte tidsenlig och utformad utifrån hur människor idag väljer att bilda familj och leva sina liv. Det finns blodbrist i sjukvården, samtidigt finns det människor som vill donera blod men som inte får - på grund av sexuell läggning. Även det vill vi ändra på."
  - id: M-368
    parti: M
    sida: 39
    rader: '2067-2069'
    lydelse: "Förbjuda konverteringsterapi, som syftar till att ändra en individs sexuella läggning eller könsidentitet"
  - id: M-369
    parti: M
    sida: 39
    rader: '2070-2072'
    lydelse: "Stoppa utbetalningar av skattemedel till organisationer som hetsar och sprider hat mot hbtq-personer"
  - id: M-370
    parti: M
    sida: 39
    rader: '2073-2074'
    lydelse: "Verka för att altruistiskt surrogatmoderskap ska vara möjligt i Sverige"
  - id: M-371
    parti: M
    sida: 39
    rader: '2075'
    lydelse: "Se till att all familjelagstiftning är könsneutral"
  - id: M-372
    parti: M
    sida: 39
    rader: '2076-2079'
    lydelse: "Ge Socialstyrelsen i uppdrag att ändra i riktlinjerna för blodgivning så att sexuell läggning inte längre ska vara avgörande för vem som får donera blod"
  - id: M-373
    parti: M
    sida: 39
    rader: '2082-2086'
    lydelse: "En mångfald av fria och oberoende medier som håller hög kvalitet spelar en helt avgörande roll för det öppna och demokratiska samhället. Det är också det viktigaste motmedlet mot företeelser såsom ”fake news” och desinformationskampanjer."
  - id: M-374
    parti: M
    sida: 39
    rader: '2087-2091'
    lydelse: "Moderaternas mediepolitik har som mål att skapa förutsättningar för ett brett utbud av medier i olika format som kan verka fritt, självständigt och i konkurrens med varandra. Vi vill värna och utveckla public service, och stärka skyddet för journalister mot hot och våld."
  - id: M-375
    parti: M
    sida: 39
    rader: '2093'
    lydelse: "Värna och stärka public services kärnuppdrag och kravet på saklighet och opartiskhet"
  - id: M-376
    parti: M
    sida: 39
    rader: '2094-2095'
    lydelse: "Reformera mediestödet för att stödja den digitala transformationen och omställningen"
  - id: M-377
    parti: M
    sida: 39
    rader: '2096-2098'
    lydelse: "Stärka det straffrättsliga skyddet för journalister, i syfte att värna tryck- och yttrandefriheten, motverka hot, våld och andra olagliga angrepp mot journalister och medieredaktioner"
  - id: SD-001
    parti: SD
    sida: 2
    rader: '4-9'
    lydelse: "Svensk flit gjorde en gång i tiden Sverige till ett föregångsland. Under 1900-talet togs steg efter steg för att bygga en stark välfärd som gav trygghet och möjligheter för alla. Sverige blev ett av de mest framåtskridande, jämlika och öppna samhällena i världen. När pragmatism sattes framför idealism kunde en stark industripolitik förenas med en tydlig fördelningspolitik i en framgångsrik strävan att förbättra livet för nästkommande generation. När alla bidrog till samhället kunde också skyddsnäten vävas starka."
  - id: SD-002
    parti: SD
    sida: 2
    rader: '10-16'
    lydelse: "Men Sverige har gjorts farligare och fattigare av de partier som styrt under decennier. Istället för att prioritera Sverige har de mot bättre vetande fört en politik som raserat det som en gång gjorde Sverige så bra. Sammanhållning har bytts mot splittring och misstro. Skyddsnäten har skurits sönder och framtidstro har bytts mot oro. Människor har sökt sig från andra delar av världen till Sverige av helt andra motiv än att de tycker om Sverige och vill bidra till att bygga vidare på vårt samhällsprojekt. Våld och otrygghet har vuxit till det mest påtagliga samhällsproblemet och påverkar människors livsmönster."
  - id: SD-003
    parti: SD
    sida: 2
    rader: '17-20'
    lydelse: "Kriget i Europa har gjort att effekter av politiska misslyckanden snabbt blivit mer påtagliga. Nedmonteringen av Sveriges försvar och kärnkraft har gjort oss sårbara. Politiska beslut för att straffa dem som är beroende av bil och transporter har gjort att kostnaderna vuxit mer för svenska hushåll och företag än i andra länder."
  - id: SD-004
    parti: SD
    sida: 2
    rader: '21-23'
    lydelse: "Sverigedemokraterna vill att Sverige åter ska bli bra. Sverige är ett litet land i en stor värld, men det är politiska beslut i Sverige som avgör vilken vår framtid ska vara. Om en negativ utveckling ska vändas till en positiv måste en annan politik föras än den som tagit oss hit."
  - id: SD-005
    parti: SD
    sida: 2
    rader: '24-28'
    lydelse: "Sverigedemokraternas främsta vallöfte är att göra Sverige tryggt igen. Det är en förutsättning för allt annat. Sveriges trygghet och säkerhet ska få en överordnad ställning i en ny regering. Stora delar av det ekonomiska utrymmet kommer behöva gå till att återupprusta ett starkt försvar och rättsväsende. Därutöver behöver snabba åtgärder vidtas för att lindra de allt tyngre ekonomiska bördorna för hushåll och företag."
  - id: SD-006
    parti: SD
    sida: 2
    rader: '29-32'
    lydelse: "Om vi prioriterar på ett nytt sätt, och sätter Sverige och nästa generation främst, har vi också möjlighet att återstarta bygget av en stark välfärd. Det vill Sverigedemokraterna. Efter att regeringar under hela 2000-talet lämnat efter sig ett land i sämre skick än de ärvde, lovar vi att efterlämna ett land med en starkare välfärd och mer framtidstro."
  - id: SD-007
    parti: SD
    sida: 2
    rader: '33'
    lydelse: "Ge chansen åt något nytt i valet den 11 september!"
  - id: SD-008
    parti: SD
    sida: 3
    rader: '35-38'
    lydelse: "Den ekonomiska politiken ska föras på ett ansvarsfullt sätt. När andra partier lovar hundratals miljarder mer till klimatpolitik, invandring och bistånd lovar vi att prioritera Sverige och att fullt ut finansiera våra reformer på ett sätt som inte spär på inflation och som är långsiktigt hållbart."
  - id: SD-009
    parti: SD
    sida: 3
    rader: '39-41'
    lydelse: "Återupprättandet av tryggheten ska ha den allra främsta prioriteten. Att säkerställa säkerheten för och i Sverige är en grundförutsättning för alla andra reformer."
  - id: SD-010
    parti: SD
    sida: 3
    rader: '42-45'
    lydelse: "Satsningar ska finansieras på andra sätt än med nya skatter. Inflationen har redan gjort att marginalerna snabbt minskat för många. Vi säger nej till Socialdemokraternas förslag om ny fastighetsskatt, ytterligare höjda drivmedelsskatter och beredskapsskatt på arbete."
  - id: SD-011
    parti: SD
    sida: 3
    rader: '46-47'
    lydelse: "Nya steg ska tas för att bygga ut välfärden. Genom att byta prioriteringar kan nya steg framåt tas för att göra de sociala trygghets-systemen starka."
  - id: SD-012
    parti: SD
    sida: 4
    rader: '51-52'
    lydelse: "Svenska hushåll har drabbats hårt av en skenande inflation och kraftigt stigande energi- och drivmedelspriser."
  - id: SD-013
    parti: SD
    sida: 4
    rader: '53-58'
    lydelse: "Skenande elpriser hotar i grunden förutsättningar för jobb och välfärd i hela landet. Sverigedemokraterna har under lång tid värnat långsiktighet i energiförsörjningen med stabila, planerbara kraftslag som vattenkraft och kärnkraft. Fyra kärnkraftsreaktorer har stängts ned under den socialdemokratiska regeringen. Istället har andelen vindkraft ökat. Problemet är att vindkraften är väderberoende, vilket resulterar i kraftigt varierande priser och osäker tillgång."
  - id: SD-014
    parti: SD
    sida: 4
    rader: '59-62'
    lydelse: "Energitillgången behöver vara tillförlitlig, tillräcklig och konkurrenskraftig. Vi måste ha effektiva system med hög leveranssäkerhet. Det kräver ny kärnkraft och långsiktiga åtgärder för att stärka energisystemen. Men åtgärder behövs också på kort sikt för att minska både direkta och indirekta följder av de högre priserna."
  - id: SD-015
    parti: SD
    sida: 4
    rader: '63-67'
    lydelse: "Särskilt drabbade är de som lever utanför storstäderna, där många bor i hus och är beroende av bil i sin vardag. Verksamheter på landsbygden måste på ett bättre sätt värnas och gynnas. Det ska löna sig att bidra till arbetstillfällen, varor, tjänster och utveckling. De resurser som skapas på landsbygden ska också i större utsträckning kunna stanna kvar där, och bidra till utveckling och tillväxt."
  - id: SD-016
    parti: SD
    sida: 5
    rader: '69-73'
    lydelse: "Sänk bensin- och dieselpriset kraftigt. Skatten på drivmedel ska permanent sänkas och de kostnadsdrivande kraven på inblandning av biodrivmedel, reduktionsplikten, ska minskas till ett minimum. Klimatet räddas inte genom att svenskar får betala mer för drivmedel och varor. Tvärtom riskerar det att slå ut våra förutsättningar att kunna investera för framtiden."
  - id: SD-017
    parti: SD
    sida: 5
    rader: '74-77'
    lydelse: "Sänk arbetsgivaravgiften för alla företag. Särskilt företag i gles- och landsbygd behöver stimuleras för att klara tuffare tider och få fler att kunna anställa. Ineffektiva riktade lönesubventioner och andra särlösningar för utvalda grupper ska avskaffas för att istället göra det billigare att anställa generellt."
  - id: SD-018
    parti: SD
    sida: 5
    rader: '78-80'
    lydelse: "Satsa på kärnkraften. Politiken måste aktivt verka för att skapa förutsättningar för ny modern och miljöanpassad kärnkraft i Sverige. En färdplan för byggandet av SMR-reaktorer ska tas fram."
  - id: SD-019
    parti: SD
    sida: 5
    rader: '81-84'
    lydelse: "Stoppa nedläggning av befintlig vattenkraft. Vattenkraften utgör tillsammans med kärnkraften ryggraden i elsystemet. Den behöver därför öka, inte minska. Sverige har i nuvarande akuta läge inte råd att förlora vattenkraft genom negativa beslut från miljöprövningar."
  - id: SD-020
    parti: SD
    sida: 5
    rader: '85-86'
    lydelse: "Elskatten ska sänkas permanent. Planerade skattehöjningar ska stoppas. Under kommande vinter bör både skatt och moms på el helt slopas."
  - id: SD-021
    parti: SD
    sida: 5
    rader: '87-89'
    lydelse: "Se över villkoren för energimarknaden. Konkurrenskraften för fjärr- och kraftvärme ska stärkas för att snabbt kunna öka elproduktionen från dessa källor. Ompröva målet för energipolitiken från förnybarhet till fossilfrihet."
  - id: SD-022
    parti: SD
    sida: 5
    rader: '90-92'
    lydelse: "Bevara det lokala självbestämmandet vid vindkraftsetablering. Sverigedemokraterna säger nej till regeringens planer att slopa det kommunala vetot vid etablering av stora vindkraftsparker."
  - id: SD-023
    parti: SD
    sida: 6
    rader: '95-99'
    lydelse: "Det var länge sedan stora framåtskridande reformer genomfördes i Sverige för att stärka välfärdssamhället för vanliga människor. De ökade skatteintäkter som tillväxten skapat har gått till andra saker, främst invandring. Bara under den socialdemokratiska regeringen har över 1000 miljarder spenderats på asylinvandring. Istället har välfärden blivit sämre. Skolresultaten har minskat och vårdköerna ökat. Det borde vara tvärtom."
  - id: SD-024
    parti: SD
    sida: 6
    rader: '100-105'
    lydelse: "Varje krona som finansierar den gemensamma välfärden har tjänats in av dem som betalar skatt genom t.ex. arbete och företagande. För Sverigedemokraterna är det viktigt att offentliga medel går till rätt ändamål och medborgarnas väl. Sverigedemokraterna vill ha en stark välfärd, med väl utbyggda skyddsnät. Men starka skyddsnät ska inte innebära att det ska vara möjligt att försörja sig på bidrag i decennier för den som är arbetsför. Tvärtom. En förutsättning för en stark välfärd är att den inte exploateras."
  - id: SD-025
    parti: SD
    sida: 6
    rader: '106-109'
    lydelse: "Svensk välfärd klarar inte av att vara tillgänglig för hela världens befolkning, och ska inte heller vara det. Sverigedemokraterna anser att svenska medborgare, och de som bidrar till välfärden, primärt är de som ska få ta del av den fullt ut. Det gör att vi är det enda parti som med trovärdighet kan lova att ta nya, riktiga, steg framåt för välfärden."
  - id: SD-026
    parti: SD
    sida: 6
    rader: '111-114'
    lydelse: "Stärk och förstatliga A-kassan. Tillfällig arbetslöshet ska inte behöva bli en privatekonomisk kris. Tryggheten för den som drabbas av arbetslöshet ska öka. Fler ska få ersättning vid arbetslöshet genom att A-kassan fullt ut inryms i det gemensamma välfärdsåtagandet."
  - id: SD-027
    parti: SD
    sida: 6
    rader: '115-119'
    lydelse: "Tandvården ska helt ingå i den allmänna välfärden. Sverigedemokraterna vill slutligen fullt ut inrymma tandvården i den allmänna välfärden för svenska medborgare. Samma högkostnadsskydd som gäller i sjukvården ska gälla för tandvård. Den kraftigt subventionerade tandvården för asylsökande, illegala invandrare och i övrigt ej svenska medborgare ska samtidigt avskaffas."
  - id: SD-028
    parti: SD
    sida: 6
    rader: '120-124'
    lydelse: "Höj pensionerna för alla och mest för dem som arbetat. Sverigedemokraterna vill öka de ekonomiska villkoren för alla pensionärer, inte bara för dem med ingen eller lägst inkomstpension. Skatten på pension ska sänkas och avsättningarna inom den allmänna pensionen ska ses över i syfte att kännbart öka pensionerna."
  - id: SD-029
    parti: SD
    sida: 6
    rader: '125-128'
    lydelse: "Öka statens ansvar för sjukvården. Utred hur delar av sjukvården skulle kunna överföras till statligt huvudmannaskap med inslag från framgångsrika nordiska exempel. Antalet utbildningsplatser ska öka i bristyrken som t.ex. barnmorskor och fler händer i vården ska leda till bättre arbetsmiljö."
  - id: SD-030
    parti: SD
    sida: 7
    rader: '129-136'
    lydelse: "Gör skolan kunskapsfokuserad igen. Återinför ett statligt huvudmannaskap för skolan, med större likvärdighet med nationell skolpeng och tydliga riktlinjer och regelverk. Samtidigt ska den socialdemokratiska flumskolan nedmonteras och en kunskapsfokuserad skola införas med betyg från årskurs fyra. Sverigedemokraterna säger nej till regeringens förslag om bussning av elever i integrationssyfte. Nolltolerans mot hot, våld och kriminella attribut ska råda i skolan. Elever som inte fungerar i skolsituationen ska flyttas till jourskolor. Särskilt stökiga elever ska placeras på pliktskolor."
  - id: SD-031
    parti: SD
    sida: 7
    rader: '137-139'
    lydelse: "Stärk välfärden i hela landet. Läkare, specialistsjuksköterskor och behöriga lärare som väljer att ta anställning i landsbygd och glesbygd, där stor brist på deras kompetens råder, ska få en årlig avskrivning av sina studieskulder."
  - id: SD-032
    parti: SD
    sida: 7
    rader: '140-144'
    lydelse: "Gör det billigare att bygga och möjliggör för fler att äga sitt boende. Många har drömmar om att bilda familj i ett boende som passar dem. Men för många med vanlig ekonomi stannar boendedrömmen där. Krångliga regler och kostsamma krav för att bygga har i kombination med bostadsbrist gjort situationen svår för många."
  - id: SD-033
    parti: SD
    sida: 7
    rader: '145-148'
    lydelse: "Stoppa fusket med välfärdens pengar. 20 miljarder försvinner från välfärden varje år i felaktiga utbetalningar och fusk. Sverigedemokraterna vill säkra utbetalningar ifrån välfärdsystemen genom biometriska data som avläser att det är rätt person som får rätt utbetalning."
  - id: SD-034
    parti: SD
    sida: 7
    rader: '149-152'
    lydelse: "Begränsa tillgången till välfärden för icke-medborgare. Bosättningsbaserade socialförsäkringsförmåner som barnbidrag, bostadsbidrag, efterlevandestöd och föräldrapenning ska begränsas för dem som inte är medborgare eller har kvalificerat sig genom arbete."
  - id: SD-035
    parti: SD
    sida: 7
    rader: '153-158'
    lydelse: "Gör om flerbarnstillägget till ett flerbarnsavdrag. Flerbarnstillägget i barnbidraget har bidragit till segregation och blivit ett verktyg för att hålla kvar utlandsfödda kvinnor i hemmet. För att komma tillrätta med problemen krävs stora förändringar. Som ett första steg föreslår Sverigedemokraterna att dagens flerbarnstillägg slopas och ersätts med ett skatteavdrag som tillkommer dem som arbetar."
  - id: SD-036
    parti: SD
    sida: 7
    rader: '159-164'
    lydelse: "Inför arbetsplikt. Sverige har i dag närmare 700 000 utrikes födda som försörjer sig på bidrag. Det ska inte vara möjligt att leva på bidrag i åratal utan motprestation. Sverigedemokraterna vill införa en svensk motsvarighet av den danska arbetsplikten som innebär att den som får försörjningsstöd också måste prestera genom uppföljningsbara ansträngningar som stärker möjligheten till integration och anställning."
  - id: SD-037
    parti: SD
    sida: 8
    rader: '168-170'
    lydelse: "Kriminaliteten har snabbt utvecklats till det mest påträngande samhällsproblemet. Att vända trenden och återbygga ett tryggt samhälle kommer vara en överordnad prioritering för Sverigedemokraterna. Vägen dit är lång och kommer kräva kraftfulla åtgärder."
  - id: SD-038
    parti: SD
    sida: 8
    rader: '171-174'
    lydelse: "Kriminalpolitiken behöver läggas om i grunden. Brottsligheten och de kriminella ska trängas ut genom omfattande upprustning av rättsväsendet, nya rättsliga verktyg och påföljder som innebär att samhällsfientliga och livsstilskriminella frihetsberövas med långa fängelsestraff och - för utländska medborgare -utvisning."
  - id: SD-039
    parti: SD
    sida: 8
    rader: '175-181'
    lydelse: "Särskilt angeläget är det att återupprätta brottsofferperspektivet. Fokus ska skifta från att söka återanpassa kriminella till att istället skydda samhället och ge upprättelse åt brottsoffer. Straffen ska fullt ut spegla brottens allvar. Det behövs en fullständig och genomgripande översyn av hela strafflagstiftningen. Samtidigt måste åtgärder vidtas för att långsiktigt bryta med den misslyckade migrations- och integrationspolitiken. Att parallellsamhällen där islamister och gängkriminella verkar i förening för att tränga bort det svenska samhället har vuxit sig starkare är ett resultat av hög invandring."
  - id: SD-040
    parti: SD
    sida: 8
    rader: '182-186'
    lydelse: "Att vända utvecklingen och få bort de parallella samhällsstrukturerna i belastade områden är en av den kommande tidens allra största uppgifter - både för att fler unga människor ska få bättre livschanser och för att Sverige ska bli ett samhälle som håller ihop. Då krävs både en ny integrationspolitik som ställer krav och har höga förväntningar och att det svenska samhället gör kraftiga framflyttningar."
  - id: SD-041
    parti: SD
    sida: 8
    rader: '188-195'
    lydelse: "Skärp straffen. Kriminalpolitiken ska i högre grad inriktas på att skydda samhället från kriminella. Inriktningen ska vara att inkapacitera och avskräcka kriminella och att skapa upprättelse åt brottsoffer. Mängd- och ungdomsrabatterna samt förtida frigivning ska avskaffas. Brottsbalken ska ses över för att ytterligare skärpa straffen för bl.a. vålds- och sexualbrott. Särskilt farliga kriminella återfallsförbrytare ska kunna dömas till förvarsdom utan bortre tidsgräns till dess att återfallsrisken bedöms ha försvunnit. Ingen ska släppas ut i väntan att avtjäna en dom i fängelse och fler utdömda straff ska avtjänas i fängelse."
  - id: SD-042
    parti: SD
    sida: 8
    rader: '196-202'
    lydelse: "Ge brottsoffren upprättelse och frid. Det ska bli lättare för brottsoffer att få ut ett skadestånd som står i proportion till brottets allvar, utan att själv behöva driva processen. Vittnesskyddet ska stärkas och det ska införas en möjlighet att vittna anonymt. Möjligheten till permission för gärningsmän ska underkastas brottsoffrets inflytande. Gärningsmän ska också kunna förbjudas att återvända till platser med anknytning till brottet eller brottsoffret och möjligheterna till elektroniskt övervakade kontaktförbud och vistelseförbud ska utökas."
  - id: SD-043
    parti: SD
    sida: 9
    rader: '203-207'
    lydelse: "Fler anstaltsplatser. Både häkten och anstalter är överfulla och fängelsedömda får gå fria för att det inte finns någon plats för dem att avtjäna sitt straff. Om fler kriminella ska avskärmas från samhället måste fler platser fram. Sverigedemokraterna vill dubblera antalet anstaltsplatser, hyra fängelseplatser i utlandet och låta fler utländska medborgare avtjäna straff i sina hemländer."
  - id: SD-044
    parti: SD
    sida: 9
    rader: '208-212'
    lydelse: "Utvisa utländska kriminella. Sveriges främsta ansvar är våra egna medborgare. När utländska medborgare kommer hit, oavsett skäl, och begår brott försakar de också rätten att vara kvar här. De ska utvisas. Vi måste prioritera tryggheten i Sverige framför utländska våldtäktsmän, gängmedlemmar och mördare."
  - id: SD-045
    parti: SD
    sida: 9
    rader: '213-217'
    lydelse: "Rättsväsendet ska vara närvarande. Alla måste kunna känna sig trygga att röra sig i sitt eget samhälle, i sitt eget bostadsområde. Vi ska skapa ett tryggare samhälle med hög närvaro av polis och ordningsvakter, övervakningskameror och belysning. Poliserna måste bli många fler och ges rätt verktyg och mer uppbackning av samhället genom ett resursstarkt rättsväsende i övrigt."
  - id: SD-046
    parti: SD
    sida: 9
    rader: '218-221'
    lydelse: "Förbjud deltagande i kriminella gäng. Den organiserade brottsligheten ska bekämpas. Deltagande i, och samröre med dessa organisationer, ska förbjudas. Den som begår brott relaterade till gängkriminalitet ska dömas till dubbla strafftiden."
  - id: SD-047
    parti: SD
    sida: 9
    rader: '222-225'
    lydelse: "Stoppa gängens inkomster. Gränskontrollerna måste stärkas för att öka kontrollen av inflöden av narkotika och vapen. Det ska bli lättare att förverka misstänkta brottsvinster, värdesaker och statussymboler från gängkriminella och deras anhöriga."
  - id: SD-048
    parti: SD
    sida: 9
    rader: '226-231'
    lydelse: "Öka föräldraansvaret. Inför strikt skadeståndsansvar för föräldrar till ungdomar som begår brott. Utred möjligheten att under vissa förhållanden begränsa tillgången till ekonomiska förmåner och bidrag till föräldrar till omyndiga kriminella. För icke-medborgare bör formerna utredas för att kunna återkalla uppehållstillstånd för familjer där bristande föräldraskap eller missanpassning bidragit till allvarlig brottslighet."
  - id: SD-049
    parti: SD
    sida: 9
    rader: '232-236'
    lydelse: "Sänk straffmyndighetsåldern. Grova brott begås allt oftare av mycket unga gärningsmän. Avsaknaden av skarpa reaktioner gör att unga ofta kommit att präglas av en kriminell livsstil under många år innan de döms första gången. Sverigedemokraterna vill sänka straffmyndighetsåldern så att även brott som begås innan 15 år kan utredas och lagföras."
  - id: SD-050
    parti: SD
    sida: 9
    rader: '237-243'
    lydelse: "Ökade möjligheter att utreda brott. Asylsökande och andra som söker uppehållstillstånd i Sverige bör i anslutning till ansökan åläggas att bidra med DNA och andra biometriska data till ett nytt sökbart register. Registret bör användas både av myndigheter som hanterar utlänningsärenden, för att t.ex. identifiera sökanden som tidigare utvisats eller avvisats från Sverige, och av brottsbekämpande myndigheter. Samverkan mellan polis och andra myndigheter måste också underlättas genom förenklade sekretessregler."
  - id: SD-051
    parti: SD
    sida: 10
    rader: '247-251'
    lydelse: "Ingen enskild faktor kan tillskrivas så stor betydelse för de snabba samhällsförändringar och stora utmaningar som kommit att prägla Sverige som migrationen. Den historiskt stora utomeuropeiska asylinvandringen under gångna decennier och den relaterade anhöriginvandringen har lagt grunden för motsättningar, utanförskap samt eskalerande kriminalitet och våldsbrottslighet."
  - id: SD-052
    parti: SD
    sida: 10
    rader: '252-256'
    lydelse: "Långt fler har tagits emot av de regeringar som styrt Sverige än vad vi haft kapacitet för. Möjligheten att integrera nyanlända till svenska normer, språk och arbetsmarknad har varit liten eftersom mottagandet varit för stort och det kulturella avståndet varit för stort. Kostnaderna för den bedrivna politiken i ekonomiska termer, såväl som vad det inneburit för Sveriges sammanhållning, är svåra att överskatta."
  - id: SD-053
    parti: SD
    sida: 10
    rader: '257-262'
    lydelse: "Att betala av kostnaden den förda politiken kommer ta lång tid. Ett första steg är att bryta med en politik som spär på redan omfattande problem. Sverige har fortfarande en mycket frikostig migrationspolitik. Både i förhållande till andra länder, vad vi är tvungna till enligt asylrätten och i jämförelse med vad som krävs för att bryta samhällsutvecklingen. I fjol uppgick bara anhöriginvandringen till över 40 000 och i år väntas över 100 000 uppehållstillstånd beviljas."
  - id: SD-054
    parti: SD
    sida: 10
    rader: '263-265'
    lydelse: "Sverigedemokraterna lovar att ta ansvar för att säkerställa att inte upprepa de misstag som regeringarna hittills under 2000-talet gjort. Sverige behöver så långt det är möjligt stoppa den asylrelaterade invandringen under överskådlig tid."
  - id: SD-055
    parti: SD
    sida: 10
    rader: '267-272'
    lydelse: "Asyllagstiftningen ska anpassas efter den rättsliga miniminivån enligt EU-rätten. Det innebär att Sveriges lagstiftning inte ska vara mer generös än vad vi är bundna till. Ett omfattande reformarbete ska genomföra sådana restriktiva åtgärder som tillåts enligt EU-rätten. Permanenta uppehållstillstånd ska avskaffas och uppehållstillstånd ska omprövas löpande, beviskraven för asylsökanden ska skärpas och fler som inte sökt skydd vid första säkra tillfälle ska utvisas."
  - id: SD-056
    parti: SD
    sida: 10
    rader: '273-276'
    lydelse: "Begränsa rätten till anhöriginvandring och skärp försörjningskraven. Endast svenska medborgare eller den som enligt internationell lagstiftning har rätt till familjeåterförening ska kunna vara anknytningsperson. Kraven på bostad, inkomst och vandel ska skärpas kraftigt för anhöriginvandring."
  - id: SD-057
    parti: SD
    sida: 10
    rader: '277-282'
    lydelse: "Minska tilldragningsfaktorerna. Förväntningar som ställs i mottagarlandet - vilken service som erbjuds och på vilka språk, vilken diaspora som redan finns från ursprungslandet, kulturella normer, frikostigheten med välfärd och ekonomiska villkor - är avgörande för Sveriges attraktivitet som destinationsland för invandring. En bred politik ska föras för att ur sådana aspekter göra Sverige mindre attraktivt för kulturellt belastande migration."
  - id: SD-058
    parti: SD
    sida: 11
    rader: '283-291'
    lydelse: "Storskaligt och effektivt återvändandearbete. Ett särskilt uppdrag ska ges till Polismyndigheten att särskilt prioritera återvändandearbete och insatser för att identifiera och omhänderta personer som befinner sig i Sverige illegalt. Personer som kan antas sakna rätt att vara i Sverige ska omhändertas och fler ska sättas i förvar eller övervakas i väntan på utvisning om sådan inte kan genomföras omedelbart. En folkräkning ska genomföras och inre utlänningskontroller ska göras till en naturlig komponent i polisens kontakter med allmänheten. Fler moderna verktyg, som fingeravtryck, DNA-test, kamerateknik och AI-analys, ska användas för att hitta och identifiera personer som befinner sig olagligt i Sverige."
  - id: SD-059
    parti: SD
    sida: 11
    rader: '292-298'
    lydelse: "Möjligheten att utvisa en utlänning p.g.a. asocialitet ska utredas. Sverigedemokraterna vill se över en ny grund för återkallande av uppehållstillstånd för utländska medborgare som genom en asocial livsstil uppvisar brister i sina förpliktelser gentemot det svenska samhället eller utgör särskild risk eller belastning för Sverige. Personer som besvarar Sveriges givmildhet genom att uppvisa fientlighet gentemot samhället eller majoritetsbefolkningen bör kunna utvisas p.g.a. asocialitet."
  - id: SD-060
    parti: SD
    sida: 11
    rader: '299-304'
    lydelse: "Reglerna för arbetskraftsinvandring ska skärpas. Arbetskraftsinvandring ska inte kunna komma ifråga för lågkvalificerad arbetskraft eller till yrken där det inte råder yrkesbrist. Kontrollen av arbetskraftsinvandringen måste öka och reglerna behöver skärpas kraftigt genom t.ex. utökade lönekrav och arbetsmarknadsprövning för den som söker uppehållstillstånd för att arbetskraftsinvandra."
  - id: SD-061
    parti: SD
    sida: 11
    rader: '305-309'
    lydelse: "Stimulera frivillig återvandring. Ekonomiska incitamentsstrukturer och myndigheternas arbetssätt ska anpassas för att uppmuntra fler att återvandra frivilligt. Det ska göras relativt mer attraktivt för den som inte anstränger sig för att bli självförsörjande eller söker tillhörighet till det svenska samhället att återvända till sitt ursprungsland eller dess närområde, än att leva i parallellsamhällen i Sverige."
  - id: SD-062
    parti: SD
    sida: 11
    rader: '310-313'
    lydelse: "Uppvärdera medborgarskapet. Hemvistkravet ska utökas till tio år. För att få svenskt medborgarskap ska man kunna tala svenska på god nivå och ha god förståelse för svenskt samhälle, kultur och normer. Hederlig vandel och självförsörjning ska vara ett villkor för att erhålla medborgarskap i Sverige."
  - id: SD-063
    parti: SD
    sida: 11
    rader: '314-317'
    lydelse: "Återupprätta gränskontroller. Kontrollen över vilka som tar sig in i Sverige ska öka för att minska illegal migration till Sverige. Berörda myndigheter ska få de möjligheter och de verktyg som de behöver för att upprätthålla inre gränskontroller."
  - id: SD-064
    parti: SD
    sida: 11
    rader: '318-323'
    lydelse: "Stoppa EU-förslag om migrationspakten. EU driver för närvarande ett förslag som skulle innebära att principen om att asyl ska sökas i första land ersätts med en omfördelning baserad på anknytning. Det skulle riskera att straffa svenskarna dubbelt för den massinvandring som varit. Länder som inte önskar ta emot asylsökande skulle om förslaget går igenom kunna straffas ekonomiskt av EU. Sverigedemokraterna kommer göra allt för att Sverige ska stoppa EU-förslaget."
  - id: SD-065
    parti: SD
    sida: 12
    rader: '326-331'
    lydelse: "Detta valmanifest innehåller ett urval av vallöften i aktuella frågor på fyra politiska områden som är särskilt prioriterade för Sverigedemokraterna. Men våra anspråk stannar inte här. Vi går till val på en heltäckande politik som kan läsas i vår mer omfattande valplattform."
  - id: SD-066
    parti: SD
    sida: 12
    rader: '332'
    lydelse: "Läs valplattformen: sd.se/dokument"
  - id: C-001
    parti: C
    sida: 3
    rader: '53-54'
    lydelse: "Valet 2022 handlar om vilket Sverige vi vill ha, och Centerpartiets vision för framtiden är hoppfull."
  - id: C-002
    parti: C
    sida: 3
    rader: '55-56'
    lydelse: "Vi kan skapa ett friare samhälle där alla har möjlighet att lyckas i livet - oavsett vem de är eller var de bor, varifrån de kommer eller vart de är på väg."
  - id: C-003
    parti: C
    sida: 3
    rader: '57-58'
    lydelse: "Vi kan bygga ett samhälle som tar vara på hela landets styrka och växtkraft, på landsbygd, i byar, i städer och i förorter."
  - id: C-004
    parti: C
    sida: 3
    rader: '59-60'
    lydelse: "Vi kan klara klimat- och miljöutmaningen och överlämna en hållbar planet till kommande generation."
  - id: C-005
    parti: C
    sida: 3
    rader: '61-62'
    lydelse: "Vi kan skapa ett mer jämställt Sverige som stärker kvinnors egenmakt och stoppar mäns våld mot kvinnor."
  - id: C-006
    parti: C
    sida: 3
    rader: '63-65'
    lydelse: "Vi kan förbättra vår gemensamma välfärd, från den bästa skolan när du är ung, till den bästa sjukvården när du blir sjuk och den bästa omsorgen på ålderns höst."
  - id: C-007
    parti: C
    sida: 3
    rader: '66-68'
    lydelse: "Vi som bor i Sverige kan göra allt detta - tillsammans - men det kommer inte att bli enkelt. För Sverige och världen står inför stora utmaningar. Vi måste ta itu med dem nu."
  - id: C-008
    parti: C
    sida: 3
    rader: '71-73'
    lydelse: "Klimatutmaningen är akut. Temperaturer stiger, polarisar smälter och bränder rasar. Ekosystem kollapsar, människor flyr och matförsörjningen hotas. Varje dag utan handling är en förlorad dag."
  - id: C-009
    parti: C
    sida: 3
    rader: '74-80'
    lydelse: "En annan utmaning är risken att Sverige klyvs. Samtidigt som många branscher skriker efter medarbetare är hundratusentals människor arbetslösa. Vissa delar av landet har växtvärk medan andra bara har värk. I delar av landet minskar befolkningen och avstånden till offentlig och kommersiell service ökar. På många håll har myndigheters närvaro och förståelse för människors livssituation minskat, vilket leder till lägre tillit. Även i städerna pågår det en klyvning på grund av segregation och utanförskap. I för många kvarter har kriminella gäng tagit över."
  - id: C-010
    parti: C
    sida: 3
    rader: '81-85'
    lydelse: "Klyvningen skär också mellan enskilda människor och grupper. För de som redan kämpar med att få ihop hushållskassan slår stigande priser och räntor extra hårt, och för svenskar med utländsk bakgrund är arbetslöshet och sämre hälsa vanligare än för genomsnittet. Dessutom hamnar fler pojkar efter i skolan och tre färdedelar av de som tar sitt liv är män."
  - id: C-011
    parti: C
    sida: 3
    rader: '86-89'
    lydelse: "Jämställdheten i Sverige har en lång väg kvar att gå. Kvinnor äger hälften så mycket som män, och i dagens takt kommer lönegapet att slutas först 2041. Kvinnodominerade yrken undervärderas och kvinnor tar större ansvar för familj och hem. Män utsätter tiotusentals kvinnor för våld varje år."
  - id: C-012
    parti: C
    sida: 3
    rader: '90-92,94-97'
    lydelse: "Runtom i världen pågår en kamp mellan anhängare av den liberala demokratin och auktoritära krafter. Den måste vi vinna. Ibland förs kampen med vapen, som i fallet med Rysslands anfallskrig, som hotar Ukrainas överlevnad och hela Europas säkerhet. Ibland förs den med politik. I land efter land försöker auktoritära rörelser flytta fram positionerna, inskränka kvinnors, minoriteters och HBTQI-personers rättigheter samt attackera den fria pressen. Vi ser samma utveckling även här i Sverige."
  - id: C-013
    parti: C
    sida: 4
    rader: '98-102'
    lydelse: "För det vi bevittnar nu är historiskt. Ett högerpopulistiskt och främlingsfientligt parti med auktoritära ledare som förebilder ingår i ett regeringsalternativ för första gången sedan demokratins intåg. Ett parti som pekat ut liberalismen som sin huvudmotståndare. Ett parti som utmanar grundläggande demokratiska principer om allas lika värde och likhet inför lagen."
  - id: C-014
    parti: C
    sida: 4
    rader: '103-105'
    lydelse: "Sveriges utmaningar är många men våra styrkor är fler. Sverige är ett av världens bästa länder att leva i. Vi som bor här och de som levde före oss har byggt ett samhälle som kännetecknas av välstånd, frihet och rättssäkerhet ett samhälle där vi månar om och respekterar både varandra och miljön."
  - id: C-015
    parti: C
    sida: 4
    rader: '106-108'
    lydelse: "Sverige rankas ofta i topp när det gäller levnadsstandard, innovationsklimat och hänsyn för miljö och klimat. Genom hårt arbete och framgångsrika reformer har Sverige blivit en av världens mest framgångsrika ekonomier."
  - id: C-016
    parti: C
    sida: 4
    rader: '109-110'
    lydelse: "Med den historien i ryggen och med Sveriges alla styrkor är en ljusare framtid möjlig."
  - id: C-017
    parti: C
    sida: 4
    rader: '113'
    lydelse: "En röst på Centerpartiet är en röst för Sveriges bästa."
  - id: C-018
    parti: C
    sida: 4
    rader: '114-116'
    lydelse: "Vi har de liberala värderingar som ligger till grund för ett land med frihet, demokrati och välfärd, och vi har den framåtdrivna reformagenda och den handlingskraft som krävs för att förbättra samhället."
  - id: C-019
    parti: C
    sida: 4
    rader: '117-121'
    lydelse: "Våra gröna frihetliga värderingar vägleder allt vi gör. Centerpartiet kommer alltid att kämpa för ett friare Sverige där människor kan bestämma mer över sina egna liv. För att lyckas med det krävs mer ekonomisk och social frihet, bättre omsorg om miljö och klimat och en trygg välfärd som ger alla möjlighet att förverkliga sina drömmar, oavsett förutsättningar."
  - id: C-020
    parti: C
    sida: 4
    rader: '122-124'
    lydelse: "I ett stormigt politiskt klimat står vi stadigt i våra värderingar. När andra ställer människa mot människa, grupp mot grupp, försvarar vi öppenheten, demokratin och principen om allas lika värde."
  - id: C-021
    parti: C
    sida: 4
    rader: '125-129'
    lydelse: "Dessa värderingar genomsyrar hela vår reformagenda. Det måste bli lättare att få ett jobb och bli billigare att anställa. Sverige måste bli mer jämställt; ingen kvinna ska utsättas för våld eller begränsas i livet eller karriären. Och hela landet ska leva och utvecklas. Allt detta förutsätter att miljön och klimatet mår bra, nu och för kommande generationer."
  - id: C-022
    parti: C
    sida: 4
    rader: '130-134'
    lydelse: "Centerpartiet har den handlingskraft som krävs för att göra visioner till verklighet och förbättra människors vardag. Runtom i hela landet kavlar vi upp ärmarna för att få saker gjorda. Vi värderar samarbete, ansvarstagande och resultat framför politiskt spel. Vi prioriterar långsiktiga, gemensamma lösningar med partier från både vänster och höger."
  - id: C-023
    parti: C
    sida: 5
    rader: '136-138'
    lydelse: "Den här kombinationen av starka principer och konstruktiv samarbetsvilja visar varför det behövs en stark liberal kraft i svensk politik, som sätter den enskilda människan i första rummet."
  - id: C-024
    parti: C
    sida: 5
    rader: '139-142'
    lydelse: "Det är möjligt att bygga koalitioner som varken utgår från den främlingsfientliga högerns nationalism eller den socialistiska vänsterns kvävande kollektivism. En majoritet av väljarna vill just det - att partierna lägger prestigen åt sidan och söker samarbete i mitten."
  - id: C-025
    parti: C
    sida: 5
    rader: '143-147'
    lydelse: "Under de senaste åren har den politiska spelplanen förändrats och övriga borgerliga partier har öppnat för att regera ihop med Sverigedemokraterna. Centerpartiet är nu det enda borgerliga partiet som inte kommer samarbeta med Sverigedemokraterna eller ge dem makt över hur Sverige ska styras. Det står vi fast vid."
  - id: C-026
    parti: C
    sida: 5
    rader: '148-151'
    lydelse: "Kommande mandatperiod kommer på många sätt att präglas av att föra Sverige in i Nato och höja vår försvarsförmåga, säkra vår energiförsörjning, men också hanteringen av en hög inflation och stigande kostnader för hushållen. Därför krävs en stabil regering som har fokus på och förmåga att hantera dessa centrala frågor."
  - id: C-027
    parti: C
    sida: 5
    rader: '152-156'
    lydelse: "Inför årets val söker Centerpartiet stöd för samarbete och en ny regering med en liberal politik förankrad i mitten. Det bästa för Sverige vore om fler partier hade mod att samarbeta över den traditionella blockgränsen. Det kommer Centerpartiet fortsätta sträva efter, för stabilitet och breda lösningar i en orolig tid."
  - id: C-028
    parti: C
    sida: 5
    rader: '157'
    lydelse: "Det är så vi hittar långsiktiga och konstruktiva lösningar för Sveriges bästa."
  - id: C-029
    parti: C
    sida: 5
    rader: '159-161'
    lydelse: "Sverige behöver ett handlingskraftigt klimatledarskap som gör skillnad på riktigt. För att övervinna klimathotet måste vi ta vara på teknikens möjligheter och företagens innovationskraft."
  - id: C-030
    parti: C
    sida: 5
    rader: '162-164'
    lydelse: "Hela landet behövs, från förort till industriort, från storstad till landsbygd. Alla delar av Sverige ska se ökad frihet, trygghet och tillgänglighet nästa mandatperiod. Det är dags att frigöra landsbygdens enorma potential."
  - id: C-031
    parti: C
    sida: 5
    rader: '165-168'
    lydelse: "Vi ska bygga ett jämställt Sverige med möjligheter och rättvisa för alla. Vi ska stärka kvinnors trygghet och egenmakt. Förebyggande åtgärder mot mäns våld mot kvinnor ska genomsyra hela samhället och män som slår ska inte komma undan."
  - id: C-032
    parti: C
    sida: 5
    rader: '169-171'
    lydelse: "Småföretagen är motorer för jobb, integration och möjligheter. Vi ska skapa bättre förutsättningar för dem att lyckas, med lägre skatt, mindre regelkrångel och en starkare arbetslinje."
  - id: C-033
    parti: C
    sida: 5
    rader: '172-174'
    lydelse: "Sveriges och hushållens ekonomi måste stärkas, idag och långsiktigt. Vi ska sänka det totala skattetrycket och skapa stabilitet i statsfinanserna genom att hushålla med skattebetalarnas pengar."
  - id: C-034
    parti: C
    sida: 5
    rader: '175-176,178'
    lydelse: "Vi ska bygga en vård och omsorg som sätter människan i centrum. Den ska bedrivas närmare den som behöver hjälp och med bättre arbetsvillkor för medarbetarna. Så kortar vi köerna och stärker likvärdigheten i hela landet."
  - id: C-035
    parti: C
    sida: 6
    rader: '179-180'
    lydelse: "Den liberala demokratin får aldrig tas för given. Den ska vårdas, värnas och vidareutvecklas - idag och för kommande generationer."
  - id: C-036
    parti: C
    sida: 6
    rader: '181-183'
    lydelse: "Vi ska stärka samhällskontraktet för ett tryggare och starkare Sverige, från landets gränser till ditt kvarter. Vi behöver rusta Sveriges totalförsvar, stärka hela rättskedjan, satsa på förebyggande insatser och en likvärdig skola."
  - id: C-037
    parti: C
    sida: 6
    rader: '184-188'
    lydelse: "Centerpartiet söker samarbete för en politik som är tydligt förankrad i mitten. Vi står för grön, liberal politik och för att bryta den splittring och polarisering som riskerar att förlama Sveriges politiska handlingskraft. Sverige behöver vare sig främlingsfientlig högernationalism eller socialistisk vänsterpolitik."
  - id: C-038
    parti: C
    sida: 6
    rader: '190'
    lydelse: "Framtiden är grön."
  - id: C-039
    parti: C
    sida: 6
    rader: '191-195'
    lydelse: "Centerpartiet sätter klimatet först, för att framtiden måste vara grön. När skogbränder rasar, havsnivåer stiger och stormar förvärras. När polarisar och glaciärer smälter, ekosystem kollapsar och människor flyr och mister livet till följd av klimatförändringar måste vi agera. Snabbt, kraftfullt och gemensamt."
  - id: C-040
    parti: C
    sida: 6
    rader: '196-198'
    lydelse: "Framtiden är också grön för att det är där - i klimatkampens framkant - som möjligheterna finns. Sverige är redan en världsledande producent av miljövänliga varor och tjänster men vi kan mycket mer. Marknaden är enorm och den kommer bara att växa. Där finns morgondagens jobb och välstånd."
  - id: C-041
    parti: C
    sida: 6
    rader: '199-201'
    lydelse: "En grön industriboom har redan påbörjats i Sverige, från batteriproduktion, bioraffinaderier och världens första fossilfria stål i norr till eldrivna bilar, flygplan och lastbilar längre söderut."
  - id: C-042
    parti: C
    sida: 6
    rader: '202-206'
    lydelse: "Företagens innovationskraft är nödvändig för att Sverige och resten av världen ska bli kvitt sitt beroende av fossil energi och övervinna klimathotet. Ekonomisk tillväxt och ett ambitiöst miljö- och klimatarbete måste i praktiken gå hand i hand, och med rätt politiska reformer går det att skapa jobb, öka välståndet och samtidigt sänka utsläppen."
  - id: C-043
    parti: C
    sida: 6
    rader: '207-212'
    lydelse: "För att göra framtiden grönare måste många saker hända på hemmaplan. Det ska kosta mer att smutsa ner. Det ska vara lätt att göra rätt i vardagen. Transporternas utsläpp ska bort och ny utsläppsfri infrastruktur ska komma på plats. Och det ska också löna sig för hela landet att ställa om till en grönare ekonomi. Mer behöver göras för att flyget, sjöfarten och jordbruket ska kunna ställa om till förnybara drivmedel med stärkt konkurrenskraft."
  - id: C-044
    parti: C
    sida: 6
    rader: '213-218,220-221'
    lydelse: "I Sverige behövs ett ännu mer konkurrenskraftigt och hållbart lantbruk, robust elförsörjning, bättre infrastruktur och fler snabbladdare för elbilar. Sverige är EU:s näst mest glesbefolkade land och det innebär särskilda utmaningar för gles- och landsbygden som politiska beslut måste ta hänsyn till - det gäller inte minst behovet av kommunikationer och infrastruktur. Med rätt reformer kommer nya jobb att skapas på landsbygden inom allt från produktion av biobränslen till utvinning av de mineral och metaller som krävs för den gröna omställningen."
  - id: C-045
    parti: C
    sida: 7
    rader: '222-226'
    lydelse: "Sveriges städer ska bli grönare. Vi vill att varje invånare har närhet till grönska, med hög biologisk mångfald, fler parker och renare vatten. Städernas elförsörjning ska förbättras och det ska bli enklare att bygga solpaneler på taken. Elbilarna ska främjas med hjälp av fler laddplatser, differentierade trängselskatter som gynnar miljöbilar och bättre parkeringsmöjligheter. Det ska dessutom vara smidigt att välja bort bilen till förmån för tåg, buss, båt och cykel."
  - id: C-046
    parti: C
    sida: 7
    rader: '227-232'
    lydelse: "Med Centerpartiets reformagenda kan Sverige dessutom göra mycket mer för att sänka utsläpp i andra länder. Vi ska använda handelspolitiken för att kapa fossila subventioner runtom i världen och pressa stora utsläppare som Kina att stänga ner sina kolkraftverk. EU:s system för handel med utsläppsrätter är bland de mest effektiva verktyg vi har, och vi vill göra det ännu mer ambitiöst och öppna upp det för fler länder som vill ansluta sig."
  - id: C-047
    parti: C
    sida: 7
    rader: '233-236'
    lydelse: "Allt detta kräver ett nytt ledarskap i miljö- och klimatfrågor. Ett ledarskap som tar klimatfrågan på allvar och som är fast beslutet att Sverige ska gå före och visa vägen. Ett ledarskap som prioriterar effektiva åtgärder framför symbolpolitik eller passivitet. Som tar vara på teknikens möjligheter och människors innovationskraft, samt deras vilja till omställning och en hållbar livsstil."
  - id: C-048
    parti: C
    sida: 7
    rader: '237-239'
    lydelse: "För Centerpartiet är omsorg om miljö och klimat en central del av politiken, aldrig en nedprioritering eller ett särintresse. Att planeten mår bra är en grundförutsättning för resten av samhällsbygget."
  - id: C-049
    parti: C
    sida: 7
    rader: '240-241'
    lydelse: "Sveriges framtid är grön, och om vi får bestämma är den här fortare än någon anar."
  - id: C-050
    parti: C
    sida: 7
    rader: '245-250'
    lydelse: "Sverige ska bli Europas gröna batteri och exportera el till grannländer som fasar ut sitt fossilberoende. Vi vill fördubbla produktionen av utsläppsfri el, och rusta och bygga ut elnätet. Minst 50 TWh utsläppsfri el måste börja byggas nästa mandatperiod. Det krävs en kriskommission för att snabbare öka Sveriges utsläppsfria elproduktion och tillstånd för vindkraft ska få ta max två år."
  - id: C-051
    parti: C
    sida: 7
    rader: '251-253'
    lydelse: "Stryp Putins krigskassa nu. Vi vill stoppa all energihandel med Ryssland och fasa ut fossila bränslen. Sveriges energioberoende måste stärkas, bland annat genom att mångdubbla produktionen av biobränslen och biogas."
  - id: C-052
    parti: C
    sida: 7
    rader: '254-257'
    lydelse: "Skogen är en nyckel i den gröna omställningen. Ett hållbart skogsbruk förutsätter ett aktivt brukande av skogen. Den lagrar koldioxid, skapar jobb och är källan till framtidens biobränslen och byggmaterial. Skogsbruket behöver goda förutsättningar grundade i en stark äganderätt."
  - id: C-053
    parti: C
    sida: 8
    rader: '260-265'
    lydelse: "Det ska vara enkelt och billigt att installera solpaneler, bygga laddning till elbilar och minska energianvändningen hemma - vare sig man bor i hus eller lägenhet. Det kan vi lösa genom att bredda och skala upp det gröna avdraget och göra det enklare att installera solpaneler på flerfamiljshus. Det ska finnas gott om laddplatser längs våra vägar och på våra parkeringar i hela landet."
  - id: C-054
    parti: C
    sida: 8
    rader: '266-268'
    lydelse: "Klimatet kan inte vänta på dyra och krångliga regelverk. Det är dags att halvera tiden det tar att få tillstånd för gröna investeringar och reformera miljöbalken så att ett projekts klimatnytta ges större vikt i miljöprövningen."
  - id: C-055
    parti: C
    sida: 8
    rader: '269-271'
    lydelse: "Sverige ska bli världens mest resurseffektiva land och ekonomin mer cirkulär. Med rätt stöd och regelförenklingar kan vi återvinna och återbruka allt från kläder till mineral och metaller."
  - id: C-056
    parti: C
    sida: 8
    rader: '272-275'
    lydelse: "För att klara den gröna omställningen måste vi ta vara på Sveriges naturresurser. Det är bättre att Sverige tar ansvar och utvinner mer mineral och metaller istället för att fortsätta importera dem från länder med större klimatavtryck och sämre arbetsvillkor."
  - id: C-057
    parti: C
    sida: 8
    rader: '277-279'
    lydelse: "Rädda Sveriges sjöar, vattendrag och hav. Våra barn ska kunna bada utan att utsättas för gifter, nedskräpning eller algblomning. Skadlig bottentrålning ska inte få förstöra för varken havsmiljön, den småskaliga fiskenäringen eller sportfisket."
  - id: C-058
    parti: C
    sida: 8
    rader: '280-283'
    lydelse: "Sveriges natur ska vårdas och den biologiska mångfalden utvecklas. Mer måste göras för att restaurera våtmarker, bekämpa invasiva arter och underlätta för markägare att bidra, då frivillighet och äganderätt är grunden för en bättre naturvård."
  - id: C-059
    parti: C
    sida: 8
    rader: '284-286'
    lydelse: "Vi ska arbeta för mer närodlad och klimatsmart mat och ett levande, hållbart jordbruk som bidrar till den biologiska mångfalden. Vi vill stärka de gröna näringarnas konkurrenskraft."
  - id: C-060
    parti: C
    sida: 8
    rader: '287-291'
    lydelse: "Sveriges städer ska bli grönare. Utsläppsfria transporter, cyklar, elbilar och kollektivtrafik ska bli smidigare och attraktivare. Vi vill se fler grönområden nära där människor bor, renare vatten och mer biologisk mångfald. Det ska bli enklare att producera mer av sin egen el, med bland annat solpaneler och bättre elförsörjning inne i tätorter."
  - id: C-061
    parti: C
    sida: 9
    rader: '294'
    lydelse: "Landsbygden bygger Sverige."
  - id: C-062
    parti: C
    sida: 9
    rader: '295-300'
    lydelse: "Här finns mycket av vår gemensamma styrka: råvarorna som skapat vårt välstånd, den gröna energi som driver klimatomställningen framåt och många av de människor som bidrar till att göra Sverige till världens bästa land. Här finns världens mest klimatsmarta jordbruk, som ger oss öppna landskap, mat på bordet, jobb och utveckling. Här finns skogen, som är helt avgörande för klimatarbetet och den svenska bioekonomin, för nya klimatsmarta produkter och för jobben runt om i vårt land."
  - id: C-063
    parti: C
    sida: 9
    rader: '301-302'
    lydelse: "Här finns också livet för alla oss som valt att leva på landsbygden i en helt vanlig men ofta helt fantastisk vardag - en vardag som det inte pratas tillräckligt mycket om i den politiska debatten."
  - id: C-064
    parti: C
    sida: 9
    rader: '303-305'
    lydelse: "Om vi lyckas förbättra landsbygdernas villkor gör vi en insats för hela landets bästa - för Sveriges beredskap och för framtida generationer. Om vi misslyckas blir Sverige fattigare, både ekonomiskt och kulturellt. Det är dags att välja väg."
  - id: C-065
    parti: C
    sida: 9
    rader: '306-311'
    lydelse: "Att hela landet ska leva handlar delvis om att skapa möjligheter. Oavsett var i landet vi bor ska man ha tillgång till en bra skola som ung och möjlighet att vidareutbilda sig längre fram i livet. Hela landet ska ha tillgång till en pålitlig infrastruktur, snabbt bredband och pålitlig mobiltäckning. Och det ska vara möjligt att hitta ett bra jobb eller starta ett framgångsrikt företag. Det är dags att frigöra landsbygdernas växtkraft."
  - id: C-066
    parti: C
    sida: 9
    rader: '312-316'
    lydelse: "Goda ekonomiska förutsättningar är inte minst avgörande för lantbruket och de gröna näringarna. Efter de senaste årens handelsstörningar, varubrist och höga priser har fler fått upp ögonen för värdet av en konkurrenskraftig och välmående livsmedelsförsörjning. Den är viktig i goda tider och livsviktig i händelse av krig eller kris. Matproduktionen måste öka, på kort och lång sikt."
  - id: C-067
    parti: C
    sida: 9
    rader: '317-320'
    lydelse: "Det är viktigt för företagandet i våra gles- och landsbygder - såväl för de gröna näringarna som för den viktiga besöksnäringen. Besöksnäringen har stor betydelse för hela landets utveckling, och för att den ska kunna fortsätta växa krävs också bättre kommunikationer och infrastruktur."
  - id: C-068
    parti: C
    sida: 9
    rader: '321-324'
    lydelse: "Regelförenklingar, skattesänkningar, gårdsförsäljning av alkohol och ett mer tillväxtvänligt strandskydd är bara några av de reformer som måste komma på plats för att stärka landsbygdens konkurrenskraft och öka människors frihet och självbestämmande."
  - id: C-069
    parti: C
    sida: 9
    rader: '325-327'
    lydelse: "Att hela landet ska leva är också en fråga om rättvisa. Alla invånare ska ha tillgång till en likvärdig och pålitlig välfärd oavsett var de bor, och den offentliga servicen ska finnas där när man behöver den. Ingen ska känna sig otrygg för att polisen är många mil bort; det är dags att öppna upp landsbygdens polisstationer på nytt."
  - id: C-070
    parti: C
    sida: 9
    rader: '328-330'
    lydelse: "Vinsterna från lokal kraftproduktion - som vind och vatten - ska i större utsträckning stanna kvar i bygden. Att bygga lokalt stöd och ge rättvis ersättning till markägare och närboende är viktiga nycklar för att lyckas med den gröna omställningen."
  - id: C-071
    parti: C
    sida: 9
    rader: '331-332'
    lydelse: "Kampen för landsbygdens villkor har varit en grundbult i Centerpartiets politik sedan vi grundades, ett arv vi vårdar och vidareutvecklar än idag."
  - id: C-072
    parti: C
    sida: 10
    rader: '337-339'
    lydelse: "Dyra, krångliga och innovationshämmande regelverk ligger som en våt filt över delar av landsbygden. Vi ska rensa upp bland överflödiga regler och byråkrati."
  - id: C-073
    parti: C
    sida: 10
    rader: '340-343'
    lydelse: "Strandskyddet ska reformeras så att det blir lättare att bygga och bo på landsbygden. Det är dags att ge landsbygdsborna mer självbestämmande över sin egen mark, och genom regelförenklingar göra det enklare att bygga och bo på landsbygden."
  - id: C-074
    parti: C
    sida: 10
    rader: '344-346'
    lydelse: "Det är orimligt att lokala producenter av alkoholhaltiga drycker inte kan sälja sina produkter till besökare. Tillåt gårdsförsäljning av alkohol för att stärka besöksnäringen och utveckla landsbygden."
  - id: C-075
    parti: C
    sida: 10
    rader: '347-351'
    lydelse: "Sverige behöver ett ännu mer konkurrenskraftigt jordbruk. En långsiktigt hållbar livsmedelsförsörjning med ökad försörjningstrygghet och ökad matproduktion kräver regelförenklingar och skattesänkningar, inklusive ett kraftfullt jordbruksavdrag och en biodrivmedelspremie som gör det hållbara lantbruket mer lönsamt."
  - id: C-076
    parti: C
    sida: 10
    rader: '353-356'
    lydelse: "Vi vill rusta upp regionala järnvägar, bygga nya stambanor från norr till söder, höja standarden på det nationella stambanenätet i hela landet och storsatsa på morgondagens tågtrafik - för klimatets och landsbygdens bästa."
  - id: C-077
    parti: C
    sida: 10
    rader: '357-360'
    lydelse: "Landsbygden behöver bättre vägar och bättre tillgång till cykelvägar. Vi vill rusta upp vägarna, göra dem mer trafiksäkra för alla trafikanter, förbättra belysningen, vägunderhållet året runt och bygga fler laddstolpar och snabbladdare i hela landet."
  - id: C-078
    parti: C
    sida: 10
    rader: '361-363'
    lydelse: "Det regionala flyget håller ihop Sverige. Flyginfrastrukturen ska fungera i hela landet. Vi vill säkerställa att de regionala flygplatserna står redo med rätt infrastruktur när elflyget utvecklas i snabb takt."
  - id: C-079
    parti: C
    sida: 10
    rader: '364-366'
    lydelse: "Alla ska ha tillgång till bredband, mobiltelefoni och surf i hela landet. Vi vill fortsätta bygga ut bredbandet och stärka mobiltäckningen i hela landet, inklusive på tågen."
  - id: C-080
    parti: C
    sida: 10
    rader: '367-368'
    lydelse: "Det reformerade reseavdraget måste i större utsträckning kompensera för de kostnader som följer med de långa avstånden på landsbygden."
  - id: C-081
    parti: C
    sida: 10
    rader: '370-371'
    lydelse: "Offentlig service ska vara nära och pålitlig i hela landet. Alla ska ha en trygg polisnärvaro, en likvärdig skola och en trygg och nära vård och omsorg oavsett var de bor."
  - id: C-082
    parti: C
    sida: 11
    rader: '373-375'
    lydelse: "Den som bor på landsbygden men betalar för sådant som det offentliga står för i tätort ska bli kompenserad. Därför vill vi införa ett avdrag för avgifterna till väg-, brygg- och bredbandssamfälligheter."
  - id: C-083
    parti: C
    sida: 11
    rader: '376-378'
    lydelse: "Den gröna omställningen kräver lokal förankring. Den som bor eller äger mark nära ett vindkraftverk ska kunna få ersättning. Mer av värdet som skapas från naturresurser - exempelvis vindkraft, vattenkraft och gruvor ska stanna kvar lokalt."
  - id: C-084
    parti: C
    sida: 11
    rader: '379-381'
    lydelse: "Statliga myndigheter måste samverka och arbeta marksnålt när man tar ny mark i anspråk för väg, tåg, el, etcetera. Likaså ska ersättning för ianspråktagen mark ersättas till avsevärt större belopp än idag."
  - id: C-085
    parti: C
    sida: 11
    rader: '384-387'
    lydelse: "Centerpartiet kommer alltid försvara din rätt att forma ditt eget liv. Oavsett vem du är eller varifrån du kommer ska du ha friheten och möjligheten att bestämma själv vart du är på väg. Varken staten eller samhället ska definiera dig eller stå i vägen för din utveckling eller dina drömmar."
  - id: C-086
    parti: C
    sida: 11
    rader: '388-392'
    lydelse: "Vi ser samtidigt de strukturer som håller människor tillbaka. Både flickor och pojkar tar skada när de trycks ner i fack som inte passar dem - vare sig det handlar om hederskultur i familjen, särbehandling i skolan eller diskriminering på arbetsplatsen. Sådana strukturer och normer måste tas på allvar och motarbetas."
  - id: C-087
    parti: C
    sida: 11
    rader: '393-394'
    lydelse: "Därför är det en självklarhet för Centerpartiet att vi ska leda kampen för ett jämställt Sverige som skapar möjligheter och rättvisa för alla."
  - id: C-088
    parti: C
    sida: 11
    rader: '395-397'
    lydelse: "Vi ska leda Sverige mot ett slut på mäns våld mot kvinnor. Män som slår ska inte komma undan. Därför vill vi skärpa straffen för sexualbrott och för mäns våld mot kvinnor, och kriminalisera kontrollerande beteende."
  - id: C-089
    parti: C
    sida: 11
    rader: '398-402'
    lydelse: "Det är också viktigt att brottsoffer får bättre stöd och att eftervåldet bekämpas. Vi vill bland annat att elektronisk fotboja används oftare och stärka skyddet för familjer med skyddad identitet. Kvinnojourer, tjejjourer och skyddade boenden behöver mer och permanent finansiering för att kunna fortsätta sitt viktiga arbete."
  - id: C-090
    parti: C
    sida: 11
    rader: '403-406'
    lydelse: "Varje man som slår var en gång en pojke. Därför är det viktigt att förebyggande insatser genomsyrar hela samhället och att det offentliga lägger grunden redan i förskolan och skolan. Organisationer som jobbar med flickor och pojkar, förövare och utsatta, ska ha den långsiktiga finansiering de behöver."
  - id: C-091
    parti: C
    sida: 11
    rader: '407-411'
    lydelse: "För att snabbare fånga upp barn i riskzonen vill vi se handlingsplaner mot hedersförtryck i alla skolor och bättre utbildning av personal. För att öka möjligheterna att upptäcka hedersförtryck behöver vi införa den nationella frånvarostatistik för skolan som Centerpartiet har drivit på för. Med ett förbud mot oskuldskontroller kan vi skydda flickor ytterligare."
  - id: C-092
    parti: C
    sida: 12
    rader: '413-415'
    lydelse: "Vi ska dessutom leda Sverige till större ekonomisk jämställdhet. Vi vill uppvärdera statusen på kvinnodominerade yrken och förbättra arbetsvillkoren inom offentlig sektor. Även kvinnors företagande behöver främjas, med trygghetssystem anpassade till företagares villkor och en mer jämställd fördelning av det offentliga riskkapitalet."
  - id: C-093
    parti: C
    sida: 12
    rader: '416-419'
    lydelse: "Att föda barn ska inte stå i vägen för karriären och föräldraskap ska inte vara en ekonomisk fälla för kvinnor. Därför vill vi reformera föräldraförsäkringen för en mer jämställd, enkel och tydlig föräldraförsäkring anpassad till vårt moderna samhälle och arbetsliv."
  - id: C-094
    parti: C
    sida: 12
    rader: '420-424'
    lydelse: "För många familjer med små marginaler är kostnaden ett problem som gör att många barn inte får tillgång till den gemenskap och förberedelse för skolan som förskolan är. Vi vill göra förskola och fritidsverksamhet tillgänglig för alla, utan att dessa kostnader drabbar kommunerna, för att underlätta integrationen, stärka jämställdheten och ge varje barn en bra start i livet."
  - id: C-095
    parti: C
    sida: 12
    rader: '425-427'
    lydelse: "Vi ska leda Sverige till en mer jämställd sjukvård. Vi vill satsa på forskning om kvinnosjukdomar, den stressrelaterade psykiska ohälsan och stärka den genusmedicinska kompetensen inom vården. Förlossningsvården ska vara trygg och likvärdig i hela landet."
  - id: C-096
    parti: C
    sida: 12
    rader: '428-432'
    lydelse: "Vi kan inte låta jämställdhetsproblemen fortgå en mandatperiod till. Inte bara av respekt för den enskilda flickans och kvinnans okränkbara rättigheter utan också för att jämställdheten gynnar hela samhället. Sverige blir rikare och ett bättre land att leva i när fler kvinnor jobbar och inte hindras från att nå sin fulla potential."
  - id: C-097
    parti: C
    sida: 12
    rader: '433-435'
    lydelse: "Vi är liberaler för att vi tror på individens frihet och allas lika värde. Ett samhälle utan jämställdhet är inte fullständigt fritt; ett samhälle utan jämställdhet är inte riktigt rättvist. Därför kan vi inte vänta på ett jämställt Sverige."
  - id: C-098
    parti: C
    sida: 12
    rader: '438-440'
    lydelse: "Män som slår ska inte komma undan. Vi vill höja straffen för sexualbrott, grov fridskränkning och grov kvinnofridskränkning. Dessutom vill vi kriminalisera kontrollerande beteende."
  - id: C-099
    parti: C
    sida: 12
    rader: '441-445'
    lydelse: "Det förebyggande arbetet måste börja tidigt och genomsyra hela samhället. Alla kommuner ska ha handlingsplaner för att förebygga mäns våld mot kvinnor och alla skolor ska ha handlingsplaner mot hedersförtryck. Skolpersonal och vårdpersonal bör utbildas och nationell frånvarostatistik införas för att snabbare kunna upptäcka hedersvåld."
  - id: C-100
    parti: C
    sida: 12
    rader: '446-449'
    lydelse: "Brottsofferperspektivet måste stärkas och eftervåldet upphöra. Vi vill att elektronisk fotboja används i fler fall vid kontaktförbud och säkra det lång siktiga stödet till kvinnojourer, tjejjourer och skyddade boenden. Kvinnor med skyddad identitet ska enklare kunna byta efternamn på sina barn."
  - id: C-101
    parti: C
    sida: 12
    rader: '450-452'
    lydelse: "Ingen ska utsättas för hedersförtryck i Sverige. Utöver tidiga insatser i skolan vill vi bland annat kriminalisera oskuldskontroller och kontrollerande beteende."
  - id: C-102
    parti: C
    sida: 13
    rader: '455-457'
    lydelse: "Vi vill uppvärdera statusen för kvinnodominerande yrken och förbättra arbetsvillkoren inom offentlig sektor, bland annat genom karriärtjänster och rätt till kompetensutveckling."
  - id: C-103
    parti: C
    sida: 13
    rader: '458-460'
    lydelse: "Sverige rankas lågt i internationella jämförelser över kvinnors företagande. Vi vill reformera trygghetssystemet så att fler kvinnor kan satsa på entreprenörskap och se till att statligt riskkapital fördelas mer jämställt."
  - id: C-104
    parti: C
    sida: 13
    rader: '461-463'
    lydelse: "Fler utrikesfödda kvinnor måste få en chans att jobba, lära sig svenska och till fullo komma in i det svenska samhället. Det är en vinst både för den enskilda och samhället i stort."
  - id: C-105
    parti: C
    sida: 13
    rader: '464-467'
    lydelse: "Vi vill göra förskola och fritidsverksamhet tillgänglig för alla, utan att dessa kostnader drabbar kommunerna, för att underlätta integrationen, stärka jämställdheten och ge varje barn en chans att utvecklas tillsammans med pedagoger och andra barn."
  - id: C-106
    parti: C
    sida: 13
    rader: '468-470'
    lydelse: "Vi vill modernisera föräldraförsäkringen så att fler kvinnor kan komma i arbete och göra karriär, bland annat genom att införa en kraftigt förstärkt jämställdhetsbonus."
  - id: C-107
    parti: C
    sida: 13
    rader: '472-476'
    lydelse: "Stressrelaterad psykisk ohälsa drabbar den enskilda människan och samhället mycket hårt. Vi vill att den som söker vård ska erbjudas en enkel väg in för stöd och hjälp, att vården ska få bättre verktyg för behandling och att sjukskrivningen ska bli mer flexibel. Arbetsgivare bör ta ett större ansvar för förebyggande insatser och rehabilitering."
  - id: C-108
    parti: C
    sida: 13
    rader: '477-479'
    lydelse: "Kvinnor och män ska få lika bra vård. Det borde vara en självklarhet. Vi vill inrätta ett nationellt forskningsprogram om kvinnosjukdomar och stärka den genusmedicinska kompetensen i hela vårdkedjan."
  - id: C-109
    parti: C
    sida: 13
    rader: '480-481'
    lydelse: "Förlossningsvården bör organiseras så att samma barnmorska kan följa kvinnan under graviditet, förlossning och eftervård."
  - id: C-110
    parti: C
    sida: 14
    rader: '484'
    lydelse: "Utan småföretagen stannar Sverige."
  - id: C-111
    parti: C
    sida: 14
    rader: '485-488'
    lydelse: "De står för nästan hälften av alla jobb i den privata sektorn och 60 procent av näringslivets bidrag till Sveriges ekonomi. De skapar ett stort värde för kunder, anställda och ägare, och är betydelsefulla underleverantörer till nationella och internationella företag."
  - id: C-112
    parti: C
    sida: 14
    rader: '489-492'
    lydelse: "Småföretagen är också nyckeln till att lösa många av de problem Sverige står inför, som arbetslösheten och den bristande integrationen. För det är just hos de mindre företagen som nyanställningar ökar snabbast och hos dem som många får in sin första fot på arbetsmarknaden."
  - id: C-113
    parti: C
    sida: 14
    rader: '493-495'
    lydelse: "Därför kommer Centerpartiet alltid att vara småföretagens bästa vän i svensk politik. Det ska vara lätt att starta och driva företag; det ska löna sig att ta klivet och satsa."
  - id: C-114
    parti: C
    sida: 14
    rader: '496-499'
    lydelse: "En av de viktigaste utmaningarna för företagen, och för hela Sveriges ekonomi, är den dåligt fungerande kompetensförsörjningen. Både företag och offentlig sektor skriker efter medarbetare. Samtidigt är hundratusentals människor arbetslösa i Sverige."
  - id: C-115
    parti: C
    sida: 14
    rader: '500-502'
    lydelse: "Så kan det inte få fortsätta. Arbetslinjen måste värnas, och den som kan jobba ska inte leva på skattebetalarnas pengar. Samtidigt behövs bättre förutsättningar att hitta ett arbete för jobbsökare."
  - id: C-116
    parti: C
    sida: 14
    rader: '503-507'
    lydelse: "Vi vill att det ska löna sig mer att gå från bidrag till arbete, och att fler med kortare utbildning och erfarenhet ska ha möjlighet att få enkla jobb. För de som har en del kvar att lära sig ska det finnas goda möjligheter att praktisera, lära sig svenska på jobbet eller vidareutbilda sig. Integrationen ska präglas av intensiv praktik och språkutbildning, med hårt arbete och höga förväntningar."
  - id: C-117
    parti: C
    sida: 14
    rader: '508-511'
    lydelse: "Den senaste mandatperioden drev Centerpartiet igenom en historisk arbetsmarknadsreform som innebär större flexibilitet för företagen och bättre omställningsmöjligheter för medarbetare. Vi kommer fortsätta arbetet för en arbetsmarknad som fungerar ännu bättre för både företagare och anställda."
  - id: C-118
    parti: C
    sida: 14
    rader: '512-516'
    lydelse: "För att Sveriges företag även fortsättningsvis ska kunna leverera produkter, tjänster och jobb i världsklass krävs en pålitlig infrastruktur i hela landet, satsningar på forskning och utveckling och krafttag mot brott emot företag. Vi måste också ta vara på all den drivkraft som finns i Sverige. Fler kvinnor och personer med utländsk bakgrund ska ha möjlighet att starta företag."
  - id: C-119
    parti: C
    sida: 14
    rader: '517-522'
    lydelse: "Få investeringar är lika viktiga och värdefulla för samhället som de vi gör i utbildning. För att Sverige ska fortsätta vara ett av världens mest innovativa länder, och för att långsiktigt lösa kompetensbristen, krävs bättre utbildningsmöjligheter anpassade efter den enskilde och för arbetsmarknadens förutsättningar och behov. Från yrkesvux för den som saknar gymnasieexamen till konkurrenskraftiga universitet och forskning i världsklass. Alla som vill ska ha möjlighet att utbilda sig genom hela livet."
  - id: C-120
    parti: C
    sida: 14
    rader: '523-524,526-527'
    lydelse: "Sverige behöver också ett politiskt ledarskap som ser resten av världen som en möjlighet, inte som ett hot - som öppnar upp nya marknader för svenska varor och tjänster och gör det möjligt att rekrytera medarbetare från andra länder. Politiken får inte svika alla de företag som inte klarar sig utan arbetskraftsinvandring."
  - id: C-121
    parti: C
    sida: 15
    rader: '528'
    lydelse: "Sverige behöver mer frihandel och internationellt samarbete, inte protektionism och stängda gränser. Sverige behöver mer frihet och företagsamhet."
  - id: C-122
    parti: C
    sida: 15
    rader: '532-533'
    lydelse: "Sänk skatten på jobb och företagande, särskilt för småföretag och egenföretagare. Det ska löna sig att driva företag och skapa jobb."
  - id: C-123
    parti: C
    sida: 15
    rader: '534-536'
    lydelse: "Rensa upp i regelträsket för entreprenörer, stora som små. Vi vill införa en ny och förenklad företagsform för mikroföretag, så att fler ska våga testa att driva företag."
  - id: C-124
    parti: C
    sida: 15
    rader: '537-540'
    lydelse: "Kapitalförsörjning är avgörande för många småföretag. Vi vill att det statliga riskkapitalet blir mer effektivt och att investeraravdraget breddas och fördjupas. Därtill behöver det statliga riskkapitalet bli mer jämställt och nå hela landet, inte minst de utsatta områdena."
  - id: C-125
    parti: C
    sida: 15
    rader: '542-545'
    lydelse: "Det måste bli billigare och lättare att anställa, särskilt personer som står långt från arbetsmarknaden. Arbetsgivaravgiften behöver sänkas, i ett första skede för ett företags första anställda, för människor som står långt från arbetsmarknaden liksom de som har låga inkomster."
  - id: C-126
    parti: C
    sida: 15
    rader: '546-547'
    lydelse: "Skapa fler dörrar in till arbetsmarknaden genom fler enkla jobb, det vill säga jobb som inte kräver kvalificerad utbildning. Förenkla och förstärk nystartsjobben och bredda de så kallade etableringsjobben."
  - id: C-127
    parti: C
    sida: 15
    rader: '548-550'
    lydelse: "Matchningen måste förbättras. Alla ska ha rätt till en effektiv matchningstjänst och det ska bli lättare att hitta medarbetare inom alla yrken. Utbildningssystemet behöver i betydligt större utsträckning utgå från arbetsmarknadens behov."
  - id: C-128
    parti: C
    sida: 15
    rader: '551-552'
    lydelse: "Svensk arbetsmarknad behöver både mer flexibilitet och mer trygghet. Stödet vid omställning och vidareutbildning måste bli bättre."
  - id: C-129
    parti: C
    sida: 15
    rader: '553-555'
    lydelse: "Gör det enklare att anställa elever i yrkesprogram som lärlingar genom att stärka ersättningen för företagens kostnader förknippade med utbildningen. Detta ökar attraktiviteten för yrkesprogram och höjer kvaliteten på yrkesutbildningen."
  - id: C-130
    parti: C
    sida: 16
    rader: '558-560'
    lydelse: "Sverige klarar sig inte utan frihandel. Öppna upp fler marknader för svenska varor och tjänster. Ställ hårdare krav på arbetsvillkor, miljö och klimat i handelsavtal."
  - id: C-131
    parti: C
    sida: 16
    rader: '561-566'
    lydelse: "Skapa ett intensivår för snabbare integration. Den som får uppehållstillstånd ska snabbt integreras och ges möjlighet att försörja sig själv. Det kräver intensiva språkstudier, praktik, en effektiv matchning och jobb - inklusive möjligheten att lära sig svenska på jobbet. Integrationsinsatser ska präglas av hårt arbete och höga förväntningar. Nyanlända bör kvalificera sig in i trygghetssystemen."
  - id: C-132
    parti: C
    sida: 16
    rader: '567-570'
    lydelse: "Värna arbetskraftsinvandringen. För att svenska företag ska kunna konkurrera måste de ha möjlighet att snabbt hitta, rekrytera och anställa rätt kompetens. Låt arbetskraftsinvandrare räkna in studietiden i Sverige vid ansökan om permanent uppehållstillstånd."
  - id: C-133
    parti: C
    sida: 16
    rader: '573-577'
    lydelse: "Alltför många människor lever med små marginaler i dagens Sverige. Skenande priser urholkar reallönerna och lämnar mindre pengar kvar i plånboken efter att räkningarna är betalda. Stigande räntor leder till högre boendekostnader. Och många företagare och anställda har fortfarande inte återhämtat sig ekonomiskt från coronapandemins ekonomiska utsatthet."
  - id: C-134
    parti: C
    sida: 16
    rader: '578-582'
    lydelse: "Sverige har dessutom strukturella makroekonomiska utmaningar med många år på nacken. En avgörande klyfta går mellan de som har ett jobb och de som är arbetslösa. Många vill jobba men en mur har rests runt arbetsmarknaden som stänger ute människor, inte minst personer som är unga, långtidsarbetslösa eller har flyttat hit från andra länder."
  - id: C-135
    parti: C
    sida: 16
    rader: '583-586'
    lydelse: "Det är för dyrt och riskabelt att anställa, särskilt för småföretagen, och det är för kostsamt och krångligt att ge sig ut i företagande på egen hand. Det lönar sig inte heller tillräckligt att ta klivet från bidrag till arbete. Sverige har inte råd att fortsätta så här."
  - id: C-136
    parti: C
    sida: 16
    rader: '587-591'
    lydelse: "Lösningen är uppenbar: Skatten måste sänkas på jobb och företagande, särskilt för dem med lägre inkomster. Det ska löna sig att jobba och bidra till vår gemensamma välfärd. Men sänkt skatt handlar om mer än så; det är också en fråga om personlig frihet, om självbestämmande över frukterna av ens eget arbete."
  - id: C-137
    parti: C
    sida: 16
    rader: '592-598'
    lydelse: "Även många som har ett jobb har det svårt just nu på grund av rusande inflation och snabbt stigande räntor. Det handlar bland annat om ensamstående föräldrar, småbarnsfamiljer och unga som försöker spara ihop till sin första bostad. Det handlar också om alla de pensionärer som bidragit till att bygga upp Sverige, men ändå har låga pensioner, inte minst kvinnor som slitit i arbetslivet och hemmet, men inte har pensioner som motsvarar deras insatser."
  - id: C-138
    parti: C
    sida: 17
    rader: '600-604'
    lydelse: "För att möta detta krävs insatser som mildrar inflationens värsta effekter för de med små marginaler. Därför bidrog Centerpartiet till att höja pensionerna på ett hållbart och rättvist sätt. Därför vill vi se över amorteringskravet. Därför vill vi sänka det totala skattetrycket nästa mandatperiod, och inte se några skattehöjningar som skadar jobben eller gör det dyrare att bo. Genom att skapa friare marknader och förbättra konkurrensen kan vi dämpa priserna ytterligare."
  - id: C-139
    parti: C
    sida: 17
    rader: '605-612'
    lydelse: "Hushållens långsiktiga ekonomiska välmående kräver att statens finanser är i ordning. Detsamma gäller förmågan att möta kommande kriser i en tid av växande ekonomisk oro. Det kräver ett politiskt ledarskap som vågar fatta tuffa men nödvändiga beslut för Sveriges bästa. Ett ansvarsfullt ledarskap som stärker Sveriges ekonomi långsiktigt och försvarar ordning och reda i ekonomin och det finanspolitiska ramverket. Ett resultatinriktat ledarskap som säger nej till kortsiktiga populistiska satsningar och istället söker långsiktiga och konstruktiva överenskommelser förankrade i mitten."
  - id: C-140
    parti: C
    sida: 17
    rader: '616-618'
    lydelse: "Sverige behöver en ekonomisk politik som skapar fler jobb, mer frihet och starkare hushåll. Därför vill vi sänka skatten, särskilt för de med lägre inkomster och för de viktiga småföretagen."
  - id: C-141
    parti: C
    sida: 17
    rader: '619-622'
    lydelse: "Sveriges pensionärer ska ha god trygghet, nu och många år framöver. Däreför bidrog Centerpartiet till en stor höjning av pensionerna, särskilt för de med lägre inkomster. Vi måste försvara pensionssystemets långsiktiga rättvisa och hållbarhet."
  - id: C-142
    parti: C
    sida: 17
    rader: '623-625'
    lydelse: "Sänk skatten maximalt på biodrivmedel som blandas in i bensin och diesel. Det skulle sänka bilisternas kostnader, gynna klimatet, skapa jobb och minska Sveriges oljeberoende. Och med ett grönt avdrag för energieffektiviseringar i hemmet kan vi sänka hushållens elkostnader."
  - id: C-143
    parti: C
    sida: 17
    rader: '626-627'
    lydelse: "Boendet är den största investeringen många människor gör. Det förstärkta amorteringskravet - ett påtvingat sparande för dem med lägst inkomster bör avskaffas när ränteläget nu normaliseras."
  - id: C-144
    parti: C
    sida: 17
    rader: '629-631'
    lydelse: "Det totala skattetrycket måste ner nästa mandatperiod. Vi kommer inte att medverka till några skattehöjningar som skadar jobben, det egna sparandet eller gör det dyrare att bo."
  - id: C-145
    parti: C
    sida: 17
    rader: '632-635'
    lydelse: "Det finanspolitiska ramverket ska värnas och förstärkas, och Sveriges långsiktiga ekonomiska stabilitet ska försvaras. Politiken ska hushålla med skattebetalarnas pengar. Mer pengar ska läggas på välfärdens kärna, mindre på bidrag."
  - id: C-146
    parti: C
    sida: 18
    rader: '639-643'
    lydelse: "Vi är övertygade om att vägen till en bättre välfärd går genom att bedriva den närmare invånarna i hela landet, och att medarbetarna ges bättre villkor för att utföra sitt arbete och utvecklas på arbetsplatsen. Med den vägledande principen är vi fast beslutna att göra Sveriges vård och omsorg ännu bättre. Här och nu, och många mandatperioder framöver."
  - id: C-147
    parti: C
    sida: 18
    rader: '644-651'
    lydelse: "Vi vill korta köerna och skapa fler vårdplatser där det behövs genom satsningar på fler sjuksköterskor och bättre statligt stöd till regionerna som är anpassade efter deras förutsättningar och behov. Vi vill öppna upp för fler vårdgivare och öka valfriheten så att patienter tillsammans med sin läkare kan välja vårdgivare och tid då operation eller behandling passar bäst utifrån patientens behov. Genom en platsmiljard och ökat samarbete mellan kommunal och regional hälso- och sjukvård ökar vi möjligheterna att nå målet om en beläggningsgrad på 90 procent på våra sjukhus."
  - id: C-148
    parti: C
    sida: 18
    rader: '652-657'
    lydelse: "Alla ska ha rätt till en fast läkarkontakt som man vet namnet på och som man kan möta både fysiskt och digitalt. Genom ett större fokus på trygghet och kontinuitet ökar vi kvaliteten i vården. Samtidigt måste administrationen inom vården minska så personalen får mer tid i patientmötet. Vi arbetar för en trygg och säker förlossning med en sammanhållen vårdkedja där samma barnmorska ska kunna följa kvinnan under graviditet, förlossning och eftervård."
  - id: C-149
    parti: C
    sida: 18
    rader: '658-660'
    lydelse: "Psykiatrin måste förbättras för såväl unga som äldre. Den som söker stöd ska mötas av en samlad och enkel väg in till vården och erbjudas bättre egenvård i väntan på behandling."
  - id: C-150
    parti: C
    sida: 18
    rader: '661-664'
    lydelse: "Den psykiska ohälsan hos våra barn och unga är alldeles för hög och vi måste arbeta mer förebyggande och skapa enkla vägar till vården, så att barn och unga snabbt får vård oavsett om det handlar om enklare psykisk ohälsa eller psykiatrisk sjukdom. Samarbetet mellan elevhälsovården och primärvårdspsykiatrin måste öka och köerna till BUP kortas."
  - id: C-151
    parti: C
    sida: 18
    rader: '665-670'
    lydelse: "För att lyckas med allt detta krävs långsiktigt arbete och en mängd olika reformer. Men även om vården är komplex måste allt börja med den som möter oss när vi behöver hjälp. Läkaren och barnmorskan, sjuksköterskan och undersköterskan, arbetsterapeuten och fysioterapeuten. Hon eller han ska ha möjlighet att fokusera på sitt kärnuppdrag, vidareutbilda sig med bibehållen lön och återhämta sig när det behövs. Bättre arbetsvillkor, helt enkelt."
  - id: C-152
    parti: C
    sida: 18
    rader: '671-675'
    lydelse: "Bättre arbetsvillkor leder till bättre vård. En läkare som kan fokusera mer på sina patienter än på pappersarbete har bättre förutsättningar att ställa rätt diagnos. En medarbetare i hemtjänsten som har tid att lära känna sin brukare kan erbjuda bättre omsorg. Och en sjuksköterska som har möjlighet till vila och återhämtning kan fortsätta ta hand om oss ett helt yrkesliv."
  - id: C-153
    parti: C
    sida: 18
    rader: '676-678'
    lydelse: "Att förbättra arbetsvillkoren i vård och omsorg leder inte bara till bättre resultat utan ökar också möjligheterna för vårdpersonal att känna stolthet och utvecklas i sin yrkesroll. Så byggs välfärden starkare över tid."
  - id: C-154
    parti: C
    sida: 19
    rader: '680-684'
    lydelse: "Eftersom kvinnor utgör en övervägande majoritet av alla medarbetare inom vård och omsorg är deras villkor dessutom en jämställdhetsfråga. Människor som jobbar inom vården drabbas oftare av stressrelaterad psykisk ohälsa än i mansdominerade yrken, och i många fall har de sämre arbetsvillkor och lägre löner. Det ska vi ändra på."
  - id: C-155
    parti: C
    sida: 19
    rader: '685-687'
    lydelse: "Sverige behöver en vård och omsorg som sätter patienter, brukare och medarbetare i centrum. Det är en huvudprioritering för Centerpartiet inför nästa mandatperiod."
  - id: C-156
    parti: C
    sida: 19
    rader: '691-693'
    lydelse: "Köerna måste kortas och man ska ha rätt att välja bort köerna genom att söka vård i andra regioner. Vi vill skapa fler vårdplatser där det behövs med hjälp av en platsmiljard och bättre stöd till regionerna."
  - id: C-157
    parti: C
    sida: 19
    rader: '694'
    lydelse: "Vi vill ge alla rätt till en fast läkarkontakt."
  - id: C-158
    parti: C
    sida: 19
    rader: '695-698'
    lydelse: "Stödet för personer med psykisk ohälsa måste förbättras, inte minst för unga. Den som söker hjälp ska ha en enkel och samlad väg in till vården. Köerna till BUP måste arbetas bort. Vi vill förbättra rehabiliteringen och göra sjukskrivningen mer flexibel."
  - id: C-159
    parti: C
    sida: 19
    rader: '699-701'
    lydelse: "Gör mer för att förebygga, motverka och rehabilitera stressrelaterad psykisk ohälsa. Vi vill göra sjukskrivningen mer flexibel och förbättra rehabiliteringen."
  - id: C-160
    parti: C
    sida: 19
    rader: '702-704'
    lydelse: "Vi vill försvara valfriheten inom vård och omsorg och bedriva verksamheten nära vårdtagarna. Ansvaret för vården ska inte flyttas från regionerna till staten."
  - id: C-161
    parti: C
    sida: 19
    rader: '706-707'
    lydelse: "Den som jobbar i vård och omsorg ska kunna växa och vidareutvecklas i sitt yrke. Vi vill ge alla undersköterskor och sjuksköterskor rätt till kompetensutveckling."
  - id: C-162
    parti: C
    sida: 19
    rader: '708-710'
    lydelse: "Den administrativa bördan inom vården måste minska, bland annat med hjälp av digitala verktyg som är användbara och efterfrågade av medarbetarna."
  - id: C-163
    parti: C
    sida: 19
    rader: '711-713'
    lydelse: "Att anställa fler sjuksköterskor leder till mindre stress på jobbet och bättre resultat för patienten. Vi vill rekrytera fler sjuksköterskor genom att införa en examenspremie och ge lön under specialiststudietiden."
  - id: C-164
    parti: C
    sida: 19
    rader: '714-717'
    lydelse: "Mer och bättre stöd från chefer skapar trygghet på jobbet. Därför vill vi införa en obligatorisk utbildning för alla som får en chefstjänst i vård och omsorg, och skapa mindre arbetsgrupper med ett mål om max 25 medarbetare per chef."
  - id: C-165
    parti: C
    sida: 20
    rader: '721-724'
    lydelse: "Den liberala demokratin är en av människans bästa skapelser, kanske den främsta. Inget annat styrelseskick levererar samma rättvisa, frihet och nytta - från den enskilda människans möjlighet att forma sitt eget liv till samhällets förmåga att fatta goda beslut gemensamt."
  - id: C-166
    parti: C
    sida: 20
    rader: '725-726'
    lydelse: "Men den liberala demokratin är hotad. Vi får aldrig ta den för given eller underskatta dess motståndare. Vissa hot kommer utifrån, som Rysslands folkrättsvidriga krig mot Ukraina har visat. Sverige måste rustas snabbt och fokuserat; ingen ska kunna ta vårt demokratiska samhälle ifrån oss."
  - id: C-167
    parti: C
    sida: 20
    rader: '727-729'
    lydelse: "Andra hot kommer inifrån. I flera länder har auktoritära ledare försvagat och i vissa fall monterat ner den liberala demokratin bit för bit. Här hemma finns politiska krafter som ser sådana länder och deras ledare som förebilder."
  - id: C-168
    parti: C
    sida: 20
    rader: '730-732'
    lydelse: "Sverige måste rustas även mot dessa hot. Våra demokratiska institutioner och principer - oberoende domstolar, äganderätten, den fria pressen, likheten inför lagen och många fler - ska stå starka oavsett politiskt styre."
  - id: C-169
    parti: C
    sida: 20
    rader: '733-736'
    lydelse: "En stark liberal demokrati består av mycket mer än lagar och regler. Den är ett gemensamt projekt som vi bygger tillsammans, varje dag, varje generation. Civilsamhällets roll för att binda samman människor och förbättra integrationen är ovärderlig."
  - id: C-170
    parti: C
    sida: 20
    rader: '737-740'
    lydelse: "Idrottsrörelsen och Sveriges folkrörelser gör värdefulla insatser för att bygga tillit och gemenskap. Idrottens, friluftslivets och kulturens betydelse för folkhälsan är odiskutabel. Att tillhandahålla kultur i hela landet är en viktig utgångspunkt för Centerpartiet. Kulturen ska vara fri och oberoende, idrotten jämlik och inkluderande."
  - id: C-171
    parti: C
    sida: 20
    rader: '741-742'
    lydelse: "Även bildning i bred mening, från förskolan till universiteten till den livslånga folkbildningen, är en bärande del av det demokratiska projektet."
  - id: C-172
    parti: C
    sida: 20
    rader: '743-745'
    lydelse: "Vi måste fortsätta arbetet för ett Sverige där ingen missgynnas på grund av kön, härkomst eller funktionsnedsättning, ett Sverige där kulturen, medierna och akademin är fri, ett Sverige där alla behövs."
  - id: C-173
    parti: C
    sida: 20
    rader: '749-751'
    lydelse: "Våra demokratiska institutioner behöver skydd. Vi vill göra det svårare att ändra grundlagen, skydda oppositionens ställning i riksdagen och stärka domstolarnas oberoende."
  - id: C-174
    parti: C
    sida: 20
    rader: '752'
    lydelse: "Sverige ska bli ännu mer transparent. Vi vill inrätta en antikorruptionsmyndighet, skärpa regler mot korruption och införa ett lobbyregister."
  - id: C-175
    parti: C
    sida: 21
    rader: '754-756'
    lydelse: "De politiska partierna är sårbara mot påverkan och infiltration. Reglerna för finansiering av politiska partier bör skärpas och deras motståndskraft mot yttre påverkan och infiltration rustas."
  - id: C-176
    parti: C
    sida: 21
    rader: '757-759'
    lydelse: "Få investeringar är lika viktiga och värdefulla för samhället och individen som utbildning, från förskola till universitet. Därför ska vi ha en likvärdig förskola och skola i hela landet."
  - id: C-177
    parti: C
    sida: 21
    rader: '760-763'
    lydelse: "Den akademiska och konstnärliga friheten liksom den fria kulturen är grund bultar i ett vitalt civilsamhälle. Politiken ska bidra till goda förutsättningar men hålla armlängds avstånd. En fristående folkbildning har mycket stor betydelse i tider då demokratiska värden ifrågasätts."
  - id: C-178
    parti: C
    sida: 21
    rader: '765-769'
    lydelse: "Våra grundläggande rättigheter får inte tas för givna. Vi vill stärka bland annat äganderätten, diskrimineringsförbudet, minoritetsskyddet och minoritetsspråkens ställning, och grundlagsskydda rätten till abort och reproduktiv hälsa. En författningsdomstol är viktig för att värna bland annat dessa rättigheter."
  - id: C-179
    parti: C
    sida: 21
    rader: '770-772'
    lydelse: "Rättsstaten och individens rättigheter gentemot staten måste försvaras. Vi säger därför nej till visitationszoner, kollektiv bestraffning, omvänd bevisbörda, anonyma vittnen, preventiv avlyssning och inskränkningar av religionsfriheten."
  - id: C-180
    parti: C
    sida: 21
    rader: '773-774'
    lydelse: "Alla som bor i Sverige ska kunna få sin sak prövad. Ledtiderna för handläggning och myndighetsutövning i domstolar och myndigheter måste kortas och tillgången till ombud förbättras."
  - id: C-181
    parti: C
    sida: 21
    rader: '775-779'
    lydelse: "Möjligheten att processa mot stat eller kommun, då man har goda skäl att få sin sak prövad, ska i en liberal demokrati inte vara en rätt förbehållen de med hög inkomst. Vi vill skapa en möjlighet för enskilda att kunna få ersättning för ombud i förvaltningsärenden då denne haft skäl att få sin sak prövad."
  - id: C-182
    parti: C
    sida: 21
    rader: '780-782'
    lydelse: "Mer måste göras mot diskriminering. Vi vill stärka myndigheternas arbete mot diskriminering och höja ersättningen till dem som utsatts, samt lägga till kön och funktionsnedsättning som hatbrottsgrunder."
  - id: C-183
    parti: C
    sida: 21
    rader: '784-785'
    lydelse: "Decentralisera mera. Människor ska få bestämma mer själva, och politiska beslut ska fattas nära dem som berörs."
  - id: C-184
    parti: C
    sida: 21
    rader: '786-788'
    lydelse: "En allsidig, oberoende och livskraftig mediebevakning i hela landet är avgörande för demokratin. Pressfriheten ska skyddas och oberoende public service försvaras."
  - id: C-185
    parti: C
    sida: 21
    rader: '789-791'
    lydelse: "Hat, hot, trakasserier och våld riktade mot demokratibärande institutioner måste upphöra. Vi ska stärka skyddet för personer verksamma bland annat i media, religiösa samfund och offentlig förvaltning."
  - id: C-186
    parti: C
    sida: 22
    rader: '794-797'
    lydelse: "Som medborgare ska du kunna lita på att staten, regionerna och kommunerna lever upp till sina delar av samhällskontraktet. Du som bor i Sverige har en skyldighet att följa våra lagar, behandla dina medmänniskor med respekt och bidra till det gemensamma efter dina förutsättningar. Du ska få trygghet, säkerhet och en god välfärd i utbyte."
  - id: C-187
    parti: C
    sida: 22
    rader: '798-802'
    lydelse: "Sverige ska försvaras. Rysslands folkrättsvidriga invasion har visat att vi inte kan utesluta att Sverige dras in i krig. Ukrainas heroiska försvar av sitt lands frihet och överlevnad har visat att det går att stå upp mot despoter. Centerpartiet vill rusta försvaret, stärka Sveriges civila beredskap och fullfölja inträdet i Nato."
  - id: C-188
    parti: C
    sida: 22
    rader: '803-807'
    lydelse: "Du ska känna dig trygg på gator, på torg och i ditt eget hem. Sverige behöver fler poliser, hårdare straff och bättre förebyggande insatser - med krafttag mot såväl gängbrottslighet, våld mot barn och mäns våld mot kvinnor. Polisen ska finnas i både förort och landsbygd, och nedstängda polisstationer behöver öppnas upp igen."
  - id: C-189
    parti: C
    sida: 22
    rader: '808-812'
    lydelse: "Du ska ha tillgång till en trygg välfärd som följer dig genom hela livet. Förlossningsvården ska vara tillgänglig, säker och likvärdig i hela landet. Kvaliteten i sjukvården och äldreomsorgen ska lyftas. Du som har en funktionsnedsättning ska få det stöd du behöver, och staten ska ta ett större ansvar för att LSS fungerar."
  - id: C-190
    parti: C
    sida: 22
    rader: '813-817'
    lydelse: "Du ska ha tillgång till en likvärdig skola i hela landet, med sikte på en utbildning och kunskapsresultat i världsklass. För det är i skolan som det första och största jämlikhetsarbetet sker. Genom att ge alla elever, oavsett bakgrund, möjligheter till en bra utbildning skapas möjligheter till klassresor. Få investeringar är lika avgörande för Sveriges framtid."
  - id: C-191
    parti: C
    sida: 22
    rader: '818-820'
    lydelse: "För att uppnå det måste vi värna och vidareutveckla det fria skolvalet, och åtgärda de brister som finns. Vi vill bland annat se höga kvalitetskrav för fortsatt verksamhet och vinstutdelning, och vi vill skärpa tillsynen av skolor och deras ägare. Skolpengen bör anpassas efter huvudmännens ansvar och efter elevernas förutsättningar och behov."
  - id: C-192
    parti: C
    sida: 22
    rader: '821-824'
    lydelse: "Skolvalet ska vara rättvist och lika för alla. Det är viktigt att alla föräldrar och elever väljer skola och att urval baserat på kö begränsas; anmälan ska ske tidigast två år innan skolstart. Betygsinflationen måste ordnas upp, med oberoende rättning och kontroll av resultat."
  - id: C-193
    parti: C
    sida: 22
    rader: '825-827'
    lydelse: "Lärarna och rektorerna är avgörande för att skapa en bättre skola. Vi vill bland annat genomföra en spetssatsning på karriärtjänster för de som jobbar på skolor med låga resultat. Med hjälp av fler vägar in i läraryrket och studiemedelsavskrivning kan vi rekrytera fler behöriga lärare i hela landet."
  - id: C-194
    parti: C
    sida: 22
    rader: '828-832'
    lydelse: "Du ska kunna lita på att det offentliga levererar på allt detta, i hela landet. Men så ser det inte ut idag. Sverige är segregerat mellan de med och utan jobb, mellan de som är födda här och i andra länder, mellan de med och utan utbildning. Att vända detta måste vara en huvudprioritet inför nästa mandatperiod."
  - id: C-195
    parti: C
    sida: 23
    rader: '834-835'
    lydelse: "Det finns inga enkla lösningar för att lyckas med allt detta, men som medborgare ska du kunna lita på att de politiska partierna lever upp till sin del av samhällskontraktet, på att de sätter Sveriges bästa i första rummet."
  - id: C-196
    parti: C
    sida: 23
    rader: '839-841'
    lydelse: "Sverige ska försvaras. Vi vill rusta det militära försvaret snabbt, kraftfullt och långsiktigt. Sverige behöver satsa två procent av BNP på försvaret så snart det är praktiskt möjligt och gå med i Nato."
  - id: C-197
    parti: C
    sida: 23
    rader: '842-843'
    lydelse: "Även det civila försvaret är livsviktigt. Vi måste rusta civilförsvaret och samhällets beredskap inför krig och kris."
  - id: C-198
    parti: C
    sida: 23
    rader: '844-846'
    lydelse: "Samhället ska inte vika ned sig för gängen. För att besegra dem krävs bättre insatser som förebygger nyrekrytering, mer resurser till polis, åklagare, domstolar och kriminalvården och strängare straff. Dessutom bör en utredning om gängens inkomster och hur dessa kan strypas genomföras."
  - id: C-199
    parti: C
    sida: 23
    rader: '847-850'
    lydelse: "Tryggheten ska förbättras i hela landet och fler brott som drabbar folk i deras vardag ska klaras upp. Fler poliser ska finnas närvarande i vardagen, både i utsatta områden och på landsbygden. Vi vill öka polistätheten till EU-snittet och öppna nedlagda polisstationer på nytt."
  - id: C-200
    parti: C
    sida: 23
    rader: '851-852'
    lydelse: "Brottsofferperspektivet måste stärkas. Den som utsatts för brott ska få upprättelse och bättre stöd."
  - id: C-201
    parti: C
    sida: 23
    rader: '855-857'
    lydelse: "Att förbättra skolresultaten måste vara en huvudprioritering. Det vill vi åstadkomma med bättre stöd och fortbildning för lärare och rektorer, och rätt stöd till alla elever."
  - id: C-202
    parti: C
    sida: 23
    rader: '858-860'
    lydelse: "Skolan ska bli bättre och mer likvärdig i hela landet. Det fria skolvalet ska värnas och små skolor och förskolor på landsbygden ges förutsättningar att fortsätta sin verksamhet."
  - id: C-203
    parti: C
    sida: 23
    rader: '861-864'
    lydelse: "Styrningen av skolan ska kännetecknas av strikta kvalitetskrav och likvärdighet. Skolpengen ska anpassas efter huvudmännens ansvar och elevernas förutsättningar och behov. Vi vill ställa kvalitetskrav för vinstutdelning och stärka rättssäkerheten i betygssystemet. Dåliga skolor ska stängas."
  - id: C-204
    parti: C
    sida: 23
    rader: '865-868'
    lydelse: "Vi vill också skärpa tillståndsprövningen för utländska ägare, se till att skolorna delar mer information och skapa ett mer aktivt skolval för alla. Högst hälften av platserna bör få fördelas efter kötid, och anmälan ska ske tidigast två år innan skolstart."
  - id: C-205
    parti: C
    sida: 23
    rader: '869-871'
    lydelse: "Skolan ska vara en trygg plats - fri från rasism, homofobi och trakasserier grundade på kön - där barn kan växa och utvecklas. En bättre elevhälsa är en förutsättning för det."
  - id: C-206
    parti: C
    sida: 24
    rader: '874-876'
    lydelse: "Sverige och världen har gått igenom mycket de senaste åren. Men en ljusare framtid är möjlig, inte minst tack vare den medmänsklighet och styrka som människor uppvisat inför svåra prövningar."
  - id: C-207
    parti: C
    sida: 24
    rader: '877-878'
    lydelse: "Under pandemin räddade vårdpersonalen liv under svåra förhållanden, familj och vänner tog hand om varandra, civilsamhället slöt upp och företagen bidrog."
  - id: C-208
    parti: C
    sida: 24
    rader: '879-883'
    lydelse: "Även under den säkerhetskris vi nu befinner oss i har människor visat sig från sin bästa sida. Tusentals har anmält sig till militären och frivilligorganisationer för att försvara vårt land. Civilsamhället har kraftsamlat för att ta emot flyktingar från Ukraina och enskilda har gemensamt skänkt många miljarder kronor till Ukraina."
  - id: C-209
    parti: C
    sida: 24
    rader: '884-885'
    lydelse: "Med den beslutsamheten, det modet och den solidariteten är ingenting omöjligt."
  - id: C-210
    parti: C
    sida: 24
    rader: '886-889'
    lydelse: "Med jordnära visioner ser vi positivt på framtiden. Vi vet att Sverige kan bli ett mer jämställt land, med bättre möjligheter och större rättvisa för kvinnor och män. Vi vet att nytänkande och utveckling är vägen mot en hållbar framtid. Vi vet att hela landet kan leva och växa."
  - id: C-211
    parti: C
    sida: 24
    rader: '890'
    lydelse: "Med hjärta, beslutsamhet och sunt förnuft tar vi oss dit, tillsammans."
  - id: C-212
    parti: C
    sida: 24
    rader: '891-893'
    lydelse: "Det som behövs är handlingskraft - och företagsamheten finns i vår själ. Det är med den vi driver igenom våra liberala värderingar och skapar en grön och trygg vardag för alla."
  - id: C-213
    parti: C
    sida: 24
    rader: '894-896'
    lydelse: "För grunden i vår politik är alla människors frihet och lika värde. Vi tror på människors förmåga att bestämma över sina liv och skapa sin egen framtid. Och genom att ge kraft åt varje människa, får vi hela landet att växa."
  - id: C-214
    parti: C
    sida: 24
    rader: '897'
    lydelse: "För Sveriges bästa."
  - id: V-001
    parti: V
    sida: 2
    rader: '2-4'
    lydelse: "Det är tillsammans vi bygger framtiden. Alla vi människor som lever våra liv här i landet. Sverige är ett rikt och välorganiserat land där alla borde kunna ha möjlighet att utveckla sina drömmar och förhoppningar, tillsammans och som individer. Men så är det inte idag."
  - id: V-002
    parti: V
    sida: 2
    rader: '5-16'
    lydelse: "Vi är många som upplevt att delar av tryggheten försvunnit och att gemenskapen slagits sönder när marknadsideologin fått styra och politiken flytt ansvar. I skolorna behandlas elever och lärare som siffror, där billigast vinner. Du som blir sjuk måste oroa dig, inte enbart över din hälsa, utan också över hur möjligheterna till sjukvård ser ut och över att Försäkringskassan kanske inte godkänner läkarintyget. I stora delar av Sverige är det svårt att få tag på medicin, fast i storstädernas rikare områden finns det flera olika apotek i varje gathörn. Sverige har dessutom under flera år varit det land i Europa där de ekonomiska klyftorna vuxit snabbast, vilket är negativt för såväl den ekonomiska utvecklingen som samhällsutvecklingen i stort, samt bidrar till att skapa oro och otrygghet. Behovet av massiva investeringar i klimatåtgärder, infrastruktur och jobb är stort och akut, men effektiva politiska åtgärder dröjer, samtidigt som klimatförändringarna får konsekvenser redan nu."
  - id: V-003
    parti: V
    sida: 2
    rader: '17-23'
    lydelse: "Coronapandemin har satt privatiseringarnas och den underfinansierade välfärdens konsekvenser i blixtbelysning, men också solidariteten människor emellan. Vi har tagit hand om varandra och visat omsorg genom att hålla avstånd, gå samman och organisera matleveranser åt de mest utsatta, och begränsat våra liv för att så många som möjligt ska klara sig igenom krisen. Många har tagit extrapass på sina jobb inom vården och omsorgen, och gjort en heroisk insats med alltför knappa resurser."
  - id: V-004
    parti: V
    sida: 2
    rader: '24-29'
    lydelse: "Pandemin har också visat upp klassamhällets brutala konsekvenser. De som blivit mest drabbade har varit äldre, men också de av oss med arbetaryrken som inte kunnat stanna hemma från jobbet för att samhället ska fungera. Det har varit människor som bor trångt och som inte har kunnat ta sig säkert till jobbet som fått ta de stora riskerna. Precis som att klass påverkar människor i en pandemi, påverkar klass vår livslängd och möjlighet till ett bra liv utanför en pandemi."
  - id: V-005
    parti: V
    sida: 2
    rader: '30-32'
    lydelse: "Samhällets oförmåga att hantera klimatomställningen har varit tydlig. Medvetet avsäger sig politiker förmågan att förändra, trots att all vetenskap pekar på att förändring är nödvändig och akut."
  - id: V-006
    parti: V
    sida: 2
    rader: '33-44'
    lydelse: "De som är ansvariga för att det ser ut så här är de politiker och den ekonomiska elit som styrt Sverige. Att det finns fattigpensionärer i Sverige beror på pensioner som beslutats politiskt. Tragedin i äldreomsorgen beror på att resurser har dragits undan och verksamheter sålts ut så att skattepengar som skulle gått till de äldre istället blivit miljardvinster för lägstbjudande företag. Att de stora klimatåtgärder som vi alla vet är akuta för vår överlevnad uteblir beror på att de som bestämt har flytt undan politiskt ansvar. De har så klart inte gjort det för att de vill att allt ska bli dåligt, utan för att det har funnits starka ekonomiska intressen. Det är högerns idéer, men trenden i samhället har varit stark, och även socialdemokratiska regeringar har i grunden fört samma politik. Fortfarande lyser reella förslag på hur man ska öka den ekonomiska jämlikheten och jämställdheten, stärka välfärden och göra de satsningar som behövs i förorter, bruksorter och på landsbygd, med sin frånvaro."
  - id: V-007
    parti: V
    sida: 3
    rader: '47-57'
    lydelse: "I trettio år har det förts samma konsekventa politik. Område efter område har underställts privata företagsintressen och allt som inte bedömts som lönsamt har prioriterats ned. Politiken har ett ansvar. Inte att lägga sig i sådant som fungerar, utan att lösa de saker som bara kan bli riktigt bra när vi gör det gemensamt. Skola, vård, omsorg, klimatsatsningar, jobb, infrastruktur, välfärd och trygghetssystem är alla exempel på områden där du inte ska nöja dig med att marknaden gör ett uselt jobb. Det är hög tid att agera och ta tillbaka den samhällsviktiga verksamhet och infrastruktur som har privatiserats. Ju längre tiden går utan att något görs, desto mer förvärras problemen, oavsett om det rör ojämlikhet eller stigande medeltemperatur. Den blinda tron på marknaden och att blunda för klimatkrisen är gårdagens politik. Vänsterpartiet har politiken för framtiden."
  - id: V-008
    parti: V
    sida: 3
    rader: '58-60'
    lydelse: "Därför vill Vänsterpartiet använda valrörelsen till ett avstamp för att genom öppna samtal lägga grunden till en bred folkrörelse där vi tillsammans kämpar för omställningen till ett mer rättvist, tryggt och hållbart samhälle."
  - id: V-009
    parti: V
    sida: 3
    rader: '62-71'
    lydelse: "Vänsterpartiet drog upp en gräns och stoppade marknadshyrorna sommaren 2021. Regeringen kunde inte tillåtas sitta kvar samtidigt som de genomförde nästa stora marknadsreform, som i längden skulle ha lett till högre hyror för praktiskt taget alla hyresgäster. Regeringen fick många chanser och i Vänsterpartiet fanns länge ett hopp om att regeringen skulle lyssna på Vänsterpartiet. När regeringen tillträdde på Vänsterpartiets mandat, trots att regeringen uttryckligen hade ett avtal om att hålla Vänsterpartiet utanför, sa Vänsterpartiet att villkoret var att en försämring av arbetsrätten och marknadshyror inte skulle genomföras. Nu är det tydligt att det är Vänsterpartiet som måste ta tillbaka framtiden, det är upp till Vänsterpartiet att stå upp för tryggheten och jämlikheten."
  - id: V-010
    parti: V
    sida: 3
    rader: '72-81'
    lydelse: "Det gör Vänsterpartiet inte ensamt. Vi är många som bygger landet. Du som jobbar inom vården, med märken från munskydd och visir, du som bygger vägar, kör lastbil eller ger våra barn kunskap och självkänsla, du som tränar barnen i fotboll eller organiserar den lokala hyresgästföreningen. Du som har slitit ut lederna i förtid på jobbet, men som varje jul är med och ordnar gemensamt julbord för områdets ensamma. Du som arbetar hårt inom ditt eget småföretag, i konkurrens med storbolag. Du är den som skapar värdet i samhället. Det är inte riskkapitalisten eller börsspekulanten som äger skolan, vårdcentralen eller tillverkningsföretaget som skapar värde i verksamheten. De snor bara åt sig av värdet för sin egen del. Det är något som möjliggjorts av politiska beslut."
  - id: V-011
    parti: V
    sida: 3
    rader: '82-89,92-93'
    lydelse: "Vilka som verkligen bidrar till samhället och vilka som inte gör det har visat sig ännu tydligare under pandemin. De av oss som måste gå till jobbet för att samhället ska fungera, det är vi som jobbar i mataffären, vi som kör bussen, vi som städar. Det är vi som sliter i vården och omsorgen och vi som ser till att förskolor och skolor fungerar. Det är lågbetalda samhällsbärande arbetarklassyrken som plötsligt synliggjorts, precis så viktiga som de är. Det är för oss, alla vi som bor i Sverige, som vi nu också ska återuppbygga landet - bättre och tryggare. Ett land där vi bidrar efter förmåga och våra olika förutsättningar. Det är möjligt, men det kräver en annan politik och att vi omfördelar resurserna från rika till fattiga människor, från rika områden till fattiga områden och förorter."
  - id: V-012
    parti: V
    sida: 4
    rader: '94-104'
    lydelse: "Sverige har aldrig varit rikare än idag men rikedomarna fördelas orättvist. Kapital samlas på hög hos ett fåtal, ofta män, och klyftorna växer. Sverige sticker ut internationellt och har nu fler dollarmiljardärer per person än många andra länder. Samtidigt har antalet personer som lever med låg ekonomisk standard fördubblats de senaste decennierna. Många barn växer upp i fattigdom och Sverige har högst andel fattigpensionärer av de nordiska länderna, oftast är det kvinnor som drabbas av orättvisan. Arbetarkvinnors livslängd sjunker. När tryggheten minskar växer misstro och splittring. Rasismen gror mellan grannar och arbetskamrater, människor som egentligen har allt att vinna på att hålla ihop. Samtidigt tjänar en direktör över 60 gånger mer än en arbetare. Så ska det inte vara. Vi har rätt att förvänta oss något bättre."
  - id: V-013
    parti: V
    sida: 4
    rader: '105-113'
    lydelse: "Tillsammans kan vi förändra, det har vi gjort förr. Under 1900-talet har vi genom organisering i folkliga rörelser och med beslut i parlamenten stärkt arbetsrätten, investerat bort bostadsbristen, ökat jämställdheten, byggt upp välfärden och förbättrat samhällets skyddsnät. Reform på reform har byggt välfärden större och bättre. Sverige skulle kunna vara världens mest jämlika och trygga land, där vi tar hand om varandra, och där alla, oavsett vem du är, har rätt till ett gott liv, med frihet att utveckla dig och trygghet när du blir gammal eller om det inte går bra. Men då krävs stora satsningar, omfördelning och massiva investeringar för att ge människor goda levnadsvillkor, ta itu med klimatkrisen och skapa jobb i hela landet."
  - id: V-014
    parti: V
    sida: 4
    rader: '114-122'
    lydelse: "Det är ett stort uppdrag. I den här valplattformen presenteras några viktiga områden att börja med. Men du behövs om det ska lyckas. Länge har politiken tappat relevans när samma politik, i samma ödesdigra riktning, förts efter många val. Att återupprätta politikens roll, och utkräva ansvar från de som bestämmer, är något som du är med och gör. När du röstar, och kanske också pratar med dina släktingar och vänner, grannar och arbetskamrater, organiserar dig i folkrörelser som fackklubben, klimatrörelsen eller kvinnojouren, eller kanske till och med blir medlem i Vänsterpartiet. Du behövs. Tillsammans bygger vi framtidens rörelse för ett samhälle för alla."
  - id: V-015
    parti: V
    sida: 4
    rader: '124-133,136-157'
    lydelse: "Det är genom en grön politik från vänster som vi kan skapa fler jobb, företag och framtidstro även utanför storstäderna. Sverige är en liten industri- och kunskapsnation som en gång i tiden, genom stora investeringar och politiska satsningar, skapade en stark, modern och väl utvecklad ekonomi, där växande företag balanserades av en stark arbetarrörelse och stat som såg till att de stora ekonomiska värden som skapades kunde fördelas relativt jämnt över hela landet och befolkningen. Det byggde världens mest jämlika land. Politiken tog ansvar för problem, byggde bort bostadsbristen, byggde ut välfärden och gjorde stora investeringar i telenät, järnväg och annan infrastruktur. Idag står samhället inför nya utmaningar. Välfärden är urholkad genom åratal av nyliberal politik och ojämlikheten ökar. Vi måste lösa klimatkrisen och skydda den biologiska mångfalden - omställningen går alldeles för sakta. Över hela världen orsakar klimatkatastrofer förödelse - bränder, översvämningar, djur- och växtarter som försvinner och människor som drivs på flykt. Vi befinner oss i ett klimatnödläge. Omställningen behöver ske omgående och alla politiska beslut behöver ta hänsyn till den akuta kris som vi befinner oss i. Det är politikens, och inte individens, ansvar att skapa möjligheter för människor att välja enkla och billiga klimatsmarta alternativ. En del lösningar behöver vara internationella men mycket går att genomföra nationellt, om bara den politiska viljan finns. Investeringar i grön teknik, industri och infrastruktur, utbyggd energikapacitet och stärkt styrning utifrån nya, skärpta klimatmål behövs. Återanvändning och återvinning av material behöver öka. Över hela världen växer en ung klimatrörelse sig stark med stora krav på politiken för en snabb och genomgripande omställning. Det är en rörelse som med rätta ställer krav på systemförändringar, för kapitalismen håller på att göra jorden obeboelig. Ett ständigt överutnyttjande av naturens resurser leder till kraftig utarmning av den biologiska mångfalden och växthusgasutsläpp. Skogens roll att naturligt minska och lagra utsläpp behöver stärkas och torrlagda våtmarker som läcker utsläpp ska återställas. Skyddet av skogs- och strandområden är en viktig del för att värna den svenska allemansrätten och den biologiska mångfalden. För att uppnå klimatmålen behöver skogens funktion som kolsänka bevaras de kommande decennierna, därför behöver kalhyggesbruket fasas ut. Den skog som avverkas måste användas klokt där endast restprodukter ska användas till biobränsle."
  - id: V-016
    parti: V
    sida: 5
    rader: '158-168'
    lydelse: "Även om vi alla försöker minska vår klimatpåverkan så är det tydligt att det inte är allas vår individuella sopsortering eller bilanvändning som kommer att påverka framtiden mest. Idag står hundra företag i världen för sjuttio procent av koldioxidutsläppen. Politiken kan och måste ställa krav på att industrin ställer om och hjälpa företagen med ett massivt grönt investeringsprogram och satsningar på ny teknik, ett program med utgångspunkt i uppdaterade klimatmål för alla utsläpp som svensk politik har inflytande över, som svarar mot den senaste forskningen och bygger på solidaritet med framtida generationer och andra delar av världen. Det är investeringar som ökar statens ägande och därmed allas demokratiska inflytande. Det går inte att överlåta framtiden till marknadskrafternas godtycke, framtiden tillhör oss alla."
  - id: V-017
    parti: V
    sida: 5
    rader: '169-180'
    lydelse: "De stora förändringar som behövs för att klara av klimatomställningen gör att vi behöver bygga ett delvis nytt samhälle, och det ger oss också möjlighet att rätta till mycket av det som var fel i det gamla. Vänsterpartiet föreslår ett massivt investeringsprogram för den gröna industrin. Sverige ska vara världsledande i omställningsarbetet. Industrier ska ställa om från fossilt till förnybart med hjälp av stora statliga investeringar och Vänsterpartiet föreslår en grön omställningsfond där staten använder sina ekonomiska muskler och där pengar förs över från företag som smutsar ner till miljö- och klimatvänlig produktion. Det är viktiga och nödvändiga investeringar, och det kommer också skapa väldigt många nya jobb över hela landet genom infrastruktursatsningar på järnväg, vägar, energi, bostäder och välfärd. Det är investeringar som vi tillsammans genom den svenska staten behöver göra."
  - id: V-018
    parti: V
    sida: 6
    rader: '183-194'
    lydelse: "Det gröna investeringsprogrammet gör att vi kan ta itu med många av de områden som varit eftersatta under många år, när fokus istället legat på kortsiktiga vinster och spekulation. Att se till att alla som bor i Sverige har en bra bostad är ett sådant exempel. Omställningen kräver att det finns bra bostäder och möjligheter att leva gott för de som ska genomföra den, oavsett var i landet det gäller. Bostadsbristen är en bromskloss både för lokalsamhällen, arbetstagare och arbetsgivare som vill vara delaktiga i att ställa om Sverige. När vi gör de nödvändiga framtidsinvesteringarna i nya bostäder har vi en fantastisk chans. Med större kontroll och planering från samhällets sida, kan byggandet både öka i takt och bli miljösmart och lagra kol istället för att släppa ut koldioxid. Så bygger vi samhället och stärker människors rätt till en trygg bostad, samtidigt som vi lägger grunden för ett hållbart klimatsmart samhälle."
  - id: V-019
    parti: V
    sida: 6
    rader: '195-207'
    lydelse: "Vägnätet och järnvägen behöver rustas upp i stora delar av Sverige, när industrierna nu expanderar på nya platser. Tunga transporter behöver styras till järnväg och hållbar sjöfart. För att göra såväl person- som godstransporter hållbara behöver vägnätet både elektrifieras och kompletteras med infrastruktur för andra hållbara drivmedel. Staten måste öka sin kontroll över infrastruktur och resurser som behövs för att genomföra klimatomställningen. Produktionen av både el och exempelvis vätgas behöver öka kraftigt när vi ställer om från användning av fossila bränslen, därför behöver staten gå in med satsningar på förnybar energi. Staten måste öka sin kontroll över infrastruktur och resurser som behövs för att genomföra klimatomställningen. Det offentliga ska ta över ansvaret för elnätet, vilket kommer leda till minskade avgifter för hushållen. För att såväl öka alla människors rörelsefrihet som för att minska utsläppen av växthusgaser så behöver även kollektivtrafiken byggas ut och göras billigare och mer tillgänglig i hela landet."
  - id: V-020
    parti: V
    sida: 6
    rader: '208-218'
    lydelse: "En annan viktig del i den gröna omställningen är satsningar på hållbar livsmedelsproduktion. Stora delar av den mat och energi vi konsumerar kommer från landsbygden, men samtidigt blir det allt svårare att bygga ett bra liv när service och välfärd koncentreras till storstäderna. Oavsett var i landet vi bor så har vi ett gemensamt intresse av att landsbygden inte utarmas. Mer av naturresursernas värden måste stanna kvar där de utvinns och produceras. Vindkraften ska gynna både kommun och boende i närområdet. Äldreomsorg, förskola, skola och matbutik behöver finnas på fler mindre orter. Ett ökat bostadsbyggande måste också ske på landsbygden, med hyresrätter med rimliga hyror och småhus. Utbyggnaden av transportinfrastruktur och fiber går alldeles för sakta, staten behöver gå in och ta ett större ansvar för utbyggnaden. Välfärden måste vara till för alla och finnas överallt."
  - id: V-021
    parti: V
    sida: 6
    rader: '219-226,229-238'
    lydelse: "Att som individ försöka minska sin klimat- och miljöpåverkan är bra, men det kommer aldrig att räcka. Vi måste ta oss an klimatkrisen som samhälle. Mycket av det vi konsumerar behöver vi för att leva bra liv - mat, kläder, boende och resor men sättet sakerna och energin framställs på behöver ändras. För de flesta av oss sker en stor del av konsumtionen och resandet för att hållbara alternativ saknas. Det gäller inte minst på landsbygden. Det är samhället och politikens ansvar att se till att alternativen finns. Där inte teknikskiften räcker för att minska utsläppen måste konsumtionen styras bort från det smutsiga och alla ges förutsättningar att leva mer hållbart. Vi ser ett hållbart liv som ett bättre liv. Kortare arbetsdagar med mer tid för relationer och egna intressen, produkter som håller och lätt kan återanvändas och delas istället för slit- och släng. Renare storstadsluft, billig och fungerande tåg- och kollektivtrafik. Hälsosammare mat från vår egen svenska landsbygd. Men för ett fåtal är konsumtion en livsstil av lyx och överflöd. Den rikaste procenten släpper ut tio gånger mer utsläpp än majoriteten av befolkningen. Det är denna elit som behöver dra ner sin konsumtion mest. Hos samma personer samlas rikedomar på hög istället för att gå till investeringar i framtiden. Det är hög tid att de få som har stora kapitaltillgångar bidrar mer till omställningen. För alla oss andra kommer omställningen att skapa större möjligheter, nya jobb, friskare liv och mer framtidstro."
  - id: V-022
    parti: V
    sida: 7
    rader: '240-249'
    lydelse: "Att välfärden omfattar alla som bor i vårt land har länge varit en viktig del i det som gjort Sverige till ett tryggt och jämlikt land. Nu ifrågasätter högerpartierna den idén. I dagens ekonomi ses värdet i en människa i hennes förmåga att producera och högerns politik går ut på att angripa invandrare, sjuka, arbetslösa och personer med funktionsnedsättning och att begränsa vår tillgång till välfärden. Högerns idé är att invandrade, sjuka och arbetslösa är lata och om vi får det sämre så tvingas vi prestera bättre. Samtidigt har de en idé om att det absoluta toppskiktet måste få det bättre, genom sänkta skatter, bonusar och andra morötter, för att de ska prestera mer. Det är en haltande logik och en politik som skapar konflikter och misstro mellan människor."
  - id: V-023
    parti: V
    sida: 7
    rader: '250-262'
    lydelse: "Möjligheten att bo bra till en rimlig kostnad har spelat en viktig roll i det jämlika samhällsbygget, men efter att också bostäderna lämnats åt marknaden ökar bostadsbristen, boendekostnader och segregation. Byggtakten har hållits nere för att bostadspriserna ska fortsätta att stiga, hyresgäster krävs på allt högre hyror medan den som köper bostadsrätt lägger allt större del av sin inkomst på bostaden. Efter att Vänsterpartiet tagit och vunnit fajten om att stoppa marknadshyrorna tillsammans med Hyresgästföreningen och en bred massiv rörelse är det tid för nästa steg. Vänsterpartiets nästa steg handlar om en politik för massivt bostadsbyggande, klimatsmarta renoveringar och sänkta hyror som går hand i hand med den gröna omställningen. Vänsterpartiet vill se ett statligt byggbolag, investeringsstöd för ökat bostadsbyggande och en aktiv markpolitik. Med en progressiv fastighetsskatt skulle lyxfastigheter taxeras högre medan majoriteten av husägarna inte skulle få högre skatt."
  - id: V-024
    parti: V
    sida: 7
    rader: '263-274,277-278'
    lydelse: "Barn, sjuka och arbetslösa måste självklart ha samma rätt som arbetande människor att ha goda liv. Alla har vi varit barn. Alla kan vi bli sjuka eller förlora jobbet. När vi blir gamla blir vi förhoppningsvis pensionärer. När du blir sjuk eller föder barn ska du kunna lita på att få ersättning från Försäkringskassan utan att behöva stånga dig blodig. När du blir gammal ska du kunna leva på din pension, inte bara överleva. På samma sätt ska du som lever med funktionsnedsättning kunna lita på att du får det stöd du behöver, och på att din rätt att delta i samhället på det sätt du vill inte ständigt ifrågasätts och försvåras. Tryggheten i ett samhälle hänger ihop med hur våra trygghetssystem fungerar - a-kassan, sjukförsäkringen, LSS och pensionerna. Vänsterpartiet vill se en mänsklig sjukförsäkring och ett slut på utförsäkrandet av sjuka. Du som blir arbetslös ska veta att du får en bra a-kassa och inte behöva oroa dig över att du måste flytta till en billigare lägenhet, sälja huset eller inte kunna ha mat på bordet. Men politiska beslut har gjort att a-kassans ersättningar är lägst i Norden."
  - id: V-025
    parti: V
    sida: 8
    rader: '279-286'
    lydelse: "Du ska vara trygg när du blir gammal. Vänsterpartiet vill ha ett nytt pensionssystem som inte gör människor fattiga och kräver därför att det nuvarande systemet rivs upp. De låga pensionerna är också en jämställdhetsfråga och rättvisefråga - en stor andel av fattigpensionärerna är kvinnor och invandrade. I ett av världens rikaste länder, Sverige, måste det gå att ha ett gott liv även som äldre. Det förutsätter en annan fördelningspolitik där värdet av det som vi skapar tillsammans fördelas efter behov. Robusta trygghetssystem kräver också en starkare och mer inkluderande arbetsmarknad där fler människor har bra och trygga jobb."
  - id: V-026
    parti: V
    sida: 8
    rader: '288-290'
    lydelse: "Arbetslöshet är ett enormt slöseri med människors kompetens och erfarenheter. Ändå är det bara ett parti i riksdagen som har en politik för full sysselsättning - Vänsterpartiet."
  - id: V-027
    parti: V
    sida: 8
    rader: '291-297'
    lydelse: "Välfärdsskulden som uppstått innebär att hundratusentals jobb försvunnit ur skola, vård och omsorg sedan 1990-talet, och det behövs en politisk vilja för att successivt börja bygga upp en bättre kvalitet igen. Men politikens ansvar stannar inte vid offentliganställda. Det som gjorde Sverige till en ledande industrination var de politiska beslut som då innebar byggandet av en miljon bostäder under kort tid, byggandet av infrastruktur och utbyggnad av välfärd åt alla. Investeringar i jämlikhet, jämställdhet och trygghet är bra också för de svenska företagen."
  - id: V-028
    parti: V
    sida: 8
    rader: '298-302'
    lydelse: "Genom en politik för högre löner för dem med lägst inkomster så skapas efterfrågan. Pensionärer som får högre pension gör så att affären kan hålla öppet på en liten ort. När politiken levererar välfärd, försäkringar som a-kassa, pensioner och sjukpenning, om staten satsar stort på klimatomställning och infrastruktur, då skapas jobb i företagen och möjligheter att leva och bo i hela landet."
  - id: V-029
    parti: V
    sida: 8
    rader: '303-315'
    lydelse: "När högern och näringslivets lobbyorganisationer talar om flexibilitet på arbetsmarknaden menar de i klarspråk försämrad anställningstrygghet, och sanningen är att arbetslivet har blivit allt mer otryggt för många av oss som arbetar. Otryggheten skapas genom tillfälliga anställningar, sms-jobb, gig-jobb, deltidsjobb och bemanningsjobb. Otrygga anställningar leder till tysta arbetsplatser och lägre facklig organisationsgrad. Du bråkar inte gärna med den chef som dagen efter kan avsluta din anställning. Du tar inte strid mot sexuella trakasserier eller diskriminering om det kan kosta dig nästa jobbpass. Få av oss väljer den osäkra arbetssituationen frivilligt. De flesta av oss vill ha en viss trygghet för att kunna planera våra liv, skaffa en bostad, kunna ta semester eller veta att vi lugnt kan sätta barnen i skola utan att behöva flytta från orten inom några år. Samhällsutvecklingen går stick i stäv med människors behov. Sedan förra valet har andelen unga som tycker att kollektivavtal och fast anställning är viktigt ökat kraftigt."
  - id: V-030
    parti: V
    sida: 8
    rader: '316-319'
    lydelse: "Anställda med utländsk bakgrund är överrepresenterade i osäkra, lågbetalda och stressiga jobb. Ingen av oss ska behöva utstå rasism på arbetsplatsen eller vara beroende av arbetsgivaren för att få stanna i Sverige. Diskrimineringen och rasismen på arbetsmarknaden måste stoppas."
  - id: V-031
    parti: V
    sida: 9
    rader: '322-331'
    lydelse: "Trygghet på arbetsmarknaden är också att alla ska orka jobba hela vägen fram till pensionen. I många arbetaryrken, särskilt de kvinnodominerade, är det verkligen ingen självklarhet. Arbetslivet måste utvecklas och arbetstiden förkortas. Det är ingen naturlag att vi ska jobba åtta timmar om dagen. Livet är så mycket mer än arbete. Med dagens tekniska utveckling finns förutsättningar att inleda en arbetstidsförkortning, med sikte på sex timmars arbetsdag, med bibehållen lön. En arbetstidsförkortning skulle vara ett viktigt steg för ökad jämställdhet eftersom det också skulle möjliggöra för en mer jämställd fördelning av det obetalda hemarbetet. Vänsterpartiet tycker att det är viktigare med en arbetstidsförkortning som kommer alla till del än sänkta skatter för ett fåtal."
  - id: V-032
    parti: V
    sida: 9
    rader: '332-341'
    lydelse: "Ett tryggt samhälle ställer inte människor mot varandra. När högerpartier förespråkar låglönejobb och begränsad välfärd för de av oss som inte är födda i Sverige bygger det på ett cyniskt utnyttjande av människor, ibland förklätt till antirasism. När människors utsatta situation utnyttjas pressas allas våra löner och våra möjligheter ner. Därför behöver vi hålla ihop. Det är inte när någon annan får sämre villkor som du får bättre villkor. Tvärtom, vi har ett gemensamt intresse av att förbättra villkoren istället för att öka den vinst som ett fåtal kan göra på våra arbetsinsatser. Det är inte genom tidsbegränsade uppehållstillstånd som integrationen förbättras. Tvärtom, det är genom en trygg och permanent tillvaro i samhället som vi människor rotar oss. Genom att hålla ihop skapar vi trygga liv för alla."
  - id: V-033
    parti: V
    sida: 9
    rader: '342-359'
    lydelse: "Fackens och kollektivavtalens roll är central både för ekonomin och demokratin. Rätten att gemensamt förhandla lönerna, och att arbetsgivaren inte kan anställa någon annan för sämre villkor eller lön än vad som är överenskommet med facket, gör att vi kan ha en stabil och positiv löneutveckling och att vi klarar dåliga tider i ekonomin utan att behöva få sämre betalt. Kollektivavtalen och arbetsrättslagstiftningen säkerställer ett grundläggande inflytande och skyddar oss anställda från maktfullkomlighet och godtycke. Det gör också att en sektor eller ett enskilt företag inte kan driva en verksamhet som inte bär sig genom att tvinga ner löner och villkor. Lönedumpning, ekonomisk brottslighet och utnyttjande är centrala hot idag. I Sverige pågår en dragkamp om makten och villkoren där löntagarna tappat mark en tid. En del av striderna sker i politiken och andra sker vid förhandlingsbordet mellan parterna på arbetsmarknaden. Men för att förhandlingarna ska vara rättvisa behöver politiken respektera den svenska modellen, där politiker inte hotar den ena parten med försämringar om den inte ger med sig. Det var vad som hände med lagen om anställningsskydd under 2020. Du som enskild löntagare kan bidra genom att vara organiserad fackligt, och se till att din arbetsplats har kollektivavtal. Vänsterpartiet kommer att fortsätta försvara förhandlingsrätten och en stark arbetsrättslagstiftning."
  - id: V-034
    parti: V
    sida: 9
    rader: '360-363'
    lydelse: "En politik för full sysselsättning, investeringar i välfärd och infrastruktur, arbetstidsförkortning, starkt anställningsskydd, trygga försäkringssystem och för att en hög andel av arbetsplatserna ska omfattas av kollektivavtal, det ger förutsättningar för starka, trygga löntagare och en fungerande samhällsekonomi."
  - id: V-035
    parti: V
    sida: 10
    rader: '366-370'
    lydelse: "En central uppgift i valet 2022 är att driva frågan om de anställdas makt över sitt arbete och att stödja fackligt aktivas kamp för avtal som ger reell beslutanderätt till de fackliga organisationerna. Den offentliga sektorn kan här gå före och genom beslut och avtal överföra makten över frågor som arbetstid, bemannings- och anställningsfrågor och arbetets organisering till de anställda."
  - id: V-036
    parti: V
    sida: 10
    rader: '371-375'
    lydelse: "Som ett skydd mot kortsiktig vinstjakt så vill Vänsterpartiet ge löntagare och samhällskooperativ laglig rätt och offentligt finansiellt stöd att ta över verksamheter och industrier som hotas stängas ner och flytta utomlands. Detta skulle skydda arbetstillfällen, löntagares inkomster och värna hela den stadsdel eller ort där arbetsplatsen finns."
  - id: V-037
    parti: V
    sida: 10
    rader: '377-384'
    lydelse: "Vänsterpartiet arbetar för alla människors frihet och har därför politiken för trygga jobb, ett robust välfärdssystem och för att samhällets rikedomar ska fördelas efter behov. Men frihet handlar också om rätten till fysisk trygghet. Risken för att drabbas av våld beror idag till stor del på vem du är och var du bor. Om du är arbetarklass, kanske med utländsk bakgrund, och bor i ett fattigt område är sannolikheten större att du utsätts för våld. Om du är kvinna löper du högre risk att bli utsatt för våld av någon som du lever i en nära relation med. Och om du är en hbtqi-person är risken stor att trakasserier, hot, hat och våld blir en del av vardagen."
  - id: V-038
    parti: V
    sida: 10
    rader: '385-401'
    lydelse: "När samhällets orättvisor och klassklyftorna ökar skapas en mer gynnsam grogrund för kriminalitet. Det gör den i hela samhället men särskilt i de fattigaste områdena. De av oss som bor i dessa områden är särskilt utsatta för våld och det finns en uppgivenhet över att samhället övergivit området. Istället för framtidsdrömmar om utbildning och bra jobb känner många en desperation inför en hopplös framtid. Droghandel har därför blivit ett alternativ för alltför många barn och ungdomar i eftersatta förorter, detta gäller särskilt för pojkar och unga män. Det är ett svek från samhällets sida. Alltför ofta lyfts repression och hårdare tag upp som lösningar istället för att ta itu med problemen på allvar. Det kräver nämligen omfattande förebyggande insatser. För att få ner brottsligheten går det inte bara att vara hård mot de kriminella, det gäller att vara smartare än de kriminella. Vissa straff kan behöva höjas men mycket mer fokus måste riktas mot att förhindra rekryteringen av nya barn till gängkriminalitet. Skola och fritidsverksamheter behöver ges bättre resurser, likaså socialtjänsten. Ge barn och ungdomar möjligheter till kommunalt stödda fritidsaktiviteter, ge skolan bättre resurser för att stödja elever som behöver det för att klara betygen och förstärk socialtjänsten med tillräckliga resurser och kunskap för att arbeta både förebyggande och med barnskydd."
  - id: V-039
    parti: V
    sida: 10
    rader: '402-407,410-413'
    lydelse: "Föräldrar ska inte behöva oroa sig över skjutvapenvåld och drömma mardrömmar om att deras barn ska drabbas. Kriminaliteten behöver mötas både med ett fungerande och närvarande rättssystem som fler patrullerande poliser, arbete mot narkotikahandel, kamp mot tillgången till illegala skjutvapen och ett effektivt avhopparprogram, men framför allt med en kamp mot kriminalitetens djupare orsaker - klassamhället, segregationen, rasismen på arbetsmarknaden, trångboddheten och bristen på framtidstro. Många unga, särskilt med utländsk bakgrund, som bor i fattiga områden, utsätts även för rasism och övervåld från polisen, vilket blev tydligt i diskussionen kring Black Lives Matter-rörelsen. Att återupprätta tilltron till polisen kräver stora förändringar av hur polisen arbetar."
  - id: V-040
    parti: V
    sida: 11
    rader: '414-419'
    lydelse: "Droganvändningen är jämt fördelad över alla samhällsklasser men det är de mest utsatta i samhället som drabbas hårdast. Det som händer i fattiga områden hänger ofta samman med droganvändning generellt. Därför måste kriminaliteten ses just som ett samhällsproblem, inte något som händer på vissa platser. Tullens och polisens resurser måste öka för att komma åt de pengar som driver narkotikahandeln."
  - id: V-041
    parti: V
    sida: 11
    rader: '420-423'
    lydelse: "I ett tryggt samhälle tar vi krafttag mot våld, hedersförtryck och sexuella kränkningar mot kvinnor, barn och hbtqi-personer. Otrygghet har varit många kvinnors vardag under stora delar av historien. Ingen ska behöva leva i en sådan verklighet. Ojämställdheten har ett högt pris."
  - id: V-042
    parti: V
    sida: 11
    rader: '424-427'
    lydelse: "Vänsterpartiet anser att den inhumana flyktingpolitik som råder, med tillfälliga och villkorade uppehållstillstånd, är en form av psykologiskt våld mot en redan utsatt grupp. Rätten att söka asyl kan aldrig tummas på, vi kräver att endast permanenta uppehållstillstånd ska utfärdas vid beviljad asyl."
  - id: V-043
    parti: V
    sida: 11
    rader: '428-445'
    lydelse: "Det är viktigt att rättssystemet fungerar, att kvinnors erfarenheter tas på allvar och att de som begår brott döms. För det behövs det fler poliser, ökad kunskap inom rättsväsendet om samtycke och om våld mot kvinnor och barn, och straff som gör att brotten prioriteras av rättsvårdande instanser. Skolor och förskolor behöver arbeta förebyggande mot destruktiva normer för att alla barn, oavsett kön, ska kunna leva fria. Många kvinnor kan inte lämna destruktiva förhållanden för att deras ekonomi är för dålig, därför hänger arbetet med att uppvärdera kvinnors arbete och höja löner i låglöneyrken ihop med arbetet mot våld mot kvinnor. Ett ökat statligt ansvar för att bygga bort bostadsbristen kommer också att göra det möjligt för många av de kvinnor som idag inte har något boendealternativ att lämna den bostad som hon delar med en förövare. Vänsterpartiet anser att det därutöver måste vara en rättighet att få hjälp med en långsiktig trygg boendelösning för den som behöver det för att lämna våldsutsatthet. Socialtjänsten måste garanteras ett varaktigt och stabilt stöd för arbetet mot våld i nära relationer. Barnperspektivet måste stärkas i vårdnadstvister och det ska inte vara möjligt för våldsutövare att behålla gemensam vårdnad. Vänsterpartiet vill motverka den privatisering som sker av kvinnojourernas verksamhet. Det är ett samhällsansvar att stoppa mäns våld mot kvinnor, inte en möjlighet för privata bolag att göra vinst."
  - id: V-044
    parti: V
    sida: 11
    rader: '447-451,454-462'
    lydelse: "De senaste decennierna har politiken förlitat sig på att marknaden ska lösa våra behov av trygghet, men marknadslösningar har urholkat vår gemensamma välfärd samtidigt som en allt större del av våra skattemedel går till administration och kontroll. Privatiseringar har lett till dyrare elpris, att apoteken flyttar från landsbygd till städer och från fattiga till rika områden, att du har olika tillgång till vård, skola och omsorg beroende på var du bor, att det gått inflation i betygen och till en allt sämre kvalitet på service och välfärd. Även kulturen och idrotten har utarmats när skolbibliotek läggs ned, simskolan blivit dyrare och biografer finns på färre orter. Det borde vara nog med skandaler om hur välfärdsprofitörer roffar åt sig vinster men låter äldre dö i ensamhet på boendet eller sparar på lärare och material så att skolbarn inte får tillräckliga kunskaper. Privatiseringarna av välfärden öppnar upp för kriminella att sko sig på skattemedel. Välfärdsbrott bekämpas inte bäst genom ytterligare tandlös kontroll. Brotten mot välfärden bekämpas bäst genom att det inte går att göra vinster vare sig på barn eller på sjuka och gamla människor."
  - id: V-045
    parti: V
    sida: 12
    rader: '463-470'
    lydelse: "En betydande majoritet av Sveriges befolkning vill sätta stopp för de nyliberala privatiseringarna och stoppa vinstjakten i välfärden. Trots det är det bara Vänsterpartiet som går i takt med väljarna. Vänsterpartiet vill införa ett totalförbud mot alla vinstdrivande verksamhetsformer inom välfärden. Men motståndet från många partier är stort och intresset från andra partier är halvhjärtat. Vänsterpartiet behöver växa och få större inflytande för att åter kunna göra välfärden till en gemensam angelägenhet och inte främst en vinstmöjlighet för riskkapitalister."
  - id: V-046
    parti: V
    sida: 12
    rader: '471-477'
    lydelse: "De massiva skattesänkningar som genomförts av högerpartier och socialdemokrater under många år har resulterat i att det nu finns 350 miljarder mindre per år till välfärden än 1990. Därför är det färre som jobbar inom välfärden, trots att vi har blivit fler i Sverige. I takt med att skatterna på de mest förmögna minskat ökar trycket på lokal- och regionalpolitiker att höja skatten för att slippa skära ner ytterligare. Det är en omvänd fördelningspolitik, där pengar flyttas från allas vår välfärd till ett fåtal redan rika."
  - id: V-047
    parti: V
    sida: 12
    rader: '478-490'
    lydelse: "Eftersom välfärdsyrkena är kvinnodominerade så slår neddragningarna särskilt hårt mot kvinnors arbetsvillkor och möjlighet till makt och inflytande. En fungerande välfärd, så som bra förskola och trygg äldreomsorg, är också en förutsättning för att många kvinnor ska kunna lönearbeta istället för att göra traditionellt hemarbete. Vänsterpartiet har en skattepolitik som ser till vilka behov som finns och där de med stora kapitaltillgångar eller höga löner får bidra mer till välfärden än de gör idag. Vi vill inte höja skatten för vanliga löntagare utan på mångmiljonarv, lyxvillor och stora aktievinster som man inte ens behöver jobba för. Vänsterpartiet har en fördelningspolitik som gör att samhällets rikedomar kommer fler till del. Istället för rut-bidrag till städning hos fullt friska personer så kan vi använda skattekronorna till att förbättra hemtjänsten. Istället för pengar i fickan på de privata skolbolagen kan vi satsa på att alla barn ska få en bra utbildning. Istället för fortsatt ökande klyftor kan vi göra Sverige mer jämlikt."
  - id: V-048
    parti: V
    sida: 12
    rader: '491-494'
    lydelse: "Kultur som konst, musik och film bidrar till att skapa ett rikare samhälle att leva i för alla. Det är viktigt att kulturen står fri från såväl kommersiell som politisk styrning och finns i hela landet. Kulturen spelar en viktig roll och är en del av välfärden. Kulturen kan spegla samhället, motverka segregation och klasskillnader."
  - id: V-049
    parti: V
    sida: 12
    rader: '495-497,500-513'
    lydelse: "Välfärden är samhällets ansvar och borde styras demokratiskt. Det är politikens uppgift att se till att den fungerar, kommer alla till del och att de anställda ges inflytande. De som jobbar på sjukhusen, skolorna eller hemtjänsten idag har burit skattesänkningarnas konsekvenser på sina axlar, med att arbeta hårdare, avstå löneökningar och se kollegorna bli färre och det egna lasset större varje år. Istället för att lösa resursbristen har styrande politiker svarat med ineffektiva modeller, minutstyrning och idéer som optimerad schemaläggning, där ingen som arbetar i verksamheten tillfrågats. Läkare och sjuksköterskor, undersköterskor, lärare och socialsekreterare, alla som behövs i välfärden, förvandlas till administratörer i ett system där politiker kräver att allt dokumenteras i modeller som inte hade behövts. Det är resurser som främst behövs, inte formulär för kvalitetssäkring, nya bokningssystem för sjukhussängar eller ännu en managementkonsult som inte kan något om verksamheten. Kombinationen av marknadslösningar, byråkrati och resursbrist har skapat närmast omänskliga villkor för de samhällsbärare vi inte klarar oss utan. Dessa samhällsbärare förtjänar att bli lyssnade på. De har handfast kunskap som är avgörande för att lyfta välfärden, och den behöver tas om hand. De anställda i välfärden bör också få ett kraftigt utökat inflytande över verksamheterna de arbetar i."
  - id: V-050
    parti: V
    sida: 13
    rader: '515-527'
    lydelse: "Det är när vi står tillsammans som vi bäst kan klara utmaningar och kriser. Pandemin har gjort bristerna i sjukvården och äldreomsorgen tydliga. Konsekvenserna av många år av nedskärningar och privatiseringar syntes i att äldre inte skyddades från smittan trots löften från vårdföretagen och trots att personalen gjorde sitt bästa med knappa resurser. Det fanns för få vårdplatser, alltför belastade vårdcentraler, för lite personal och för dåliga förberedelser med skyddsutrustning. Sverige behöver rusta upp hela vårdsektorn för att kunna klara de mer normala skiftningarna i vårdbehov men också för att kunna växla upp kapaciteten i kristider. Om personalen redan går på knäna och vårdköerna redan är för långa är det svårt att hantera en kris utan att både personal och patienter blir lidande. Det är inte acceptabelt att stora resurser, som behövs till människor med komplext eller långvarigt behov av vård istället går till nätläkartjänster för att behandla vanlig snuva och andra mindre åkommor hos friska människor."
  - id: V-051
    parti: V
    sida: 13
    rader: '528-533'
    lydelse: "När vården inte räcker till tvingas anhöriga, särskilt kvinnor, att ta ett allt större ansvar. Vården och omsorgen har styckats upp, mellan nivåer och aktörer, människor bollas runt i en stor administrativ apparat och det är ofta en kamp för den enskilde och dess anhöriga att få rätt tillgång till vård. Vård måste ges efter människors behov och inte efter kapaciteten i felaktigt konstruerade system. Din försäkring eller position i samhället ska inte avgöra vilken vård du får."
  - id: V-052
    parti: V
    sida: 13
    rader: '534-543,546-549'
    lydelse: "Många år av privatiseringar och ständig jakt på effektiviseringar i arbetslivet, skolan, vården och omsorgen har påverkat både hälsa, vårdbehov och tillgången till vård negativt. Stressrelaterade sjukdomar blir allt vanligare och psykisk ohälsa ökar särskilt bland kvinnor och hos unga utan att det leder till utbyggd vård eller förändrad arbetsmiljö. Du ska ha rätt till hjälp snabbt oavsett om du har brutit benet eller blivit utbränd. Men Sverige har idag minst antal vårdplatser i EU och en alldeles för dåligt utbyggd primärvård. Att du är beroende av omsorg ska inte, som idag, begränsa dina möjligheter att styra över ditt liv. Vittnesmålen om äldre som nästan aldrig får gå ut eller som måste äta sin middag tidigt på eftermiddagen för att personalen ska få tiden att gå ihop vittnar om en förskjutning i synen på människovärde. Vård och omsorg måste ges efter behov oavsett om du bor på ett särskilt boende eller har insatser av hemtjänsten. Därför vill Vänsterpartiet satsa mer resurser på hälso- och sjukvården och äldreomsorgen, samt satsa på personalen så att vi samtidigt får bort personalbristen och stärker personalens villkor och arbetsmiljö."
  - id: V-053
    parti: V
    sida: 14
    rader: '550-557'
    lydelse: "Sjukvården måste vara jämlik, jämställd och tillgänglig, oavsett var i landet du bor och oavsett vem du är. Så är det inte idag. Behoven ska styra, du ska inte behöva lösa en privat försäkring för att få en bra sjukvård och tandvård eller en trygg förlossning. Lösningen är inte att förstatliga sjukvården men för att säkerställa en jämlik vård i Sverige måste staten ta ett större ansvar för att skapa lika förutsättningar. Omfördelningen från stat till region och kommun måste öka och särskild hänsyn ska tas till de många kommuner och regioner som idag inte får ihop sin ekonomi samtidigt som de redan har bland landets högsta skatter totalt sett."
  - id: V-054
    parti: V
    sida: 14
    rader: '558-564'
    lydelse: "Trots att tandhälsan i befolkningen som helhet har förbättrats kvarstår betydande socioekonomiska skillnader. En viktig orsak är att det för vuxna patienter saknas ett högkostnadsskydd värt namnet och dessa får därför stå för en stor del av tandvårdskostnaderna själva. Detta innebär att en ganska stor grupp avstår från tandvård av ekonomiska skäl. Vänsterpartiet vill därför införa en tandvårdsförsäkring liknande den som finns inom övrig hälso- och sjukvård med ett högkostnadsskydd som gör att vuxna människor med behov inte ska behöva tacka nej till god tandvård."
  - id: V-055
    parti: V
    sida: 14
    rader: '565-567'
    lydelse: "En vård och omsorg som är solidariskt finansierad av skattemedel och där pengarna går till verksamhet och inte till företagens vinster är en grundförutsättning för att uppnå en jämlik vård i hela Sverige."
  - id: V-056
    parti: V
    sida: 14
    rader: '569-576'
    lydelse: "Svensk förskola och skola ska vara jämlik och jämställd, där alla barn och unga ges samma rätt till utbildning. En skola som ger barn lika chanser är också kompensatorisk, det vill säga den förmår ge mer stöd till den som kommer från sämre förutsättningar. Under lång tid fanns det en vilja till detta. Politiska reformer la grunden för en av världens bästa skolor. Så är det inte längre. Alldeles för många barn går idag miste om en bra skolgång, särskilt barn som växer upp i socioekonomisk utsatthet. Det är ett misslyckande, inte bara för det enskilda barnet, utan också för samhället i stort."
  - id: V-057
    parti: V
    sida: 14
    rader: '577-586,589-591'
    lydelse: "Sverige är extremt. Som enda land i världen råder det fri dragningsrätt på de skattemedel som ska gå till våra barns utbildning. Pengarna du och jag betalar för våra barns skolgång och framgång går till vinster i skolkoncerner och hamnar i skatteparadis. Dessutom leder den marknadsanpassade skolan till betygsinflation, segregation och ökad ojämlikhet. Privatiseringsexperimentet med marknadsskolan har förstört möjligheterna för tusentals barn. Om dina föräldrar är låg- eller höginkomsttagare, akademiskt skolade eller inte, invandrade eller svenskfödda, spelar en allt större roll för dina möjligheter att klara skolan. Marknadsskolan är ett monumentalt misslyckande. Det tycker en majoritet av svenska folket och stora delar av lärarkåren. Vänsterpartiet vill avskaffa marknadsskolan med start nästa mandatperiod. Barnens rätt till utbildning kan inte vänta. Varje år är det nya elever som skickas igenom systemet utan tillräckliga kunskaper. För varenda en av dem är det en förlorad livschans."
  - id: V-058
    parti: V
    sida: 15
    rader: '592-597'
    lydelse: "Det räcker inte att åtgärda systemfelen med den privatiserade skolan. Skolan måste också tillföras mer resurser, det är bara så vi kan skapa en skola som kan möta barn utifrån deras olikheter och skiftande behov. De senaste årtiondena har pengarna till skolan minskat. Det krävs satsningar inte bara på undervisning utan också på elevhälsa, specialpedagoger, fritidsverksamhet och socialt stöd. Alltför många barn far illa idag och den psykiska ohälsan bland unga är utbredd."
  - id: V-059
    parti: V
    sida: 15
    rader: '598-611'
    lydelse: "En framgångsrik klimatomställning kräver många nya och kunskapsintensiva arbeten, hög kompetens och satsningar på utbildningsväsendet. Arbetare, som idag är anställda i privata företag och offentlig verksamhet ska inte drabbas av arbetslöshet när samhället ställer om från fossilberoende. Deras yrkeskompetens behövs också i den gröna omställningen, men för att kunna hantera de nya gröna jobben behövs massiva satsningar på omställningsstöd, kompetensutveckling och utbildning i vad hållbar samhällsutveckling innebär. Det måste bli lättare att utbilda sig efter grundskolan oavsett vem du är, tjockleken på din plånbok eller var i landet du bor. Alltför många barn börjar aldrig gymnasieskolan eller hoppar av i förtid. Gymnasieskolan ska kunna möta alla barns behov, och inte som idag bygga på konkurrens. Vänsterpartiet vill värna universitetens oberoende och finansiering och höja studiestödet så att fler kan välja att vidareutbilda sig. Folkhögskolor och Komvux behövs i hela landet. Bildning sker genom hela livet. Därför behöver vi också värna studieförbundens ställning."
  - id: V-060
    parti: V
    sida: 15
    rader: '612-617'
    lydelse: "Vänsterpartiet vill satsa på hela utbildningssystemet. Från förskola till universitet och yrkeshögskola behöver kvaliteten och tillgängligheten öka. Det ska inte spela någon roll om du bor i ett miljonprogramsområde eller på landsbygden, rätten till likvärdig utbildning och bildning är grundläggande. Vänsterpartiet vill se fler lärare, tidigare insatser för barn som har det kämpigt och förbättrad tillgång till lärande genom hela livet."
  - id: V-061
    parti: V
    sida: 15
    rader: '619-624'
    lydelse: "Vänsterpartiet försvarar den oberoende kulturen. Politiken ska skapa förutsättningar för en bred kultur som kommer alla till del och hålla armlängds avstånd till innehållet. Vi lever i en tid då högerpopulistiska krafter försöker styra information och innehåll allt hårdare. Därför är det särskilt viktigt att satsa på och utveckla folkbiblioteken, folkbildningen och public services oberoende ställning. En fri kultur är avgörande för en stark demokrati."
  - id: V-062
    parti: V
    sida: 16
    rader: '628-635'
    lydelse: "Det är hög tid för förändring. Vänsterpartiet satte ner foten kring marknadshyror för att nu är gränsen nådd. Ska vi alla ha en framtid som vi kan tro på, så är det Vänsterpartiet som ska leda den politiska förändringen. Vänsterpartiet är ett parti som lägger sin energi på konkreta politiska reformer för att återuppbygga och utveckla de trygghetssystem som rivits ner, en kraftfull grön omställning med jobb och välfärd i hela landet, i både storstad och glesbygd, förort och landsbygd. Ett parti som står upp för oss alla, inte bara en liten rik elit. Vänsterpartiet ställer krav på kollektivavtal vid offentliga upphandlingar."
  - id: V-063
    parti: V
    sida: 16
    rader: '636-651'
    lydelse: "Politik är inte något som händer någon annanstans. Det är tillsammans med folkrörelser som Vänsterpartiet driver fram förändringar. Vårt parti är också en stolt del av en internationellt växande vänster som i åratal kritiserat politikens blinda tro på marknaden och agerat mot dess konsekvenser. Kapitalismen och klimathotet har inga landgränser. Därför är vi en rörelse som sätter den internationella solidariteten högt på dagordningen. Vänsterpartiet är ett socialistiskt, feministiskt och antirasistiskt parti på ekologisk grund. Asylrätten undergrävs just nu i land efter land. När rasismen växer, länder sluter sig och EU bygger murar ska Sverige agera för flyktingars rättigheter och försvara asylrätten både i Sverige och internationellt. Vänsterpartiet anser att Sverige ska vara en röst för fred och rättvisa, inte för ökad militarisering. Sverige ska öka biståndet, stärka FN och skriva under kärnvapenkonventionen. Därför är Vänsterpartiet motståndare till Sveriges allt djupare militära samarbete med NATO och EU, och vi är det enda riksdagspartiet som konsekvent värnar och vill återupprätta svensk alliansfrihet. Vänsterpartiet vill att Sverige river upp värdlandsavtalet med NATO. I en rättvis värld måste den globala ojämlikheten kraftigt minskas."
  - id: V-064
    parti: V
    sida: 16
    rader: '652-660'
    lydelse: "Vänsterpartiet vill ha en regering som står till vänster i svensk politik. Vänsterpartiet kommer att arbeta för att en sådan regering har modet att driva vänsterpolitik och stå emot nyliberalism och rasism. Vänsterpartiet samarbetar gärna med andra partier, men bara om resultatet av arbetet innebär ökad jämlikhet, grön omställning och kraftigt stärkt välfärd. För oss står inte valet mellan två dåliga alternativ. Du som väljare håller förmodligen inte med oss i alla frågor. Det är ok. Men detta valår är det viktigt att lägga sin röst på ett vänsterparti som du kan lita på och som har modet att stå upp för sina ideal. För den som vill ha mer vänsterpolitik så finns det bara Vänsterpartiet att rösta på i detta val."
  - id: V-065
    parti: V
    sida: 16
    rader: '661-671'
    lydelse: "Att vi i Vänsterpartiet anser att mycket mer resurser ska och kan satsas på välfärd, klimatinvesteringar, vård och jobbpolitik än vad de andra partierna gör beror inte på att vi kan trolla fram pengar som andra inte kan hitta. Det beror på att vi inte tror på den ekonomiska politik som fört Sverige in i passiv underkastelse inför marknadskrafter, privat riskkapital och starka lobbyister från bolag som tjänar sina pengar på att ta dem från elever, gamla och sjuka. Vi vet att de stora revor som skadat samhället, de snabbt växande klyftorna och förlusten av trygghet och gemenskap, inte varit oundvikliga. Det är politiker som fattat beslut om varje enskild privatisering. Varje systemskifte. Varje skattesänkning och därpå följande nedskärning av viktig verksamhet. Varje icke-beslut, där klimatomställningen skjutits på framtiden."
  - id: V-066
    parti: V
    sida: 17
    rader: '674-679'
    lydelse: "Vi står vid en vändpunkt. Det som måste göras kommer att ta tid. Men det viktiga är att bryta trenden, och att istället för att acceptera fler försämringar börja bygga framtiden. Det finns självklara och brådskande problem att lösa för att rädda jorden från klimathotet. Välfärden måste byggas upp, jämlikheten stärkas och framförallt måste politiken ta ansvar för samhällsutvecklingen och lösa de behov som finns hos människor och miljö."
  - id: V-067
    parti: V
    sida: 17
    rader: '680-685'
    lydelse: "Ingen av oss vet vad som händer efter valet, men vi vet att det är din röst som avgör. Vi vill att den rösten räknas. Därför tycker vi att du ska lägga den på ett parti som står upp för de förändringar som behöver göras i Sverige. Vänsterpartiet kommer inte att acceptera den utgångspunkt som hela tiden består i att välja det mindre dåliga alternativet. Respekten för väljarna och demokratin kräver att en regering vi stödjer också ska vara en regering som driver vänsterpolitik."
  - id: V-068
    parti: V
    sida: 17
    rader: '686-688'
    lydelse: "Det är tillsammans vi bygger framtiden. Du som vill ha en politik för att förhindra klimatkatastrofen, skapa nya jobb i hela landet, förbättra trygghetssystemen och stärka välfärd, jämlikhet och jämställdhet, rösta på Vänsterpartiet!"
  - id: KD-001
    parti: KD
    sida: 2
    rader: '7-20'
    lydelse: "Det har gått åtta år sedan Kristdemokraterna senast satt i regeringen. Sedan dess har utvecklingen gått åt fel håll och vanligt folk har fått det sämre. Vårdköerna har tredubblats. 140 000 människor har väntat olagligt länge på besök hos specialist eller på behandling. Gängkrigen har tagit mer än tvåhundra liv de senaste fem åren. El- och drivmedelspriserna pressar hushållen, inte minst i Sveriges hjärtland. Drivmedelspriserna har skenat och den gångna vinterns elpriser låg periodvis tusen procent högre än året innan. Sverige har blivit dyrare, otryggare och med sämre tillgång till vård för den som behöver - det är orimligt."
  - id: KD-002
    parti: KD
    sida: 2
    rader: '21-42'
    lydelse: "Det behöver inte vara så här. Det går att vända utvecklingen. Sverige är ett fantastiskt land med en stark ekonomisk grund och ett välfärdssystem som stödjer människor utifrån behov genom hela livet. Köer i vården, gängkrig och upplopp på gatorna är inte värdigt vårt land. Det är inte det Sverige vi växte upp i och det är inte det Sverige vi ska lämna över till våra barn. Kristdemokraterna vill bygga ett samhälle där ingen hålls tillbaka och ingen lämnas efter. Vi når dit genom att i vår demokrati främja goda värden som medmänsklighet ansvarstagande, förvaltarskap, hederlighet, måttfullhet och jämställdhet. Vi prioriterar välfärdens viktigaste delar, samtidigt som vi ger människor utrymme att forma sina egna liv i gemenskap med andra. De problem vi har fått på senare år är djupa, men de kan lösas och de ska lösas. Det är dags nu. Vi är redo för en ny regering."
  - id: KD-003
    parti: KD
    sida: 2
    rader: '43-52,54-57'
    lydelse: "Vi prioriterar vården, för alla dem som lider i väntan på vård. Vi prioriterar samhällets äldsta och yngsta, dem som inte längre orkar höja sin röst eller ännu inte lärt sig att använda den. Vi prioriterar lantbruket, det som sällan syns i media men som producerar vår mat. Vi ser den som bor utanför storstäderna och är beroende av sin bil. Vi prioriterar tryggheten, vi är redo att bekämpa brotten. Vi ser människors behov av välfärd och vi ser företagaren vars affärsidéer gör det möjligt att betala för välfärden. Vi ser den som drabbats av elfattigdom och som tvingades ha ytterjackan på sig hemma i vintras för att uppvärmningen blivit för dyr."
  - id: KD-004
    parti: KD
    sida: 3
    rader: '58-65'
    lydelse: "I Sverige ska vi ha råd med värme. Både den värme som kommer från element och den som kommer från mänsklig gemenskap. Om du har läst ända hit så ber vi dig att läsa i en minut till, så ska vi berätta hur det ska gå till."
  - id: KD-005
    parti: KD
    sida: 4
    rader: '72-77'
    lydelse: "Var i landet du bor ska inte avgöra vilken sjukvård du får. Vården har blivit ett ojämlikt postkodlotteri. Hundratusentals väntar olagligt länge på specialiserad vård eller operation, samtidigt som det finns lediga tider i andra delar av landet. Vårdköer är inte någon naturlag. Andra länder klarar av att ge vård utan långa köer och Sverige kan också klara det. Men för det krävs att vi både tänker om och tänker nytt."
  - id: KD-006
    parti: KD
    sida: 5
    rader: '91-96'
    lydelse: "Avskaffa regionernas ansvar för sjukvården. Låt staten ta över ansvaret för vården med en gemensam organisation i stället för 21 olika. Det ger en högkvalitativ, effektiv och jämlik vård på lika villkor till hela befolkningen."
  - id: KD-007
    parti: KD
    sida: 5
    rader: '97-101'
    lydelse: "Inför en nationell vårdförmedling som matchar vårdbehovet med den vårdkapacitet som finns i hela landet - och inte bara i regionen där personen bor."
  - id: KD-008
    parti: KD
    sida: 5
    rader: '102-106'
    lydelse: "Fler vårdplatser. Sverige har lägst antal vårdplatser per capita i Europa, trots att vi är ett av de länder som lägger mest pengar på vården."
  - id: KD-009
    parti: KD
    sida: 5
    rader: '107-110'
    lydelse: "Fler vårdcentraler på landsbygden och enklare för enskilda läkare att starta egen verksamhet - så att vården finns nära till hands."
  - id: KD-010
    parti: KD
    sida: 5
    rader: '111-115'
    lydelse: "Inför fast läkarkontakt med en namngiven läkare och tak för antal patienter för att möjliggöra relationsbyggande mellan patient och läkare."
  - id: KD-011
    parti: KD
    sida: 5
    rader: '116-119'
    lydelse: "Ökad möjlighet att vårdas i egna hemmet, särskilt för multisjuka, genom mobila sjukvårdsenheter som kan ge vård i hemmet."
  - id: KD-012
    parti: KD
    sida: 5
    rader: '120-123'
    lydelse: "En nationell förlossningsplan och öppna fler förlossningskliniker, ökad bemanning och ett barnmorsketeam genom hela vårdkedjan - Före, under och efter förlossningen."
  - id: KD-013
    parti: KD
    sida: 5
    rader: '124-126'
    lydelse: "Utbilda mer personal för sjukvården. Förbättrade villkor i vårdens bristyrken och minska behovet av dyr inhyrd personal."
  - id: KD-014
    parti: KD
    sida: 5
    rader: '127-129'
    lydelse: "Kraftigt stärkt elevhälsa med en sammanhållen barn- och ungdomshälsovård och föräldrastödsprogram som erbjuds alla föräldrar."
  - id: KD-015
    parti: KD
    sida: 5
    rader: '130-134'
    lydelse: "Trygg patientsäkerheten med nationella standarder och tekniska specifikationer för all digital vårdinformation. Information om patienten ökar möjligheterna för en god vård."
  - id: KD-016
    parti: KD
    sida: 6
    rader: '136-146'
    lydelse: "Sverige befinner sig i en extrem situation. Det sker i snitt en skjutning om dagen och en dödsskjutning i veckan. Så ser det inte ut någon annanstans bland jämförbara länder. Sverige har de största problemen i hela EU, samtidigt har vi nästintill lägst antal poliser per invånare i EU. I flera svenska förorter är de kriminella gängens makt stor. Människor vågar inte vittna och knarkhandel sker öppet. Det finns också områden där islamistiska extremister har en avgörande påverkan på samhällslivet. Så här kan vi inte ha det. Tryggheten på gator och torg måste återupprättas, brottsförebyggande arbetet måste stärkas, brottslingar dömas och brottsoffer få upprättelse."
  - id: KD-017
    parti: KD
    sida: 7
    rader: '149-151'
    lydelse: "Förebygg brott genom att stärka familjerna och föräldraansvaret och göra det obligatoriskt med föräldrastöd i alla Sverige kommuner."
  - id: KD-018
    parti: KD
    sida: 7
    rader: '152-154'
    lydelse: "Förebygg brott genom att stärka föreningslivet samt inrättande av mentorskapsprogram och nationellt avhopparprogram."
  - id: KD-019
    parti: KD
    sida: 7
    rader: '155-157'
    lydelse: "Fler poliser och höjda polislöner. Polisyrket behöver bli mer attraktivt för att behålla poliser och attrahera nya."
  - id: KD-020
    parti: KD
    sida: 7
    rader: '158-160'
    lydelse: "Renodla polisens uppdrag. Polisen fokuserar idag alldeles för mycket på annat än brottsbekämpning."
  - id: KD-021
    parti: KD
    sida: 7
    rader: '161-164'
    lydelse: "Hela rättsväsendet behöver byggas ut. Fler poliser kräver fler åklagare, domstolar på fler platser i landet och en kraftigt utbyggd kriminalvård."
  - id: KD-022
    parti: KD
    sida: 7
    rader: '165-166'
    lydelse: "Skärp straffet för vapenbrott till lägst fem års fängelse."
  - id: KD-023
    parti: KD
    sida: 7
    rader: '167-172'
    lydelse: "Skärp straffen för sexualbrott kraftigt. 25 års fängelse för grov våldtäkt, kemisk kastrering som villkor för villkorlig frigivning och livstids fängelse för grov våldtäkt mot barn."
  - id: KD-024
    parti: KD
    sida: 7
    rader: '173-175'
    lydelse: "Stram migrationspolitik krävs för att ta itu med integrationsproblem och utanförskap."
  - id: KD-025
    parti: KD
    sida: 7
    rader: '176-180'
    lydelse: "Stärk sociala insatser och socialtjänstens möjligheter till tvingande åtgärder gentemot barn och unga som begår brott. Inrätta en nationell social insatsstyrka, så det förebyggande arbetet stärks och blir mer lika i landet."
  - id: KD-026
    parti: KD
    sida: 7
    rader: '181-182'
    lydelse: "Total översyn av sekretessreglerna, så att myndigheter kan dela uppgifter mellan sig för att förebygga och klara upp brott."
  - id: KD-027
    parti: KD
    sida: 7
    rader: '183-185'
    lydelse: "Beslagta kriminellas statussymboler och bekämpa på så sätt negativa förebilder som rekryterar unga in i gängkriminalitet."
  - id: KD-028
    parti: KD
    sida: 7
    rader: '186-188'
    lydelse: "Inför brottsrubriceringen missfirmelse mot tjänsteman, dvs att skrika okvädningsord till poliser, ska förbjudas."
  - id: KD-029
    parti: KD
    sida: 7
    rader: '189-191'
    lydelse: "Inför anonyma vittnen. Det finns i flera andra länder och har bidragit till fler fällande domar."
  - id: KD-030
    parti: KD
    sida: 8
    rader: '193-203'
    lydelse: "Hela Sverige ska fungera och det ska gå att bo och verka även utanför de stora städerna. Idag blir det allt svårare. Regeringen, och även andra partier, har glömt bort dessa orter. Det är rekorddyrt att tanka bilen, elförsörjningen sviktar, infrastruktursatsningar prioriteras bort, äganderätten över skogen hotas, lokala företag, jordbruk och åkerier får det allt tuffare. Viktig samhällsservice hamnar längre bort och avstånden till vård växer. Sverige är världsledande i klimatomställningen och det ska vi fortsätta vara på ett sätt som både fungerar och är effektivt. Det ska gå att bo, leva och känna sig trygg i Sveriges hjärtland, men det kräver en annan politik."
  - id: KD-031
    parti: KD
    sida: 9
    rader: '206-208'
    lydelse: "Sänk bensin- och dieselpriserna rejält för alla, främst genom minskad inblandningen av dyrt biobränsle."
  - id: KD-032
    parti: KD
    sida: 9
    rader: '209-210'
    lydelse: "Miljardsatsning för att rusta eftersatta vägar i hela landet - istället för att bygga dyra höghastighetståg."
  - id: KD-033
    parti: KD
    sida: 9
    rader: '211-215'
    lydelse: "Fler poliser med lokal närvaro, utbyggd primärvård, enklare starta lokal läkarmottagning och inrätta fler statliga servicekontor. Du ska känna dig trygg i hela landet."
  - id: KD-034
    parti: KD
    sida: 9
    rader: '216-219'
    lydelse: "Underlätta personalägande och generationsskifte av företag - så att fler företag kan drivas vidare av personalen om ägaren vill sluta."
  - id: KD-035
    parti: KD
    sida: 9
    rader: '220-221'
    lydelse: "Rädda lanthandeln genom att bredda driftstödet till dagligvarubutiker."
  - id: KD-036
    parti: KD
    sida: 9
    rader: '222-223'
    lydelse: "Den svenska vargstammen ska minskas till 170 individer."
  - id: KD-037
    parti: KD
    sida: 9
    rader: '224-226'
    lydelse: "Satsa på kärnkraften med långsiktiga villkor att utvecklas. Förläng befintliga reaktorers drift och bygg ut med nya reaktorer."
  - id: KD-038
    parti: KD
    sida: 9
    rader: '227-229'
    lydelse: "Inför en “stötdämpare” i elskatten så att den sänks om elpriserna ökar."
  - id: KD-039
    parti: KD
    sida: 9
    rader: '230-231'
    lydelse: "Värna vattenkraften, både den storskaliga och småskaliga."
  - id: KD-040
    parti: KD
    sida: 9
    rader: '232-236'
    lydelse: "Bygg ut vindkraften men med respekt för den lokala demokratin och anpassa storleken efter lokala villkor. Vindkraft kan dock bara vara ett komplement."
  - id: KD-041
    parti: KD
    sida: 9
    rader: '237-239'
    lydelse: "Regeländringar och kostnadslättnader för svenskt lantbruk för att öka Sveriges självförsörjning och stärka lantbrukets konkurrenskraft."
  - id: KD-042
    parti: KD
    sida: 10
    rader: '241-248'
    lydelse: "Sveriges äldre och pensionärer förtjänar bättre. De som byggt Sverige är värda en ekonomi och omsorg som ger både trygghet och frihet. Sverige ska ha en äldreomsorg i världsklass. Det kräver att personalen i äldreomsorgen har goda villkor, att de äldre ska garanteras ett tryggt boende och att äldres möjligheter till gemenskap stärks. Vi vill bygga ett samhälle där människor kan åldras i trygghet och värdighet utan åldersdiskriminering. Sveriges äldre förtjänar en bättre politik."
  - id: KD-043
    parti: KD
    sida: 11
    rader: '251'
    lydelse: "Sänkt skatt på pension."
  - id: KD-044
    parti: KD
    sida: 11
    rader: '252-253'
    lydelse: "Skattelättnad för äldre (69+) som vill och kan fortsätta arbeta."
  - id: KD-045
    parti: KD
    sida: 11
    rader: '254-260'
    lydelse: "Gör det möjligt att arbeta längre och mer flexibelt för den som kan genom att förlänga rätten att arbeta (LAS-åldern) i två steg till 75 års ålder, med ömsesidig rätt att minska arbetstiden till 50%. Ta samtidigt bort arbetsgivaravgiften helt från 69 år."
  - id: KD-046
    parti: KD
    sida: 11
    rader: '261-262'
    lydelse: "Inför trygghetsersättning, för dem som har ett fåtal år kvar till pensionen men som slitit ut kroppen."
  - id: KD-047
    parti: KD
    sida: 11
    rader: '263'
    lydelse: "Höjd garantipension och höjt bostadstillägg för pensionärer."
  - id: KD-048
    parti: KD
    sida: 11
    rader: '264'
    lydelse: "Fler trygghetsboenden, gemenskapsboenden för äldre."
  - id: KD-049
    parti: KD
    sida: 11
    rader: '265-267'
    lydelse: "Förbättrade villkor för personalen i äldreomsorgen - bort med delade turer."
  - id: KD-050
    parti: KD
    sida: 11
    rader: '268-269'
    lydelse: "Ökad medicinsk kompetens inom äldreomsorgen."
  - id: KD-051
    parti: KD
    sida: 11
    rader: '270-272'
    lydelse: "Tid och resurser till demensvården och ökade kunskaper om demenssjukdomar och psykisk ohälsa hos äldre."
  - id: KD-052
    parti: KD
    sida: 11
    rader: '273-276'
    lydelse: "Bryt äldres ofrivilliga ensamhet och isolering genom äldresamtal i alla kommuner, gemenskapsfrämjande insatser i omsorgen samt digitala hjälpmedel."
  - id: KD-053
    parti: KD
    sida: 11
    rader: '277-278'
    lydelse: "Stärkt tandvård för äldre bland annat genom att sänka högkostnadsskyddet för tandvård."
  - id: KD-054
    parti: KD
    sida: 11
    rader: '279-281'
    lydelse: "Säkerställ att personal inom hemtjänst och äldreboenden har möjlighet till kontinuerlig kompetensutveckling."
  - id: KD-055
    parti: KD
    sida: 12
    rader: '286-287'
    lydelse: "Fyra prioriterade områden. Men vi går också till val på förslag som rör andra viktiga områden. Förslag för"
  - id: KD-056
    parti: KD
    sida: 12
    rader: '302-304'
    lydelse: "Vill du läsa mer om våra förslag eller om vår politik på alla politikområden, läs mer på kristdemokraterna.se"
  - id: MP-001
    parti: MP
    sida: 3
    rader: '5'
    lydelse: "Vi är Miljöpartiet de gröna."
  - id: MP-002
    parti: MP
    sida: 3
    rader: '8'
    lydelse: "solidaritet med djur, natur och det ekologiska systemet"
  - id: MP-003
    parti: MP
    sida: 3
    rader: '9'
    lydelse: "solidaritet med kommande generationer"
  - id: MP-004
    parti: MP
    sida: 3
    rader: '10'
    lydelse: "solidaritet med världens alla människor"
  - id: MP-005
    parti: MP
    sida: 3
    rader: '11-14'
    lydelse: "Det är mycket i Sverige och världen som hotar vårt samhälle och vår framtid. Klimatförändringarna påverkar redan människors liv i hela världen, med torka, skyfall och extrema väder. Miljoner tvingas fly på grund av krig och konflikter i Europa och världen. Högerextrema rörelser slår tillbaka mot allt vi uppnått i fråga om jämställdhet, demokrati, tolerans och lika rättigheter för alla. I Sverige har orättvisorna och klyftorna mellan rik och fattig vuxit sig allt större."
  - id: MP-006
    parti: MP
    sida: 3
    rader: '15-18'
    lydelse: "Men vi är Miljöpartiet de gröna. Vi ser sambanden och vårt arbete ger resultat. Vi har beslutat om världens mest ambitiösa klimatmål, gjort utsläppen dyrare för industrin i hela Europa och fått fart på omställningen till sol- och vindkraft. Vi har förbättrat villkoren för dem som har det sämst ställt. Vi ger plats åt dem som behöver skydd. Vi värnar allas rätt att vara den man är och älska den man vill. I det nya gröna folkhemmet sätter vi satsningar framför restriktioner, och ser möjligheter istället för hot."
  - id: MP-007
    parti: MP
    sida: 3
    rader: '19-21'
    lydelse: "Vi har kämpat i över 40 år. Vi behöver dig i kampen. Tillsammans ska vi klara klimatet, skydda naturen och stå upp för medmänsklighet, jämlikhet och demokrati. Tillsammans ska vi bygga ett grönt, modernt Sverige för framtiden. Det nya gröna folkhemmet. Ett hållbart samhälle formar vi tillsammans. Alla ska med när Sverige ställer om."
  - id: MP-008
    parti: MP
    sida: 3
    rader: '23-28'
    lydelse: "Världen är i ett klimatnödläge och omställningen från fossila bränslen måste ske i rekordfart. Vi har lösningarna för att skapa en framtid att längta till, för att bygga ett nytt grönt folkhem - tillsammans. I vårt Sverige får vi vår energi från solen och vinden, tar hand om naturen och varandra. Vi ger varje invånare frihet, möjligheter och en stark välfärd. Den som har det gott ställt ska bidra mer än den som har små marginaler."
  - id: MP-009
    parti: MP
    sida: 3
    rader: '30-31'
    lydelse: "investera minst 100 miljarder per år i att ställa om så att Sverige blir ett fossilfritt välfärdsland senast år 2030."
  - id: MP-010
    parti: MP
    sida: 3
    rader: '32'
    lydelse: "ta fram en svensk utsläppsbudget som gör att vi når klimatmålen."
  - id: MP-011
    parti: MP
    sida: 3
    rader: '33-34'
    lydelse: "införa en omställningslag så att all industri fasar ut kol, olja och fossilgas till senast 2030."
  - id: MP-012
    parti: MP
    sida: 3
    rader: '35'
    lydelse: "fasa ut fossila subventioner."
  - id: MP-013
    parti: MP
    sida: 3
    rader: '36-37'
    lydelse: "att biståndet ska hjälpa till att bygga hållbara, klimatsmarta samhällen, skydda hav, främja biologisk mångfald och ekosystemtjänster."
  - id: MP-014
    parti: MP
    sida: 3
    rader: '38-41'
    lydelse: "att de med mest pengar, som också orsakar större utsläpp, ska bidra mer till omställningen och välfärden genom en progressiv beskattning av kapital. De med minst resurser ska få mer samhällsservice, lägre skatt och mer stöd i omställningen."
  - id: MP-015
    parti: MP
    sida: 3
    rader: '42-43'
    lydelse: "höja priset på utsläppsrätter i EU, inkludera utsläpp från flyg och sjöfart i systemet och införa klimattullar på varor från länder utanför EU."
  - id: MP-016
    parti: MP
    sida: 4
    rader: '45-51'
    lydelse: "Putins invasion av Ukraina visar tydligt hur viktigt det är att Sverige och EU blir mindre beroende av att importera energi. Mängder med ny energi krävs också för att bygga det nya gröna folkhemmet. Solenergi och vindkraft är idag de överlägset billigaste, snabbaste och säkraste sätten att bygga ut vår energiproduktion. Kärnkraften tar minst 15 år att bygga, kräver hundratals miljarder av staten i investeringar och har enorma säkerhetsrisker. Om vi vill ge hushåll, företag och industrier billig el i närtid och en säkrare värld, då måste framtiden vara förnybar!"
  - id: MP-017
    parti: MP
    sida: 4
    rader: '53-54'
    lydelse: "bygga ut vindkraften till havs snabbt i hela landet, med hänsyn till livet i havet. Ge rejäl ekonomisk återbäring till de kommuner där det byggs och finns vindkraft."
  - id: MP-018
    parti: MP
    sida: 4
    rader: '55'
    lydelse: "införa ett kraftfullt stöd för energieffektivisering till både hushåll och industrier."
  - id: MP-019
    parti: MP
    sida: 4
    rader: '56'
    lydelse: "storsatsa på solceller och solvärme."
  - id: MP-020
    parti: MP
    sida: 4
    rader: '57'
    lydelse: "bygga ut elnäten, investera i energilager och satsa på ett smart energisystem."
  - id: MP-021
    parti: MP
    sida: 4
    rader: '58'
    lydelse: "helt ta bort energiskatten för företag som producerar el för eget bruk."
  - id: MP-022
    parti: MP
    sida: 4
    rader: '60-68'
    lydelse: "Den svenska naturen är fantastisk men den behöver vår hjälp. Idag hotas arter av utrotning och hela skogar, stränder, våtmarker och andra naturmiljöer riskerar att förstöras på grund av kortsiktigt tänkande och vinningslystnad. Också allemansrätten hotas av ekonomiska intressen. Vi vill att både du och dina barn ska kunna njuta av våra sandstränder, bada i rent vatten, vandra i skogen och veta att det finns många olika djurarter som mår bra i Sveriges natur. För oss människor ger naturen avkoppling och återhämtning, och en levande natur bidrar till att hejda klimatförändringarna. Att skydda djur, natur och ekosystem är avgörande för oss alla, och för vår framtid. Naturens starkaste skydd är människor som älskar den."
  - id: MP-023
    parti: MP
    sida: 4
    rader: '70'
    lydelse: "att Sverige verkar för en ekocidlagstiftning."
  - id: MP-024
    parti: MP
    sida: 4
    rader: '71-72'
    lydelse: "skydda 30 procent av Sveriges natur, bland annat våra unika sammanhängande fjällskogar och skyddsvärda skogar i hela landet."
  - id: MP-025
    parti: MP
    sida: 4
    rader: '73'
    lydelse: "återställa våtmarker som torrlagts i snabbare takt."
  - id: MP-026
    parti: MP
    sida: 4
    rader: '74'
    lydelse: "att mer skogsbruk bedrivs med hyggesfria metoder."
  - id: MP-027
    parti: MP
    sida: 4
    rader: '75'
    lydelse: "ge mer pengar till friluftsorganisationerna så att fler kan njuta av svensk natur."
  - id: MP-028
    parti: MP
    sida: 4
    rader: '76'
    lydelse: "investera i mer natur och grönska i städer och tätorter."
  - id: MP-029
    parti: MP
    sida: 4
    rader: '77'
    lydelse: "försvara allemansrätten och stärka strandskyddet."
  - id: MP-030
    parti: MP
    sida: 4
    rader: '78'
    lydelse: "rädda kustens ekosystem - återskapa förstörda miljöer ."
  - id: MP-031
    parti: MP
    sida: 4
    rader: '79-80'
    lydelse: "låt ekosystemen i haven sätta gränserna för hur mycket fisk som får fångas, inför en ekosystembaserad havsförvaltning och gå över till skonsamma fiskemetoder."
  - id: MP-032
    parti: MP
    sida: 4
    rader: '81'
    lydelse: "skydda minst 30 procent av världens hav."
  - id: MP-033
    parti: MP
    sida: 4
    rader: '82-83'
    lydelse: "ge mer stöd till lantbruket för omställning till ekologisk odling, återskapande av naturbetesmarker och andra miljöinsatser."
  - id: MP-034
    parti: MP
    sida: 4
    rader: '85-91'
    lydelse: "Transporterna står idag för en tredjedel av Sveriges klimatutsläpp. Trafikens utsläpp måste minska om vi ska ha en chans att klara klimatmålen. Oavsett om du bor i en stad eller på landsbygden, ska ta dig till jobbet eller åka på semester, så ska det vara billigt och enkelt att välja det klimatsmarta sättet att resa. Med utbyggd tåg- och kollektivtrafik, bättre tågförbindelser till Europa, fler och bättre cykelvägar och billigare elbilar, kommer du både kunna pendla och upptäcka världen med omsorg om vår planet."
  - id: MP-035
    parti: MP
    sida: 5
    rader: '93-94'
    lydelse: "bygga ut och rusta upp järnvägsnätet för snabba tåg i hela landet och skynda på bygget av nya stambanor för höghastighetståg."
  - id: MP-036
    parti: MP
    sida: 5
    rader: '95-96'
    lydelse: "säkra och utveckla nattågstrafiken i hela Sverige och knyt oss närmare våra nordiska grannländer och övriga Europa med fler avgångar."
  - id: MP-037
    parti: MP
    sida: 5
    rader: '97-98'
    lydelse: "bygga ut kollektivtrafiken i hela landet, och gör det billigare att åka buss och tåg, särskilt för unga och pensionärer."
  - id: MP-038
    parti: MP
    sida: 5
    rader: '99'
    lydelse: "minska bilåkandet i storstäderna och främja gång-, cykel- och kollektivtrafik."
  - id: MP-039
    parti: MP
    sida: 5
    rader: '100-101'
    lydelse: "investera i laddning i hela landet - staten ska ta ansvar där marknaden inte räcker till, så att bilar och lastbilar kan köra på el oavsett vart i landet de ska."
  - id: MP-040
    parti: MP
    sida: 5
    rader: '102-103'
    lydelse: "att den som behöver bil ska ha råd med ett klimatsmart alternativ, och att bara fossilfria bilar ska säljas från 2025."
  - id: MP-041
    parti: MP
    sida: 5
    rader: '104-106'
    lydelse: "minska flygets utsläpp - höja flygskatten, minska flygresandet och skynda på omställningen till förnybara bränslen, elektrobränslen och elflyg för de flygresor som inte kan ersättas på annat sätt. Staten borde sälja SAS och investera pengarna i järnväg."
  - id: MP-042
    parti: MP
    sida: 5
    rader: '108-111'
    lydelse: "Vårt köp- och slängsamhälle bränner ut både planeten och mångas ekonomi. Den ohållbara konsumtionen hotar också mänskliga rättigheter och skapar dåliga arbetsvillkor. Vi vill skapa en delningsekonomi, där det vi köper håller längre, och går att reparera till lägre kostnad."
  - id: MP-043
    parti: MP
    sida: 5
    rader: '113-114'
    lydelse: "sänka momsen kraftigt på bilpooler och andra delningstjänster och underlätta för de som vill dela, istället för äga, en bil."
  - id: MP-044
    parti: MP
    sida: 5
    rader: '115'
    lydelse: "förbjuda produkter som är tillverkade för att gå sönder i förtid."
  - id: MP-045
    parti: MP
    sida: 5
    rader: '116'
    lydelse: "ställa lagkrav på att produkter ska vara enkla och billiga att reparera och uppdatera."
  - id: MP-046
    parti: MP
    sida: 5
    rader: '117'
    lydelse: "fasa ut giftiga ämnen omgående, speciellt från produkter för barn."
  - id: MP-047
    parti: MP
    sida: 5
    rader: '119-121'
    lydelse: "Djur ska leva sina liv fritt från lidande och stress, och så nära sina naturliga beteenden som möjligt. Djurskyddet i EU måste skärpas rejält. Miljöpartiet kräver ett verkligt djurskydd, en hög djurvälfärd och stopp för onödiga djurförsök."
  - id: MP-048
    parti: MP
    sida: 5
    rader: '123'
    lydelse: "stänga minkfarmerna."
  - id: MP-049
    parti: MP
    sida: 5
    rader: '124'
    lydelse: "förbjuda burhållning av höns."
  - id: MP-050
    parti: MP
    sida: 5
    rader: '125'
    lydelse: "minimera djurs lidande vid transport och slakt."
  - id: MP-051
    parti: MP
    sida: 5
    rader: '126-127'
    lydelse: "minska användningen av antibiotika i djurhållningen och införa en skatt på kött som producerats med hög antibiotikaanvändning."
  - id: MP-052
    parti: MP
    sida: 5
    rader: '129-133'
    lydelse: "Samhällets skyddsnät räcker inte till. Det visar sig snabbt för den som till exempel förlorar jobbet, blir långvarigt sjuk eller behöver vårda en närstående. Så ska det inte vara. Ett starkt samhälle betyder att vi hjälper varandra igenom svåra perioder, och att de med mest pengar bidrar mer. De med minst resurser behöver en starkare ekonomi för att kunna välja sina liv själva."
  - id: MP-053
    parti: MP
    sida: 6
    rader: '134-137'
    lydelse: "Vi vill bygga skyddsnäten starka så att alla kan vara trygga och ingen lämnas utanför. I det nya gröna folkhemmet ska inte ett enda barn växa upp i fattigdom, inte en enda äldre stå utan en pension som går att leva på, och ingen tvingas jobba trots att man är sjuk. Ingen ska heller vara utan jobb för att rätt sorts hjälpmedel inte finns att tillgå på arbetsplatsen."
  - id: MP-054
    parti: MP
    sida: 6
    rader: '139'
    lydelse: "höja den lägsta nivån i sjuk- och aktivitetsersättningarna."
  - id: MP-055
    parti: MP
    sida: 6
    rader: '140-141'
    lydelse: "höja garantipensionen och reformera pensionssystemet med syfte att höja pensionerna, mest för de med de lägsta pensionerna."
  - id: MP-056
    parti: MP
    sida: 6
    rader: '142'
    lydelse: "höja bostadsbidraget för barnfamiljer och bostadstillägget för pensionärer."
  - id: MP-057
    parti: MP
    sida: 6
    rader: '143'
    lydelse: "höja studiestödet och förbättra studenters a-kassa och sjukförsäkring."
  - id: MP-058
    parti: MP
    sida: 6
    rader: '144-145'
    lydelse: "förändra sjukförsäkringen så den ger bättre trygghet vid sjukskrivning och se till att människor inte bollas mellan myndigheter när de behöver samhällets stöd."
  - id: MP-059
    parti: MP
    sida: 6
    rader: '146'
    lydelse: "slopa karensdagen i sjukförsäkringen."
  - id: MP-060
    parti: MP
    sida: 6
    rader: '147'
    lydelse: "korta arbetstiden så att fler människor orkar jobba ett helt arbetsliv."
  - id: MP-061
    parti: MP
    sida: 6
    rader: '149-153'
    lydelse: "Alla behöver ett hem. Det nya gröna folkhemmet ska byggas med klimatsmarta bostäder till låga kostnader, så alla får möjlighet att skapa sig ett eget hem, på egen hand eller tillsammans med andra. Det vi bygger ska vara trivsamt och tryggt för människor, med god arkitektur och grönska. Det ska inte krävas rika föräldrar eller ett stort arv för att kunna få en bostad."
  - id: MP-062
    parti: MP
    sida: 6
    rader: '155'
    lydelse: "bygga fler klimatsmarta hyresrätter med rimliga hyror, utveckla och utöka investeringsstödet som gjorde det billigare att bygga och se till att fler kan äga sin bostad."
  - id: MP-063
    parti: MP
    sida: 6
    rader: '156-158'
    lydelse: "minska hemlösheten, genom en nationell strategi som på riktigt minskar hemlösheten och en bostadsstiftelse som finansierar en bostad för dem som inte har ett tryggt boende."
  - id: MP-064
    parti: MP
    sida: 6
    rader: '159-160'
    lydelse: "stoppa renovräkningar. Renovering ska inte vara så lyxig att människor måste vräkas från sina hem. Vi vill stärka hyresgästernas ställning vid renovering."
  - id: MP-065
    parti: MP
    sida: 6
    rader: '161-162'
    lydelse: "införa ett rot-stöd för hyresrätter och stimulera hållbar renovering genom statligt långsiktigt stöd."
  - id: MP-066
    parti: MP
    sida: 6
    rader: '164-168'
    lydelse: "Du ska ha rätt till en bra vård, oavsett var i landet du bor. Att man ska kunna föda barn på ett tryggt sätt i hela landet tycker vi är en självklarhet. Under pandemin applåderade vi vårdpersonalens insatser, men det är hög tid att också uppvärdera vård- och omsorgsyrkena. I ett jämställt samhälle ska kvinnors arbete värderas lika högt som mäns, och arbetsmiljön vara hållbar hela livet."
  - id: MP-067
    parti: MP
    sida: 6
    rader: '170'
    lydelse: "höja lönerna och säkra en god arbetsmiljö i vården."
  - id: MP-068
    parti: MP
    sida: 6
    rader: '171'
    lydelse: "förbättra förlossningsvården och satsa på barnmorskorna."
  - id: MP-069
    parti: MP
    sida: 6
    rader: '172'
    lydelse: "förbättra vård och omsorg för äldre och stärka resurserna till hemsjukvården."
  - id: MP-070
    parti: MP
    sida: 6
    rader: '173-174'
    lydelse: "att tandvården ska jämställas med övrig hälso- och sjukvård, och ingå i samma högkostnadsskydd."
  - id: MP-071
    parti: MP
    sida: 6
    rader: '175'
    lydelse: "att hjälpmedel ska ingå i högkostnadsskyddet."
  - id: MP-072
    parti: MP
    sida: 6
    rader: '176'
    lydelse: "satsa på primärvården och öka tillgången till vård för psykisk ohälsa."
  - id: MP-073
    parti: MP
    sida: 6
    rader: '177'
    lydelse: "korta köerna till behandling i hela landet."
  - id: MP-074
    parti: MP
    sida: 7
    rader: '178'
    lydelse: "att preventivmedel ska vara avgiftsfritt upp till 26 år."
  - id: MP-075
    parti: MP
    sida: 7
    rader: '179-181'
    lydelse: "förbättra stödet för personer med funktionsnedsättning och sällsynta diagnoser oavsett var du bor i landet. Den som har rätt till stöd ska inte behöva planera sitt liv flera veckor i förväg för att ha ett fullvärdigt liv."
  - id: MP-076
    parti: MP
    sida: 7
    rader: '183-186'
    lydelse: "Skolan ska ge varje barn möjlighet att lära sig, utvecklas och växa. I det nya gröna folkhemmet fördelas resurserna till skola och förskola efter behov så att varje barn klarar sin utbildning och mår bra. Vinstintressen hör inte hemma i skolan när varje unge ska med."
  - id: MP-077
    parti: MP
    sida: 7
    rader: '188'
    lydelse: "sätta stopp för vinstjakten i skolan."
  - id: MP-078
    parti: MP
    sida: 7
    rader: '189'
    lydelse: "bryta skolsegregationen och göra skolvalet fritt och rättvist för alla."
  - id: MP-079
    parti: MP
    sida: 7
    rader: '190-191'
    lydelse: "göra det attraktivt att vara lärare genom att säkra höjda löner och en god arbetsmiljö i skolan."
  - id: MP-080
    parti: MP
    sida: 7
    rader: '192-193'
    lydelse: "förstärka elevhälsan och satsa på fler skolsköterskor, specialpedagoger, psykologer och kuratorer i skolan."
  - id: MP-081
    parti: MP
    sida: 7
    rader: '194-195'
    lydelse: "satsa mer på fritidshemmen och se till att även de barn vars föräldrar inte arbetar får tillgång till fritids."
  - id: MP-082
    parti: MP
    sida: 7
    rader: '196'
    lydelse: "satsa på mindre barngrupper och mer personal i förskolan."
  - id: MP-083
    parti: MP
    sida: 7
    rader: '198-201'
    lydelse: "Coronapandemin slog hårt mot kulturen. Vi vill bygga ett starkare kulturliv som fler har tillgång till - i hela landet. Barns kultur ska särskilt värnas. Kulturpolitiken ska grundas på respekt för den konstnärliga friheten och yttrandefriheten och stimulera en mångfald av kulturella uttryck."
  - id: MP-084
    parti: MP
    sida: 7
    rader: '203-204'
    lydelse: "satsa på en bred återhämtningsplan för kulturlivet i hela landet, som omfattar både offentliga, fria, professionella och ideella aktörer."
  - id: MP-085
    parti: MP
    sida: 7
    rader: '205'
    lydelse: "stärka kulturskolan och inrätta en kulturskolelag."
  - id: MP-086
    parti: MP
    sida: 7
    rader: '206-207'
    lydelse: "satsa på barns kultur i skolan, med utbildad personal på alla skolbibliotek och estetiska ämnen i alla gymnasieprogram."
  - id: MP-087
    parti: MP
    sida: 7
    rader: '208-209'
    lydelse: "förbättra kulturskaparnas ekonomiska och sociala villkor och modernisera upphovsrätten så att kulturskaparnas rättigheter värnas."
  - id: MP-088
    parti: MP
    sida: 7
    rader: '210'
    lydelse: "stärka biblioteken i deras viktiga arbete för läsning och demokrati."
  - id: MP-089
    parti: MP
    sida: 7
    rader: '212-214'
    lydelse: "Den svenska demokratin är stark och livskraftig, men vi får aldrig ta den för given. Det fria ordet, minoriteters rättigheter och skydd mot diskriminering är viktiga för demokratisk utveckling, tillsammans med en stark och oberoende rättsstat."
  - id: MP-090
    parti: MP
    sida: 7
    rader: '216'
    lydelse: "skydda Sveriges grundlag mot snabba förändringar."
  - id: MP-091
    parti: MP
    sida: 7
    rader: '217'
    lydelse: "förstärka yttrandefriheten och stödja oberoende medier i hela landet."
  - id: MP-092
    parti: MP
    sida: 7
    rader: '218-220'
    lydelse: "stärka nationella minoriteters och urfolket samernas rättigheter och att Sverige ska förbinda sig att följa den internationella konventionen om urfolks rättigheter (ILO 169)."
  - id: MP-093
    parti: MP
    sida: 7
    rader: '221'
    lydelse: "skydda ett oberoende public service i grundlagen."
  - id: MP-094
    parti: MP
    sida: 8
    rader: '223-226'
    lydelse: "Kvinnor ska kunna leva sina liv i trygghet. Ingen ska begränsas av hedersförtryck och våld, det är förövarens frihet som ska begränsas. Samtycke kan inte köpas. Kvinnor som brutit sig loss från destruktiva relationer ska få sina liv tillbaka. I vårt Sverige väger barns rätt till trygghet tyngre än våldsamma föräldrars rätt till sina barn."
  - id: MP-095
    parti: MP
    sida: 8
    rader: '228-230'
    lydelse: "skapa en dörr ut för våldsutsatta i hela landet, så att ansvaret för skydd, boende och vård samordnas direkt efter uppbrottet. Även de med husdjur som de inte vågar lämna kvar hos förövaren, ska få den hjälp som krävs för att ta sig ur förhållandet."
  - id: MP-096
    parti: MP
    sida: 8
    rader: '231-232'
    lydelse: "skärpa samtyckeslagen så att det blir tydligt att prostitution inte innebär samtycke till sex."
  - id: MP-097
    parti: MP
    sida: 8
    rader: '233-234'
    lydelse: "stärka arbetet mot hedersrelaterat våld och förtryck så att likvärdig hjälp ges i hela landet."
  - id: MP-098
    parti: MP
    sida: 8
    rader: '235'
    lydelse: "skydda barn från att tvingas till umgänge med en våldsam förälder."
  - id: MP-099
    parti: MP
    sida: 8
    rader: '236-237'
    lydelse: "att våldsutsatta kvinnor som tvingas gömma sig ska få starkare skydd och att fler som utövar våld ska få fotboja."
  - id: MP-100
    parti: MP
    sida: 8
    rader: '239-246'
    lydelse: "Feminismen har inte alls gått för långt, som vissa påstår. Tvärtom, den måste gå längre. För trots att Sverige har hunnit en bra bit på vägen finns det mycket kvar att göra. Åt orättvisa löner, åt fördelningen av ansvar i hemmen, åt de olika förväntningarna på vad flickor och pojkar ska göra. I ett feministiskt samhälle värderas mäns och kvinnors arbete lika, även vid olika men likvärdiga arbetsuppgifter. Vi vill se ett samhälle där ägandet är jämnt fördelat mellan män och kvinnor, precis som ansvaret för barn och hem. I vårt nya gröna folkhem kan kvinnor leva gott på ålderns höst när livsinkomsterna matchar männens."
  - id: MP-101
    parti: MP
    sida: 8
    rader: '248-249'
    lydelse: "dubblera pappornas uttag av föräldraledighet - varje förälder ska ta ut minst en tredjedel av föräldradagarna."
  - id: MP-102
    parti: MP
    sida: 8
    rader: '250-251'
    lydelse: "höja lönerna i kvinnodominerade yrken till samma nivåer som i mansdominerade yrken med motsvarande ansvar och utbildningskrav."
  - id: MP-103
    parti: MP
    sida: 8
    rader: '252-253'
    lydelse: "att en samtyckeskultur ska genomsyra samhället - alla elever ska få en likvärdig sex- och samlevnadsundervisning, där samtycke står i fokus."
  - id: MP-104
    parti: MP
    sida: 8
    rader: '254-255'
    lydelse: "stärk utrikesfödda kvinnors etablering genom SFI kombinerad med praktik och yrkesutbildning och jämställda insatser från arbetsförmedlingen."
  - id: MP-105
    parti: MP
    sida: 8
    rader: '257-259'
    lydelse: "För Miljöpartiet är alla människors lika värde en självklarhet. I vårt Sverige ska ingen utsättas för rasism eller diskriminering på grund av till exempel tro, sexuell läggning eller funktionsvariation."
  - id: MP-106
    parti: MP
    sida: 8
    rader: '261-262'
    lydelse: "stärka lagstiftningen mot diskriminering och se över rätten till rättshjälp i diskrimineringsfall."
  - id: MP-107
    parti: MP
    sida: 8
    rader: '263'
    lydelse: "ta fram systematisk statistik för att belysa diskriminering och rasism i samhället."
  - id: MP-108
    parti: MP
    sida: 8
    rader: '264-265'
    lydelse: "stärka transpersoners rättigheter genom en ny könstillhörighetslag, och införa ett tredje juridiskt kön."
  - id: MP-109
    parti: MP
    sida: 8
    rader: '266-267'
    lydelse: "anpassa familjepolitiken så att den blir könsneutral och stärka rättigheterna för stjärnfamiljer, det vill säga alla olika typer av familjer."
  - id: MP-110
    parti: MP
    sida: 9
    rader: '268-269'
    lydelse: "stärka och utveckla läsa-skriva-räkna-garantin för att fler barn med funktionsnedsättning ska få insatser i tid."
  - id: MP-111
    parti: MP
    sida: 9
    rader: '270-272'
    lydelse: "att lagen om stöd och service till vissa funktionshindrade (LSS) förtydligas och statligt huvudmannaskap införs i den personliga assistansen så att människor får det stöd de behöver och har rätt till."
  - id: MP-112
    parti: MP
    sida: 9
    rader: '274-280'
    lydelse: "Det dödliga våldet har blivit en del av många människors vardag. Allt för många mödrar får se sina barn falla offer för skjutningar och gängkriminalitet. Att bryta våldsspiralen börjar med att ge varje barn som växer upp i Sverige tro på sig själv och sin framtid, och en utbildning som rustar för att att ta sig an den framtiden. Så vaccinerar vi våra barn mot gängens locktoner och gör det lättare att bryta sig fri från deras destruktiva liv. I det gröna folkhemmet ska det vara så svårt och olönsamt att bedriva organiserad brottslighet att gängen drar sig tillbaka."
  - id: MP-113
    parti: MP
    sida: 9
    rader: '282'
    lydelse: "storsatsa på det förebyggande arbetet i socioekonomiskt eftersatta områden."
  - id: MP-114
    parti: MP
    sida: 9
    rader: '283-284'
    lydelse: "se fler och bättre betalda poliser för att bekämpa den organiserade brottsligheten och för att motverka parallellsamhällen."
  - id: MP-115
    parti: MP
    sida: 9
    rader: '285-287'
    lydelse: "höja maxtiden för sluten ungdomsvård och förstärka vårdinsatser och utbildning under tiden den unge är frihetsberövad, samt införa en utslussningsverksamhet när straffet är avtjänat."
  - id: MP-116
    parti: MP
    sida: 9
    rader: '288-290'
    lydelse: "lätta på sekretessen mellan områdespoliser, skola, socialtjänst och stärka samarbetet med civilsamhälle så att inga barn faller mellan stolarna i det förebyggande arbetet."
  - id: MP-117
    parti: MP
    sida: 9
    rader: '291-295'
    lydelse: "stoppa finansieringen av de kriminella gängen genom att stärka myndighetssamverkan så att myndigheterna kan slå till mot den organiserade brottslighetens företag från flera håll: svartklubbar och gästarbetarbostäder utan bygglov, restauranger som missköter hygien, skattebrott och varenda spelautomat som saknar tillstånd. Det ska vara dyrt, jobbigt och svårt att vara kriminell."
  - id: MP-118
    parti: MP
    sida: 9
    rader: '297-302'
    lydelse: "I klimatförändringens spår följer allt fler extrema väderhändelser, som torka, stormar och översvämningar. Den ryska invasionen av Ukraina har fört kriget till Europa och drivit miljoner människor på flykt. Sverige måste höja beredskapen för att möta den nya tidens hot. När kriser inträffar påverkar det oss alla i vardagen. Vi har lärt oss mycket av de senaste årens kriser och nu ska vi rusta Sverige för att stå starkt oavsett vad som händer."
  - id: MP-119
    parti: MP
    sida: 9
    rader: '304-305'
    lydelse: "satsa en större andel av försvarets pengar på det civila försvaret, och öka anslagen till krisberedskap."
  - id: MP-120
    parti: MP
    sida: 9
    rader: '306'
    lydelse: "investera i klimatanpassning för att möta effekterna av klimatförändringarna."
  - id: MP-121
    parti: MP
    sida: 9
    rader: '307'
    lydelse: "anpassa äldreboenden, skolor och förskolor för att klara skyfall och hetta."
  - id: MP-122
    parti: MP
    sida: 9
    rader: '308-309'
    lydelse: "införa en civiltjänstgöring som komplement till värnplikten för att ge fler den kunskap och träning som behövs i kris."
  - id: MP-123
    parti: MP
    sida: 9
    rader: '310-312'
    lydelse: "stärka det svenska jordbruket för ökad självförsörjning med baslivsmedel, och stödja övergången till ett ekologiskt och hållbart jordbruk med fossiloberoende arbetsmaskiner."
  - id: MP-124
    parti: MP
    sida: 10
    rader: '313-314'
    lydelse: "stärka skyddet av våra dricksvattentäkter och se till att det finns fungerande reservvattentäkter."
  - id: MP-125
    parti: MP
    sida: 10
    rader: '316-325'
    lydelse: "Sverige är en del av världen, och vi ska bidra till att världen blir säkrare, fredligare och mer jämställd. Svenskt bistånd har gjort stor skillnad i många länder och ger flickor och kvinnor bättre förutsättningar att få bestämma över sina liv och sina kroppar. Det är skamligt att skära ned biståndet och istället använda det till statens kostnader för flyktingmottagande. Därför ska inga pengar flyttas över från biståndet till flyktingmottagandet. Det allvarliga säkerhetsläget i Europa efter Rysslands invasion av Ukraina och effekterna av klimatförändringarna gör det ännu viktigare med nära samarbeten med andra länder. Samtidigt vill vi att Sverige behåller sin militära alliansfrihet för att kunna fortsätta arbeta mot kärnvapen, för nedrustning och kunna bedriva en självständig utrikespolitik där vi står upp för mänskliga rättigheter."
  - id: MP-126
    parti: MP
    sida: 10
    rader: '327-329'
    lydelse: "att mer än 1 procent av Sveriges bruttonationalinkomst fortsatt ska gå till bistånd, att biståndet ska styras av principer om effektivitet och fattigdomsbekämpning och inte villkoras mot Sveriges inrikespolitiska intressen."
  - id: MP-127
    parti: MP
    sida: 10
    rader: '330'
    lydelse: "utveckla och förstärka Sveriges feministiska utrikes- och utvecklingspolitik."
  - id: MP-128
    parti: MP
    sida: 10
    rader: '331-333'
    lydelse: "att utvecklingssamarbetet ska bidra till att bekämpa fattigdom, förebygga och hantera klimatförändringarna, bevara och skapa fred, förebygga konflikter, bygga upp demokratiska samhällen och motverka korruption."
  - id: MP-129
    parti: MP
    sida: 10
    rader: '334-335'
    lydelse: "ratificera konventionen om kärnvapenförbud och arbeta för ett totalförbud mot att använda autonoma vapensystem."
  - id: MP-130
    parti: MP
    sida: 10
    rader: '336'
    lydelse: "införa en lag som förbjuder kärnvapen på svensk mark."
  - id: MP-131
    parti: MP
    sida: 10
    rader: '337-338'
    lydelse: "inte att Sverige ska anpassa sin utrikespolitik efter auktoritära staters krav för kunna att bli medlem i Nato och Sverige ska inte börja sälja vapen till Turkiet."
  - id: MP-132
    parti: MP
    sida: 10
    rader: '340-344'
    lydelse: "Krig och konflikter fortsätter härja i världen. Allt fler vill nu stänga dörrarna för dem som tvingas fly. Det gör inte vi. Den som flyr ska ha fler lagliga vägar för att ta sig till säkerhet. Den som har rätt till asyl ska välkomnas och ges möjlighet att etablera sig i Sverige. Barnperspektivet ska genomsyra migrationslagarna, och Sverige ska ta vara på den stora kraft som finns i nya invånares vilja att delta i samhället."
  - id: MP-133
    parti: MP
    sida: 10
    rader: '346'
    lydelse: "försvara asylrätten och kvotflyktingsystemet."
  - id: MP-134
    parti: MP
    sida: 10
    rader: '347-348'
    lydelse: "att fler familjer ska kunna återförenas i Sverige. Inga asylsökande barn ska kunna skiljas från sina föräldrar."
  - id: MP-135
    parti: MP
    sida: 10
    rader: '349'
    lydelse: "att barn på flykt ska få permanent uppehållstillstånd."
  - id: MP-136
    parti: MP
    sida: 10
    rader: '350-351'
    lydelse: "stärka rättssäkerheten i asylprocessen och stödet för hbtqi-flyktingar och andra sårbara grupper."
  - id: MP-137
    parti: MP
    sida: 10
    rader: '352-353'
    lydelse: "korta handläggningstiderna för arbetstillstånd och asylbeslut så att det går fortare att komma in i samhället."
  - id: MP-138
    parti: MP
    sida: 10
    rader: '354-355'
    lydelse: "förlänga etableringsprogrammet för nyanlända till minst fyra år för att skapa bättre förutsättningar för etablering, så att fler kommer i arbete snabbare."
  - id: L-001
    parti: L
    sida: 2
    rader: '8-9'
    lydelse: "Jag heter Johan Pehrson och är partiledare för Liberalerna. Vill du som jag byta riktning och regering i vårt land? Då finns det bara ett liberalt parti att rösta på."
  - id: L-002
    parti: L
    sida: 2
    rader: '10-12'
    lydelse: "Liberalerna är partiet som sätter skolan först och har lösningarna på segregationen och otryggheten. Vi är partiet som vet att mer kunskap i skolan i dag hindrar brotten och skapar jobben i morgon. Och vi är partiet som vet att klimathotet måste mötas med teknik och framtidstro."
  - id: L-003
    parti: L
    sida: 2
    rader: '13-17'
    lydelse: "Liberalerna är Sveriges kunskapsparti. I dag går 16 000 elever varje år ut skolan utan tillräckliga kunskaper. Det vill vi liberaler ändra på. Det kräver ordning och arbetsro i varje klassrum. Och det kräver att ansvaret och finansieringen för skolan blir statens ansvar i stället för att vara en uppgift spridd på 290 kommuner. Det kräver en ny friskolereform där valfriheten för elever och föräldrar försvaras, men vinstjakt och kortsiktiga klippare stoppas."
  - id: L-004
    parti: L
    sida: 2
    rader: '18-24'
    lydelse: "Liberalerna är även Sveriges integrationsparti. I dag bor en halv miljon människor i utsatta områden där kriminella gäng har tagit över, skolresultaten viker, ojämställdheten slagit rot och arbetslösheten brett ut sig. Medan regeringen tror att det går att blanda bort integrationsproblemet säger vi att Sveriges utsatta områden måste förändras på riktigt. Nu måste polisen få verktygen att överallt upprätthålla lag och ordning, så att alla kan känna sig trygga i sina kvarter var de än bor. Nu måste människors egen kraft tas till vara genom att fler som kommit till Sverige jobbar, lär sig svenska och bidrar i stället för att gå på bidrag. Alla barn i Sverige ska växa upp med vuxna förebilder som går till jobbet. Att ställa krav - det är att bry sig."
  - id: L-005
    parti: L
    sida: 2
    rader: '25-28'
    lydelse: "Och Liberalerna är Sveriges gröna borgerliga parti. Vi vet att klimatet är vår tids ödesfråga och måste mötas därefter. Med en omställning med nya kärnkraftverk och en autobahn för all ny grön el som förbättrar överföringen i hela Sverige - i stället för nedlagd kärnkraft och rekordhöga elpriser. Och med elektrifiering av transporter och industri, ny teknik och tillväxt i stället för plakatpolitik och nya symbolskatter. Med en klimatomställning som går hand i hand med naturvård och biologisk mångfald."
  - id: L-006
    parti: L
    sida: 2
    rader: '29-31'
    lydelse: "Liberalerna är partiet för dig som inte är nöjd med vad Sverige är efter åtta år på fel kurs, men som heller inte längtar tillbaka till något som Sverige aldrig har varit. Vi är partiet för dig som tror på Sverige som land, samtidigt som Sverige aldrig ska svikta i stödet för friheten i vår omvärld som nu när Ukraina utsätts för ett grymt erövringskrig."
  - id: L-007
    parti: L
    sida: 3
    rader: '33-34'
    lydelse: "Vi är partiet för dig som vill se en borgerlig statsminister som genomför liberal politik. I stället för en svag regering som gör för lite, för rött och för sent."
  - id: L-008
    parti: L
    sida: 3
    rader: '35-39'
    lydelse: "Vi är alternativet för dig som tycker att Sverige behöver fler som tar eget ansvar och färre politiker som försöker skylla segregation, skjutningar och kökaos på någon annan. Partiet för dig som vill göra rätt för dig och förväntar dig att andra ska göra rätt för sig, och som vet att livets lotter faller olika och därför vill se ett Sverige där segregationen är mindre och möjligheterna fler för var och en. Partiet för den ansvarskännande breda medelklassen, om du så vill."
  - id: L-009
    parti: L
    sida: 3
    rader: '40-43'
    lydelse: "Det finns de som menar att vi för ofta pratar om medelklassen och dess villkor. Men det behövs i tider när priserna stiger och otryggheten sprider sig. Vi i Liberalerna är alternativet om du som jag försöker leva ett vanligt medelklassliv och vill att samhället helt enkelt ska fungera och att vägen till det livet ska vara öppen för fler som arbetar och anstränger sig."
  - id: L-010
    parti: L
    sida: 3
    rader: '44-49'
    lydelse: "Vi är valet för dig som vill ersätta en regering som överrumplas av verkligheten med en politik för både i dag och i morgon. Jag är stolt över att företräda ett parti och en politik som gång på gång har visat just den förmågan. Vi ville rädda kärnkraften när alla andra sa nej. Vi ville ta tag i integrationen och varnade för gängkriminaliteten när alla andra sa nix. Och vi ville gå med i Nato när alla andra sa njet. Vi sätter alltid skolan först - därför att den framtid som väntar i morgon finns i våra klassrum i dag."
  - id: L-011
    parti: L
    sida: 3
    rader: '50-51'
    lydelse: "Liberalerna är garanten för en ny liberal borgerlig regering, som inte blundar för problemen och som har förmågan att se vad som väntar runt hörnet."
  - id: L-012
    parti: L
    sida: 3
    rader: '52'
    lydelse: "För en politik som är klok i stället för bara efterklok."
  - id: L-013
    parti: L
    sida: 3
    rader: '53'
    lydelse: "För en politik med vuxna svar på de arbetande samhällsbyggarnas frågor."
  - id: L-014
    parti: L
    sida: 3
    rader: '54-55'
    lydelse: "Vi behövs - och din röst på oss behövs - för att det ska finnas ett starkt kunskapsparti, integrationsparti och grönt borgerligt parti i Sveriges riksdag."
  - id: L-015
    parti: L
    sida: 3
    rader: '56'
    lydelse: "Vi behövs - och din röst på oss behövs - för ett liberalt och borgerligt maktskifte."
  - id: L-016
    parti: L
    sida: 4
    rader: '62-64'
    lydelse: "De senaste tio åren har en kvarts miljon elever lämnat grundskolan utan tillräckliga kunskaper. Detta skolmisslyckande är grogrund för den långtidsarbetslöshet, gängkriminalitet och segregation som i dag präglar stora delar av Sverige. Vi är beredda att göra det som krävs för att ge alla elever de kunskaper de behöver."
  - id: L-017
    parti: L
    sida: 4
    rader: '65-69'
    lydelse: "Vi tänker börja med att satsa på det som elevers lärande alltid börjar med - en riktigt bra lärare. Efter åtta år med en socialdemokratisk ledd regering har skolorna med de allra största utmaningarna fått färre behöriga lärare, men desto mer våld, hot och trakasserier mot lärarkåren. Nu behövs en politik som står på lärarnas sida. Som ger yrket auktoriteten tillbaka och gör så att fler vill utbilda sig till lärare och vill verka på de skolor som behöver bra lärare allra mest."
  - id: L-018
    parti: L
    sida: 4
    rader: '70-73'
    lydelse: "Sedan 2014 är det inte bara fler lärare som trakasseras. Nu upplever varannan elev sig som otrygg i skolan och var tredje tycker att det inte är tillräcklig ordning. Samtidigt får allt färre elever hjälp och stöd i särskilda undervisningsgrupper. Det här hör ihop. Alla elever förlorar på detta - både de som annars stökar och de som annars störs. Det behövs en ny politik för att fler elever oftare lyfts ut och får hjälp i mindre grupper."
  - id: L-019
    parti: L
    sida: 4
    rader: '74-77'
    lydelse: "Vi är partiet som kämpar för att varje lärare och varje elev ska möta en skola i världsklass. Därför kräver vi att skolor varken ska drivas av klippare som vill se stora vinster, eller av kommunpolitiker som inte ger tillräckliga resurser till skolan. I stället vill vi liberaler att alla skolor ges de rätta förutsättningarna att sätta elevers kunskap och lärande i första rummet."
  - id: L-020
    parti: L
    sida: 4
    rader: '78-81'
    lydelse: "1. Satsa på Sveriges viktigaste yrke. Allt börjar med en bra lärare. Därför vill vi se högre krav för att komma in på lärarutbildningen, högre krav på lärarutbildningen och se en bättre arbetsmiljö för lärare ute på landets skolor. Lärare ska avlastas för att kunna vara just lärare, kunna göra karriär, få betald fortbildning och få ordentligt bra betalt. En storsatsning på läromedel måste göras så att eleverna får riktiga skolböcker och landets lärare slipper stå och kopiera."
  - id: L-021
    parti: L
    sida: 4
    rader: '82-87'
    lydelse: "2. Studiero för alla - fler speciallärare och fler mindre undervisningsgrupper. Alla förlorar när skolgången inte fungerar för en elev. Därför vill vi se fler särskilda undervisningsgrupper utanför det vanliga klassrummet, för att elever som annars stökar och stör ska få bättre chanser. För att göra det möjligt skjuter vi till pengar för minst 1 000 fler speciallärare. Dessutom vill vi kunna förlänga skoldagarna för de elever som annars riskerar att halka efter, och ha mer av obligatorisk lovskola tidigare i skolåren."
  - id: L-022
    parti: L
    sida: 4
    rader: '88-91'
    lydelse: "3. Förstatliga skolan. Vi vill att staten tar över ansvaret från skolan från kommunerna så att alla elever får gå i bra skolor - inte bara de som råkar bo på rätt ställe. I ett första steg kommer vi att införa en statlig skolpeng som ger likvärdiga villkor i hela landet och ha statliga skolakuter som kan ta över de skolor som inte fungerar."
  - id: L-023
    parti: L
    sida: 4
    rader: '92-95'
    lydelse: "4. Vinstbegränsning och valfrihet i en ny friskolereform. Friheten för föräldrar och elever att själv välja skola är här för att stanna - men inte friskolornas vinstuttag på bekostnad av elevernas kunskaper. Vi vill se en ny friskolereform med en samlad friskolelag som sätter stopp för friskolor där kortsiktiga vinster går före elevernas kunskaper."
  - id: L-024
    parti: L
    sida: 5
    rader: '97-100'
    lydelse: "5. Stopp för religiösa friskolor. Ingen skola ska tvinga en elev att leva efter religiösa seder och ingen skola ska kunna användas för att sprida religiös fundamentalism. Vi vill sätta stopp för religiösa friskolor och hindra utländska icke-demokratiska aktörer från att äga skolor i Sverige. Skolor med inriktning mot de lagskyddade nationella minoriteterna ska alltid kunna finnas."
  - id: L-025
    parti: L
    sida: 5
    rader: '101-104'
    lydelse: "6. Nej till lottning. Integrationsproblemen är så stora att de inte går att blanda bort genom rödgröna förslag om att manipulera skolområden, flytta runt elever eller lotta vilken skola de ska gå i. Vi vill i stället stärka skolvalet genom att göra det obligatoriskt och samordnat, så att fler i stället för färre får välja vilken skola de vill gå i."
  - id: L-026
    parti: L
    sida: 5
    rader: '105-109'
    lydelse: "7. Flytta på mobbaren - inte den mobbade. Ordningsproblemen i den svenska skolan slår hårdast mot de barn som inte har stöd hemifrån. Rektorer ska enklare kunna omplacera elever som allvarligt stör verksamhet. Elever som kränker, hotar eller slår lärare och klasskamrater ska tillfälligt kunna få sitt studiebidrag indraget, precis som i dag är möjligt vid skolkande. Att inte markera tydligt och tidigt mot våld och hot är en otjänst mot alla."
  - id: L-027
    parti: L
    sida: 5
    rader: '110-112'
    lydelse: "8. Öka lärarnas befogenheter. Det är läraren som ska bestämma i klassrummet. Vi vill ge lärare ökad rätt att agera mot elever som förstör för klasskompisar och sig själv och tydliggöra i skollaget att det är läraren - inte eleverna - som ska bestämma över undervisningens upplägg."
  - id: L-028
    parti: L
    sida: 5
    rader: '113-115'
    lydelse: "9. En jämställd skola. Flickor och pojkar ska alltid känna sig trygga i skolan och aldrig begränsas av sitt kön. Förskolans och skolans arbete mot hedersrelaterat förtryck ska stärkas och både flickor och pojkar ska mötas av samma höga förväntningar i sitt skolarbete."
  - id: L-029
    parti: L
    sida: 5
    rader: '116-118'
    lydelse: "10. Alla ska uppmuntras och utmanas. Elever som vill och kan ska kunna gå före i stället för att hållas tillbaka. Det kräver fler spetsklasser runt om i Sverige, men också att alla elever oavsett skola ska kunna få stöd i att sikta högre än godkänt."
  - id: L-030
    parti: L
    sida: 5
    rader: '119-122'
    lydelse: "11. Mer tid och plats för kunskap. Att Sverige har kortare skoldagar än andra länder drabbar hårdast de elever som behöver skolan allra mest. Vi vill bygga ut undervisningstiden i bland annat svenska och matematik så att det finns tid till att lära sig mer. Läroplanerna ska revideras och få ett större fokus på fakta och kunskap."
  - id: L-031
    parti: L
    sida: 5
    rader: '123-127'
    lydelse: "12. Mer förskola. Vi vill bygga ut förskolan och satsa på det svenska språket. För att se till att alla barn får rätt start i livet vill vi både införa en obligatorisk språkförskola för nyanlända barn och barn till nyanlända och göra den allmänna förskolan obligatorisk från fem års ålder. Inget barn ska halka efter redan från start - därför vill vi att barn utan tillräckliga språkkunskaper alltid ska få den fördel det innebär att delta i förskolan."
  - id: L-032
    parti: L
    sida: 5
    rader: '128-129'
    lydelse: "13. En högre utbildning med högre ambitioner. Vi vill öka den lärarledda undervisningen, skärpa utvärderingen och bygga ut de utbildningar och lärosäten som håller högst kvalitet."
  - id: L-033
    parti: L
    sida: 5
    rader: '130-133'
    lydelse: "14. Fri och framstående forskning. Sverige ska ta emot Nobelpris - inte bara dela ut dem. Vi vill öka forskningsanslagen och både skapa bättre karriärvägar för yngre forskare och se riktade satsningar på att svenska universitet ska kunna locka hit världens främsta forskare. Den akademiska friheten ska ges skydd i grundlagen."
  - id: L-034
    parti: L
    sida: 6
    rader: '137-139'
    lydelse: "Över en halv miljon människor bor i Sveriges utsatta områden. Det är områden där polisen varnar för att arbetslösheten är högre, skolresultaten lägre och att de boende tvingas leva med våldet från klaner och kriminella som en del av vardagen."
  - id: L-035
    parti: L
    sida: 6
    rader: '140-142'
    lydelse: "Dessa parallellsamhällen påverkar oss alla. I utsatta miljöer i både stora och små städer växer barn upp under hedersvåld och hedersförtryck, och lågstadiebarn ser upp till våldsverkare i högstadiet. Därifrån sprider sig mycket av det grova våld som slår mot hela Sverige."
  - id: L-036
    parti: L
    sida: 6
    rader: '143-145'
    lydelse: "Nu behövs en politik som svarar upp mot vidden av den ofrihet och otrygghet som segregationen leder till. Som slutar kompromissa med förortens moralpoliser och som ser till att polisen kan upprätthålla frihet och trygghet - alltid och överallt."
  - id: L-037
    parti: L
    sida: 6
    rader: '146-149'
    lydelse: "Men att stoppa våldet är bara en del. Förorten behöver både höga tillskott till skolan och höga förväntningar på eleverna. Vi behöver också ställa upp förväntningen att alla som bor i Sverige ska kunna tala svenska. Vi behöver en politik för integration i stället för separation. Så att frihet och framtidsdrömmar blir något för alla unga oavsett var i världen du är född och var i Sverige du bor."
  - id: L-038
    parti: L
    sida: 6
    rader: '150-152'
    lydelse: "15. Inga utsatta områden 2030. Alla i Sverige förtjänar trygghet där de bor. Men i dag bor var tjugonde svensk - och en ännu högre andel nya svenskar - i ett utsatt område där kriminaliteten tagit över. Vårt viktigaste mål är detta: Sverige ska år 2030 inte ha ett enda utsatt område."
  - id: L-039
    parti: L
    sida: 6
    rader: '153-156'
    lydelse: "16. Stoppa separatisterna och parallellsamhällena. Islamister och kriminella klaner spär på segregationen och hotar sammanhållningen i Sverige. Vi vill ta tillbaka makten från separatister i utsatta områden, värna en skolgång fri från separatistisk påverkan och pröva möjligheten att införa vistelseförbud för dömda kriminella i utsatta områden."
  - id: L-040
    parti: L
    sida: 6
    rader: '157-160'
    lydelse: "17. Stå på de goda krafternas sida. Riktig förändring börjar underifrån. Därför ska vi stötta förortens demokrater, feminister och företagsamma människor. Det demokratiska civilsamhället i utsatta områden ska stödjas mer - särskilt kvinnors och flickors organisering. Genom att göra de 100 000 första intjänade kronorna från arbete eller företagande skattefria stärker vi de välståndsbildande krafterna i hela Sverige, men inte minst i de utsatta områdena."
  - id: L-041
    parti: L
    sida: 6
    rader: '161-164'
    lydelse: "18. Svenska språket är nyckeln till Sverige. Bristande språkkunskaper permanentar utanförskap. Därför vill vi bland annat öka kraven och kvaliteten i SFI och erbjuda fler flexibla former för undervisning, exempelvis i kombination med öppna förskolan Den som låter bli att lära sig svenska i normalfallet kunna få sitt försörjningsstöd nedsatt."
  - id: L-042
    parti: L
    sida: 7
    rader: '166-170'
    lydelse: "19. Höga krav för medborgarskap. Vi har i tjugo år argumenterat att du ska kunna svenska för att bli medborgare i Sverige. Nästa mandatperiod ska inte bara ett språktest äntligen komma på plats, utan också villkoret att du förstår hur det svenska demokratiska samhället fungerar och har förutsättningar att försörja dig. Vi ska helt enkelt ställa höga krav på den som vill bli svensk medborgare."
  - id: L-043
    parti: L
    sida: 7
    rader: '171-175'
    lydelse: "20. Integration börjar i skolan. Det finns skolor i utsatta områden där mer än varannan elev går ut nian utan tillräckliga kunskaper. För att ändra det krävs att de skolor som har tuffast förutsättning ges möjlighet att rekrytera de bästa lärarna, fler verktyg för lärare och rektor att hantera stök och oordning och sociala team på utsatta skolor som kan komma tillrätta med unga på glid."
  - id: L-044
    parti: L
    sida: 7
    rader: '176-181'
    lydelse: "21. Bekämpa hedersbrott och hedersförtryck. Parallella samhällen med odemokratiska värderingar och parallell rättsskipning får aldrig accepteras. Vi vill göra mycket mer för att alla ska få kunskap om sina rättigheter, bland annat genom obligatorisk samhällsundervisning för nyanlända. Samtidigt ska stöden till offren byggas ut, kunskapen hos yrkesverksamma öka, straffen för hedersrelaterade brott skärpas och kriminaliseringen breddas till uttryck för hederstänkande såsom oskuldskontroller och uppfostringsresor."
  - id: L-045
    parti: L
    sida: 7
    rader: '182-188'
    lydelse: "22. Mer bostadsrätter och mindre bidragsberoende. Det är områden med eftersatt underhåll, otrygga gatumiljöer och en låg andel ägt boende som blir socialt utsatta. Därför måste vi också bygga bort utsattheten med tryggare kvarter där fler kan äga sitt boende och där fastighetsägare och det offentliga samarbetar långsiktigt. Så skapas positiva spiraler där fler tar ansvar för sitt närområde i stället för att flytta därifrån så fort möjligheten ges. Kommunala bostadsbolag ska både arbeta för att fler hyresrätter i utsatta områden omvandlas till bostadsrätter och för att få fler med egen försörjning och färre med försörjningsstöd att flytta till utsatta områden."
  - id: L-046
    parti: L
    sida: 8
    rader: '192-194'
    lydelse: "Sverige har i dag uppemot 10 000 gängkriminella där var sjunde är under 18 år. Polisen rapporterar om sjuåringar som är knarkkurirer och tolvåringar som bär vapen. Regeringen lovade att knäcka gängen, men efter åtta år ökar i stället skjutningarna här mest i hela Europa."
  - id: L-047
    parti: L
    sida: 8
    rader: '195-197'
    lydelse: "Samtidigt som allt fler kriminella avlossar allt fler skott, klaras allt färre skjutningar upp. Bara vart fjärde gängmord och var sjunde skjutning leder i dag till fällande domar. Och bara var tjugonde av de runt 10 000 anmälda våldtäkterna per år klaras upp."
  - id: L-048
    parti: L
    sida: 8
    rader: '198-201'
    lydelse: "Detta är följden av en politik från partier som varken är villiga att göra tillräckligt för att förebygga brott eller hindra dömda brottslingar från att begå brott igen. Straffen är för låga samtidigt som antalet poliser per invånare nu under varje år i två mandatperioder varit färre än när Sverige förra gången hade en borgerlig regering."
  - id: L-049
    parti: L
    sida: 8
    rader: '202-203'
    lydelse: "Nu behövs en politik från partier som både ser till att färre unga blir gängkriminella och att fler gängkriminella döms till fängelse och hålls inlåsta längre. Det har den här regeringen visat att den inte klarar av att leverera."
  - id: L-050
    parti: L
    sida: 8
    rader: '204-208'
    lydelse: "23. Fler poliser med bättre betalt. Sverige har i dag färre poliser i förhållande till vår folkmängd än nästan något annat land i EU. Så kan det inte fortsätta. Därför vill vi på sikt nå 33 000 poliser så att polistätheten blir minst lika hög som i övriga Europa. För att nå dit måste det bli mer attraktivt att både bli och fortsätta som polis - därför ska villkoren ska bli bättre och lönerna höjas. Samtidigt behöver vi fler domare och fler åklagare, och fler häkten och fängelser med fler kriminalvårdare."
  - id: L-051
    parti: L
    sida: 8
    rader: '209-213'
    lydelse: "24. En grövre brottslighet kräver längre straff. Livsstilskriminella ska hållas inlåsta i stället för att släppas ut på våra gator. Vi vill avskaffa dagens mängdrabatt på brott, slopa den närmast automatiska frigivningen från fängelsestraff och skärpa straffen för bland annat vapenbrott, våldtäkt och utpressning. Ett nationellt avhopparprogram ska införas för att fler ska kunna lämna ett kriminellt liv bakom sig."
  - id: L-052
    parti: L
    sida: 8
    rader: '214-217'
    lydelse: "25. Ge polisen fler verktyg och vapen. Avlyssning och andra hemliga tvångsmedel ska kunna användas både vid misstanke om fler brott än i dag och efter domstolsbeslut mot organiserade gängmedlemmar även utan konkret brottsmisstanke. För att stoppa upplopp och kravaller ska polisen kunna använda mer effektiv och modern utrustning så att fler kan gripas och lagföras."
  - id: L-053
    parti: L
    sida: 8
    rader: '218-221'
    lydelse: "26. Stoppa kriminaliteten redan i klassrummen. En starkare skola i Sveriges utsatta områden kommer göra att färre unga glider in i kriminaliteten. Alla skolor ska stärka sitt våldspreventiva arbete. För att polis och socialtjänst alltid ska få kännedom om barn som är på fel väg i livet ska huvudregeln bli att skolan alltid gör polisanmälan och orosanmälan vid misstänkt brottslighet."
  - id: L-054
    parti: L
    sida: 9
    rader: '223-227'
    lydelse: "27. Rätt förutsättningar för förebyggande insatser. Socialtjänstens brottsförebyggande arbete hindras i dag av en lagstiftning och utbildning i otakt med tiden. Vi vill göra ungdomskriminalitet till ett obligatoriskt utbildningsmoment på socionomutbildningen och införa en specialisering för socialsekreterare med fokus på unga lagöverträdare. Polis och socialtjänst ska som huvudregel alltid kunna utbyta information sinsemellan och ska oftare dela lokaler. Kommuners brottsförebyggande arbete ska lagstadgas."
  - id: L-055
    parti: L
    sida: 9
    rader: '228-232'
    lydelse: "28. Bryt brottsbanan i tid. Tidigare, tydligare och tuffare insatser för att förebygga och förhindra att unga glider in i brottslighet måste till. Vi vill se nationella hembesöksprogram från socialtjänsten för nyblivna förstagångsföräldrar i utsatta områden, att socialtjänsten ska kunna göra fler insatser för familjer obligatoriska och att betydligt fler barn som fostras in i kriminalitet eller själva begår grova brott ska kunna omhändertas."
  - id: L-056
    parti: L
    sida: 9
    rader: '233-238'
    lydelse: "29. Inrätta ungdomsfängelser och fler särskilda boenden för unga på glid. Det ska inte som i dag råda kö till de anläggningar som ska akut ska kunna omhänderta unga våldsutövare. Vi vill inrätta särskilda fängelser så att unga kriminella både kan få bättre vård under sitt straff och hållas undan äldre brottslingar. Den maximala vårdtiden för sluten ungdomsvård ska förlängas, så att unga mördare som i dag inte ska kunna släppas fria efter fyra år. Fler unga i behov av omfattande sociala insatser ska placeras på särskilda ungdomshem."
  - id: L-057
    parti: L
    sida: 9
    rader: '239-242'
    lydelse: "30. Mäns våld mot kvinnor ska upphöra. Kvinnor ska vara trygga både hemma och ute. Vi vill se en ökad handlingskraft mot sexuellt våld och våld mot kvinnor genom bland annat högre straff för sexualbrott och ett bättre skydd och stöd för offren. Ett nationellt stöd för skyddade boenden ska införas."
  - id: L-058
    parti: L
    sida: 9
    rader: '243-246'
    lydelse: "31. Utvisa fler kriminella från Sverige. Återfall i brott ska lättare leda till utvisning för den som inte är svensk medborgare, och vid grova vålds- och sexualbrott liksom hat- eller hedersrelaterade brott ska utvisning alltid prövas. Fler som väntar på både utvisning och avvisning ska hållas i förvar. Vi ska kräva att länder som tar emot svenskt bistånd också tar emot egna medborgare som dömts för brott i Sverige."
  - id: L-059
    parti: L
    sida: 9
    rader: '247-251'
    lydelse: "32. Inrätta ett europeiskt FBI. Gränsöverskridande brottslighet måste mötas med en gränsöverskridande polis. Sverige ska delta fullt ut i EU:s brottsbekämpning och den europeiska polismyndigheten Europol ska ges ett tydligare operativt mandat att bekämpa internationell brottslighet och terrorism. Förundersökningar och brottsutredningar där flera länder berörs ska kunna bedrivas på europeisk nivå. För att stärka det yttre gränsskyddet och rättssäkerheten behöver EU på sikt helt ta över ansvaret för kontrollen av unionens yttre gränser."
  - id: L-060
    parti: L
    sida: 10
    rader: '255-257'
    lydelse: "Bara förra året steg elpriserna med över 500 procent sett till hela landet. Samtidig slogs rekord i hur mycket extra elen tilläts kosta i södra och mellersta delen av Sverige. Det innebär inte bara att den rödgröna energipolitiken gjort det dyrare att bo och leva - utan det har också fördyrat och försenat klimatomställningen."
  - id: L-061
    parti: L
    sida: 10
    rader: '258-261'
    lydelse: "Nu behöver vi energipolitik som ser till att det både finns billig el i hela landet och tillräcklig med el till både nya elbilar alla de nya industrier som nu kan drivas på ren energi i stället för olja, gas och kol. Och som ser till att elen fungerar oavsett väder. Då behöver vi bygga ny kärnkraft i stället för att som de rödgröna partierna fortsätta lägga ned kärnkraften."
  - id: L-062
    parti: L
    sida: 10
    rader: '262-265'
    lydelse: "Och nu behövs en klimatpolitik som inte mäts i hur många skatter som höjs eller hur mycket den kostar skattebetalarna utan i hur mycket den på riktigt får ner utsläppen. En klimatpolitik som ersätter den symbolpolitik där bidrag betalas ut till klimatångest i stället för det vi vet är allra viktigast: mer ny teknik, mer internationellt samarbete och fler effektiva styrmedel."
  - id: L-063
    parti: L
    sida: 10
    rader: '266-267'
    lydelse: "Sverige behöver helt enkelt en liberal klimatagenda. Tre val i rad har nu Naturskyddsföreningen gett vår klimat- och miljöpolitik högst betyg av alla borgerliga partier. Det är dags att omsätta den politiken i handling."
  - id: L-064
    parti: L
    sida: 10
    rader: '268-270'
    lydelse: "33. Klimatmålen kräver tillväxt och teknik. Medan andra gröna partier grundades för att stoppa tillväxten vet vi att ny teknik och nya lösningar är en del av lösningen på klimatutmaningen. Vi ska nå klimatmålen - inga nettoutsläpp av växthusgaser senast 2045 och därefter negativa utsläpp inom ramen för en växande ekonomi."
  - id: L-065
    parti: L
    sida: 10
    rader: '271-274'
    lydelse: "34. Utveckla - inte avveckla - kärnkraften. Klimatomställningen kräver dubbelt så mycket el som i dag. Då kan vi inte avveckla kärnkraften. I stället vill vi möjliggöra fler nya reaktorer på fler ställen, möjliggöra återstart av Ringhals 1 och 2, se till att statliga lånegarantier omfattar kärnkraften, modernisera regelverken och ge kärnkraften betalt för att den alltid finns tillgänglig."
  - id: L-066
    parti: L
    sida: 10
    rader: '275-279'
    lydelse: "35. Billig el och pålitlig el i hela landet. Rödgrön energipolitik har lett till mångdubblade elpriser för svenska hushåll och industrier. Ska vi få ner elpriserna krävs att vi bygger inte bara kärnkraft utan också mer sol- och vindkraft i hela landet, investerar i kraftsystemet och satsar på energilagring. Vi vill både sänka elmomsen och den särskilda extraskatten på el för att mildra elprischocken här och nu."
  - id: L-067
    parti: L
    sida: 10
    rader: '280-283'
    lydelse: "36. Den som förorenar ska betala. Det är den som förorenar - ingen annan - som ska betala. Därför är vi för riktiga klimatskatter i stället för att göra klimatpolitiken till en tävling i högst bidrag och flest symbolskatter. Subventioner, inklusive skattelättnader och stöd, till fossila bränslen i Sverige såväl som globalt ska successivt avskaffas."
  - id: L-068
    parti: L
    sida: 11
    rader: '285-289'
    lydelse: "37. Den som fångar in koldioxid ska få betalt. Det brådskar att ta hand om den koldioxid som finns i atmosfären. Därför ska vi skala upp arbetet med infångning, avskiljning och lagring av koldioxid. De tekniska lösningarna finns - nu måste staten se till att den som minskar mängden växthusgaser i atmosfären också får betalt. Den naturliga koldioxidinlagringen ska stärkas genom att fler tidigare våtmarker återställs."
  - id: L-069
    parti: L
    sida: 11
    rader: '290-295'
    lydelse: "38. Elektrifiera transporterna. Fossilutsläppen från transportsektorn ska bort. Fler ska välja elbilen och en inblandning av fossilfria bränslen ska fortsätta. Det behövs laddstolpar där vi bor, arbetar och reser. Fler flygresor ska göras fossilfria och all kollektivtrafik på väg och spår ska vara fossilfri senast 2030. Vi vill bygga bort järnvägsnätets flaskhalsar och så att tågen går i tid här och nu i stället för att lägga hundratals miljarder på en höghastighetsjärnväg som inte är klar ens om 20 år."
  - id: L-070
    parti: L
    sida: 11
    rader: '296-300'
    lydelse: "39. EU - för klimatets skull. EU är världens viktigaste miljöorganisation - det är bara genom samarbete i Europa och globalt som klimatutmaningen kan mötas. Det finns två problem med rysk gas: att det är gas och att den är rysk. Det brådskar att få på plats en tidssatt plan för att fullt ut avveckla kol- och gasanvändningen i Europa. Det behövs en europeisk koldioxidskatt och klimattullar för att höja kostnaden för utsläpp, samtidigt som det europeiska klimatbiståndet ökar."
  - id: L-071
    parti: L
    sida: 11
    rader: '301-306'
    lydelse: "40. Grön politik för skogen och miljön. Sveriges fjäll, skogar och marker är fantastiska - och ska vara det också för nästa generation. Då behöver vi fortsätta arbetet med att skydda både värdefull natur och den biologiska mångfalden. Allemansrätten och det svenska skogsbruket ska värnas, samtidigt som strandskyddet reformeras så att det blir enklare att bygga strandnära på landsbygden medan skyddet upprätthålls där det finns känsliga ekosystem och högt tryck på byggande. Det kommunala vetot mot vindkraft ska bestå."
  - id: L-072
    parti: L
    sida: 11
    rader: '307-310'
    lydelse: "41. Rädda hav och vatten. Våra hav och vatten är i dåligt skick. Kampen mot övergödningen ska fortsätta, industrifisket ska begränsas och de mest värdefulla havsområdena skyddas som marina reservat. Samtidigt behövs fortsatta insatser för att förhindra att skräp och föroreningar, som plast och läkemedel, sprids i våra vatten."
  - id: L-073
    parti: L
    sida: 12
    rader: '314-317'
    lydelse: "Socialdemokraterna lovade att Sverige skulle få EU:s lägsta arbetslöshet. I stället har vi fått den fjärde högsta. I dag får en halv miljon människor inte uppleva gemenskapen med kollegor på jobbet eller självbestämmandet som ligger i en egen inkomst - samtidigt som färre betalar skatt och samhället har råd med färre medarbetare i vård, skola och omsorg."
  - id: L-074
    parti: L
    sida: 12
    rader: '318-321'
    lydelse: "Fler är inte bara arbetslösa nu än 2014. Bland utrikesfödda har långtidsarbetslösheten och sysslolösheten bitit sig fast. I utsatta stadsdelar finns områden där inte ens varannan som är född i ett annat land går till jobbet en vanlig dag. Allra längst från arbetsmarknaden står utrikes födda kvinnor. När föräldrar saknar friheten i en egen lön, och barn saknar vuxna förebilder som går till jobbet, så växer utanförskapet."
  - id: L-075
    parti: L
    sida: 12
    rader: '322-324'
    lydelse: "Detta är resultatet av en politik som höjt bidragen i samma takt som skatterna. 47 skattehöjningar har det hunnit bli på bara åtta år. Högre skatter på att jobba, högre skatter på att erbjuda ett arbete och högre skatter på att spara."
  - id: L-076
    parti: L
    sida: 12
    rader: '325-329'
    lydelse: "Liberalerna går till val på att ändra riktning. Fler måste bidra - färre måste gå på bidrag. Vi vill sänka din skatt oavsett om du är företagare eller anställd. VI ska ha samma förväntningar på att kvinnor och män ska kunna försörja sig själv - även bland utrikes födda. Vi vill uppmuntran sparande och eget ansvarstagande. Vi vill mota inflationstrycket. Vi vill skapa en bostadsmarknad med fler bostäder och mer marknad, där fler vill bygga och fler har råd att flytta."
  - id: L-077
    parti: L
    sida: 12
    rader: '330-335'
    lydelse: "42. Återupprätta arbetslinjen. Sverige är fortfarande ett av de länder i världen som har högst skatt på arbete. Det gör att arbete och ansträngning här lönar sig mindre - och ibland inte alls. För att stärka arbetslinjen och hushållens ekonomi i ett oroligt ekonomiskt läge vill vi skyndsamt genomföra ett nytt brett jobbskatteavdrag. För dig som studerat och tagit studielån vill vi dessutom införa en femårig CSN-paus, så att du när du vill ska kunna ta ett uppehåll från din återbetalning. På sikt vill vi permanent sänka skatten på de lägsta lönerna med minst 1 000 kronor i månaden samtidigt som marginalskatterna för alla fortsätter att minska."
  - id: L-078
    parti: L
    sida: 12
    rader: '336-337'
    lydelse: "43. Inför ett bidragstak. Det ska alltid löna sig att arbeta. Därför vill vi modernisera bidragssystemet genom ett bidragstak - de samlade bidragen ska inte kunna vara högre än de lägsta kollektivavtalade lönerna."
  - id: L-079
    parti: L
    sida: 12
    rader: '338-342'
    lydelse: "44. Ett försörjningsstöd för fler i arbete. Försörjningsstödet ska vara en hjälp på vägen vidare, inte en återvändsgränd. Vi vill införa en ny dagersättning för arbetsföra personer med ett tydligt krav på motprestation i form av anvisat arbete, språkutbildning eller annan kompetenshöjande verksamhet. Samtidigt ska dagens jobbonus förstärkas så att den som går från försörjningsstöd till arbete får behålla mer av sin inkomstökning."
  - id: L-080
    parti: L
    sida: 13
    rader: '344-347'
    lydelse: "45. Alla ska arbeta - även utrikes födda kvinnor. Fler utrikes födda kvinnor ska komma i arbete genom reformer av föräldraförsäkringen och flerbarnstillägget och ett mer individualiserat försörjningsstöd. Arbetsförmedlingen, Försäkringskassan och socialtjänsten ska bli bättre i sitt stöd men också tydligare i förväntningen på att alla som kan ska försörja sig själva."
  - id: L-081
    parti: L
    sida: 13
    rader: '348-349'
    lydelse: "46. Stå upp för Sveriges entreprenörer. Fler företagare och entreprenörer skapar fler jobb och mer välstånd. Därför vill vi att det ska bli enklare och billigare att anställa genom att arbetsgivaravgifterna sänks för både småföretagare och för dem som vill anställa unga."
  - id: L-082
    parti: L
    sida: 13
    rader: '350-355'
    lydelse: "47. Sänk skatterna på kunskap. Sveriges skattenivåer ska vara konkurrenskraftiga och lättförståeliga för att uppmuntra till företagande, utbildning och investeringar. Det gäller inte minst bolags-, kunskaps- och kapitalskatterna. Vi vill göra optionsbeskattningen internationellt konkurrenskraftig och sänka expertskatten så att svenska företag ska kunna locka hit utländska nyckelmedarbetare. Tillfälliga arbetstillstånd ska kunna ges för en längre period än i dag. Kompetensutvisningarna av högkvalificerad arbetskraft måste få ett slut. En startup-kommission ska tillsättas och skattesystemet anpassas bättre till den växande delningsekonomin."
  - id: L-083
    parti: L
    sida: 13
    rader: '356-359'
    lydelse: "48. Gynna spara i stället för slösa. I stället för att som regeringen gång på gång höja skatten på sparande vill vi sänka den. Det ska helt enkelt löna sig att ta personligt ansvar för sin egen ekonomiska framtid. Vi vill sänka skatten på investeringssparkonton genom att bland annat göra de första 300 000 kronorna på ett ISK helt skattefria."
  - id: L-084
    parti: L
    sida: 13
    rader: '360-364'
    lydelse: "49. Jobb och framtidstro i hela landet. Företagandet i hela Sverige hämmas när skatten kan vara fem, sex eller sju kronor högre per hundralapp i glesbygd än i Stockholm. Vi vill skapa mer likvärdiga villkor och skatter genom att flytta finansieringsansvaret för bland annat skolan och LSS till staten. Vägnätet ska fungera och statliga myndigheter ska finnas närvarande i alla delar av Sverige."
  - id: L-085
    parti: L
    sida: 13
    rader: '365-368'
    lydelse: "50. Fler nya bostäder och fler första bostäder. Att få uppleva frihetskänslan av en egen bostad är något många fler ska få göra. Vi vill införa en stimulans för att spara ihop till den första insatsen, slopa det förhöjda amorteringskravet, korta överklagandeprocesserna och fortsätta förenkla byggreglerna. Så får vi fler nya bostäder och fler som har råd med bostäder."
  - id: L-086
    parti: L
    sida: 13
    rader: '369-373'
    lydelse: "51. En fungerande bostadsmarknad med kortare köer. För att få upp byggandet av fler hyresrätter och korta köerna vill vi kombinera ett starkt besittningsskydd med att hyran i nybyggda hyresrätter ska få avtalas fritt mellan hyresvärd och hyresgäst. Dagens dyra byggsubventioner ska avskaffas och ett nytt system med behovsbostäder ska införas för grupper med särskilt stora bostadsbehov, såsom våldsutsatta och familjer med mycket svag ekonomi."
  - id: L-087
    parti: L
    sida: 14
    rader: '377-379'
    lydelse: "Sverige har färre antal vårdplatser än våra nordiska grannländer - vi har till och med lägst antal vårdplatser på sjukhus per invånare i hela EU. Då är det inte underligt att vårdkön är över 150 000 personer lång och att fyra av tio patienter får vänta olagligt länge på sin operation."
  - id: L-088
    parti: L
    sida: 14
    rader: '380-382'
    lydelse: "Nu behövs en politik för rätt vård i rätt tid för varje patient. Och för att sjukvården alltid ska utgå från dina förutsättningar som patient. Det är därför vi liberaler både vill se ännu bättre digital tillgänglighet och att du ska få en läkare som är just din. Så ger vi fler både trygghet och flexibilitet i kontakt med vården."
  - id: L-089
    parti: L
    sida: 14
    rader: '383-385'
    lydelse: "Men mer trygghet behövs i fler delar av välfärden. Sedan 2014 har det varje år blivit färre och färre personer med funktionsnedsättning som beviljas personlig assistans för att kunna leva som alla andra. Nu är det dags att ge friheten tillbaka."
  - id: L-090
    parti: L
    sida: 14
    rader: '386-389'
    lydelse: "Under en vanlig tvåveckorsperiod är det i snitt hela 16 olika personer som kommer hem till den som har hemtjänst. Varken den som behöver hjälp eller den som ska hjälpa lär känna den andra. Ska du - även på ålderns höst - känna trygghet i ditt eget hem kan det inte vara fler personer i din hemtjänst än att du kan bli bekant med alla."
  - id: L-091
    parti: L
    sida: 14
    rader: '390-395'
    lydelse: "52. Fler bemannade vårdplatser i hela Sverige. Sveriges sjukhus har för små marginaler. Kompetensbristen har orsakat långa vårdköer och färre vårdplatser än våra nordiska grannländer. Vi vill därför nästa mandatperiod se en nationell kraftsamling för fler bemannade vårdplatser i hela landet så att du som patient kan få vård snabbare. För att klara det måste de som arbetar inom vården mötas av goda arbetsvillkor, fler kollegor och bra löneutveckling. Bristyrken ska bli drömjobb."
  - id: L-092
    parti: L
    sida: 14
    rader: '396-400'
    lydelse: "53. En tydligare roll för staten i sjukvården. Det behövs en bred översyn av vårdens organisering och finansiering. Staten ska ta ett större ansvar för sjukvårdens strategiska planering, placering av högspecialiserad vård, beredskap och långsiktig kompetensförsörjning. Samtidigt ska detaljstyrningen och byråkratin minska i verksamheterna. Särskilda initiativ krävs för att mödra- och förlossningsvården ska stärkas i hela Sverige."
  - id: L-093
    parti: L
    sida: 14
    rader: '401-404'
    lydelse: "54. En personlig husläkare när du behöver. Du ska ha rätt till en fast läkare på din vårdcentral som har tid för - och som lär känna - just dig. Dessutom ska de barn och vuxna som har många och täta kontakter i specialistsjukvården där också ha rätt till en fast vårdkontakt som kan guida och stötta. På så sätt blir mötet med vården både enklare, tryggare och snabbare."
  - id: L-094
    parti: L
    sida: 14
    rader: '405-407'
    lydelse: "55. Nätläkaren är här för att stanna. Vi vill se en digital valfrihetsreform och vårdgaranti där alla regioner ska åläggas att erbjuda en minst lika bra digital tillgänglighet som fysisk, där du utifrån din situation alltid ska välja hur du vill möta vården."
  - id: L-095
    parti: L
    sida: 15
    rader: '409-411'
    lydelse: "56. Laga hålen i tandvården. Tandvårdens finansiering ska steg för steg likna annan sjukvård där du som patient betalar mindre och samhället mer. Nästa steg är gradvis ökande subventionsgrad för de grupper som har sämst munhälsa och nationella tandvårdsprogram för särskilda riskgrupper."
  - id: L-096
    parti: L
    sida: 15
    rader: '412-415'
    lydelse: "57. Mer trygghet i äldreomsorgen. Vi vill att du som har hemtjänst ska ha ett eget team av omvårdnadspersonal så att du slipper möta nya ansikten varje dag. All personal ska ha tillräckliga kunskaper i det svenska språket. För att öka tryggheten vill vi ta bort förbudet för kommuner att anställa läkare i äldreomsorgen."
  - id: L-097
    parti: L
    sida: 15
    rader: '416-420'
    lydelse: "58. Återupprätta assistansen. Bristerna i dagens assistansersättning - vårt viktigaste stöd till många med funktionsnedsättning - är så allvarliga att det krävs en kriskommission. Vi vill även under nästa mandatperiod inrätta en LSS-inspektion som bevakar den enskildes rättigheter gentemot staten och får bukt med de oseriösa aktörer inom assistansen där brukare eller anställda far illa."
  - id: L-098
    parti: L
    sida: 15
    rader: '421-425'
    lydelse: "59. Högre pensioner och ett gynnat pensionssparande. Vi vill fortsätta stärka Sveriges pensionärers inkomster så att det alltid lönat sig att ha arbetat. Därför vill vi bland annat sänka skatten på pensioner, och införa en pensionsgas så att dagens och morgondagens pensionärer får del av det överskott som byggts upp i pensionssystemet. Dessutom vill vi återinföra rätten till avdrag för privat pensionssparade så att alla kan spara 1 000 kronor månaden skattefritt."
  - id: L-099
    parti: L
    sida: 16
    rader: '429-440'
    lydelse: "Den 11 september avgör du och över sju miljoner andra svenskar riktningen för vårt land. Den handlingen är höjdpunkten i vår demokrati, men demokratins grund ligger i dina och alla andras lika rättigheter. Den svenska liberala rörelsen har sina rötter i människors strävanden för yttrande- och religionsfrihet, ekonomisk frihet, frihet från könsförtryck och frihet från statligt maktmissbruk. Vårt parti har funnits till för den strävan i över hundra år. I dag är flera av dessa rättigheter satta under press i vår omvärld, vårt närområde eller vårt eget land. Det handlar bland annat om upprepade hot mot kvinnors rätt till abort och om rätten för den som verkligen fruktar krig och förföljelse att söka en fristad. Men det handlar också om varje människas rätt att leva sitt liv i frihet och trygghet, oavsett kön eller sexuell läggning. Därför kan vi aldrig acceptera att ojämställdheten består eller att extremister, separatister och självutnämnda moralpoliser kränker den som öppet visar sin kärlek till någon av samma kön. Här i Sverige och globalt ska dessa rättigheter värnas. Aldrig kompromissar vi med att din rätt också är allas rätt."
  - id: L-100
    parti: L
    sida: 16
    rader: '441-444'
    lydelse: "Valdagen är heller inte slutpunkten för demokratin. Den svenska demokratin och våra medborgerliga rättigheter måste förklaras och vinnas för nya generationer. Demokratins livsluft är att fler granskar, diskuterar och pekar ut samhällets brister. Det fria samtalet ska värnas genom att stärka oberoendet hos journalistiken, kulturen och civilsamhället."
  - id: L-101
    parti: L
    sida: 16
    rader: '445-448'
    lydelse: "60. Värna den liberala demokratin. Den svenska demokratin ska stå stark och dina rättigheter ska försvaras. Vi vill se ett förstärkt grundlagsskydd för vårt demokratiska statsskick, öka domstolarnas oberoende och verka för en författningsdomstol som ska kunna häva lagar eller bestämmelser som strider mot grundlagsskyddade fri- och rättigheter."
  - id: L-102
    parti: L
    sida: 16
    rader: '449-453'
    lydelse: "61. Stärk public service och granskande medier. Mediernas oberoende roll och kritiska granskning är grunden i varje demokrati. Därför ska Sveriges Television, Sveriges Radio och Utbildningsradion ha ökat skydd i lagen för sitt oberoende från politisk styrning, och public service-bolagen ska fortsätta ha ett brett programutbud. Vi vill göra om press- och mediestödet för att främja en lokal granskande kvalitetsjournalistik i hela landet."
  - id: L-103
    parti: L
    sida: 16
    rader: '454-458'
    lydelse: "62. Försvara kulturens oberoende. Kulturpolitiken ska utgå från frihet, mångfald och kvalitet men ska inte lägga sig i innehållet i kulturen. Därför vill vi att staten ska styra mindre och att det ska vara kulturskapare och inte politiker som fattar besluten om stöd. Kulturpolitiken ska värna kulturens eget värde gentemot rena nyttoändamål. Alla barn och elever ska få läsa både svenska och internationella skönlitterära klassiker i skolan."
  - id: L-104
    parti: L
    sida: 17
    rader: '460-463'
    lydelse: "63. Skydda svensk aborträtt i grundlagen. Kvinnans rätt att bestämma över sin kropp ska skyddas i grundlagen tillsammans med andra fri- och rättigheter som yttrandefrihet, religionsfrihet och äganderätt. Sverige ska arbeta långsiktigt för att rätten till abort erkänns internationellt som en del av de mänskliga rättigheterna."
  - id: L-105
    parti: L
    sida: 17
    rader: '464-468'
    lydelse: "64. Feminism utan socialism. Jämställdheten måste fortsätta gå framåt. Vi vill se ny föräldraförsäkring som både värnar valfriheten och stärker jämställdheten på arbetsmarknaden. Vi vill öka trycket på arbetsgivare att erbjuda jämställda löner och villkor, och sänka skatten på sparande så att fler kan bygga upp en buffert. En ojämställd arbetsmarknad gör att kvinnor oftast har mycket lägre tjänstepension än män - för att öka jämställdheten vill vi därför att en större andel av pensionen, precis som bilen och huset, delas vid en skilsmässa."
  - id: L-106
    parti: L
    sida: 17
    rader: '469-473'
    lydelse: "65. Hbtqi-reformer handlar om frihet. Sverige ska vara världens bästa land att leva i som hbtqi-person. Vi vill möjliggöra altruistiskt värdmödraskap här i Sverige och underlätta för de par som i utlandet använder värdmödraskap att i här i Sverige erkännas som barnets föräldrar. Hbtqi-kompetensen i vård, skola och omsorg ska stärkas och ett lagskydd mot omvändelseterapi ska införas."
  - id: L-107
    parti: L
    sida: 17
    rader: '474-478'
    lydelse: "66. Samhället är större än staten. Samhället byggs underifrån - civilsamhället är inte ett komplement till utan en förutsättning för demokratin. Vi vill fortsätta förbättra civilsamhällets finansiering genom både bredare skatteavdrag för gåvor och långsiktiga statsbidrag. Regelverk och upphandlingar bör utformas så att det är oftare är möjligt för idéburna aktörer att bidra i välfärden."
  - id: L-108
    parti: L
    sida: 17
    rader: '479-483'
    lydelse: "67. Säkra demokratin mot separatisterna. När Säpo säger att flera organisationer från extremistmiljöer finansieras av skattepengar måste mycket mer göras. Vi vill både stärka uppföljningen av bidragsgivning och stoppa dold finansiering av trossamfund så att de inte blir verktyg för extremistiska krafter. Socialsekreterare och andra offentliganställda ska skyddas mot förföljelse och utsatthet genom att ett nytt brott - tjänstemannaförföljelse - införs."
  - id: L-109
    parti: L
    sida: 17
    rader: '484-487'
    lydelse: "68. En human och långsiktigt hållbar migrationspolitik. Människor som flyr krig och förföljelse ska få skydd. Asylrätten ska värnas där den med asylskäl ska stanna och den utan skäl lämnar landet. Ska integrationen lyckas måste Sverige få en migrationspolitik med en lagstiftning i linje med andra EU-länder."
  - id: L-110
    parti: L
    sida: 17
    rader: '488-491'
    lydelse: "69. Din bakgrund ska inte avgöra din framtid. Rättigheter och möjligheter ska vara lika för alla i Sverige. Därför ska staten med kraft bekämpa all slags rasism, diskriminering och intolerans. Vi vill modernisera diskrimineringslagen, prioritera polisens hatbrottsverksamhet och säkerställa att alla skolor står upp för alla människors lika värde."
  - id: L-111
    parti: L
    sida: 18
    rader: '495-497'
    lydelse: "I nära åtta år ville dagens regering stoppa en stor upprustning av försvaret och den lovade att aldrig söka ett medlemskap i Nato. Den gjorde fel. Därför är Sveriges närområde otryggare och landets försvarsförmåga lägre än vad den varit om regeringen hade varit klok i stället för bara efterklok."
  - id: L-112
    parti: L
    sida: 18
    rader: '498-501'
    lydelse: "Liberalerna har varit för att rusta upp försvaret mot hotet från Putin i över tio år, för över tjugo år sedan var vi det första riksdagsparti som sa ja till svenskt medlemskap i Nato och för över trettio år sedan drev vi på för att Sverige äntligen skulle ta klivet in i EU. När dagens regering samarbetar med partier som ännu säger nej till Nato och har försökt stoppa Sveriges vapenleveranser till Ukraina står vi för alternativet."
  - id: L-113
    parti: L
    sida: 18
    rader: '502-506'
    lydelse: "Vi är den tydligaste rösten för att Sverige aldrig ska tveka att tillsammans med demokratiska grannländer försvara demokratin. Vi är den tydligaste rösten för mer samarbete i Europa och EU - inte bara mot det ryska hotet, utan mot alla hot och problem som bäst löses tillsammans. När rödgröna partier drömmer om att försvaga eller upplösa EU vill vi fördjupa samarbetet. Vi vet att friheten växer i takt med att gränshindren för resor, arbete och handel på vår kontinent försvinner."
  - id: L-114
    parti: L
    sida: 18
    rader: '507-508'
    lydelse: "Och vi är rösten för att försvaret av demokratin - även långt bortom Europas gränser - alltid ska utgöra grunden för Sveriges och EU:s utrikespolitik."
  - id: L-115
    parti: L
    sida: 18
    rader: '509-515'
    lydelse: "70. Ja till Nato sedan 1999. I dag skapas trygghet i allianser, inte i allianslöshet. Därför ska Sverige gå med i Nato och tillsammans med USA, Kanada och våra europeiska grannar försvara både Sverige och vår del av världen. Vi har arbetat för ett svenskt Natomedlemskap i årtionden och tänker inte låta rödgröna Natomotståndare stoppa ett svenskt medlemskap. Sverige ska inom Nato särskilt kunna bidra med den infrastruktur som behövs för att skapa ett nödvändigt och strategiskt djup för försvaret av Finland och Baltikum. Globalt behöver försvarsalliansen vidare stärka sitt arbete mot hotet från Kina. Ensam är inte stark utan bara ensam."
  - id: L-116
    parti: L
    sida: 18
    rader: '516-521'
    lydelse: "71. Stärk försvaret av Sverige. Sverige behöver ett betydligt starkare militärt försvar än i dag. Vi vill därför redan 2025 se ett försvarsanslag om 2 procent av BNP och därmed skapa tillräckliga förutsättningar att stärka både armen, marinen och flygvapnet. Antalet anställda och värnpliktiga i krigsorganisationen ska öka, ny materiel tillföras och det civila försvaret stärkas i samma takt som det militära. För att stärka Sveriges samlade försvarsförmåga ska fler vapenföra än i dag genomgå en grundläggande militär utbildning."
  - id: L-117
    parti: L
    sida: 18
    rader: '522-527'
    lydelse: "72. Stå upp mot Ryssland. Sverige ska helhjärtat stödja Ukraina i att Rysslands oprovocerade anfallskrig måste sluta i fullständig rysk militär reträtt. Med det ryska anfallskriget mot Ukraina - detta angrepp mot hela Europa - är hotet mot vår säkerhetsordning akut. Sverige ska vara pådrivande för att så breda globala koalitioner som möjligt bygger ut en så heltäckande sanktionsregim mot Ryssland som möjligt. En ny regering ska vara garanten för att Ukraina ges ökat ekonomiskt, politiskt och militärt stöd."
  - id: L-118
    parti: L
    sida: 19
    rader: '529-533'
    lydelse: "73. Ja till Europa. Europa behöver mer - inte mindre - samarbete. Inte minst vill vi öka de europeiska klimatambitionerna samt se en tätare samverkan mot inre och yttre hot. Vi ska stärka EU som frihandelsunion med en fördjupad inre marknad, värna den fria rörligheten i Europa och verka för fler frihandelsavtal med omvärlden. Sverige ska verka för ett snabbspår för ukrainskt EU-medlemskap och ge landet stöd i att nå de villkor som då måste uppfyllas."
  - id: L-119
    parti: L
    sida: 19
    rader: '534-537'
    lydelse: "74. En friare värld är möjlig. Liberalernas frihetskamp börjar i våra värderingar. Målet med vår utrikespolitik är en friare värld för alla. Därför vill vi att Sverige gör mycket mer, både som enskilt land och inom internationella samarbeten, för fri- och rättigheter, frihandel, fria val och samarbete i den fria världen. Vi kallar det för vad det är: en ny värderingsstyrd utrikespolitik."
  - id: L-120
    parti: L
    sida: 19
    rader: '538-544'
    lydelse: "75. Handel och bistånd för demokrati. Biståndet spelar en viktig roll i en orolig värld. Därför vill vi att det svenska biståndet ska uppnå till en procent av BNI. Samtidigt finns i dag allvarliga problem med bristande öppenhet och korruption med svenska biståndspengar. Den svenska biståndspolitiken måste genomgå stora reformer med fokus på demokrati, jämställdhet och minskad korruption. Handels- och främjandepolitiken ska stärka Sverige som aktör för en friare värld och dra nytta av frihandelns fördelar utan den naivitet som alltför länge uppvisats för kinesisk och rysk maktpolitik."

