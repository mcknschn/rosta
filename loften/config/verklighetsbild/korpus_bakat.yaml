    citat: "Lager efter lager av krav, system och kontroller har byggts upp och på bara ett decennium har antalet administratörer och chefer utan bakgrund i välfärdens professioner ökat med nästan femtio procent."
  - id: Ck-046
    dokument: C
    kategori: "Välfärd"
    sida: 34
    kalla: kandidater_bakat.md
    citat: "Många i välfärdsyrken känner samvetsstress, för att de inte hann trösta det ena barnet medan det andra behövde gå på toaletten."
  - id: Ck-047
    dokument: C
    kategori: "Välfärd"
    sida: 34
    kalla: kandidater_bakat.md
    citat: "Personal inom vård, skola och omsorg vittnar om en arbetsvardag där tiden inte räcker till och där administration och detaljstyrning tar över på bekostnad av kärnuppdraget."
  - id: Ck-048
    dokument: C
    kategori: "Välfärd"
    sida: 34
    kalla: kandidater_bakat.md
    citat: "På landsbygderna och i mindre orter försvinner vårdcentraler, skolor och annan samhällsservice. Avstånden ökar och det blir svårare att få vård eller utbildning nära sitt hem."
  - id: Ck-049
    dokument: C
    kategori: "Välfärd"
    sida: 34
    kalla: kandidater_bakat.md
    citat: "Skolan sviker också: alltför många elever lämnar grundskolan utan fullständiga betyg, ordningen i klassrummen brister och elever som behöver stöd får det inte i tid."
  - id: Ck-050
    dokument: C
    kategori: "Välfärd"
    sida: 34
    kalla: kandidater_bakat.md
    citat: "Vårdköerna är fortsatt långa. För många får vänta för länge på behandling. Barn och unga med psykisk ohälsa fastnar i köer istället för att få hjälp i tid."
  - id: Ck-051
    dokument: C
    kategori: "Välfärd"
    sida: 35
    kalla: kandidater_bakat.md
    citat: "För mycket resurser i välfärden går till administration istället för till människor."
  - id: Ck-052
    dokument: C
    kategori: "Välfärd"
    sida: 35
    kalla: kandidater_bakat.md
    citat: "För många barn och unga mår dåligt och fastnar i köer där hjälpen kommer för sent."
  - id: Ck-053
    dokument: C
    kategori: "Välfärd"
    sida: 35
    kalla: kandidater_bakat.md
    citat: "För många elever lämnar skolan utan att ha fått rätt stöd."
  - id: Ck-054
    dokument: C
    kategori: "Välfärd"
    sida: 36
    kalla: kandidater_bakat.md
    citat: "Samtidigt räcker inte personalen till och vården är för dåligt organiserad. Resultatet blir att människor inte får hjälp i tid."
  - id: Ck-055
    dokument: C
    kategori: "Välfärd"
    sida: 37
    kalla: kandidater_bakat.md
    citat: "Alltför många barn och unga mår psykiskt dåligt idag utan att få hjälp, ibland utan att någon ser dem."
  - id: Ck-056
    dokument: C
    kategori: "Välfärd"
    sida: 37
    kalla: kandidater_bakat.md
    citat: "Det finns ett generationsglapp i den psykiska hälsan idag. Unga vuxna svenskar mår allt sämre och känner mindre livstillfredsställelse, mindre mening i livet och sämre ekonomisk trygghet än äldre åldersgrupper."
  - id: Ck-057
    dokument: C
    kategori: "Välfärd"
    sida: 38
    kalla: kandidater_bakat.md
    citat: "För många får vänta för länge, får fel stöd eller faller mellan stolarna när vårdkedjan inte hänger ihop."
  - id: Ck-058
    dokument: C
    kategori: "Välfärd"
    sida: 38
    kalla: kandidater_bakat.md
    citat: "Psykisk ohälsa är en av folkhälsans största utmaningar, men vården räcker inte till."
  - id: Ck-059
    dokument: C
    kategori: "Välfärd"
    sida: 39
    kalla: kandidater_bakat.md
    citat: "För många elever lämnar idag skolan utan fullständiga kunskaper."
  - id: Ck-060
    dokument: C
    kategori: "Välfärd"
    sida: 40
    kalla: kandidater_bakat.md
    citat: "Detaljstyrning och politiska pekpinnar begränsar professionens utrymme, trots att det är lärarna, rektorerna och skolorna som bäst vet vad som fungerar för eleverna."
  - id: Ck-061
    dokument: C
    kategori: "Välfärd"
    sida: 40
    kalla: kandidater_bakat.md
    citat: "Många lärare pressas idag av stora klasser, hög arbetsbelastning och en växande administration."
  - id: Ck-062
    dokument: C
    kategori: "Välfärd"
    sida: 41
    kalla: kandidater_bakat.md
    citat: "För många elever, särskilt de med neuropsykiatriska funktionsnedsättningar, blir skolan en kamp istället för en möjlighet."
  - id: Ck-063
    dokument: C
    kategori: "Välfärd"
    sida: 41
    kalla: kandidater_bakat.md
    citat: "Föräldrar tvingas slåss för stöd som borde vara självklart, och barns skolgång avgörs ibland av familjens resurser snarare än elevens behov."
  - id: Ck-064
    dokument: C
    kategori: "Välfärd"
    sida: 42
    kalla: kandidater_bakat.md
    citat: "Idag söker sig för få till vård, skola och omsorg, samtidigt som arbetsvillkoren ofta är för tuffa och möjligheterna att utvecklas för små."
  - id: Ck-065
    dokument: C
    kategori: "Välfärd"
    sida: 43
    kalla: kandidater_bakat.md
    citat: "Fler lever allt längre liv, men många äldre möter en vardag där deras valmöjligheter är begränsade, tillgången till vård varierar och stödet inte alltid utgår från individens behov."
  - id: Ck-066
    dokument: C
    kategori: "Välfärd"
    sida: 44
    kalla: kandidater_bakat.md
    citat: "För mycket av tiden i välfärden går till administration istället för till människor."
  - id: Ck-067
    dokument: C
    kategori: "Välfärd"
    sida: 44
    kalla: kandidater_bakat.md
    citat: "Krångliga statsbidrag, återrapportering och onödig byråkrati stjäl resurser från vård, skola och omsorg."
  - id: Ck-068
    dokument: C
    kategori: "Välfärd"
    sida: 46
    kalla: kandidater_bakat.md
    citat: "Kvinnors hälsa har länge varit nedprioriterad i vården. Kunskapen om kvinnorelaterade sjukdomar är för dålig, tillgången till vård varierar och många får vänta för länge på diagnos och behandling."
  - id: Ck-069
    dokument: C
    kategori: "Välfärd"
    sida: 50
    kalla: kandidater_bakat.md
    citat: "Vägar förfaller, vården blir svårare att nå och skolor hotas av nedläggning."
  - id: Ck-070
    dokument: C
    kategori: "Välfärd"
    sida: 52
    kalla: kandidater_bakat.md
    citat: "Det leder till otrygghet och bidrar till att människor i landsbygder i högre grad drabbas av sjukdomar som hade kunnat behandlas i tid."
  - id: Ck-071
    dokument: C
    kategori: "Välfärd"
    sida: 53
    kalla: kandidater_bakat.md
    citat: "Ett byråkratiskt tungt regelverk byggt för stora skolor gör det svårare att driva landsbygdsskolor."
  - id: Ck-072
    dokument: C
    kategori: "Välfärd"
    sida: 53
    kalla: kandidater_bakat.md
    citat: "På många håll i landsbygderna är det svårare att rekrytera behöriga lärare, resultaten är lägre och hotet om nedläggning ständigt närvarande."
  - id: Ck-073
    dokument: C
    kategori: "Välfärd"
    sida: 68
    kalla: kandidater_bakat.md
    citat: "Men vi vet att efterfrågan på sjukvården för dessa ingrepp består."
  - id: Ck-074
    dokument: C
    kategori: "Välfärd"
    sida: 77
    kalla: kandidater_bakat.md
    citat: "Idag ser vi hur allt fler behöver medicinsk hjälp för att få barn, samtidigt som tillgången till behandling varierar och möjligheterna begränsas av system som inte hängt med i människors verklighet."
  - id: Ck-075
    dokument: C
    kategori: "Lag och trygghet"
    sida: 5
    kalla: kandidater_bakat.md
    citat: "I grova brott och organiserad kriminalitet som biter sig fast och påverkar en generation av barn och unga."
  - id: Ck-076
    dokument: C
    kategori: "Lag och trygghet"
    sida: 51
    kalla: kandidater_bakat.md
    citat: "Stärk polisens närvaro i de delar av landet där den idag är alldeles för svag."
  - id: Ck-077
    dokument: C
    kategori: "Lag och trygghet"
    sida: 57
    kalla: kandidater_bakat.md
    citat: "Idag är polisens närvaro svagare i många landsbygdsområden samtidigt som brott mot individer, företag och lantbruk fortsätter, med exempelvis inbrott, bedrägerier och stölder av diesel och andra råvaror."
  - id: Ck-078
    dokument: C
    kategori: "Lag och trygghet"
    sida: 57
    kalla: kandidater_bakat.md
    citat: "När staten drar sig tillbaka växer otryggheten och tilliten minskar."
  - id: Ck-079
    dokument: C
    kategori: "Lag och trygghet"
    sida: 60
    kalla: kandidater_bakat.md
    citat: "Företag utnyttjas, välfärdssystemen plundras och parallella strukturer etableras."
  - id: Ck-080
    dokument: C
    kategori: "Lag och trygghet"
    sida: 60
    kalla: kandidater_bakat.md
    citat: "Kvinnors frihet begränsas, äldre känner oro och företagare utsätts för brott som sällan leder till konsekvenser."
  - id: Ck-081
    dokument: C
    kategori: "Lag och trygghet"
    sida: 60
    kalla: kandidater_bakat.md
    citat: "Många människor upplever oro i sin vardag - i bostadsområden, i sina hem, på arbetsplatser och i det offentliga rummet."
  - id: Ck-082
    dokument: C
    kategori: "Lag och trygghet"
    sida: 60
    kalla: kandidater_bakat.md
    citat: "Skjutningar, sprängningar och systematisk brottslighet har tagit över vardagen på platser där människor tidigare levde i trygghet."
  - id: Ck-083
    dokument: C
    kategori: "Lag och trygghet"
    sida: 60
    kalla: kandidater_bakat.md
    citat: "Sverige har varit ett sådant land."
  - id: Ck-084
    dokument: C
    kategori: "Lag och trygghet"
    sida: 62
    kalla: kandidater_bakat.md
    citat: "För många upplever idag att polisen inte hinner fram, att brott inte utreds och att konsekvenser uteblir."
  - id: Ck-085
    dokument: C
    kategori: "Lag och trygghet"
    sida: 62
    kalla: kandidater_bakat.md
    anmarkning: avviker
    citat: "Många mängdbrott som inbrott, cykelstölder och dieselstölder från jordbrukare anmäls sällan ens när människor inte litar på att det leder till något."
  - id: Ck-086
    dokument: C
    kategori: "Lag och trygghet"
    sida: 64
    kalla: kandidater_bakat.md
    citat: "För många barn och unga rekryteras in i våld, utnyttjas för brott och växer upp med en normalisering av gängens kriminella värld."
  - id: Ck-087
    dokument: C
    kategori: "Lag och trygghet"
    sida: 64
    kalla: kandidater_bakat.md
    citat: "Samhällets insatser kommer ofta för sent, hänger inte ihop och är för svaga för att bryta utvecklingen."
  - id: Ck-088
    dokument: C
    kategori: "Lag och trygghet"
    sida: 66
    kalla: kandidater_bakat.md
    citat: "Bara i Sverige kan kriminella identifiera sina brottsoffer genom publika hemsidor."
  - id: Ck-089
    dokument: C
    kategori: "Lag och trygghet"
    sida: 66
    kalla: kandidater_bakat.md
    citat: "Brott mot företagare är ett stort problem, likaså när företag används som brottsverktyg."
  - id: Ck-090
    dokument: C
    kategori: "Lag och trygghet"
    sida: 66
    kalla: kandidater_bakat.md
    citat: "Den grova organiserade brottsligheten och dess ekonomi grundar sig fortfarande i stor utsträckning på handel med narkotika."
  - id: Ck-091
    dokument: C
    kategori: "Lag och trygghet"
    sida: 66
    kalla: kandidater_bakat.md
    citat: "Idag kan kriminella tjäna miljardbelopp på bedrägerier, arbetslivskriminalitet och ekonomisk brottslighet, samtidigt som seriösa företag konkurreras ut och skattepengar missbrukas."
  - id: Ck-092
    dokument: C
    kategori: "Lag och trygghet"
    sida: 66
    kalla: kandidater_bakat.md
    citat: "Skjutningar är ofta kopplade till konflikter om kontrollen över försäljning av narkotika i specifika områden."
  - id: Ck-093
    dokument: C
    kategori: "Lag och trygghet"
    sida: 67
    kalla: kandidater_bakat.md
    citat: "Kopplingen mellan barn som utsätts för, eller upplever våld, under sin uppväxt och de som ansluter sig till gängkriminalitet är dessutom mycket stark."
  - id: Ck-094
    dokument: C
    kategori: "Lag och trygghet"
    sida: 68
    kalla: kandidater_bakat.md
    citat: "Den farligaste platsen för en kvinna är hennes eget hem och den farligaste perioden är när hon vågar ta steget och bryta upp."
  - id: Ck-095
    dokument: C
    kategori: "Lag och trygghet"
    sida: 68
    kalla: kandidater_bakat.md
    citat: "Varje år blir 13 kvinnor mördade av en man hon har eller har haft en nära relation med."
  - id: Ck-096
    dokument: C
    kategori: "Lag och trygghet"
    sida: 69
    kalla: kandidater_bakat.md
    citat: "Den nya lagstiftningen har fört med sig att kvinnojourer i hela landet tvingats stänga eller minska sina öppettider."
  - id: Ck-097
    dokument: C
    kategori: "Lag och trygghet"
    sida: 79
    kalla: kandidater_bakat.md
    citat: "Hot och hat måste tas på större allvar, inte minst gentemot transpersoner som idag lever i en mycket utsatt position."
  - id: Ck-098
    dokument: C
    kategori: "Försvar och beredskap"
    sida: 5
    kalla: kandidater_bakat.md
    citat: "Samtidigt växer auktoritära krafter globalt och utmanar den regelbaserade världsordning som Sverige byggt sin säkerhet, sin handel och sin frihet på."
  - id: Ck-099
    dokument: C
    kategori: "Försvar och beredskap"
    sida: 24
    kalla: kandidater_bakat.md
    citat: "Det gör oss sårbara både ekonomiskt och säkerhetspolitiskt."
  - id: Ck-100
    dokument: C
    kategori: "Försvar och beredskap"
    sida: 24
    kalla: kandidater_bakat.md
    citat: "Vårens blockad av Hormuzsundet har visat hur snabbt ett sådant fossilberoende kan slå hårt mot svenskarnas vardag."
  - id: Ck-101
    dokument: C
    kategori: "Försvar och beredskap"
    sida: 89
    kalla: kandidater_bakat.md
    citat: "Under lång tid har investeringar varit otillräckliga och förmågan att hantera väpnade angrepp begränsad."
  - id: Ck-102
    dokument: C
    kategori: "Försvar och beredskap"
    sida: 90
    kalla: kandidater_bakat.md
    citat: "Idag finns brister i beredskap, samordning och förmåga att hantera störningar. Det gör Sverige mer sårbart vid krig, kriser och hybridhot."
  - id: Ck-103
    dokument: C
    kategori: "Försvar och beredskap"
    sida: 91
    kalla: kandidater_bakat.md
    anmarkning: avviker
    citat: "Sverige är idag beroende av globala leveranskedjor för viktiga varor som livsmedel, läkemedel och energi. Samtidigt är beredskapen och lagren vi idag har otillräckliga för sådana större avbrott."
  - id: Ck-104
    dokument: C
    kategori: "Klimat, miljö och energi"
    sida: 24
    kalla: kandidater_bakat.md
    citat: "Det har gjort klimatomställningen dyrare och krångligare än nödvändigt för både hushåll och företag, när alternativen till det fossila egentligen är långsiktigt billigare och säkrare än importerad olja."
  - id: Ck-105
    dokument: C
    kategori: "Klimat, miljö och energi"
    sida: 24
    kalla: kandidater_bakat.md
    citat: "Sverige är idag fortfarande onödigt och skadligt beroende av fossila bränslen i transporter, industri och jordbruket."
  - id: Ck-106
    dokument: C
    kategori: "Klimat, miljö och energi"
    sida: 26
    kalla: kandidater_bakat.md
    citat: "Sverige är världsledande i den gröna industrin."
  - id: Ck-107
    dokument: C
    kategori: "Klimat, miljö och energi"
    sida: 27
    kalla: kandidater_bakat.md
    citat: "Fossilberoendet gör Sverige sårbart, samtidigt som alternativen inte alltid är tillräckligt tillgängliga eller är för dyra."
  - id: Ck-108
    dokument: C
    kategori: "Klimat, miljö och energi"
    sida: 28
    kalla: kandidater_bakat.md
    citat: "Idag bromsas utbyggnaden av osäkra marknadsvillkor, otydliga spelregler, bromsande politik och höga risker."
  - id: Ck-109
    dokument: C
    kategori: "Klimat, miljö och energi"
    sida: 29
    kalla: kandidater_bakat.md
    citat: "Effekterna märks redan i översvämningar, torka, värmeböljor och hot mot dricksvatten."
  - id: Ck-110
    dokument: C
    kategori: "Integration och sammanhållning"
    sida: 14
    kalla: kandidater_bakat.md
    citat: "Utrikes födda fastnar i ineffektiva system, långtidsarbetslösa möter stängda dörrar och personer med funktionsnedsättning lämnas utanför arbetsmarknaden."
  - id: Ck-111
    dokument: C
    kategori: "Integration och sammanhållning"
    sida: 21
    kalla: kandidater_bakat.md
    citat: "Entreprenörer möts av flera års handläggningstider som skrämmer bort dem från att etablera sig i Sverige."
  - id: Ck-112
    dokument: C
    kategori: "Integration och sammanhållning"
    sida: 72
    kalla: kandidater_bakat.md
    citat: "Rasismen, med angrepp på minoriteter, vardagsrasism och diskriminering, begränsar människors frihet."
  - id: Ck-113
    dokument: C
    kategori: "Integration och sammanhållning"
    sida: 93
    kalla: kandidater_bakat.md
    citat: "Sveriges migrations- och integrationspolitik fungerar för dåligt. Processer är långsamma, incitamenten svaga och systemen motverkar dem som vill arbeta och bidra."
  - id: Ck-114
    dokument: C
    kategori: "Frihet, demokrati och institutioner"
    sida: 5
    kalla: kandidater_bakat.md
    citat: "När också äganderätten steg för steg inskränks, och människor blir osäkra på vad de får göra med sin mark och sina investeringar, minskar viljan att satsa, utveckla och ta ansvar."
  - id: Ck-115
    dokument: C
    kategori: "Frihet, demokrati och institutioner"
    sida: 47
    kalla: kandidater_bakat.md
    citat: "Erfarenheterna ifrån när Barnrättskonventionen blev lag är över lag positiva eftersom det ökat fokus på barnens rättigheter."
  - id: Ck-116
    dokument: C
    kategori: "Frihet, demokrati och institutioner"
    sida: 47
    kalla: kandidater_bakat.md
    citat: "Funktionsrättskonventionen är ratificerad av Sverige, men inte implementerad som lag."
  - id: Ck-117
    dokument: C
    kategori: "Frihet, demokrati och institutioner"
    sida: 50
    kalla: kandidater_bakat.md
    citat: "Centraliserad byråkrati och regelkrångel har byggts upp under lång tid samtidigt som statens närvaro i hela landet nu nedmonteras ännu snabbare när regeringen lägger ner servicekontor."
  - id: Ck-118
    dokument: C
    kategori: "Frihet, demokrati och institutioner"
    sida: 54
    kalla: kandidater_bakat.md
    citat: "Regeringen har stängt servicekontor på många orter och centraliserad byråkrati har byggts upp under lång tid."
  - id: Ck-119
    dokument: C
    kategori: "Frihet, demokrati och institutioner"
    sida: 65
    kalla: kandidater_bakat.md
    citat: "Tilliten till socialtjänsten brister på många håll."
  - id: Ck-120
    dokument: C
    kategori: "Frihet, demokrati och institutioner"
    sida: 72
    kalla: kandidater_bakat.md
    citat: "Även i Sverige ser vi ökad polarisering och misstro, samt förslag som riskerar att försvaga rättssäkerheten och individens skydd mot staten."
  - id: Ck-121
    dokument: C
    kategori: "Frihet, demokrati och institutioner"
    sida: 74
    kalla: kandidater_bakat.md
    citat: "De globala digitala plattformarna har stort inflytande över demokratin i Sverige. De kan styra hur information sprids och förvärra splittringar i samhället, och de är sårbara för desinformation och påverkansoperationer."
  - id: Ck-122
    dokument: C
    kategori: "Frihet, demokrati och institutioner"
