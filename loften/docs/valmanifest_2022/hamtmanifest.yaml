# Två noteringar om enskilda dokument.
#
# V: partiet kallar sitt dokument `valplattform` och inte `valmanifest`. Sidhuvudet på varje
# sida lyder `Vänsterpartiets valplattform 2022`. Det är partiets eget dokument inför valet
# 2022, alltså samma slags dokument som de sju övriga. Projektet har godtagit avvikande namn
# förut: S:s dokument 2026 heter `Valprogram`.
#
# M: filens PDF-metadata säger att den skapades 2026-03-17 med Ghostscript, alltså långt efter
# valet. Den filen är vad partiet självt serverar idag, och den hämtade kopian stämmer byte för
# byte. Byten är därför inte augusti 2022 års original, men dokumentet är partiets eget.
# De sju övriga bär skapandedatum från februari till augusti 2022.
