#
# ADRESSERNA ÄR BELAGDA, INTE UPPGIVNA. Varje URL nedan hämtades på nytt 2026-09-16 och
# den hämtade filens SHA-256 jämfördes byte för byte med filen på disk. Alla åtta stämde
# exakt. En URL står här bara om den träffade.
#
# Detta är skillnaden mot 2026 års hämtmanifest, där `url` är tom för alla åtta eftersom
# adresserna aldrig skrevs ned. Den luckan upprepas inte.
#
# BEGRÄNSNINGEN, i klartext: hashen styrker VILKET dokument som lästes, men den återskapar
# det inte. Dör partiets URL finns ingen väg tillbaka till dokumentet. `arkivadress` är ett
# frivilligt fält för en kopia hos oberoende tredje part, och är tomt för alla åtta.

