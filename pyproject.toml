[project]
name = "rosta"
version = "0.1.0"
description = "Objektiv, datadriven väljarkompass för svenska riksdagspartier"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "jsonschema>=4.21",
    "duckdb>=1.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: live smoke-test mot officiella API:er (opt-in; körs bara med ROSTA_LIVE=1 satt)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Inget build-system: detta är en applikation/pipeline, inte ett distribuerbart paket.
