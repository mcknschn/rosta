name: Deploy Pages

# Publicerar web/ som sajtens rot. Ingen byggkedja behövs: frontenden är byggfri statisk och
# läser de förberäknade betygen ur web/data/ (synkade från dist/ med scripts/sync_dist.py).
# Rådata och warehouse stannar lokalt per design, se DATA.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# En deploy i taget; avbryt inte en pågående publicering.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
